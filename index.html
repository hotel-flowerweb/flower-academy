Ky është parimi i “efikasitetit të ngrohtë”: shpejtësi dhe saktësi, por me buzëqeshje dhe me emër. Ky leksion e ndjek mysafirin nga hyrja deri në largim.`],
["Hyrja dhe numri i dhomës",`Mysafiri përshëndetet brenda 60 sekondave pasi hyn, sipas HD19. Përshëndetja e mëngjesit është e ngrohtë, por e shkurtër: “Mirëmëngjes. Mirë se vini.”

Numri i dhomës kërkohet me takt: “Më lejoni numrin e dhomës suaj?” Mos e kërko me zë të lartë dhe mos e përsërit me zë të lartë, sepse mysafirët e tjerë dëgjojnë. Numri kontrollohet diskret në listë, që tregon nëse mëngjesi është i përfshirë në çmim, emrin e mysafirit dhe shënimet e veçanta, si alergjitë ose preferencat.

Pas kontrollit, përdor emrin: “Faleminderit, zonja Rossi. Ju lutem, më ndiqni.” Nëse lista ka shënime, si “alergji ndaj arrave” ose “preferon tavolinën pranë dritares”, përdori pa e bërë mysafirin t'i përsërisë.

Nëse mëngjesi nuk është i përfshirë, mos e thuaj para mysafirëve të tjerë. Shpjegoje diskret, me takt, dhe ofro opsionet.`],
["Ulja dhe orientimi",`Mysafiri shoqërohet te tavolina, ndihmohet me karrigen dhe i jepet peceta.

Pastaj orientimi, që mysafiri i ri të dijë si funksionon mëngjesi: “Bufeja është në të djathtë, stacioni i vezëve në fund. Nëse dëshironi, mund t'ju sjell edhe diçka nga menuja.” Ky orientim zgjat pesë sekonda dhe e kursen mysafirin nga pyetjet ose nga shëtitjet e humbura.

Për mysafirin që kthehet për ditën e dytë ose të tretë, orientimi nuk përsëritet. Në vend të tij: “Mirëmëngjes, zoti Smith. Të njëjtën tavolinë? Kafe amerikane si dje?” Kjo është ndjesia që mysafiri kujton.`],
["Pijet: brenda 60 sekondave",`Kafeja ose çaji ofrohet brenda 60 sekondave nga ulja, sipas HD20. Pyet me opsione konkrete: “Kafe amerikane, espresso apo cappuccino?” Jo “Çfarë dëshironi të pini?”, sepse kjo e detyron mysafirin të mendojë.

Lëngu ofrohet me sugjerim: “Kemi edhe lëng portokalli të freskët.” HD29 kërkon të paktën dy lëngje të freskëta ose të veçanta.

Kafeja me filtër ose amerikane rimbushet pa u kërkuar, sipas HD22. Kamarieri kalon me ibrik dhe rimbush kur filxhani është në një të tretën. Për espreson ose cappuccino-n, pyet kur filxhani mbaron: “Një tjetër?”

Uji ofrohet gjithashtu, sidomos në verë.`],
["Porosia nga menuja",`Kur mysafiri porosit nga menuja, konfirmo çdo detaj që mund të ndryshojë:
• Stilin e vezëve, siç shpjegohet në leksionin B4. “Vezë të skuqura: sunny side up apo over easy?”
• Llojin e bukës dhe nëse e do të thekur.
• Përbërësit e omëletës.
• Alergjitë dhe intolerancat, nëse nuk janë në listë.

Pastaj thuaj kohën: “Omëleta juaj del për rreth 8 minuta.” Kjo i jep mysafirit siguri, e lejon të shkojë në bufe për fruta ndërkohë, dhe i lejon të planifikojë.

Porosia futet në sistem menjëherë. Standardi është 7 minuta për të ftohtin, 10 për të nxehtin, dhe ora fillon kur mysafiri porosit, jo kur kamarieri arrin në kuzhinë.

Kur pjata vjen, shërbehet saktë, pa pyetur “kush e kishte?”, sipas HD39. Kamarieri e di çfarë ka porositur çdo mysafir.`],
["Gjatë mëngjesit",`Gjatë mëngjesit, kamarieri është i pranishëm por i padukshëm:
• Kur mysafiri ngrihet për raundin tjetër në bufe, pjatat e përdorura hiqen. Mysafiri kthehet në një tavolinë të pastër.
• Kafeja rimbushet.
• Thërrimet fshihen nëse ka shumë.
• Peceta e rënë zëvendësohet.
• Mysafiri që lexon ose punon nuk ndërpritet. Pyetjet bëhen me sy ose me një gjest të vogël.

Për familjet me fëmijë:
• Karrige e lartë ose ulëse për fëmijët e vegjël, pa u kërkuar.
• Takëme të vogla dhe gota të sigurta.
• Ndihmë me bufenë.
• Durim me zhurmën dhe rrëmujën. Fëmijët janë mysafirë.

» Skenë nga Flower: Një familje me dy fëmijë ulet. Kamarieri sjell menjëherë një ulëse për fëmijën më të vogël dhe dy gota me lëng: “Mirëmëngjes. Kafe për prindërit?” Kur prindërit shkojnë në bufe me fëmijën e madh, kamarieri qëndron pranë tavolinës ku i vogli është me gjyshen. Kur ata kthehen, pjatat e para janë hequr dhe kafeja është rimbushur.`],
["Largimi",`Mysafiri largohet me një urim personal: “Ju uroj një ditë të bukur, zoti Smith.”

Nëse mysafiri ka përmendur një plan gjatë mëngjesit, si një ekskursion, një takim ose një fluturim, përdore: “Udhëtim të mbarë për në Berat” ose “Suksese me takimin”. Kjo tregon që e ke dëgjuar, dhe e bën mysafirin të ndihet i njohur.

Nëse mëngjesi nuk është i përfshirë, fatura sillet shpejt, e saktë dhe diskrete, sipas HD56 dhe HD57. Mysafiri i mëngjesit nuk do të presë 10 minuta për faturën.

Tavolina e liruar pastrohet dhe shtrohet përsëri shpejt, sipas HD58, sidomos në orët e pikut kur mysafirët presin.`],
["Përmbledhje",`Efikasitet i ngrohtë: shpejtësi dhe saktësi me buzëqeshje dhe emër. Përshëndetje brenda 60 sekondave, numri i dhomës me takt, emri nga lista. Orientim i shkurtër për të riun, kujtim i preferencave për atë që kthehet. Kafe brenda 60 sekondave, me opsione konkrete, e rimbushur pa u kërkuar. Konfirmo stilin e vezëve dhe thuaj kohën. Hiq pjatat kur mysafiri shkon në bufe. Mos ndërprit atë që lexon. Dhe largimi me një urim që përdor planin e tij.`]
];
LEC.B4=[
["Hyrje: porosia më e personalizuar",`Vezët janë porosia më e personalizuar e mëngjesit. Çdo mysafir i do ndryshe: njëri me të verdhën të lëngshme, tjetri plotësisht të gatuar, njëri të trazuara të buta, tjetri vetëm me të bardhat. Dhe shumë mysafirë, sidomos të huajt, i porosisin me terma anglisht që stafi duhet t'i kuptojë saktë.

Një stil i keqkuptuar, për shembull “over easy” i shërbyer si “sunny side up”, është gabim i standardit HD38, gatim siç u kërkua, dhe vonesë e dyfishtë, sepse pjata duhet bërë përsëri. Ky leksion shpjegon çdo stil vezësh, termat në anglisht, kohët dhe pyetjet që duhen bërë.`],
["Vezët e skuqura",`Vezët e skuqura kanë katër stile, dhe diferencat janë të vogla por të rëndësishme:
• Sunny side up: e skuqur vetëm nga një anë, pa u kthyer. E verdha është e lëngshme dhe e dukshme, si një diell. E bardha është e gatuar, por sipër mund të jetë pak e butë.
• Over easy: e kthyer nga ana tjetër për pak sekonda. E verdha mbetet e lëngshme, por mbulohet me një shtresë të hollë të bardhe.
• Over medium: e kthyer, e gatuar pak më gjatë. E verdha është gjysmë e lëngshme, si krem i trashë.
• Over hard: e kthyer dhe e gatuar derisa e verdha të jetë plotësisht e fortë.

Kur mysafiri thotë vetëm “vezë të skuqura”, pyet: “Me të verdhën e lëngshme apo të gatuar? Të kthyera apo jo?”`],
["Vezët e trazuara, poached dhe të ziera",`Scrambled, ose të trazuara. Vezët rrihen dhe gatuhen në tigan duke u trazuar vazhdimisht. Pyet: “Të buta apo më të gatuara?” Disa mysafirë i duan kremoze dhe të lagura, sipas stilit francez; të tjerë më të thata dhe të ndara.

Poached. Veza thyhet pa lëvozhgë në ujë që mezi ziej, me pak uthull që e bardha të mblidhet, dhe gatuhet 3 deri në 4 minuta. E bardha është e gatuar, e verdha e lëngshme. Është baza e Eggs Benedict. Kërkon vezë shumë të freskëta.

Boiled, ose të ziera me lëvozhgë. Koha përcakton rezultatin:
• Rreth 3 minuta: e butë, e verdha e lëngshme. Shërbehet në mbajtëse veze, me lugë të vogël.
• Rreth 6 minuta: mesatare, e verdha si krem.
• 9 deri në 10 minuta: e fortë.

Pyet gjithmonë: “Sa minuta?” ose “E butë, mesatare apo e fortë?”`],
["Omëleta dhe pjatat klasike",`Omëleta. Pyet për përbërësit: djathë, proshutë, kërpudha, spinaq, domate, speca, qepë, sipas asaj që ka kuzhina. Pyet nëse e do me vezë të plota apo vetëm me të bardhat, një kërkesë e shpeshtë nga mysafirët që kujdesen për shëndetin, sipas HD31.

Eggs Benedict. Muffin anglez i thekur, proshutë, vezë poached dhe salcë hollandeze. Variantet:
• Florentine: me spinaq në vend të proshutës.
• Royale: me salmon të tymosur në vend të proshutës.

Kujdes me alergjenët: salca hollandeze ka vezë dhe gjalpë; muffin-i ka gluten. Vezët janë një nga 14 alergjenët, siç shpjegohet në leksionin U2.`],
["Stacioni à la minute",`HD44 kërkon një stacion à la minute për vezë dhe pjata të nxehta. “À la minute” do të thotë “në minutë”: gatohet sipas porosisë, menjëherë.

Kuzhinieri i stacionit:
• Përshëndet mysafirin.
• Merr porosinë dhe pyet për detajet: stilin, përbërësit, alergjitë.
• Ofron ta sjellë në tavolinë, që mysafiri të mos presë në këmbë: “Uluni, do t'jua sjell për 5 minuta.”
• Mban stacionin të pastër dhe të organizuar, sepse mysafiri e sheh.
• Përdor tigan të veçantë për mysafirët me alergji, për shembull pa gjalpë për intolerancën ndaj laktozës.

Kur stacioni ka radhë, stafi i bufesë ndihmon duke marrë porositë dhe duke i sjellë në tavolinë.`],
["Termat në anglisht",`Mysafirët e huaj përdorin terma që stafi duhet t'i dijë përmendsh:
• “Sunny side up”: e skuqur nga një anë.
• “Over easy”, “over medium”, “over hard”: e kthyer, me të verdhën e lëngshme, gjysmë të lëngshme, ose të fortë.
• “Scrambled”: të trazuara. “Soft scrambled”: të buta.
• “Poached”: pa lëvozhgë në ujë.
• “Soft boiled”, “medium boiled”, “hard boiled”: të ziera, të buta, mesatare, të forta.
• “Egg white omelette”: omëletë vetëm me të bardha.
• “Runny yolk”: e verdha e lëngshme.

Kur nuk je i sigurt për çfarë do mysafiri, përsërite me fjalë të thjeshta: “So, fried on one side only, with the yolk runny?” Kjo kontrollon porosinë pa e bërë mysafirin të ndihet i keqkuptuar.

» Skenë nga Flower: Një mysafire amerikane porosit “two eggs over easy, wheat toast”. Kamarieri përsërit: “Two eggs, flipped, with the yolk still runny, and wheat toast?” “Exactly.” Kamarieri e shkruan në sistem: “2 vezë over easy, e verdha e lëngshme”. Kuzhinieri e di saktësisht çfarë të bëjë.`],
["Përmbledhje",`Vezët janë porosia më e personalizuar. Të skuqura: sunny side up pa u kthyer, over easy me të verdhën e lëngshme, over medium gjysmë e lëngshme, over hard e fortë. Të trazuara: pyet “të buta apo më të gatuara?”. Poached: 3 deri në 4 minuta në ujë me uthull. Të ziera: 3 minuta e butë, 6 mesatare, 9 deri në 10 e fortë. Omëleta: pyet për përbërësit dhe për të bardhat. Eggs Benedict, Florentine dhe Royale. Dhe kur nuk je i sigurt, përsërite porosinë me fjalë të thjeshta.`]
];
LEC.D1=[
["Hyrje: restoranti pa sallë",`In-Room Dining, ose room service, është restoranti më i vështirë i hotelit. Nuk ka sallë, nuk ka dekor, nuk ka buzëqeshje që mysafiri sheh. Gjithçka fillon me një telefonatë, dhe në atë telefonatë, zëri yt është i vetmi kontakt i mysafirit me ne.

Mysafiri që porosit në dhomë është shpesh në një gjendje të veçantë: i lodhur nga udhëtimi, i zënë me punë, me fëmijë që flenë, i sëmurë, ose thjesht dëshiron privatësi. Ai pret që ushqimi të vijë si në restorant, në kohën e thënë, pa gabime. Forbes ka një seri standardesh për këtë, me shkurtimin IRD. Ky leksion shpjegon telefonatën e porosisë, nga zilja e parë deri në mbyllje.`],
["Zëri është e vetmja përshtypje",`Në telefon, mysafiri nuk sheh uniformën, sallën ose buzëqeshjen. Gjithçka kalon nga toni, ritmi dhe qartësia e zërit. Standardi IRD1 kërkon “bisedë telefonike të qetë dhe të qartë”.

Disa rregulla:
• Buzëqesh kur flet. Buzëqeshja dëgjohet; zëri ndryshon fizikisht kur buzëqesh.
• Fol ngadalë dhe qartë, sidomos me mysafirët e huaj. Telefonat e dhomave nuk kanë gjithmonë cilësi të mirë zëri.
• Pa zhurmë prapa: kuzhina, kolegët, muzika. Nëse stacioni i telefonit është pranë kuzhinës, mbyll derën.
• Pa ngrënë, pa përtypur, pa folur me dikë tjetër ndërkohë.
• Mos u ndërprit nga zhurmat e tjera; mysafiri e kupton menjëherë që nuk ke vëmendjen tek ai.

Ulu drejt ose qëndro në këmbë. Qëndrimi i trupit ndikon në zë: kur je i shtrirë në karrige, zëri dëgjohet i lodhur.`],
["Përgjigjja dhe emri",`Telefoni përgjigjet brenda tri ziljeve. Përshëndetja ka katër pjesë:
• Përshëndetja sipas orës: “Mirëmëngjes”, “Mirëdita”, “Mirëmbrëma”.
• Emri i mysafirit, që shfaqet nga sistemi i dhomës.
• Departamenti: “In-Room Dining”.
• Emri yt: “Elira në shërbimin tuaj.”

Shembull: “Mirëmbrëma, zoti Smith, In-Room Dining, Elira në shërbimin tuaj.”

Standardi IRD12 kërkon që emri të përdoret natyrshëm, jo në çdo fjali, por në përshëndetje, në konfirmim dhe në mbyllje.

Nëse sistemi nuk e tregon emrin, ose nëse ka dy mysafirë në dhomë, mos supozo. “Mirëmbrëma, In-Room Dining. Me kë kam nderin?” ose thjesht përdor “zotëri” ose “zonjë” deri sa ta dish.`],
["Pritja: asnjëherë pa pyetur",`Ka momente kur duhet ta vendosësh mysafirin në pritje: një telefonatë tjetër, një pyetje për kuzhinën. Standardet janë të qarta:
• IRD2: mysafiri pyetet gjithmonë para se të vihet në pritje. “A mund t'ju vendos në pritje për një moment?” Dhe pritet përgjigjja. Jo “Një moment” dhe muzikë menjëherë.
• IRD3: asnjë pritje mbi 30 sekonda pa ofruar rikthim telefonate.

Nëse pyetja do më shumë se 30 sekonda, për shembull nëse duhet të kontrollosh me shefin për një alergji, kthehu dhe thuaj: “Më lejoni ta kontrolloj me shefin. Mund t'ju telefonoj unë pas dy minutash?” Pastaj telefono vërtet pas dy minutash.

30 sekonda në pritje duken si dy minuta për mysafirin. Mos e harro kurrë mysafirin në pritje.`],
["Porosia: njohuri dhe sugjerim",`Standardi IRD19 kërkon që marrësi i porosisë të diskutojë me njohuri ushqimet dhe pijet. Ai që merr porosinë në telefon duhet ta dijë menunë e In-Room Dining aq mirë sa një kamarier i restorantit di menunë e tij: përbërësit, metodat e gatimit, alergjenët, porcionet.

Gjatë porosisë:
• Rekomando kur mysafiri është i pasigurt: “Nëse dëshironi diçka të lehtë, sallata me peshk të pjekur është shumë e mirë.”
• Pyet për gradën e pjekjes së mishit, siç shpjegohet në leksionin U1.
• Pyet për anësoret dhe salcat.
• Pyet për alergjitë: “A keni ndonjë alergji ose intolerancë?” Gjithmonë, edhe kur mysafiri nuk e përmend.
• Pyet për pijet: ujë, verë, kafe.
• Pyet për numrin e personave, që të dërgosh takëmet e duhura.
• Ofro verë ose ëmbëlsirë: “Dëshironi një gotë verë me të? Kemi një Riesling shumë të mirë.”

Mysafiri në dhomë nuk e sheh menunë e ëmbëlsirave dhe karrocën e verës. Ti je i vetmi që mund t'ia ofrosh.`],
["Konfirmimi dhe koha",`Para se ta mbyllësh, përsërit porosinë e plotë: “Pra, një bifsteku medium-rare me patate të skuqura dhe salcë piperi, një sallatë Cezar pa krutona, një shishe ujë me gaz dhe dy gota verë të kuqe. Dhoma 412.” Mysafiri konfirmon. Ky hap zbulon shumicën e gabimeve.

Pastaj thuaj kohën, sipas IRD20. Thuaj orën, jo vetëm minutat: “Porosia juaj do të mbërrijë rreth orës 20:35.” Ora është më e qartë se “për 30 minuta”, sepse mysafiri nuk e di kur filloi numërimi.

Kjo kohë është premtim. Forbes kërkon që porosia të mbërrijë brenda 5 minutave nga koha e thënë, as më herët, as më vonë.

Pse “as më herët”? Sepse mysafiri që porosit për 30 minuta mund të jetë në dush, në telefon, duke u veshur. Nëse kamarieri troket pas 15 minutash, ai nuk është gati. Saktësia është respekt për planin e mysafirit.`],
["Mbyllja",`Telefonata mbyllet me falënderim dhe me emër: “Faleminderit, zoti Smith. Ju bëftë mirë.”

Lëre mysafirin të mbyllë i pari. Nëse e mbyll ti, mund të ketë pasur diçka tjetër për të shtuar.

Pas telefonatës, porosia futet menjëherë në sistem, me çdo detaj: grada e pjekjes, alergjitë, kërkesat e veçanta, koha e premtuar. Kuzhina dhe kamarieri që do ta dorëzojë duhet ta dinë sa ti.

» Skenë nga Flower: Ora 22:40. Telefoni bie. “Mirëmbrëma, zonja Müller, In-Room Dining, Arben në shërbimin tuaj.” Mysafirja është e lodhur nga fluturimi dhe dëshiron “diçka të lehtë”. Arbeni sugjeron një supë dhe një sallatë, pyet për alergjitë dhe ofron një çaj bimor. Përsërit porosinë dhe thotë: “Do të mbërrijë rreth orës 23:05.” Porosia troket në derë në 23:03.`],
["Përmbledhje",`Zëri është e vetmja përshtypje: buzëqesh, fol qartë, pa zhurmë prapa. Përgjigju brenda tri ziljeve, me përshëndetje, emrin e mysafirit, departamentin dhe emrin tënd. Pyet gjithmonë para se ta vësh në pritje; mbi 30 sekonda, ofro të telefonosh ti. Njih menunë, sugjero, pyet për pjekjen, alergjitë, pijet dhe numrin e personave. Përsërit porosinë dhe thuaj orën e mbërritjes. Dhe mbaje premtimin: brenda 5 minutave, as më herët, as më vonë.`]
];
LEC.D2=[
["Hyrje: restoranti në dhomë",`Kur kamarieri troket në derë, telefonata është harruar. Tani fillon pjesa që mysafiri e sheh. Dhe Forbes kërkon që kjo pjesë të jetë po aq e rafinuar sa në restorant: tavolinë e shtruar, pije të hapura dhe të derdhura, lule, asnjë kapak plastik i harruar.

Pse kaq kujdes për diçka që hahet në dhomë? Sepse mysafiri që porosit në dhomë shpesh është i lodhur ose dëshiron privatësi, dhe nuk duhet të bëjë asgjë vetë. Një kapak plastik i harruar mbi një pjatë dërgon mesazhin “ky është ushqim për t'u marrë me vete”. Ky leksion shpjegon dorëzimin, nga kontrolli në kuzhinë deri te heqja e tabakasë.`],
["Kohët",`Standardi IRD21 kërkon:
• Dreka dhe darka brenda 30 minutave nga porosia.
• Mëngjesi brenda 25 minutave.

Dhe IRD20 kërkon që porosia të mbërrijë brenda 5 minutave nga koha e thënë mysafirit.

Këto kohë përfshijnë gjithçka: përgatitjen në kuzhinë, kontrollin, rrugën me ashensor dhe korridore. Në orët e pikut, kur ka shumë porosi njëherësh, koordinimi midis kuzhinës dhe kamarierëve është kritik.

Nëse porosia do të vonohet më shumë se koha e thënë, mysafiri telefonohet para se ta presë: “Zoti Smith, ju kërkoj ndjesë, porosia juaj do të vonohet rreth 10 minuta. Do të mbërrijë rreth orës 20:45.” Ky telefonim i vogël shmang shumicën e ankesave.`],
["Kontrolli para nisjes",`Para se të dalë nga kuzhina, porosia krahasohet me faturën, artikull për artikull:
• Çdo pjatë e porositur, me gradën e pjekjes dhe kërkesat e veçanta.
• Takëmet e duhura për çdo pjatë: thikë bifteku për biftekun, lugë supe për supën.
• Salcat, kripa, piperi.
• Peceta liri.
• Pijet, të ftohta, me hapëse nëse duhet.
• Gotat, të pastra dhe pa njolla.
• Bukë dhe gjalpë, nëse përfshihen.
• Lulja ose elementi dekorativ, sipas IRD27.

Temperatura:
• Ushqimi i nxehtë në pjata të ngrohura, me kapakë metalikë.
• Për rrugët e gjata, karrocë me ngrohës.
• Ushqimi i ftohtë i ftohtë; akullorja në enë të ftohtë.

Ky kontroll zgjat dy minuta dhe kursen kthimin në kuzhinë për diçka të harruar, që shkatërron kohën.`],
["Te dera",`Mënyra si troket kamarieri është përshtypja e parë.
• Trokit qartë, por jo fort.
• Prit pak sekonda.
• Thuaj “In-Room Dining” me zë të qartë, që mysafiri ta dijë kush është.
• Prit të hapet dera. Nëse nuk hapet pas disa sekondash, trokit përsëri një herë.
• Kur hapet, përshëndet me emër: “Mirëmbrëma, zoti Smith. Porosia juaj.”

Kurrë mos hyr pa u ftuar, edhe kur dera është e hapur. Kurrë mos përdor çelësin e dhomës.

Nëse mysafiri hap derën i veshur me peshqir ose rrobë banjoje, sillu natyrshëm dhe profesionalisht. Mos e bëj situatën të sikletshme.`],
["Shtrimi dhe prezantimi",`Pyet: “Ku dëshironi ta shtroj?” Disa mysafirë e duan te tavolina, të tjerë në ballkon, të tjerë në shtrat. Respekto zgjedhjen.

Shtrimi, sipas IRD22 deri IRD27:
• Mbulesa, nëse tavolina nuk e ka.
• Takëmet, gota, peceta, të vendosura si në restorant.
• Karrigia afrohet te tavolina, sipas IRD25.
• Lulja ose elementi dekorativ.

Prezantimi:
• Hiq të gjithë kapakët dhe plastikën, sipas IRD26. Asnjë kapak nuk mbetet mbi pjatë.
• Emërto çdo pjatë: “Bifsteku juaj medium-rare me salcë piperi.”
• Pijet hapen dhe derdhen, sipas IRD23.
• Vera me gotë prezantohet në shishe dhe derdhet para mysafirit, sipas IRD24. Mysafiri duhet ta shohë etiketën, njësoj si në restorant.
• Pyet: “Dëshironi diçka tjetër?”

Mysafiri duhet të mund të ulet dhe të fillojë të hajë, pa bërë asgjë vetë.`],
["Fatura dhe largimi",`Fatura prezantohet në mbajtëse, jo e hedhur mbi tavolinë. Shpjego shkurt çdo tarifë shërbimi të përfshirë, nëse ka. Mysafiri nënshkruan ose paguan.

Para se të largohesh, sqaro heqjen e tabakasë:
• “Kur të keni mbaruar, thjesht na telefononi ose vendoseni tabakanë jashtë derës. Do të vijmë brenda 10 minutave.”
• Ose: “Në çfarë ore dëshironi ta marrim?”

Pastaj largohu me falënderim: “Ju bëftë mirë, zoti Smith.”

» Skenë nga Flower: Kamarieri troket në dhomën 305: “In-Room Dining.” Dera hapet. Një çift me fëmijë që flenë në dhomën tjetër. Kamarieri flet me zë të ulët: “Mirëmbrëma. Ku dëshironi ta shtroj?” “Në ballkon, të lutem.” Ai shtron tavolinën e vogël të ballkonit, ndez një qiri në gotë, hap ujin dhe derdh verën. Pastaj largohet pa zhurmë, duke mbyllur derën ngadalë.`],
["Heqja e tabakasë",`Heqja është pjesa më e harruar e room service-it, dhe një nga ankesat më të shpeshta. Mysafiri që del nga dhoma në mëngjes dhe sheh tabakatë e darkës së mbrëmshme në korridor ka një përshtypje të keqe për gjithë hotelin.

Standardi IRD43 kërkon që pjatat e përdorura të hiqen brenda 10 minutave nga thirrja, ose në kohën e caktuar me mysafirin, plus minus 5 minuta.

Rregullat:
• Kur mysafiri telefonon, tabakaja merret brenda 10 minutave.
• Kur mysafiri e vendos jashtë derës, ajo duhet të hiqet sa më shpejt.
• Stafi i room service-it kontrollon korridoret çdo 30 minuta për tabaka të harruara.
• Stafi i katit, housekeeping-u, njofton room service-in kur sheh një tabaka.

Tabakaja hiqet e plotë: pjatat, gotat, takëmet, pecetat, shishet. Asnjë gjë nuk lihet në korridor ose në dhomë.`],
["Përmbledhje",`Room service është restoranti në dhomë. Dreka dhe darka brenda 30 minutave, mëngjesi brenda 25, brenda 5 minutave nga koha e thënë. Kontrollo çdo artikull para nisjes, me ushqimin e nxehtë të nxehtë. Trokit, thuaj “In-Room Dining”, prit të hapet. Pyet ku ta shtrosh, shtro si në restorant, hiq çdo kapak dhe plastikë, hap dhe derdh pijet, prezanto verën në shishe. Sqaro heqjen e tabakasë, dhe hiqe brenda 10 minutave nga thirrja.`]
];
LEC.D3=[
["Hyrje: detajet që bëjnë diferencën",`Dy leksionet e mëparshme shpjeguan telefonatën dhe dorëzimin. Ky leksion fokusohet te detajet: si mbërrin ushqimi, si prezantohen salcat, si shërbehet kafeja, në çfarë gjendje janë tabakaja dhe lirit. Këto janë gjërat që mysafiri i vëren në heshtje, dhe që inspektori i Forbes i kontrollon një nga një.

Standardet IRD28 deri IRD42 kërkojnë që ushqimi në dhomë të jetë po aq i mirë sa në restorant: në prezantim, temperaturë, freski, shije, sasi dhe gatim siç u kërkua. Dhe që çdo element i tabakasë të jetë në gjendje perfekte.`],
["Ushqimi si në restorant",`Standardet IRD28 deri IRD33 kërkojnë që ushqimi në dhomë të ketë të njëjtën cilësi si në restorant në gjashtë aspekte:
• Prezantimi: pjata duhet të duket si në restorant, jo e lëvizur gjatë rrugës. Kuzhina duhet të marrë parasysh rrugën: salcat ndaras kur rrezikojnë të derdhen, garniturat që nuk vyshken.
• Temperatura: e nxehta e nxehtë, e ftohta e ftohtë.
• Freskia: asnjë pjatë e përgatitur para kohe.
• Shija: e njëjtë si në restorant.
• Sasia: e njëjtë si në restorant.
• Gatimi siç u kërkua: grada e pjekjes, kërkesat e veçanta.

Disa pjata nuk udhëtojnë mirë. Patatet e skuqura humbasin krokantësinë nën kapak; sufleja bie. Kuzhina dhe menuja e In-Room Dining duhet ta marrin parasysh këtë, dhe kamarieri që merr porosinë duhet të dijë t'i paralajmërojë mysafirët.`],
["Salcat, shtesat dhe kafeja",`Salcat dhe shtesat, sipas IRD35, prezantohen me elegancë:
• Në enë të vogla porcelani, jo në paketa plastike.
• Ketchup-i, mustarda, majoneza: në enë të vogla, jo në shishe.
• Gjalpi: në enë të vogël, në temperaturë që mund të lyhet.
• Kripa dhe piperi: në mbajtëse të pastra dhe të mbushura.

Kafeja dhe çaji, sipas IRD36 dhe IRD37, janë të disponueshme në çdo kohë dhe shërbehen me rafinim:
• Kafeja në termos të ngrohur ose në ibrik, që të mbetet e nxehtë.
• Çaji në çajnik të ngrohur, me çajin në qese ose me filtër.
• Filxhan me pjatë, lugë.
• Qumësht i ngrohtë anash, sheqer dhe ëmbëlsues.
• Për espreson dhe cappuccino-n, koha nga makina te dera duhet të jetë sa më e shkurtër; ndryshe humbasin kremin dhe shkumën.`],
["Tabakaja, lirit, gotat dhe takëmet",`Standardet IRD38 deri IRD42 kërkojnë që tabakaja ose karroca, lirit, gotat dhe takëmet të jenë në gjendje perfekte:
• Tabakaja ose karroca: e pastër, pa gërvishtje, pa njolla, me rrotat që nuk kërcasin.
• Lirit: mbulesa dhe pecetat të pastra, të hekurosura, pa njolla dhe pa vrima.
• Gotat: të pastra, pa njolla dhe pa gishta, të lustruara.
• Takëmet: të lustruara, pa njolla uji, të plota për çdo pjatë.
• Porcelani: pa çarje, pa thyerje, pa shenja.

Kamarieri i kontrollon këto para çdo dorëzimi. Një gotë me njollë ose një pecetë me vrimë nuk dërgohet; zëvendësohet.

Akulli: me pijet, ofro gjithmonë një kovë me akull, sidomos në verë. Mysafiri në dhomë nuk ka akull, dhe pija e ngrohtë nuk është e njëjta pije.`],
["Gabimi i zbuluar",`Edhe me kontrollin më të kujdesshëm, ndonjëherë diçka mungon: një salcë, një takëm, një pije. Mënyra si reagojmë përcakton nëse mysafiri e kujton si gabim apo si shërbim.

Rregulli: nëse diçka mungon, kamarieri kthehet brenda 5 minutave me artikullin dhe kërkon ndjesë. Asnjë mysafir nuk shkon vetë për ta marrë, dhe asnjë mysafir nuk pret 20 minuta.

Për gabime më të mëdha, si pjata e gabuar, mishi i gatuar keq, ushqimi i ftohtë, ndiqet protokolli i rikuperimit, siç shpjegohet në Modulin 13: kërko ndjesë, zgjidhe menjëherë, informo supervizorin, dhe shiko nëse duhet një gjest kompensimi.

» Skenë nga Flower: Mysafiri telefonon: “Bifsteku im është well-done, por e kërkova medium-rare.” Marrësi i porosisë: “Ju kërkoj ndjesë, zoti Smith. Do t'ju dërgojmë një të ri medium-rare menjëherë, rreth 15 minuta. Ndërkohë, a dëshironi t'ju sjellim diçka për të pirë?” Pas 15 minutash, bifsteku i ri mbërrin, me një gotë verë të kuqe falas dhe një shënim nga shefi.`],
["Përmbledhje",`Ushqimi në dhomë duhet të jetë si në restorant: prezantim, temperaturë, freski, shije, sasi, gatim siç u kërkua. Salcat në enë porcelani, jo në paketa. Kafeja dhe çaji në termos ose çajnik të ngrohur, me qumësht të ngrohtë. Tabakaja, lirit, gotat dhe takëmet në gjendje perfekte. Ofro gjithmonë akull me pijet. Dhe kur diçka mungon, kthehu brenda 5 minutave; asnjë mysafir nuk shkon vetë për ta marrë.`]
];
LEC.N1=[
["Hyrje: shërbimi në diell",`Pishina është vendi ku mysafiri është më i relaksuar se kudo tjetër në hotel. Ai është me rroba banje, shpesh me sy të mbyllur, me një libër, në ujë ose duke fjetur nën çadër. Dhe pikërisht kjo e bën shërbimin e pishinës të vështirë: duhet të jetë i dukshëm kur mysafiri ka nevojë, dhe i padukshëm kur nuk ka.

Forbes ka një seri standardesh për pishinën dhe plazhin, me shkurtimin PB. Ky leksion shpjegon si pritet mysafiri, si kujdesemi për të gjatë qëndrimit, standardi i freskimit të papritur dhe si mbyllet dita.`],
["Pse shërbimi i jashtëm është ndryshe",`Në restorant, mysafiri është i ulur, në një tavolinë, dhe kamarieri e di ku ta gjejë. Në pishinë, mysafiri lëviz: në ujë, në shezlong, në dush, në bar. Ai nuk ka zile për të thirrur, dhe nuk dëshiron të ngrihet për të kërkuar.

Prandaj stafi i pishinës skanon zonën çdo 2 deri në 3 minuta dhe reagon ndaj gjestit më të vogël: një dorë e ngritur, një shikim, një gotë bosh, një peshqir i lagur.

Mysafiri i pishinës gjithashtu ka nevoja që nuk ekzistojnë në restorant:
• Mbrojtja nga dielli: çadra, kremi i diellit, uji.
• Rehatia: shezlongu, peshqirët, jastëkët.
• Privatësia: larg fëmijëve, larg grupeve.
• Siguria: dielli, nxehtësia, uji.

Standardi PB24 kërkon hapësirë dhe privatësi, me mundësi për t'u larguar nga fëmijët dhe grupet.`],
["Mbërritja",`Standardi PB15 kërkon që mysafiri të shoqërohet te shezlongu, të ndihmohet me rregullimin dhe t'i ofrohet ujë.

Hapat:
• Përshëndetje me emër, nëse e dimë.
• Pyet për preferencën: “Dëshironi në diell apo në hije? Pranë pishinës apo më të qetë?” Për çiftet dhe mysafirët e vetëm, ofro zonat larg fëmijëve.
• Shoqëroje te shezlongu.
• Shtro peshqirët mbi shezlong dhe mbi jastëk, sipas PB19, automatikisht dhe në sasi të bollshme.
• Rregullo çadrën sipas dëshirës.
• Ofro ujë të ftohtë.
• Trego si të thërrasë stafin, si funksionon menuja dhe ku janë dushet dhe banjat.

Ky ritual zgjat dy minuta dhe e bën mysafirin të ndihet i pritur, jo vetëm i lejuar të hyjë.`],
["Gjatë qëndrimit",`Pasi mysafiri është rregulluar, kujdesi vazhdon:
• Ofro kremin e diellit, sipas PB18. Disa hotele e kanë në dispozicion në stacione; stafi duhet ta përmendë.
• Kur lëviz dielli, rregullo çadrën pa u kërkuar. Mysafiri që flinte në hije dhe zgjohet në diell e vëren.
• Ndërro peshqirët e lagur. Kur mysafiri del nga uji, një peshqir i thatë pranë është gjest i vogël por i kujtuar.
• Peshqirët e përdorur ruhen diskret, sipas PB20, jo të hedhur pranë shezlongut.
• Hiq gotat bosh dhe pjatat e përdorura.
• Mbaje zonën rreth shezlongut të pastër.

Kujdes me mysafirët që flenë: mos i zgjo për të ofruar diçka. Por mbaje parasysh që mund të digjen nga dielli, dhe nëse çadra nuk i mbulon më, rregulloje me kujdes.`],
["Porosia dhe pijet",`Standardi PB17 kërkon që pijet dhe snacks të sinjalizohen lehtë dhe të dorëzohen brenda 10 minutave.

Rregullat:
• Mysafiri duhet ta ketë të lehtë të sinjalizojë: një gjest me dorë, një flamur i vogël, ose stafi që kalon rregullisht.
• Menuja e pishinës është e pastër dhe në gjendje të mirë, sipas PB31, jo e lagur ose e grisur.
• Pijet dorëzohen brenda 10 minutave nga porosia.
• Prezantimi i pijeve është i veçantë, sipas PB32: garniturë e freskët, gotë e ftohtë, pecetë.
• Pijet e freskëta dhe të lehta janë më të kërkuarat: Mint Fizz, Hugo Spritz, Aperol Spritz, Rose Colada, Sunrise, mocktail-i, ujë me agrume.

Siç shpjegohet në leksionin N2, pranë pishinës nuk përdoret xham; gotat janë prej materiali që nuk thyhet.

Fatura për mysafirët e hotelit regjistrohet në dhomë, me nënshkrimin e tyre. Kontrollo numrin e dhomës me takt.`],
["Freskimi i papritur",`Standardi PB16 kërkon që gjatë 90 minutave, në mot të ngrohtë, mysafirit t'i ofrohet proaktivisht një freskim falas.

Ky është një nga momentet “wow” më të lira që ekzistojnë. Mysafiri nuk e pret, dhe e kujton. Ide:
• Copa frutash të ftohta, si shalqi, ananas, rrush.
• Peceta të ftohta me aromë, si limon ose mente.
• Një sorbet i vogël.
• Ujë me agrume ose me kastravec.
• Një spërkatje me ujë termal për fytyrën.

Si bëhet:
• Çdo 90 minuta, një anëtar i stafit kalon me tabaka nëpër të gjitha shezlongjet.
• Ofrohet me buzëqeshje dhe pa presion: “Diçka e freskët nga ne?”
• Mysafirët që flenë nuk zgjohen; atyre u ofrohet në raundin tjetër.

» Skenë nga Flower: Ora 15:30, 32 gradë. Një çift ka 90 minuta në shezlong. Kamarieri afrohet me një tabaka me copa shalqiri të ftohtë dhe peceta të ftohta me limon: “Diçka e freskët nga ne, me komplimentet e hotelit.” Gruaja buzëqesh: “Kjo është pikërisht ajo që na duhej.” Pas pesë minutash, ata porosisin dy Hugo Spritz.`],
["Largimi",`Kur mysafiri largohet:
• Ndihmë me sendet, sidomos për familjet me fëmijë.
• Falënderim me emër: “Faleminderit, zonja Rossi, ju pritmë nesër.”
• Peshqirët e përdorur hiqen diskret.
• Shezlongu rregullohet menjëherë për mysafirin tjetër: peshqirë të rinj, çadra e mbyllur ose e rregulluar, tavolina e pastër.

Shezlongu që mbetet i çrregullt pas largimit të mysafirit i jep zonës një pamje të pakujdesshme, dhe mysafiri tjetër nuk do ta zgjedhë.`],
["Përmbledhje",`Shërbimi në pishinë është i dukshëm kur nevojitet dhe i padukshëm kur jo. Skano zonën çdo 2 deri në 3 minuta. Shoqëro mysafirin te shezlongu, pyet për diellin dhe hijen, shtro peshqirët, rregullo çadrën, ofro ujë. Ofro kremin e diellit, rregullo çadrën kur lëviz dielli, ndërro peshqirët e lagur. Pijet brenda 10 minutave. Freskimi falas çdo 90 minuta në mot të ngrohtë. Dhe rregullo shezlongun menjëherë pas largimit.`]
];
LEC.N2=[
["Hyrje: siguria si pjesë e luksit",`Pishina është zona më e rrezikshme e hotelit. Uji, dielli, nxehtësia, dyshemeja e lagur, fëmijët, alkooli: të gjitha këto krijojnë rreziqe që nuk ekzistojnë në restorant. Por mysafiri nuk duhet t'i shohë këto rreziqe. Ai duhet të shohë vetëm një zonë të pastër, të organizuar dhe të qetë.

Forbes ka tri standarde kryesore për këtë. PB21: zona ka pamje të organizuar dhe profesionale. PB22: shezlongjet, jastëkët, peshqirët dhe çadrat janë në gjendje të shkëlqyer. PB23: pastërti dhe higjienë e plotë. Ky leksion shpjegon si mbahen këto, dhe si menaxhohen rreziqet kryesore.`],
["Rregulli i xhamit",`Rregulli më i rëndësishëm i pishinës: asnjë gotë xhami pranë ujit.

Pse? Sepse xhami i thyer pranë pishinës është shumë i rrezikshëm. Mysafirët ecin zbathur, dhe copat e xhamit në ujë janë pothuajse të padukshme. Në shumë raste, një gotë e thyer pranë ose brenda pishinës kërkon zbrazjen e plotë të pishinës, pastrimin dhe mbushjen përsëri. Kjo do të thotë që pishina mbyllet për një ditë ose më shumë.

Zgjidhja: gota prej polikarbonati ose materiali tjetër cilësor që nuk thyhet dhe që duket si xham. Mysafiri merr një gotë të bukur, por pa rrezik.

Kjo vlen për çdo gjë: gotat e verës, gotat e kokteileve, pjatat, shishet. Edhe shishet e birrës dhe të verës nuk sillen pranë ujit; pija derdhet në bar ose në zonën e sigurt.

Nëse, megjithatë, thyhet xham pranë pishinës:
• Zona izolohet menjëherë.
• Mysafirët largohen me takt nga zona.
• Supervizori dhe roja i pishinës njoftohen.
• Pastrimi bëhet me kujdes të plotë.
• Nëse ka mundësi që xhami ka rënë në ujë, pishina mbyllet derisa të kontrollohet.`],
["Rregullimi dhe pamja",`PB21 kërkon që zona të ketë pamje të organizuar dhe profesionale. Kjo do të thotë:
• Shezlongjet në vija të drejta, në distanca të barabarta.
• Peshqirët e palosur njësoj, në çdo shezlong ose në stacionin e peshqirëve.
• Çadrat e mbyllura kur nuk përdoren, dhe të hapura njësoj kur përdoren.
• Tavolinat e vogla të pastra, pa gota bosh.
• Koshat e mbeturinave të zbrazur, jo plot.
• Asnjë send i harruar, asnjë peshqir në tokë.

PB22 kërkon që shezlongjet, jastëkët, peshqirët dhe çadrat të jenë në gjendje të shkëlqyer. Kjo do të thotë:
• Shezlongjet pa ndryshk, pa të çara, pa njolla.
• Jastëkët pa njolla, pa grisje, të thatë.
• Peshqirët të bardhë, të butë, pa vrima dhe pa njolla.
• Çadrat pa grisje, pa ngjyrë të zbehur, që hapen dhe mbyllen lehtë.

Çdo send që nuk është në gjendje të shkëlqyer hiqet nga përdorimi dhe raportohet.`],
["Pastërtia dhe kontrolli",`PB23 kërkon pastërti dhe higjienë të plotë. Kjo kërkon kontroll të rregullt:
• Çdo orë: tavolinat, koshat e mbeturinave, dushet, banjat dhe dhomat e ndërrimit, sipas PB26 dhe PB27.
• Dyshemetë rreth pishinës: pa ujë të ndenjur, pa gjethe, pa mbeturina.
• Dushet: të pastra, me ujë që funksionon.
• Banjat: të pastra, të furnizuara me letër, sapun, peshqirë.

Kontrolli bëhet me një listë dhe shënohet. Supervizori e kontrollon listën.

Dyshemeja e lagur është rrezik rrëshqitjeje. Zonat ku mysafirët ecin me këmbë të lagura duhet të jenë prej materiali që nuk rrëshqet, dhe të mbahen pa ujë të ndenjur.`],
["Dielli dhe nxehtësia",`Dielli dhe nxehtësia janë rreziqe reale, sidomos për fëmijët, të moshuarit dhe mysafirët që kanë pirë alkool.

Uji falas duhet të jetë gjithmonë i disponueshëm.

Stafi duhet të njohë shenjat e goditjes nga dielli ose nga nxehtësia:
• Lëkurë shumë e kuqe dhe e nxehtë.
• Dhimbje koke, marramendje, të përziera.
• Konfuzion ose dobësi.
• Djersitje e tepërt, ose, në raste të rënda, mungesë djersitjeje.

Nëse sheh këto shenja:
• Ço mysafirin në hije.
• Ofro ujë të freskët, jo të akullt.
• Peceta të ftohta në ballë dhe qafë.
• Njofto supervizorin, dhe nëse shenjat janë të rënda, thirr ndihmën mjekësore.

Kujdes i veçantë për fëmijët: ata nuk e ndiejnë gjithmonë kur kanë nxehtë ose kur janë djegur. Një fjalë e qetë me prindërit, “Dielli është shumë i fortë sot, dëshironi një çadër më të madhe?”, mund të parandalojë problemin.`],
["Alkooli dhe uji",`Alkooli dhe uji janë një kombinim i rrezikshëm. Alkooli ul vëmendjen dhe koordinimin, dhe në diell efekti i tij është më i fortë, sepse trupi dehidratohet.

Siç shpjegohet në leksionin X4:
• Vëzhgo mysafirët që pinë shumë, sidomos ata që notojnë.
• Ofro ujë me çdo pije alkoolike.
• Ofro alternativa pa alkool: mocktail-i, lëngje, ujë me agrume.
• Nëse një mysafir duket i dehur dhe dëshiron të notojë, njofto supervizorin dhe rojën e pishinës.

Kjo nuk do të thotë të bëhesh polic. Do të thotë të jesh i vëmendshëm, me takt, dhe të sigurohesh që të gjithë mysafirët largohen të sigurt.

» Skenë nga Flower: Një grup miqsh ka porositur disa raunde Aperol Spritz nën diell. Njëri prej tyre është shumë i kuq në fytyrë dhe flet me zë të lartë. Kamarieri sjell një kanë me ujë të ftohtë dhe gota për të gjithë: “Me komplimentet tona, është shumë nxehtë sot.” Pastaj i thotë diskret supervizorit të mbajë sytë te grupi, dhe kur njëri prej tyre ngrihet për të notuar, roja i pishinës është afër.`],
["Përmbledhje",`Asnjë xham pranë ujit: polikarbonat që duket si xham. Xhami i thyer pranë pishinës mund të kërkojë zbrazjen e saj. Shezlongjet në vija, peshqirët të palosur njësoj, çadrat të mbyllura kur nuk përdoren. Çdo send në gjendje të shkëlqyer, ose hiqet. Kontroll çdo orë i tavolinave, koshave, dusheve dhe banjave. Ujë falas gjithmonë, vëmendje për shenjat e goditjes nga dielli. Dhe kujdes i veçantë me alkoolin dhe ujin.`]
];
LEC.A1=[
["Hyrje: gabimi nuk e prish përvojën",`Në çdo restorant, sado i mirë, ndodhin gabime. Një pjatë del e ftohtë, një biftek gatuhet më shumë se duhej, një porosi harrohet, një faturë është e gabuar. Kuzhina e Flower dhe e Garden nuk janë përjashtim, dhe as stafi i sallës. Pyetja nuk është nëse do të ketë gabime, por si do të reagojmë kur të ndodhin.

Ky leksion shpjegon teorinë e rikuperimit të shërbimit: pse një ankesë është mundësi, pse shumica e mysafirëve të pakënaqur nuk ankohen, çfarë vlerëson mysafiri kur ankohet dhe si e teston Forbes këtë. Leksionet e tjera të modulit shpjegojnë metodën LEARN, situatat e vështira dhe autorizimin.`],
["Paradoksi i rikuperimit",`Në vitin 1992, studiuesit Michael McCollough dhe Sundar Bharadwaj përshkruan një fenomen që e quajtën “paradoksi i rikuperimit të shërbimit”. Ata vunë re se klientët që kishin pasur një problem dhe e kishin parë të zgjidhur shpejt dhe me bujari shpesh e vlerësonin shërbimin më lart se klientët që nuk kishin pasur asnjë problem.

Pse? Sepse kur gjithçka shkon mirë, klienti nuk mëson asgjë për kompaninë. Por kur diçka shkon keq dhe kompania reagon shkëlqyeshëm, klienti mëson diçka të rëndësishme: që kjo kompani kujdeset për të, që mund t'i besojë, që kur ka problem, do ta zgjidhë.

Studimet e mëvonshme kanë treguar që paradoksi nuk funksionon gjithmonë: nëse gabimi është shumë i rëndë, ose nëse përsëritet, asnjë rikuperim nuk e rikthen besimin plotësisht. Por mesazhi kryesor mbetet: gabimi vetë nuk e prish përvojën; mënyra si reagojmë e përcakton.

Kjo do të thotë që kamarieri nuk duhet të ketë frikë nga ankesat. Ankesa është momenti ku mund të tregojmë më shumë se kurrë se kush jemi.`],
["Ankesat e heshtura",`Shumica e mysafirëve të pakënaqur nuk ankohen. Kërkimet në shërbim tregojnë vazhdimisht që vetëm një pakicë e klientëve të pakënaqur e shprehin pakënaqësinë drejtpërdrejt. Të tjerët thjesht nuk kthehen, dhe shumë prej tyre ua tregojnë miqve ose shkruajnë online.

Pse nuk ankohen?
• Nuk duan të krijojnë konflikt, sidomos para shoqëruesve.
• Mendojnë që nuk do të ndryshojë asgjë.
• Janë të lodhur, me nxitim, ose thjesht nuk duan ta prishin mbrëmjen.
• Ndihen në siklet, sidomos në një restorant luksoz.

Kjo do të thotë që mysafiri që ankohet po na jep një dhuratë: mundësinë ta rregullojmë para se të largohet. Prandaj e falënderojmë: “Faleminderit që ma thatë.”

Dhe do të thotë që duhet t'i kërkojmë ankesat e heshtura. Shenjat: pjata e lënë gjysmë e ngrënë, fytyra e pakënaqur, heshtja e papritur në tavolinë, mysafiri që shikon përreth. Kamarieri që i sheh këto pyet: “A është gjithçka siç e prisnit?” dhe pret përgjigjen e vërtetë.`],
["Drejtësia e perceptuar",`Kur mysafiri ankohet, ai vlerëson përgjigjen tonë sipas tri dimensioneve, që studiuesit i quajnë “drejtësia e perceptuar”:
• Rezultati: a u zgjidh problemi? A mora atë që më duhej?
• Procesi: sa shpejt dhe sa lehtë? A më duhej të prisja, të shpjegoja tri herë, të flisja me tre persona?
• Trajtimi: a u ndjeva i respektuar? A më dëgjuan? A më besuan? A më kërkuan ndjesë sinqerisht?

Shpesh, trajtimi ka më shumë peshë se rezultati. Një mysafir që merr një ëmbëlsirë falas, por që ndihet i trajtuar si gënjeshtar ose si bezdi, do të largohet i pakënaqur. Një mysafir që nuk merr asnjë kompensim, por që dëgjohet me vëmendje, merr ndjesë sinqerisht dhe sheh problemin të zgjidhur shpejt, mund të largohet më i kënaqur se kur erdhi.

Kjo do të thotë që kompensimi nuk zëvendëson kurrë dëgjimin dhe respektin. Kompensimi pa respekt duket si përpjekje për ta “blerë” mysafirin.`],
["Forbes dhe ankesat",`Inspektori i Forbes ndonjëherë krijon një problem me qëllim, për të parë si reagon stafi. Mund të kërkojë diçka që nuk është në menu, të ankohet për temperaturën e pjatës, të thotë që vera ka shije të çuditshme, ose të kërkojë një ndryshim të vështirë.

Çfarë kontrollon inspektori:
• HD18 dhe BL16: asnjë kërkesë nuk refuzohet pa alternativë. “Jo” pa alternativë është gabim.
• HD10: komunikimi mes stafit është i plotë; mysafiri nuk përsërit kërkesat. Nëse inspektori ia thotë problemin kamarierit dhe pastaj supervizori e pyet përsëri “çfarë ndodhi?”, standardi është shkelur.
• Kategoria e kujdesit personal: a u ndje inspektori i dëgjuar, i respektuar, i kujdesur?
• Shpejtësia e zgjidhjes.

Inspektori nuk pret që të mos ketë gabime. Pret që gabimet të trajtohen me profesionalizëm të përsosur.`],
["Kultura e rikuperimit",`Rikuperimi i mirë nuk varet vetëm nga kamarieri. Varet nga kultura e ekipit:
• Gabimet nuk fshihen. Kamarieri që e di se do të ndëshkohet për gabimin do ta fshehë, dhe mysafiri do të largohet i pakënaqur pa e ditur askush.
• Gabimet nuk fajësohen para mysafirit. “Kuzhina e gaboi” është fjalia më e keqe që mund të thuhet. Për mysafirin, ne jemi një hotel, jo departamente.
• Gabimet regjistrohen dhe analizohen. Qëllimi nuk është të gjejmë fajtorin, por të rregullojmë shkakun. Nëse bifteku del i gatuar keq çdo të shtunë, problemi nuk është kamarieri.
• Rikuperimet e mira festohen. Kur një kamarier e kthen një mysafir të zemëruar në një mysafir besnik, ekipi duhet ta dijë.

» Skenë nga Flower: Një mysafir thotë që levreku është i thatë. Kamarieri nuk mbrohet dhe nuk shpjegon: “Faleminderit që ma thatë, ju kërkoj ndjesë. Dëshironi t'ju përgatisim një tjetër menjëherë, apo të provoni shojzën?” Mysafiri zgjedh shojzën. Kamarieri njofton supervizorin, që kalon te tavolina para ëmbëlsirës. Dy javë më vonë, mysafiri kthehet me katër miq dhe i thotë kamarierit: “Erdhëm sepse herën e kaluar e zgjidhët aq mirë.”`],
["Përmbledhje",`Paradoksi i rikuperimit: një problem i zgjidhur shpejt dhe me bujari mund ta bëjë mysafirin më besnik se ai që nuk pati problem. Shumica e mysafirëve të pakënaqur nuk ankohen; ai që ankohet na jep dhuratë, prandaj e falënderojmë. Kërko ankesat e heshtura. Mysafiri vlerëson rezultatin, procesin dhe trajtimin, dhe trajtimi shpesh ka më shumë peshë. Forbes teston pikërisht këto momente. Dhe kultura e ekipit: gabimet nuk fshihen, nuk fajësohen para mysafirit, regjistrohen dhe rregullohen në rrënjë.`]
];
LEC.A2=[
["Hyrje: pse një metodë",`Kur mysafiri ankohet, kamarieri ndjen presion. Dhe nën presion, njerëzit reagojnë me instinkt: mbrohen, shpjegojnë, fajësojnë dikë tjetër, ose ikin për të thirrur dikë tjetër. Asnjë nga këto nuk ndihmon.

Një metodë e mësuar përmendsh e zëvendëson instinktin me një sjellje profesionale të përsëritshme. Metoda LEARN, e përdorur gjerësisht në industrinë e mikpritjes, ka pesë hapa: Listen, Empathize, Apologize, React, Notify, që në shqip janë: Dëgjo, Empati, Kërko ndjesë, Vepro, Njofto. Ky leksion e shpjegon çdo hap, me frazat që duhen dhe ato që duhen shmangur.`],
["L: Dëgjo",`Hapi i parë është më i thjeshti dhe më i vështiri: dëgjo.
• Ndalo çdo gjë tjetër që po bën. Mos e dëgjo mysafirin duke mbajtur pjata ose duke shikuar tavolinën tjetër.
• Kontakt me sy.
• Lëre të flasë deri në fund, pa e ndërprerë. Edhe kur e ke kuptuar problemin pas fjalisë së parë, lëre të mbarojë.
• Mos shpjego. Mos u mbro. Mos korrigjo. Edhe kur mysafiri gabon për një detaj, ky nuk është momenti.

Pse është kaq e rëndësishme? Sepse mysafiri i pakënaqur ka nevojë, para së gjithash, të ndihet i dëgjuar. Kur e ndërpret, edhe për ta ndihmuar, ai ndihet i padëgjuar dhe zemërimi rritet.

Dëgjimi aktiv tregohet me trup: koka që tundet lehtë, sytë te mysafiri, qëndrimi i drejtë dhe i hapur, pa krahë të kryqëzuar.`],
["E: Empati",`Hapi i dytë: trego që e kupton ndjenjën e mysafirit.

“E kuptoj plotësisht, nuk është ajo që prisnit nga ne.”
“E kuptoj, kjo është zhgënjyese, sidomos në një mbrëmje të veçantë.”

Empatia nuk do të thotë që pranon që mysafiri ka të drejtë në çdo detaj. Do të thotë që pranon që ndjenja e tij është e vërtetë. Mysafiri që pret 40 minuta për pjatën kryesore ndihet i zhgënjyer, pavarësisht nëse kuzhina kishte një arsye të mirë.

Shmang frazat që duken empatike por nuk janë:
• “E kuptoj, por...” Fjala “por” fshin gjithçka para saj.
• “Më vjen keq që u ndjetë kështu.” Kjo e vendos problemin te ndjenja e mysafirit, jo te ajo që ndodhi.
• “Qetësohuni.” Kjo e zemëron edhe më shumë.`],
["A: Kërko ndjesë",`Hapi i tretë: kërko ndjesë, sinqerisht dhe në emër të hotelit.

“Ju kërkoj ndjesë.”
“Ju kërkoj ndjesë për këtë.”

Ndjesa është e thjeshtë, e shkurtër dhe pa kushte. Nuk ka nevojë për shpjegime të gjata. Nuk fajëson askënd: as kuzhinën, as kolegun, as sistemin.

Disa kamarierë kanë frikë se ndjesa do të thotë pranim faji. Por ndjesa në shërbim nuk është deklaratë ligjore; është shprehje respekti. Ne kërkojmë ndjesë që mysafiri nuk mori përvojën që meritonte, pavarësisht nga shkaku.

Ndjesa jepet në emër të hotelit: “Ju kërkoj ndjesë” ose “Ju kërkojmë ndjesë”, jo “Kuzhina ju kërkon ndjesë”. Për mysafirin, kamarieri është hoteli.`],
["R: Vepro",`Hapi i katërt: zgjidhe problemin, menjëherë.

Ofro zgjidhje, ose më mirë, dy zgjidhje: “Mund t'jua përgatisim përsëri menjëherë, ose t'ju sugjeroj tartarin e karkalecave që del për pak minuta. Çfarë preferoni?”

Pse dy zgjidhje? Sepse i jep mysafirit kontrollin. Mysafiri i pakënaqur ndihet i pafuqishëm; zgjedhja ia rikthen fuqinë.

Vepro brenda kompetencës tënde, pa pritur leje. Siç shpjegohet në leksionin A4, kamarieri ka autoritet për disa zgjidhje: rigatim, zëvendësim, një pije ose ëmbëlsirë falas, heqja e pjatës nga fatura. Për këto nuk ka nevojë të shkojë te supervizori dhe ta lërë mysafirin të presë.

Thuaj kohën: “Pjata e re do të jetë këtu për 10 minuta.” Dhe mbaje premtimin.

Gjatë pritjes, mos e lër mysafirin bosh. Ofro diçka: bukë shtesë, një pije, një pjatë të vogël nga kuzhina.`],
["N: Njofto",`Hapi i pestë: njofto, regjistro, dhe kthehu.
• Njofto supervizorin menjëherë. Supervizori duhet ta dijë, edhe kur problemi është zgjidhur.
• Regjistro rastin në sistem, me detajet: tavolina, mysafiri, problemi, zgjidhja.
• Kthehu te mysafiri pas 2 deri në 3 minutash për të kontrolluar: “A është gjithçka në rregull tani?”
• Supervizori kalon te tavolina para fundit të darkës: “Zoti Smith, më thanë për levrekun. Ju kërkoj ndjesë. Shpresoj që pjesa tjetër e darkës të ketë qenë e mirë.”

Standardi HD10 kërkon që mysafiri të mos përsërisë kërkesat. Kur supervizori vjen te tavolina, ai duhet ta dijë problemin. Nëse pyet “Çfarë ndodhi?”, mysafiri duhet ta tregojë për herë të dytë, dhe kjo është gabim.

Mysafiri nuk duhet të kalojë kurrë “nga dora në dorë”. Ai që dëgjon ankesën është përgjegjës deri në zgjidhje.`],
["Çfarë nuk thuhet kurrë",`Disa fraza e prishin çdo rikuperim:
• “Nuk është faji im, është kuzhina.”
• “Kështu e bëjmë gjithmonë.”
• “Askush tjetër nuk është ankuar.”
• “Kjo është receta e shefit.”
• “Nuk mund të bëj asgjë.”
• Një shpjegim i gjatë teknik para se të dëgjosh: “Shikoni, levreku gatuhet kështu sepse shefi...”

Dhe disa sjellje:
• Mysafiri ia thotë problemin tre personave të ndryshëm.
• Kamarieri ikën dhe nuk kthehet.
• Kamarieri debaton me mysafirin para mysafirëve të tjerë.
• Kamarieri flet me kolegët për mysafirin, me zë që dëgjohet.

» Skenë nga Garden: Mysafiri thërret kamarierin: “E kërkova ribeye-n medium-rare dhe kjo është well-done.” Kamarieri dëgjon pa e ndërprerë. “E kuptoj plotësisht, nuk është ajo që kërkuat. Ju kërkoj ndjesë. Mund t'ju përgatisim një tjetër medium-rare, rreth 15 minuta, ose, nëse preferoni, një prerje tjetër nga menuja. Çfarë dëshironi?” Mysafiri zgjedh ribeye-n e re. Kamarieri sjell një gotë Primitivo falas për pritjen dhe njofton supervizorin, që kalon te tavolina kur del bifteku i ri.`],
["Përmbledhje",`LEARN: Dëgjo, Empati, Kërko ndjesë, Vepro, Njofto. Dëgjo deri në fund pa e ndërprerë. Trego që e kupton ndjenjën, pa “por”. Kërko ndjesë thjesht, sinqerisht, në emër të hotelit, pa fajësuar askënd. Ofro dy zgjidhje dhe vepro brenda kompetencës, pa pritur leje. Njofto supervizorin, regjistro, kthehu pas 2 deri në 3 minutash. Dhe mysafiri nuk kalon kurrë nga dora në dorë.`]
];
LEC.A3=[
["Hyrje: qetësia ngjitet",`Disa situata në restorant dhe në bar janë më të vështira se një pjatë e ftohtë. Një reaksion alergjik, një mysafir i dehur, një mysafir që bërtet, një kartë e refuzuar, një vonesë e madhe e kuzhinës, një kërkesë që nuk është në menu. Këto situata kërkojnë jo vetëm metodën LEARN, por edhe hapa specifikë që duhen ditur përmendsh, sepse në moment nuk ka kohë për të menduar.

Dhe kërkojnë qetësi. Emocionet ngjiten: një kamarier i qetë e ul tensionin e gjithë tavolinës dhe të tavolinave përreth. Mysafirët e tjerë po shikojnë si e trajtojmë situatën, dhe do ta gjykojnë hotelin nga reagimi ynë, jo nga problemi. Ky leksion shpjegon gjashtë situatat më të vështira.`],
["Reaksioni alergjik",`Reaksioni alergjik i rëndë, anafilaksia, është emergjencë mjekësore. Mund të zhvillohet brenda minutave dhe mund të jetë fatal.

Shenjat:
• Ënjtje e buzëve, gjuhës, fytyrës ose fytit.
• Vështirësi në frymëmarrje, kollë, fishkëllimë.
• Skuqje ose kruajtje e lëkurës.
• Marramendje, dobësi, rënie e presionit.
• Të vjella ose dhimbje barku.

Çfarë bën:
• Thirr menjëherë supervizorin dhe ambulancën, 127.
• Mos e lëviz mysafirin, përveç kur është në rrezik. Lëre të ulet ose të shtrihet në pozicionin që i jep më shumë rehati; nëse ka vështirësi në frymëmarrje, shpesh preferon të rrijë ulur.
• Pyet nëse ka autoinjektor adrenaline, EpiPen. Shumë njerëz me alergji të rënda e mbajnë me vete. Mysafiri ose shoqëruesi e përdor.
• Qëndro me mysafirin derisa të vijë ndihma.
• Ruaj pjatën dhe porosinë, për hetim të mëvonshëm.
• Asnjë diskutim për fajin në sallë. As me mysafirin, as me kolegët.

Siç shpjegohet në Modulin 8, parandalimi është mbrojtja më e mirë: pyet gjithmonë për alergjitë, konfirmo me kuzhinën, mos supozo kurrë.`],
["Mysafiri i dehur",`Shërbimi i alkoolit një mysafiri qartësisht të dehur është përgjegjësi ligjore dhe morale, siç shpjegohet në leksionin X4.

Çfarë bën:
• Mos i shërbe më alkool.
• Ofro ujë, kafe, diçka për të ngrënë.
• Fol me qetësi, privatisht, pa e turpëruar para të tjerëve: “Për sonte, më lejoni t'ju sjell diçka tjetër.” Jo “Ju jeni i dehur” ose “Mjaft pinë”.
• Mos debato. Mysafiri i dehur nuk arsyeton si zakonisht.
• Njofto supervizorin, dhe sigurinë nëse duhet.
• Ndihmë me taksi. Kurrë mos e lër të ngasë makinën.
• Nëse është mysafir i hotelit, sigurohu që arrin në dhomë i sigurt.

Kujdes me shoqëruesit: shpesh janë aleatët më të mirë. Një fjalë e qetë me mikun e tij, “A mund ta ndihmoni të shkojë në dhomë?”, funksionon më mirë se çdo gjë tjetër.`],
["Mysafiri i zemëruar me zë të lartë",`Mysafiri që ngre zërin krijon dy probleme: problemin e tij dhe shqetësimin e të gjithë sallës.

Çfarë bën:
• Mos e ngri zërin. Fol më ngadalë dhe më qetë se zakonisht. Mysafiri, pa e kuptuar, do ta ulë zërin për t'u përshtatur.
• Ofroji një vend më privat për të folur: “Më lejoni t'ju dëgjoj në një vend më të qetë.” Kjo e largon konfliktin nga mysafirët e tjerë dhe i tregon mysafirit që e merr seriozisht.
• Zbato LEARN: dëgjo, empati, ndjesë, vepro, njofto.
• Mos e merr personalisht. Mysafiri është i zemëruar me situatën, jo me ty.

Nëse situata bëhet kërcënuese, me fyerje, kërcënime ose agresivitet fizik:
• Tërhiqu.
• Thirr supervizorin dhe sigurinë.
• Mos u përpiq ta menaxhosh vetëm.

Siguria jote ka përparësi mbi çdo standard shërbimi.`],
["Karta e refuzuar",`Karta e refuzuar është situatë e sikletshme për mysafirin, sidomos kur është me shoqërues, me klientë pune ose në një takim romantik.

Rregulli: asnjëherë me zë të lartë dhe asnjëherë para shoqëruesve.

Çfarë bën:
• Afrohu diskret te mysafiri që pagoi, jo te tavolina e gjithë.
• Përdor një fjali neutrale që nuk e fajëson: “Terminali nuk e pranoi pagesën, ndoshta është problem lidhjeje. Dëshironi të provojmë përsëri, ose me një kartë tjetër?”
• Nëse është mysafir i hotelit, ofro opsionin e ngarkimit në dhomë.
• Nëse asnjë opsion nuk funksionon, ftoje mysafirin te stacioni ose te recepsioni për ta zgjidhur privatisht.

Mos thuaj kurrë “Karta juaj u refuzua” ose “Nuk keni para në kartë” para të tjerëve. Edhe kur e di që problemi është te karta, mysafiri duhet të ruajë dinjitetin.`],
["Vonesa e madhe e kuzhinës",`Ndonjëherë kuzhina vonohet: një natë shumë e ngarkuar, një gabim në porosi, një problem me pajisjet. Mysafiri që pret pa e ditur pse është mysafiri më i pakënaqur.

Çfarë bën:
• Njofto proaktivisht, para se mysafiri të pyesë. Në momentin që e di se pjata do të vonohet, thuaje.
• Jep kohë reale: “Pjatat tuaja do të vonohen rreth 10 minuta. Ju kërkoj ndjesë.” Jo “Vjen menjëherë” kur nuk vjen.
• Ofro diçka gjatë pritjes: bukë shtesë, një pjatë të vogël nga kuzhina, një pije.
• Supervizori kalon te tavolina.
• Kur pjata vjen, mos bëj sikur nuk ka ndodhur asgjë: “Faleminderit për durimin.”

Mysafiri e toleron vonesën shumë më mirë kur e di. Pritja e paditur duket dy herë më e gjatë se pritja e njoftuar.`],
["Kërkesa që nuk është në menu",`Mysafiri kërkon diçka që nuk është në menu: një pjatë pa një përbërës, një salcë tjetër, një pjatë e thjeshtë për fëmijën, diçka që hëngri herën e kaluar.

Rregulli: asnjëherë “jo” menjëherë. Standardi HD18 kërkon që asnjë kërkesë të mos refuzohet pa alternativë.

Çfarë bën:
• “Më lejoni ta kontrolloj me shefin.” Kuzhina shpesh mund ta bëjë, sidomos kërkesat e thjeshta.
• Nëse kuzhina mund ta bëjë, thuaje me kënaqësi: “Shefi do ta përgatisë me kënaqësi.”
• Nëse nuk mund, ofro dy alternativa: “Shefi nuk mund ta bëjë sonte, por mund t'ju sugjeroj levrekun me kore barishtesh, ose shojzën, që janë të ngjashme.”

» Skenë nga Flower: Një nënë kërkon “diçka të thjeshtë” për djalin e saj pesëvjeçar, që nuk ha peshk. Kamarieri: “Më lejoni ta kontrolloj me shefin.” Kthehet pas një minute: “Shefi mund t'i bëjë një pjatë pasta me gjalpë dhe parmixhano, ose me salcë domateje. Çfarë preferon?” Djali zgjedh pastën me domate. Nëna e kujton këtë për gjithë qëndrimin.`],
["Përmbledhje",`Qetësia ngjitet, dhe mysafirët e tjerë po shikojnë. Reaksion alergjik: supervizori dhe 127 menjëherë, mos e lëviz, pyet për EpiPen, ruaj pjatën. Mysafir i dehur: mos shërbe më alkool, fol privatisht, ofro ujë dhe taksi. Mysafir i zemëruar: mos e ngri zërin, ofro vend privat, LEARN, tërhiqu nëse bëhet kërcënues. Kartë e refuzuar: diskret, me fjali neutrale, kurrë para shoqëruesve. Vonesë: njofto para se të pyesë, kohë reale, ofro diçka. Kërkesë jashtë menusë: kurrë “jo” menjëherë, kontrollo me shefin, dy alternativa.`]
];
LEC.A4=[
["Hyrje: mysafiri nuk pret ndërsa ti kërkon leje",`Imagjino këtë: mysafiri ankohet që ëmbëlsira e tij është e djegur. Kamarieri dëgjon, kërkon ndjesë, dhe pastaj thotë: “Më lejoni ta pyes supervizorin.” Supervizori është në tavolinën tjetër. Kamarieri pret. Pas pesë minutash, supervizori vjen, dëgjon problemin përsëri, dhe thotë: “Sigurisht, do t'ju sjellim një tjetër.”

Problemi u zgjidh, por mysafiri priti pesë minuta dhe e tregoi dy herë. Rikuperimi u dobësua. Ky leksion shpjegon si i jepet stafit autoriteti për të zgjidhur problemet pa pritur leje, si përcaktohet kompensimi i duhur dhe si regjistrohet.`],
["Autorizimi i stafit",`Ritz-Carlton është i njohur për një rregull të famshëm: çdo punonjës mund të shpenzojë deri në 2.000 dollarë për mysafir për të zgjidhur një problem, pa kërkuar leje nga askush.

Shifra nuk është thelbi. Shumica e problemeve zgjidhen me shumë më pak: një ëmbëlsirë, një pije, një pjatë e re. Thelbi është parimi: mysafiri nuk pret ndërsa kamarieri kërkon leje. Rikuperimi më i fortë është ai i menjëhershëm, nga personi i parë që dëgjon problemin.

Ky koncept quhet “empowerment”, autorizim. Ai bazohet në besim: hoteli i beson stafit që do të përdorë gjykimin e mirë. Dhe stafi, kur ndihet i besuar, merr përgjegjësi.

Autorizimi nuk do të thotë që stafi mund të bëjë çfarë të dojë. Do të thotë që ka kufij të qartë, brenda të cilëve vepron pa pyetur, dhe mbi të cilët kërkon ndihmë.`],
["Kompensimi proporcional",`Kompensimi duhet të jetë në përpjesëtim me problemin dhe me ndikimin që pati te mysafiri.

Një pjatë e ftohtë nuk kërkon darkë falas. Një ditëlindje e prishur, me një vonesë të madhe dhe një pjatë të gabuar, mund të kërkojë një gjest të madh.

Pyetjet që përcaktojnë kompensimin:
• Sa i rëndë ishte problemi? Një vonesë e vogël, apo një reaksion alergjik?
• Sa ndikoi te përvoja? Një pjatë e zëvendësuar shpejt, apo një mbrëmje e prishur?
• A ishte rast i veçantë? Ditëlindje, përvjetor, propozim martese, takim i rëndësishëm pune?
• A ka ndodhur më parë me këtë mysafir?

Dhe një e vërtetë e rëndësishme: gjesti personal shpesh vlen më shumë se zbritja. Një shënim i shkruar me dorë nga shefi, një ëmbëlsirë me një mesazh, një vizitë e menaxherit, kujtohen më gjatë se 20 për qind zbritje në faturë.

Kompensimi gjithashtu nuk duhet të jetë i tepërt. Një mysafir që merr darkë falas për një pjatë të ftohtë mund të mendojë që problemi ishte më i madh se ç'ishte, ose mund të mësojë se ankesa sjell darka falas.`],
["Tri nivelet",`Modeli i autorizimit ka tri nivele. Kufijtë e saktë i përcakton menaxhmenti i hotelit; ky është modeli që propozojmë.

Niveli 1, kamarieri ose banakieri, pa leje:
• Rigatimi ose zëvendësimi i pjatës.
• Një pije, kafe, ëmbëlsirë ose digjestiv falas.
• Heqja e pjatës nga fatura nëse mysafiri nuk e hëngri.

Niveli 2, supervizori:
• Heqja e disa artikujve nga fatura.
• Një shishe vere me zbritje ose falas.
• Një gjest në dhomë: ëmbëlsira, letër personale.

Niveli 3, menaxheri i F&B:
• Darkë falas.
• Ftesë për një vizitë tjetër.
• Koordinim me recepsionin për gjeste gjatë gjithë qëndrimit.

Edhe kur kamarieri vepron në nivelin 1, ai njofton supervizorin, siç kërkon hapi N i metodës LEARN. Njoftimi nuk është kërkesë leje; është informacion.`],
["Regjistrimi",`Çdo kompensim regjistrohet në POS, me arsyen: “Ëmbëlsirë falas, tavolina 12, levrek i ftohtë.”

Qëllimi nuk është kontrolli i stafit. Qëllimi është mësimi:
• Problemet që përsëriten zbulohen. Nëse levreku del i ftohtë çdo të shtunë, problemi është në kuzhinë ose në sistem, dhe duhet rregulluar në rrënjë.
• Mysafirët që kanë pasur probleme njihen. Nëse mysafiri kthehet, stafi e di dhe mund t'i kushtojë vëmendje të veçantë.
• Kostot e rikuperimit maten dhe krahasohen me kostot e humbjes së mysafirëve.

Regjistrimi mbron edhe stafin. Kamarieri që ka dhënë një ëmbëlsirë falas dhe e ka regjistruar me arsyen nuk ka asgjë për të shpjeguar më vonë.`],
["Gjykimi i mirë",`Autorizimi kërkon gjykim. Disa udhëzime:
• Vepro shpejt. Rikuperimi i menjëhershëm vlen më shumë se rikuperimi i madh por i vonuar.
• Pyet mysafirin. Ndonjëherë mysafiri nuk dëshiron kompensim; dëshiron vetëm që problemi të zgjidhet dhe të dëgjohet. “Çfarë mund të bëj për ta rregulluar?” është pyetje e mirë.
• Personalizoje. Një çift që feston përvjetorin vlerëson një ëmbëlsirë me qiri më shumë se një zbritje.
• Mos premto atë që nuk mund ta japësh. Nëse diçka është mbi nivelin tënd, thuaj: “Më lejoni ta diskutoj me menaxherin,” dhe kthehu shpejt.
• Mos e bëj kompensimin publik. Mysafirët e tjerë nuk duhet të dëgjojnë “do t'ju bëjmë darkën falas”.

» Skenë nga Flower: Një çift feston përvjetorin e dhjetë. Kuzhina vonohet 25 minuta me pjatat kryesore. Kamarieri njofton menjëherë, sjell dy gota Moët falas dhe njofton supervizorin. Supervizori kalon te tavolina, kërkon ndjesë dhe, me ëmbëlsirën, sjell një pjatë me “Gëzuar përvjetorin” të shkruar me çokollatë dhe një shënim të shkruar me dorë nga shefi. Çifti shkruan më vonë online për “mbrëmjen më të bukur të vitit”.`],
["Përmbledhje",`Mysafiri nuk pret ndërsa kamarieri kërkon leje: rikuperimi më i fortë është i menjëhershmi. Kompensimi në përpjesëtim me problemin dhe ndikimin; gjesti personal shpesh vlen më shumë se zbritja. Tri nivele: kamarieri pa leje, supervizori, menaxheri i F&B, me kufijtë e përcaktuar nga menaxhmenti. Çdo kompensim regjistrohet me arsyen, për të mësuar dhe për ta rregulluar në rrënjë. Dhe përdor gjykimin: vepro shpejt, pyet mysafirin, personalizoje, mos premto atë që nuk mund ta japësh.`]
];
LEC.Z1=[
["Hyrje: shitja si shërbim",`Shumë kamarierë kanë një marrëdhënie të vështirë me shitjen. Disa e shohin si diçka të pahijshme, që nuk i përket shërbimit luksoz. Të tjerë e bëjnë me presion, duke sugjeruar gjithmonë më të shtrenjtën, duke përsëritur pas një “jo”, duke e bërë mysafirin të ndihet i detyruar.

Të dyja qasjet janë të gabuara. Ky leksion shpjegon një qasje të tretë: shitjen etike, ku sugjerimi është shërbim, sepse ndihmon mysafirin të zgjedhë më mirë. Leksioni shpjegon pse sugjerimi është standard shërbimi, ku është kufiri midis sugjerimit dhe presionit, psikologjinë e zgjedhjes dhe pse e ardhura më e madhe vjen nga mysafiri që kthehet.`],
["Sugjerimi është shërbim",`Mysafiri që vjen për herë të parë në Flower nuk e di çfarë është më e mira. Menuja ka dhjetëra pjata, lista e verërave ka 123 etiketa. Ai mund të zgjedhë diçka që nuk i pëlqen, ose të humbasë pjatën që do ta kishte bërë mbrëmjen e paharrueshme.

Kur kamarieri sugjeron, i jep informacion dhe i kursen rrezikun e një zgjedhjeje të gabuar. Kjo është arsyeja pse Forbes e ka bërë rekomandimin standard shërbimi, jo shitjeje:
• HD23: stafi jep rekomandime të dobishme kur pyetet.
• HD24: stafi diskuton detajet e pjatave.
• HD25 dhe BL8: stafi diskuton pijet, verërat, birrat dhe alkoolet.

Kamarieri që nuk sugjeron asgjë nuk është “më pak i bezdisshëm”; është më pak i dobishëm. Mysafiri që pyet “Çfarë më sugjeroni?” dhe merr përgjigjen “Gjithçka është e mirë” nuk ka marrë shërbim.`],
["Kufiri: kur sugjerimi bëhet presion",`Sugjerimi bëhet presion kur:
• Përsëritet pas një “jo”. Mysafiri tha që nuk dëshiron verë; kamarieri sugjeron verë përsëri pas pjatës së parë dhe përsëri pas të dytës.
• Injoron buxhetin ose preferencën e mysafirit. Mysafiri porositi verën më të lirë të listës; kamarieri i sugjeron një shishe 15.000 lekë.
• Fsheh çmimin. Kamarieri sugjeron një specialitet jashtë menusë pa e thënë çmimin, dhe mysafiri e zbulon në faturë.
• Krijon ndjenjë faji ose turpi. “Të gjithë mysafirët tanë marrin shampanjë.”
• Ndërpret bisedën e mysafirëve vetëm për të shitur.

Mysafiri që ndihet i manipuluar nuk kthehet, dhe shpesh e shkruan online. Fitimi nga një shishe e shitur me presion është shumë më i vogël se humbja e një mysafiri që do të kishte ardhur dhjetë herë.

Rregulli i artë: sugjero një herë, me sinqeritet, dhe respekto përgjigjen.`],
["Psikologjia e zgjedhjes: ankorimi",`Psikologët Amos Tversky dhe Daniel Kahneman, ky i fundit fitues i çmimit Nobel për ekonominë në 2002, përshkruan në vitet 1970 një fenomen që quhet “efekti i ankorimit”. Opsioni ose numri i parë që dëgjon njeriu bëhet pika e referencës për gjithçka tjetër.

Në restorant, kjo do të thotë që vera e parë që sugjeron kamarieri bëhet referenca për mysafirin. Nëse sugjeron fillimisht një verë të nivelit mesatar-të lartë, ajo bëhet pika e krahasimit. Nëse fillon me më të lirën, ajo bëhet referenca, dhe çdo verë tjetër duket e shtrenjtë.

Prandaj, siç shpjegohet në leksionin F4, ofrohen tri nivele, duke filluar nga mesi: “Me shojzën ju sugjeroj një Chablis Premier Cru. Nëse dëshironi diçka më të thjeshtë, Chardonnay i Livon-it është shumë i mirë, dhe për një rast të veçantë, Meursault-i është i jashtëzakonshëm.”

Kujdes: ankorimi funksionon vetëm kur sugjerimi është i sinqertë. Nëse kamarieri sugjeron një verë vetëm sepse është e shtrenjtë, pa qenë çiftimi i duhur, mysafiri e kupton herët a vonë. Ankorimi është mjet për të ndihmuar, jo për të manipuluar.`],
["Ekonomia e restorantit",`Pse ka rëndësi shitja? Sepse ekonomia e restorantit është e brishtë.

Disa koncepte:
• Çeku mesatar: të ardhurat totale pjesëtuar me numrin e mysafirëve. Kjo është shifra kryesore që mat menaxhmenti.
• Marzhi: diferenca midis çmimit të shitjes dhe kostos. Pijet, ëmbëlsirat dhe kafeja kanë zakonisht marzhin më të lartë; pjatat kryesore, sidomos mishi dhe peshku premium, kanë kosto më të lartë.

Një rritje e vogël e çekut mesatar, për shembull një kafe ose një ëmbëlsirë më shumë për tavolinë, shumëzuar me mijëra mysafirë në vit, mund të jetë diferenca midis një restoranti që humbet dhe një që fiton. Dhe një restorant që fiton mund të investojë në staf, në produkte më të mira, në pagë.

Por e ardhura më e madhe nuk vjen nga një darkë e vetme. Vjen nga mysafiri që kthehet, që sjell miqtë, që shkruan mirë për ne. Prandaj shitja etike nuk është në konflikt me fitimin; është strategjia më fitimprurëse në afat të gjatë.`],
["Si duket shitja etike",`Shitja etike ka disa karakteristika:
• Fillon nga mysafiri, jo nga produkti. Pyet çfarë i pëlqen, çfarë feston, sa kohë ka, sa i uritur është.
• Sugjeron atë që do të sugjeroje për një mik. Nëse nuk do t'ia sugjeroje mikut tënd, mos ia sugjero mysafirit.
• Jep opsione në nivele të ndryshme, që mysafiri të zgjedhë pa u ndjerë i gjykuar.
• Thotë çmimin për çdo gjë jashtë menusë.
• Sugjeron një herë dhe respekton përgjigjen.
• Ndonjëherë sugjeron më pak: “Dy pjata për ndarje mjaftojnë për të filluar; porcionet janë bujare.”

Kjo e fundit është ndoshta teknika më e fuqishme. Kamarieri që thotë “mendoj se kjo është shumë ushqim për dy persona” fiton besimin e plotë të mysafirit. Dhe mysafiri që i beson kamarierit do ta dëgjojë kur ai sugjeron verën ose ëmbëlsirën.

» Skenë nga Garden: Dy miq porosisin tomahawk-un, ribeye-n dhe dy anësore secili. Kamarieri: “Nëse më lejoni, tomahawk-u është rreth 1,2 kg dhe mjafton mirë për dy persona. Me ribeye-n do të jetë shumë. Ndoshta tomahawk-un dhe tri anësore për ndarje?” Miqtë falënderojnë. Me ushqimin, ata pranojnë sugjerimin e kamarierit për një Brunello, dhe në fund, Tiramisu Brutal për ndarje.`],
["Përmbledhje",`Sugjerimi është shërbim: HD23, HD24 dhe HD25 janë standarde shërbimi. Sugjerimi bëhet presion kur përsëritet pas “jo”, injoron buxhetin, fsheh çmimin ose krijon faj. Ankorimi: opsioni i parë bëhet referenca, prandaj fillo nga mesi, por vetëm me sinqeritet. Çeku mesatar dhe marzhi kanë rëndësi, por e ardhura më e madhe vjen nga mysafiri që kthehet. Sugjero atë që do t'i sugjeroje një miku, thuaj çmimin, sugjero një herë, dhe ndonjëherë sugjero më pak.`]
];
LEC.Z2=[
["Hyrje: tetë momente natyrale",`Kamarieri nuk duhet të mendojë gjatë gjithë darkës “a duhet të shes tani?”. Kjo e bën të ndihet i sikletshëm dhe mysafirin të ndihet i shtyrë. Në vend të kësaj, ka tetë momente natyrale gjatë një darke ku sugjerimi është pjesë e ciklit të shërbimit, siç shpjegohet në Modulin 1. Në këto momente, mysafiri pret një sugjerim, dhe mungesa e tij është mungesë shërbimi.

Ky leksion shpjegon çdo moment, me fraza konkrete për Flower dhe Garden. Frazat nuk janë skenare për t'u recituar; janë shembuj që çdo kamarier i përshtat me stilin e vet.`],
["Momenti 1: uji",`Uji është sugjerimi i parë, dhe shpesh më i harruari. Pyetja “Dëshironi ujë?” merr shpesh përgjigjen “Po, ujë rubineti” ose “Jo”. Pyetja me dy opsione merr një zgjedhje: “Preferoni ujë natyral apo me gaz?”

Emërto markën premium që kemi. Marka e përmendur e bën ujin produkt, jo shtesë. Mysafiri që dëgjon emrin e një uji të mirë shpesh e zgjedh.

Kujdes: nëse mysafiri kërkon ujë rubineti, jepet me kënaqësi, pa koment dhe pa shikim. Shitja etike respekton çdo zgjedhje.`],
["Momenti 2: aperitivi",`Pasi mysafiri është ulur dhe ka ujin, momenti i aperitivit. Jep dy sugjerime konkrete: kokteilin e shtëpisë dhe një gotë shkumëzuese.

Shembuj:
• “Për të filluar, mund t'ju sugjeroj Clover Kiss, kokteilin tonë me xhin, mjedër dhe limon, ose një gotë Prosecco Col Mesian?”
• “Dëshironi diçka për të filluar? Aperol Spritz është klasiku, ose Hugo, me lule shtogu dhe mente, më i lehtë.”

Pse dy sugjerime? Sepse “Dëshironi një aperitiv?” merr “Jo, faleminderit”. Dy opsione konkrete e bëjnë mysafirin të mendojë cilin dëshiron, jo nëse dëshiron.

Siç shpjegohet në leksionin C1, aperitivi duhet të jetë i freskët ose hidhur-ëmbël, jo i rëndë dhe i ëmbël.`],
["Momentet 3 dhe 5: pjatat për ndarje",`Ndërsa mysafirët shikojnë menunë, një pjatë për ndarje i ndihmon të fillojnë, dhe e bën darkën më sociale.

Te Flower:
• “Ndërsa vendosni, goca deti janë fillimi ideal: një për secilin.”
• “Brusketa me açuge është shumë e mirë për ta ndarë.”

Te Garden:
• “Për tavolinën, shumë mysafirë marrin arancinin ose brusketën me palcë për të filluar.”

Momenti 5, pas porosisë kryesore, mund të jetë një pjatë shtesë për ndarje, sidomos për grupet: “Me mishin, një anësore shtesë për tavolinën?”

Kujdes nga tepria: siç shpjegohet në leksionin Z1, nëse tavolina ka porositur shumë, mos sugjero më shumë. Thuaj, nëse duhet: “Kjo është shumë ushqim për dy persona.”`],
["Momenti 4: vera",`Vera është momenti më i rëndësishëm i shitjes, dhe ai ku kamarieri ka më shumë nevojë për njohuri.

Sugjero çiftimin me pjatat e porositura, siç shpjegohet në leksionin F4 dhe në Manualin e verës:
• Fillo nga niveli mesatar-i lartë.
• Jep një alternativë: “Me peshkun ju sugjeroj Chablis-in e William Fèvre-it, ose, nëse dëshironi diçka vendase, Shesh i Bardhë i Tufës, më i freskët.”
• Për tavolinat ku secili ka pjata të ndryshme, sugjero verë me gotë: “Mund t'ju sugjeroj një gotë Riesling për peshkun dhe një Primitivo për mishin?”
• Për çiftet që duan të bardhë dhe të kuqe, sugjero shishet e vogla 0,375 litra.

Thuaj çmimin kur nuk është i qartë, ose kur mysafiri duket i pasigurt.`],
["Momenti 6: raundi i dytë",`Raundi i dytë ofrohet kur gota është në një të katërtën, sipas BL18: brenda 1 minute pasi gota mbaron.

Diskret: “Një tjetër?” ose një shikim dhe një lëvizje e lehtë me kokë. Nuk ka nevojë për fjali të gjata.

Për shishet e verës: kur shishja është pothuajse bosh, pyet: “Dëshironi një shishe tjetër të së njëjtës, apo të provoni diçka tjetër me pjatën tjetër?”

Kujdes: mos ofro raundin e dytë mysafirit që ka pirë shumë, siç shpjegohet në leksionin X4. Ofro ujë.`],
["Momenti 7: ëmbëlsira",`Menuja e ëmbëlsirave sillet gjithmonë, pa pyetur “Dëshironi ëmbëlsirë?”. Pyetja merr “Jo, jemi ngopur”. Menuja e hapur, me një favorit të përmendur, e ngjall dëshirën.

Shembuj:
• Te Flower: “Bakllavaja signature e Genti Malavecit është specialiteti ynë.”
• Te Garden: “Tiramisu Brutal është favoriti i mysafirëve.”

Për mysafirët e ngopur: “Një ëmbëlsirë për t'u ndarë, me dy lugë?” Kjo është shpesh zgjidhja që të gjithë e pranojnë.

Për rastet e veçanta, si ditëlindjet ose përvjetorët, ëmbëlsira me qiri ose me mesazh është moment “wow”, siç shpjegohet në leksionin E2.`],
["Momenti 8: kafeja dhe digjestivi",`Pas ëmbëlsirës, ose në vend të saj, kafeja dhe digjestivi.

Sugjerim konkret, me opsionet që kemi në bar:
• “Një espresso për të mbyllur? Ose, nëse dëshironi diçka me kafe, Espresso Martini?”
• “Për digjestiv, Old Father është krijimi ynë, me tekila, Aperol dhe amaretto. Ose, nëse preferoni diçka klasike, Hennessy ose Glenfiddich 15 vjeç.”
• “Don Amaretto, me rum, bajame dhe vanilje, është shumë i mirë pas darkës.”

Mos harro alergjinë ndaj arrave për kokteilet me amaretto, dhe dekafeinatin për ata që nuk pinë kafe në mbrëmje.

» Skenë nga Flower: Një çift pas menusë së degustimit. Kamarieri: “Shpresoj që darka të ketë qenë e mrekullueshme. Dëshironi një espresso, apo diçka për të mbyllur mbrëmjen? Old Father është kokteili ynë firmato.” Gruaja: “Jam e ngopur, por një espresso po.” Burri: “Old Father, sigurisht.” Kamarieri: “Ka amaretto, a keni ndonjë alergji ndaj arrave?”`],
["Përmbledhje",`Tetë momente natyrale: uji me dy opsione dhe markë, aperitivi me dy sugjerime konkrete, pjata për ndarje ndërsa vendosin, vera nga niveli mesatar me alternativë, pjata shtesë për ndarje, raundi i dytë kur gota është në një të katërtën, ëmbëlsira me menunë gjithmonë dhe një favorit, kafeja dhe digjestivi me sugjerim konkret. Asnjë “Dëshironi...?” që merr “jo”. Dhe gjithmonë me respekt për zgjedhjen e mysafirit.`]
];
LEC.Z3=[
["Hyrje: teknikat që funksionojnë",`Leksioni Z1 shpjegoi pse shitja etike është shërbim; leksioni Z2 shpjegoi kur bëhet. Ky leksion shpjegon si bëhet: gjashtë teknika sugjerimi që funksionojnë, të bazuara në psikologjinë e zgjedhjes dhe në përvojën e restoranteve më të mira në botë.

Asnjë nga këto teknika nuk është manipulim. Të gjitha bazohen në një parim: të ndihmojmë mysafirin të zgjedhë diçka që do t'i pëlqejë, me informacion të plotë dhe të ndershëm.`],
["Teknika 1: dy opsione, jo pyetje po ose jo",`Pyetja “Dëshironi verë?” ka dy përgjigje të mundshme, dhe më e lehta është “jo”. Pyetja “Preferoni një të bardhë të freskët apo një të kuqe më të plotë?” ka dy përgjigje të tjera, dhe të dyja janë zgjedhje.

Kjo teknikë funksionon sepse:
• Mysafiri nuk ka nevojë të vendosë nëse dëshiron; vendos vetëm çfarë.
• I jep mysafirit kontroll, sepse zgjedh ai.
• E bën bisedën më të lehtë dhe më natyrale.

Shembuj:
• “Ujë natyral apo me gaz?”
• “Espresso apo cappuccino?”
• “Clover Kiss, i freskët dhe frutor, apo Negroni, më i fortë dhe i hidhur?”
• “Bakllava apo crème brûlée?”

Kujdes: mysafiri gjithmonë mund të thotë “asnjërën”. Kjo përgjigje respektohet pa koment.`],
["Teknika 2: gjuha shqisore",`Fjalët që përdorim për të përshkruar ushqimin dhe pijet ndikojnë në atë që mysafiri dëshiron, dhe madje në mënyrën si e shijon. Kërkimet në psikologjinë e ushqimit kanë treguar që përshkrimet shqisore dhe të detajuara rrisin dëshirën dhe kënaqësinë.

Krahaso:
• “Kemi levrek.” me “Levreku me kore barishtesh, mbi pure fasuleje dhe karota ylber.”
• “Kemi biftek.” me “Ribeye-n e pjekim në Josper, me qymyr druri, që i jep një kore të tymosur.”
• “Kemi sufle.” me “Sufleja përgatitet në çast, me akullore, karamel dhe ashkla bajameje.”

Fjalët shqisore:
• Teksturë: krokante, e butë, kremoze, e shkrifët, e lëngshme.
• Metoda: e pjekur në thëngjill, e gatuar ngadalë, e marinuar.
• Temperaturë: e nxehtë, e ftohtë, e freskët.
• Aromë: e tymosur, me barishte, me agrume.

Rregull: përdor vetëm fjalë që janë të vërteta. Mos thuaj “e kapur sot në mëngjes” nëse nuk e di me siguri.`],
["Teknika 3: rekomandimi personal",`“Favoriti im është...” Mysafiri i beson përvojës së një personi më shumë se përshkrimit në menu. Kur kamarieri thotë që e ka provuar dhe i pëlqen, ai jep diçka që menuja nuk mund ta japë: një garanci personale.

Shembuj:
• “Favoriti im është oktapodi i zi. Piperi i tymosur me xhenxhefilin është kombinim i jashtëzakonshëm.”
• “Nëse do të vija si mysafir, do të merrja tomahawk-un. Është prerja më spektakolare.”

Kushti: rekomandimi duhet të jetë i vërtetë. Kamarieri duhet t'i ketë provuar pjatat, dhe kjo është arsyeja pse provat e pjatave para turnit janë kaq të rëndësishme. Rekomandimi i rremë zbulohet: mysafiri bën një pyetje të dytë, dhe kamarieri nuk di çfarë të thotë.

Ndrysho favoritet. Nëse çdo kamarier rekomandon gjithmonë të njëjtën pjatë, rekomandimi humbet vlerën.`],
["Teknika 4: markat premium",`Kur mysafiri porosit pa markë, “një gin tonik”, “një vodka”, “një uiski”, ai shpesh nuk ka preferencë. Pyet me dy marka premium:
• “Gin tonik me Hendrick's, me kastravec, apo me Gin Mare, me rozmarinë?”
• “Vodka: Belvedere apo Grey Goose?”
• “Uiski: Glenfiddich 12 vjeç, apo diçka më të butë si Chivas?”

Kjo teknikë funksionon sepse:
• Mysafiri mëson që kemi marka të mira.
• Pyetja tregon njohuri.
• Mysafiri zgjedh një produkt më të mirë dhe zakonisht është më i kënaqur.

Kujdes: kur mysafiri kërkon markën standarde, ose thotë “çfarëdo”, respektoje. Mos e bëj të ndihet i varfër.`],
["Teknika 5: çiftimi",`Lidhja e dy produkteve rrit vlerën e të dyjave. “Kjo verë e bën qengjin të shkëlqejë” i jep mysafirit arsye për verën dhe për qengjin.

Shembuj nga menutë tona:
• “Me gocat, Sigalas nga Santorini është çiftimi perfekt; e përdorim edhe në vetë pjatën.”
• “Qengji i gatuar ngadalë shkon shumë mirë me Côte-Rôtie, me piperin dhe barishtet e saj.”
• “Bakllavaja me një espresso është mbyllja klasike.”

Çiftimi tregon që kamarieri mendon për përvojën e plotë, jo vetëm për pjatat veç e veç. Dhe mysafiri që ka provuar një çiftim të mirë e kujton, dhe e kërkon përsëri.`],
["Teknika 6: transparenca e çmimit",`Kjo nuk është teknikë shitjeje; është kusht. Pa transparencë, çdo teknikë tjetër bëhet manipulim.

Për çdo specialitet jashtë menusë, për çdo prerje mishi me peshë, për çdo verë të sugjeruar kur mysafiri nuk e ka parë çmimin, thuaj çmimin:
• “Tomahawk-u është 12.000 lekë për kilogram. Ky peshon rreth 1,2 kg, pra afro 14.400 lekë, për dy persona.”
• Wagyu është 50.000 lekë për kilogram dhe shërbehet në porcione të vogla: para porosisë, thuaj peshën dhe çmimin e porcionit.
• “Barolo Batasiolo në shishe të vogël 0,375 litra është 7.000 lekë.”

Asgjë nuk e prish më shumë mbrëmjen se një faturë e papritur. Mysafiri që e di çmimin dhe zgjedh, është i kënaqur. Mysafiri që e zbulon çmimin në fund ndihet i mashtruar, edhe nëse pjata ishte e shkëlqyer. Standardi HD57 kërkon që fatura të jetë e saktë, dhe një çmim i papritur shkel frymën e këtij standardi.

» Skenë nga Garden: Kamarieri: “Sonte kemi një tomahawk prej 1,4 kg. Me 12.000 lekë për kilogram, del rreth 16.800 lekë, mjafton për dy ose tre persona.” Mysafiri buzëqesh: “Faleminderit që ma thatë. E marrim.” Në fund, fatura nuk ka asnjë surprizë.`],
["Përmbledhje",`Gjashtë teknika: dy opsione në vend të pyetjes po ose jo; gjuha shqisore, vetëm me fjalë të vërteta; rekomandimi personal, vetëm për pjatat që ke provuar; markat premium kur mysafiri nuk ka preferencë; çiftimi që rrit vlerën e të dyjave; dhe transparenca e çmimit, që është kusht për të gjitha të tjerat. Asnjë teknikë nuk është manipulim kur bazohet në sinqeritet dhe në respekt për zgjedhjen e mysafirit.`]
];
LEC.E1=[
["Hyrje: si ndihet mysafiri",`Standardet e Forbes që kemi mësuar deri tani janë kryesisht të matshme: a u përshëndet mysafiri brenda 1 minute, a erdhi pija brenda 4 minutash, a u shërbye vera nga e djathta. Këto janë thelbësore. Por një hotel mund t'i plotësojë të gjitha dhe përsëri ta lërë mysafirin indiferent.

Forbes e di këtë. Prandaj, krahas standardeve të matshme, mat edhe diçka më të vështirë: si ndihet mysafiri. Ky leksion shpjegon shkallën emocionale të Forbes, pse kënaqësia nuk mjafton, dhe tri burimet që e ngrenë ndjenjën e mysafirit nga “i kënaqur” në “i mahnitur”.`],
["Anketa e lidhjes emocionale",`Forbes ofron një raport shtesë për hotelet, që mat deri në 35 momente të përvojës sipas ndjenjës së inspektorit. Për çdo moment, inspektori nuk shënon vetëm “po” ose “jo”, por si u ndje.

Shkalla ka dhjetë nivele:
• I zemëruar: 0 për qind.
• I frustruar: 10 për qind.
• I pakënaqur: 20 për qind.
• I zhgënjyer: 30 për qind.
• Indiferent: 45 për qind.
• I kënaqur: 60 për qind.
• I lumtur: 70 për qind.
• Shumë i impresionuar: 80 për qind.
• I habitur: 90 për qind.
• I mahnitur: 100 për qind.

Vëre diçka: “i kënaqur” është vetëm 60 për qind. Është mbi mesataren, por shumë larg majës. Dhe “indiferent”, 45 për qind, është më poshtë se gjysma.`],
["Kënaqësia nuk mjafton",`“I kënaqur” do të thotë “asgjë nuk shkoi keq”. Pjata ishte e mirë, shërbimi ishte korrekt, fatura ishte e saktë. Por asgjë nuk ishte e veçantë.

Mysafiri i kënaqur:
• Nuk flet për ne me miqtë.
• Nuk shkruan online, ose shkruan diçka të përgjithshme.
• Mund të zgjedhë një hotel tjetër herën tjetër, sepse nuk ka arsye të veçantë të kthehet.

Kërkimet mbi besnikërinë e klientëve kanë treguar vazhdimisht që klientët “të kënaqur” ndryshojnë shpesh kompaninë, ndërsa klientët “shumë të impresionuar” kthehen dhe rekomandojnë.

Besnikëria fillon nga “shumë i impresionuar”, 80 për qind. Ky është pragu ku mysafiri fillon të ndiejë që ky hotel është i veçantë, që dëshiron të kthehet, që dëshiron t'ua tregojë të tjerëve.

Kjo do të thotë që qëllimi ynë nuk është të mos kemi gabime. Qëllimi është të krijojmë momente që e ngrenë mysafirin mbi 80 për qind.`],
