Ngjashmëria: vera ka një element që gjendet edhe në pjatë. Një Chardonnay i plotë me aroma gjalpi me një salcë me gjalpë. Një Pinot Noir me aroma kërpudhash me një rizoto me kërpudha. Një Syrah me piper të zi me një biftek me piper.

Kontrasti: vera ka një element të kundërt që e balancon pjatën. Një shkumëzuese e thatë dhe e freskët me ushqime të skuqura dhe të kripura. Një verë e ëmbël me një djathë blu të kripur, si Sauternes me Roquefort.

Të dyja funksionojnë, kur bëhen me qëllim.`],
["Si e sugjeron në sallë",`Sugjerimi i çiftimit ndjek metodën P-A-S të leksionit L5:
• Pyet për preferencat: “Preferoni të bardhë apo të kuqe? Diçka të lehtë apo më të plotë?”
• Ankoro me dy opsione: një me gotë dhe një me shishe, ose një më i thjeshtë dhe një premium.
• Shpjego pse shkon: një fjali që lidh verën me pjatën.

Shembull: “Me short rib-in ju sugjeroj Duka Riserva 2019. Ka fruta të errëta dhe tanine që zbuten me mishin, dhe vjen nga Durrësi. Nëse dëshironi diçka më të veçantë, Châteauneuf-du-Pape 2018 është shumë e plotë, me piper dhe barishte që shkojnë me demi-glace-n.”

Kur tavolina ka pjata të ndryshme, peshk dhe mish, zgjidhje të mira janë:
• Një verë “urë” që shkon me të dyja, si një Pinot Noir i lehtë ose një roze e Provence-s.
• Verë me gotë për secilin.
• Dy shishe të vogla ose dy gjysmë shishe nëse kemi.

» Skenë nga Flower: Tavolinë me katër persona. Dy marrin levrek me kore barishtesh, dy salmonin me glazurë aziatike, dhe dy prej tyre duan të kuqe. Kamarieri: “Për të gjithë tavolinën, një opsion i mirë do të ishte një roze e Château Roubine nga Provence, e freskët për levrekun dhe me pak strukturë për salmonin. Ose, nëse preferoni, një gotë Malvasia për levrekun dhe një Nuits-Saint-Georges i Jadot-it për salmonin, sepse Pinot Noir është e vetmja e kuqe që shkon me sigurinë me peshkun e yndyrshëm.” Tavolina zgjedh opsionin e dytë.`],
["Përmbledhje",`Gjashtë parimet: pesha me peshë, aciditeti që pastron yndyrën dhe përputhet me acidin, taninet me proteinën dhe jo me peshkun e yndyrshëm, vera të paktën po aq e ëmbël sa ëmbëlsira dhe pak e ëmbël me pikantin, rajoni me rajonin, kontrasti ose ngjashmëria me qëllim. Sugjerohet me P-A-S, me dy opsione dhe një fjali që shpjegon pse. Dhe për tavolinat me pjata të ndryshme, një verë urë ose verëra me gotë.`]
];
LEC.V5=[
["Hyrje: kur vera nuk është në rregull",`Një përqindje e vogël e shisheve të verës, edhe nga prodhuesit më të mirë, kanë defekte. Disa nga tapa, disa nga ruajtja, disa nga koha. Kamarieri nuk duhet të jetë ekspert për t'i diagnostikuar të gjitha, por duhet t'i njohë më të zakonshmet dhe, më e rëndësishmja, duhet të dijë si të reagojë kur mysafiri thotë “kjo verë nuk është mirë”.

Ky leksion shpjegon defektet kryesore, si t'i njohësh, si i parandalojmë dhe rregullin e Flower për reagimin.`],
["Era e tapës (TCA)",`Defekti më i njohur quhet “vera me tapë”, ose në anglisht “corked”. Shkaktohet nga një përbërës kimik i quajtur TCA, që formohet kur disa kërpudha mikroskopike në tapën natyrale reagojnë me disa substanca që përdoren për pastrim. Mjafton një sasi shumë e vogël për të prekur gjithë shishen.

Si ta njohësh: vera ka erë kartoni të lagur, bodrumi të lagësht, gazete të vjetër ose qeni të lagur. Në rastet e lehta, vera nuk ka erë të keqe të qartë, por duket e shuar, pa aroma frutash, “e mbyllur”.

TCA nuk është i dëmshëm për shëndetin, por e prish plotësisht përvojën. Prek një përqindje të vogël të shisheve me tapë natyrale. Shishet me tapë me vidë ose me tapë sintetike nuk e kanë këtë problem.`],
["Oksidimi",`Oksidimi ndodh kur vera ka qenë e ekspozuar ndaj ajrit për shumë kohë. Oksigjeni e ndryshon kiminë e verës: aromat e freskëta të frutave zhduken dhe zëvendësohen nga aroma të tjera.

Si ta njohësh:
• Ngjyra bëhet më e errët. E bardha merr ngjyrë të artë ose kafe. E kuqja humbet ngjyrën vjollcë dhe merr reflekse kafe ose tullë.
• Aromat të kujtojnë mollën e prerë që ka marrë ngjyrë kafe, arrat, sherry-n ose karamelin.
• Shija është e sheshtë, pa freski.

Oksidimi ndodh më shpesh në shishet e hapura prej ditësh, prandaj vera me gotë kontrollohet çdo ditë dhe datohet kur hapet. Mund të ndodhë edhe në shishet e mbyllura kur tapa është tharë ose kur shishja është ruajtur në këmbë për shumë kohë, që e bën tapën të tkurret.

Kujdes: disa verëra kanë aroma oksidative me qëllim, si sherry-ja, disa verëra të vjetra dhe disa verëra portokalli. Ato nuk janë të defektuara.`],
["Dëmtimi nga nxehtësia",`Vera që është ruajtur në temperaturë të lartë, afër kuzhinës, në diell ose në një makinë në verë, mund të “gatuhet”.

Si ta njohësh: aroma marmelate, frutash të gatuara ose të pjekura tepër, ndonjëherë sikur vera të jetë ëmbëlsuar. Shpesh tapa është shtyrë pak jashtë nga presioni, ose ka gjurmë vere që ka rrjedhur rreth tapës.

Parandalimi: vera ruhet larg nxehtësisë dhe dritës, në temperaturë të qëndrueshme rreth 12 deri në 14 gradë, dhe shishet me tapë natyrale ruhen të shtrira që tapa të mbetet e lagur.`],
["Reduktimi dhe defekte të tjera",`Reduktimi është e kundërta e oksidimit: vera ka pasur shumë pak kontakt me oksigjenin gjatë prodhimit. Shkakton erë veze të prishur, shkrepëseje të djegur, gome ose lakre të zier. Shpesh është i lehtë dhe largohet me ajrosje: rrotullimi i verës në gotë ose dekantimi mund ta zhdukin pas disa minutash.

Defekte të tjera më të rralla:
• Acidi volatil i tepërt: erë uthulle ose llaku thonjsh.
• Brettanomyces, një maja që jep aroma stalle, lëkure ose fermë. Në sasi të vogla, disa e konsiderojnë pjesë të karakterit. Në sasi të mëdha, është defekt.

Gjërat që nuk janë defekte, por që mysafiri mund t'i ngatërrojë:
• Kristalet e bardha në fund të shishes ose në tapë, që quhen tartrate. Janë natyrale dhe të padëmshme.
• Sedimenti në verërat e kuqe të vjetra.
• Flluskat e vogla në disa verëra të bardha të reja.`],
["Rregulli i Flower: pa debat",`Kur mysafiri thotë që vera nuk është në rregull, rregulli ynë është i thjeshtë: zëvendësohet pa debat.

• Kërko ndjesë: “Ju kërkoj ndjesë, ju sjell një shishe tjetër menjëherë.”
• Mos e diskuto. Edhe nëse ti mendon që vera është në rregull, mos thuaj “kjo verë është kështu” ose “e kemi provuar”. Mysafiri nuk duhet të ndihet i gjykuar.
• Hiq shishen dhe gotat.
• Sill një shishe të re të së njëjtës verë, ose ofro alternativë nëse mysafiri preferon diçka tjetër.
• Njofto sommelier-in ose shefin e barit.

Pas shërbimit, sommelier-i ose shefi i barit e vlerëson shishen. Nëse ka defekt të vërtetë, shishja kthehet te furnitori, i cili zakonisht e zëvendëson. Nëse nuk ka defekt, kjo është informacion i vlefshëm për të kuptuar preferencat e mysafirit, dhe shënohet në profilin e tij.

Arsyeja e këtij rregulli është e thjeshtë: kostoja e një shisheje është shumë më e vogël se kostoja e një mysafiri që largohet i pakënaqur.`],
["Vera me gotë: datimi dhe kontrolli",`Shumica e problemeve me verën në restorant nuk vijnë nga defektet e prodhimit, por nga ruajtja e shisheve të hapura. Prandaj:
• Çdo shishe me gotë datohet kur hapet, me datën dhe orën në një etiketë të vogël.
• E bardha dhe e kuqja ruhen me sistem vakumi ose me gaz inert, deri në rreth tri ditë. Të bardhat në frigorifer, të kuqet në vend të freskët.
• Shkumëzuesja ruhet me tapë speciale për shampanjë, deri në rreth një ditë.
• Çdo ditë, para shërbimit, shefi i barit ose sommelier-i provon një sasi të vogël nga çdo shishe e hapur. Nëse vera ka humbur freskinë, hiqet.

» Skenë nga Flower: Mysafirja provon Malvasia-n me gotë dhe bën një fytyrë të vogël: “Nuk më duket e freskët.” Kamarieri: “Ju kërkoj ndjesë, ju sjell një gotë nga një shishe e re.” Në bar, shefi i barit e provon shishen e hapur dhe vëren që është hapur para katër ditësh, një ditë më shumë se rregulli. E heq dhe kontrollon të gjitha shishet e tjera. Mysafirja merr gotën e re dhe buzëqesh.`],
["Përmbledhje",`Defektet kryesore: era e tapës, me erë kartoni të lagur dhe aroma të shuara; oksidimi, me ngjyrë të errët dhe erë molle kafe ose arre; dëmtimi nga nxehtësia, me aroma marmelate; reduktimi, me erë veze ose shkrepëseje, që shpesh largohet me ajrosje. Kristalet dhe sedimenti nuk janë defekte. Rregulli i Flower: zëvendësohet pa debat dhe vlerësohet më pas. Vera me gotë datohet: tri ditë për të bardhat dhe të kuqet me vakum, një ditë për shkumëzuesen.`]
];
LEC.X1=[
["Hyrje: rafti pas barit",`Pas çdo bari luksoz ka një raft me dhjetëra shishe: uiski skocez, bourbon, xhinë, rume, tekila, konjakë, likere. Për mysafirin, ky raft është pjesë e atmosferës. Për stafin, është një bibliotekë që duhet ta njohë.

Standardi BL8 kërkon që stafi të diskutojë me njohuri pijet dhe ofertën e barit, përfshirë llojet e alkooleve. BL30 kërkon që menuja e pijeve të ketë një shumëllojshmëri të jashtëzakonshme alkoolesh të cilësisë së lartë. Ky leksion shpjegon si bëhen alkoolet e forta dhe kategoritë kryesore që mysafirët pyesin më shpesh. Manuali i barit në platformë ka listën e plotë të distilateve tona.`],
["Distilimi: si lind alkooli i fortë",`Çdo alkool i fortë fillon si një lëng i fermentuar, ashtu si vera ose birra. Uiski fillon si një lloj birre elbi. Rumi fillon si melasë ose lëng kallami sheqeri i fermentuar. Konjaku dhe rakia fillojnë si verë.

Pastaj vjen distilimi. Lëngu i fermentuar nxehet në një aparat që quhet distilator, ose “alambik”. Alkooli avullon në temperaturë më të ulët se uji, rreth 78 gradë kundrejt 100. Avujt e alkoolit mblidhen, ftohen dhe kondensohen në një lëng shumë më të fortë. Kështu nga një lëng me 5 deri në 12 për qind alkool përftohet një distilat me 40 deri në 70 për qind.

Ka dy lloje kryesore distilatorësh. Alambiku i vjetër me kazan, “pot still”, jep distilate me më shumë karakter dhe aromë. Përdoret për single malt skocez, konjak, shumë rume artizanale. Kolona e vazhdueshme, “column still”, jep distilate më të pastra dhe më neutrale. Përdoret për vodkën dhe për shumë uiski drithërash.

Pas distilimit, disa alkoole mbeten të bardha dhe pihen të reja: vodka, xhini, rumi i bardhë, tekila blanco, shumë raki. Të tjerët plaken në fuçi druri, zakonisht lisi, për vite. Druri u jep ngjyrën kafe të artë dhe aromat e vaniljes, karamelit, erëzave, kokosit dhe tymit. Mosha në etiketë tregon kohën më të shkurtër që ka kaluar çdo pjesë e përzierjes në fuçi.`],
["Vodka dhe xhini",`Vodka është alkooli më neutral. Bëhet nga drithëra, patate ose lëndë të tjera, dhe distilohet shumë herë dhe filtrohet për të qenë sa më e pastër. Vodkat premium dallohen nga butësia dhe teksturat e tyre, jo nga aromat e forta. Përdoret në shumë kokteile sepse nuk mbulon përbërësit e tjerë.

Xhini është, në thelb, një vodkë e aromatizuar. Alkooli neutral aromatizohet me dëllinjë, që është përbërësi i detyrueshëm, dhe me botanike të tjera: koriandër, lëkurë agrumesh, rrënjë angjelike, kardamom, kanellë dhe shumë të tjera. Çdo prodhues ka recetën e vet.

Stilet kryesore:
• London Dry. Botaniket shtohen vetëm gjatë distilimit dhe nuk shtohet sheqer ose aromë pas tij. Stil i thatë dhe klasik, me dëllinjën në plan të parë. Pavarësisht emrit, mund të bëhet kudo.
• Stilet moderne ose “New Western”. Dëllinja është më e butë dhe dalin në pah botanike të tjera: lule, agrume, barishte. Hendrick's, me trëndafil dhe kastravec, është shembulli më i njohur.
• Old Tom. Stil historik pak më i ëmbël.

Xhini është baza e kokteileve klasike si Martini, Negroni dhe gin tonic.`],
["Uiski",`Uiski bëhet nga drithëra të fermentuara dhe të distiluara, të plakura në fuçi druri. Ka shumë stile sipas vendit dhe metodës.

• Scotch single malt. Nga Skocia, 100 për qind elb i maltuar, nga një distileri e vetme, i distiluar në alambik me kazan dhe i plakur të paktën tre vjet në fuçi lisi. Rajonet kanë karakter të ndryshëm. Speyside është më frutor dhe i ëmbël. Highlands është i larmishëm. Islay, një ishull në perëndim, është i njohur për uiskit e tymosur, me aroma torfe, tymi dhe deti, si Laphroaig ose Ardbeg.
• Scotch blended. Përzierje e disa single malt me uiski drithërash. Shumica e uiskive skoceze që shiten në botë janë blended, si Johnnie Walker ose Chivas Regal. Janë më të buta dhe më të arritshme.
• Bourbon. Nga Shtetet e Bashkuara, me të paktën 51 për qind misër, i plakur në fuçi të reja lisi të djegura nga brenda. Fuçia e re dhe e djegur i jep aroma të forta vanilje, karameli dhe kokosi. Bourbon-i është më i ëmbël se skocezi.
• Rye. Uiski amerikan ose kanadez me shumë thekër, me aroma erëzash dhe piperi.
• Irish. Nga Irlanda, zakonisht i distiluar tri herë, që e bën shumë të butë dhe të lehtë.
• Japanese. Uiski japonez, i ndikuar nga stili skocez, shumë i vlerësuar për elegancën dhe ekuilibrin.

Kur mysafiri pyet për uiski, pyet çfarë i pëlqen: “Preferoni diçka të butë dhe të ëmbël, apo diçka të tymosur?” Dhe si e dëshiron: “Neat, me pak ujë, apo me akull?” Pak pika ujë në një single malt i hapin aromat.`],
["Rumi dhe tekila",`Rumi bëhet nga kallami i sheqerit, nga lëngu i tij ose më shpesh nga melasa, nënprodukti i prodhimit të sheqerit. Vjen kryesisht nga Karaibet dhe Amerika Latine.
• Rumi i bardhë është i ri ose i plakur shkurt dhe i filtruar. I lehtë, për kokteile si Mojito dhe Daiquiri.
• Rumi i artë dhe i errët është i plakur në fuçi, me aroma karameli, vaniljeje, bananeje dhe erëzash.
• Rumi i plakur gjatë pihet si uiski, neat ose me një kub akulli.
• Rhum agricole, nga Martinika dhe ishujt francezë, bëhet nga lëngu i freskët i kallamit dhe ka aroma më bimore.

Tekila bëhet nga zemra e bimës agave blu, në rajone të caktuara të Meksikës, kryesisht në shtetin e Jalisco-s. Zemra e agaves piqet, shtypet, lëngu fermentohet dhe distilohet.
• Blanco ose silver: e re, pa plakje ose me plakje shumë të shkurtër, me aroma të freskëta agaveje, piperi dhe agrumesh.
• Reposado: e plakur nga dy muaj deri në një vit në fuçi, më e butë.
• Añejo: e plakur nga një deri në tre vjet, me aroma druri dhe karameli.

Tekilat cilësore janë “100 për qind agave”. Tekilat e tjera, të quajtura “mixto”, kanë edhe sheqer të tjerë. Mezcali është i afërm i tekilës, nga lloje të ndryshme agaveje, shpesh me aroma tymi sepse zemrat e agaves piqen në gropa me zjarr. Në barin tonë kemi tekilat Tiscaz.`],
["Brandy, konjak dhe rakia",`Brandy është emri i përgjithshëm për distilatin e verës ose të frutave.
• Konjaku vjen nga rajoni i Cognac-ut në Francë, distilohet dy herë në alambik bakri dhe plaket në fuçi lisi francez. Shkallët e moshës: VS, të paktën dy vjet; VSOP, të paktën katër vjet; XO, të paktën dhjetë vjet. Aroma frutash të thata, lulesh, vaniljeje dhe druri.
• Armagnac vjen nga Gaskonja, zakonisht i distiluar një herë, me më shumë karakter dhe “rusticitet”.
• Calvados është brandy molle nga Normandia.
• Grappa italiane bëhet nga bërsitë e rrushit, mbetjet pas shtrydhjes për verë.

Rakia shqiptare është e afërt me grappa-n kur bëhet nga bërsitë e rrushit. Por ka edhe raki mani, kumbulle dhe frutash të tjera. Rakia cilësore shqiptare, sidomos ajo e plakur, mund të ofrohet me krenari si digjestiv ose aperitiv.`],
["Likeret dhe aperitivët",`Likeret janë alkoole të ëmbëlsuara dhe të aromatizuara me fruta, barishte, erëza, kafe, çokollatë ose krem. Disa nga më të përdorurat në bar:
• Cointreau dhe Triple Sec, me portokall, për Margarita dhe Cosmopolitan.
• Amaretto, me aromë bajameje, për Amaretto Sour.
• Likerët e kafesë, për Espresso Martini.
• Limoncello, liker limoni nga bregu i Amalfit, si digjestiv i ftohtë.
• Likerët me lule të shtogut, si në Hugo.

Aperitivët italianë të hidhur janë baza e shumë kokteileve:
• Campari, i kuq dhe i hidhur, për Negroni dhe Americano.
• Aperol, më i ëmbël dhe me më pak alkool, për Aperol Spritz.
• Vermuti, verë e aromatizuar me barishte, i ëmbël ose i thatë, për Martini, Negroni dhe Manhattan. Vermuti duhet të ruhet në frigorifer pasi hapet, sepse është verë dhe oksidohet.

Amarot janë likere të hidhura me barishte, që pihen si digjestiv pas darkës.

» Skenë nga Flower: Një mysafir pyet në bar: “Çfarë uiski kini?” Barmeni: “Kemi disa stile. Preferoni diçka të butë, si një blended ose një Irish, apo diçka me më shumë karakter, si një single malt? Dhe nëse ju pëlqejnë aromat e tymosura, kemi edhe një Islay.” Mysafiri thotë që i pëlqen e ëmbla. Barmeni i ofron një bourbon dhe i shpjegon që fuçitë e reja të djegura i japin vaniljen dhe karamelin.`],
["Përmbledhje",`Alkoolet e forta lindin nga distilimi i një lëngu të fermentuar. Plakja në fuçi u jep ngjyrën dhe aromat. Vodka është neutrale, xhini aromatizohet me dëllinjë dhe botanike. Uiski ka shumë stile: single malt dhe blended skocez, bourbon me misër dhe fuçi të reja, Irish i butë. Rumi bëhet nga kallami i sheqerit, tekila nga agave blu. Konjaku plaket në kategori VS, VSOP, XO. Rakia shqiptare është e afërt me grappa-n. Dhe likeret dhe aperitivët janë baza e kokteileve.`]
];
LEC.X2=[
["Hyrje: kokteili si recetë e saktë",`Një kokteil i mirë nuk është një përzierje e rastësishme pijesh. Është një recetë me ekuilibër të saktë midis forcës, ëmbëlsisë, aciditetit, hidhërimit dhe ujit. Dy kokteile me të njëjtat përbërës mund të jenë njëri i shkëlqyer dhe tjetri i papirë, vetëm për shkak të teknikës.

Standardet BL26 dhe BL27 kërkojnë kokteile të balancuara, me garniturë, saktësisht si u kërkuan, dhe me akullin e stilit të duhur. Ky leksion shpjegon teknikat bazë të banakut dhe pse funksionojnë.`],
["Hollimi është përbërës",`Gabimi më i zakonshëm i barmenëve fillestarë është të mendojnë që akulli shërben vetëm për të ftohur. Në të vërtetë, akulli ka dy funksione: ftoh dhe hollon. Ndërsa tund ose trazon një kokteil me akull, një pjesë e akullit shkrin dhe shton ujë në kokteil, zakonisht rreth 20 deri në 30 për qind të vëllimit.

Ky ujë nuk është gabim. Është pjesë e recetës. Pa të, kokteili është i ashpër, alkooli djeg dhe aromat nuk hapen. Me shumë ujë, kokteili është i dobët dhe i ujshëm. Teknika që zgjedh, tundje apo trazim, dhe sa kohë e bën, kontrollon pikërisht sa ujë shtohet.

Kjo është arsyeja pse cilësia e akullit ka rëndësi. Akulli i mirë është i fortë, i ftohtë dhe i kristaltë. Akulli i lagësht ose i vogël shkrin shumë shpejt dhe e hollon tepër kokteilin.`],
["Matja: gjithmonë me jigger",`Jigger-i është matësi i barit, zakonisht një enë metalike me dy anë me masa të ndryshme, për shembull 25 dhe 50 ml. Në Flower, çdo kokteil bëhet me jigger. Pa përjashtim.

Pse kjo rëndësi? Për tri arsye:
• Konsistenca. Mysafiri që porosit të njëjtin kokteil dy herë pret të njëjtin kokteil. Edhe barmenët me përvojë gabojnë me sy kur janë të lodhur ose me nxitim.
• Ekuilibri. Një ndryshim prej 10 ml në lëngun e limonit e bën kokteilin shumë të thartë.
• Kostoja. Çdo derdhje me sy shton alkool që nuk paguhet dhe ndryshon koston e pijes.

Teknika: mbushe jigger-in deri në buzë, mbaje drejt, derdhe plotësisht. Mos e mbush deri në gjysmë “me sy”.`],
["Kur tundet dhe kur trazohet",`Rregulli bazë është i thjeshtë dhe ka logjikë.

Tundet, “shake”, kur kokteili ka përbërës që duhet të përzihen fort: lëng agrumesh, qumësht, krem, të bardhë veze, pure frutash, shurupe të dendura. Tundja e fortë bën tri gjëra: i përzien mirë përbërësit, futet ajër dhe krijon një teksturë të lehtë me shkumë, dhe ftoh shpejt. Margarita, Daiquiri, Whisky Sour, Espresso Martini tunden.

Trazohet, “stir”, kur kokteili ka vetëm alkoole dhe përbërës të qartë: xhin, vermut, bitter, liker. Trazimi i ftoh dhe i hollon pa futur ajër. Kokteili mbetet i qartë, i mëndafshtë dhe i dendur në gojë, pa flluska. Martini, Negroni, Manhattan, Old Fashioned trazohen.

Kur mysafiri kërkon një Martini “të tundur”, siç e porosiste James Bond, respektohet, por kokteili do të jetë pak i turbullt dhe më i hollë.`],
["Teknika e tundjes",`• Mbushe shaker-in rreth dy të tretat me akull të fortë.
• Shto përbërësit, zakonisht duke filluar nga më të lirët, si shurupi dhe agrumet, dhe duke mbaruar me alkoolin, që nëse gabon të mos humbasësh pjesën më të shtrenjtë.
• Mbylle mirë shaker-in.
• Tunde fort, me lëvizje nga përpara-prapa, për 10 deri në 12 sekonda, derisa shaker-i të ngrijë nga jashtë dhe të jetë shumë i ftohtë në dorë.
• Kulloje në gotë me “double strain”: me sitën e shaker-it dhe me një sitë të imët të dorës, që të heqësh copëzat e vogla të akullit dhe të pulpës.

Dry shake. Për kokteilet me të bardhë veze, si Whisky Sour ose Pisco Sour, bëhet një tundje e parë pa akull për 10 sekonda. Kjo krijon një shkumë të dendur dhe të qëndrueshme. Pastaj shtohet akulli dhe tundet përsëri për ta ftohur. Disa barmenë bëjnë “reverse dry shake”: fillimisht me akull, pastaj pa akull, për shkumë edhe më të mirë.`],
["Teknika e trazimit",`• Mbushe gotën e përzierjes me akull të fortë, deri lart.
• Shto përbërësit.
• Me lugën e barit, e cila ka një bisht të gjatë dhe të përdredhur, trazo butë, duke e lëvizur lugën rreth buzës së brendshme të gotës, me pjesën e pasme të lugës drejt xhamit. Akulli dhe lëngu rrotullohen së bashku pa u përplasur.
• 20 deri në 30 rrotullime, ose rreth 20 deri në 30 sekonda, derisa kokteili të jetë shumë i ftohtë.
• Kulloje në gotën e ftohur me strainer Julep, që duket si një lugë e madhe me vrima, ose me strainer Hawthorne, me spirale.

Gota e shërbimit për kokteilet e trazuara pa akull, si Martini, duhet të jetë e ftohur paraprakisht, në frigorifer ose me akull dhe ujë që hiqen para derdhjes.`],
["Teknika të tjera",`• Build. Kokteili ndërtohet drejtpërdrejt në gotën e shërbimit, me akull, duke shtuar përbërësit një nga një dhe duke e trazuar lehtë. Gin tonic, Aperol Spritz, Hugo, Cuba Libre.
• Muddle. Shtypja e butë e frutave, barishteve ose sheqerit në fund të gotës me një shkop druri, për të çliruar lëngjet dhe aromat. Për Mojito, nenexhiku shtypet butë: vetëm sa të çlirojë vajrat, jo të grihet, sepse gjethet e grira lëshojnë hidhërim.
• Layering. Derdhja e përbërësve në shtresa që nuk përzihen, duke i derdhur ngadalë mbi pjesën e pasme të një luge. Përbërësit më të dendur, zakonisht më të ëmbël, shkojnë poshtë.
• Rinse. Shpëlarja e gotës me një sasi të vogël të një pije aromatike, si absinth, dhe heqja e tepricës, që gota të mbajë vetëm aromën.`],
["Akulli dhe garnitura",`Akulli i duhur për çdo pije:
• Kub i madh ose sferë për pijet e shkurtra me akull, si Old Fashioned, Negroni ose uiski on the rocks. Shkrin ngadalë dhe nuk e hollon shpejt pijen.
• Kube standarde, deri në majë të gotës, për highball si gin tonic. Sa më shumë akull, aq më ngadalë shkrin.
• Akull i thyer për Mojito, julep dhe kokteile tropikale.
• Pa akull, “up”, për kokteilet e shërbyera në coupe ose gotë martini.

Garnitura nuk është dekorim, është përbërës. Lëkura e portokallit ose e limonit prehet e freskët, në çast, dhe shtrydhet mbi gotë për të çliruar vajrat aromatikë në sipërfaqe, pastaj fërkohet në buzë dhe vendoset në pije ose hidhet. Barishtet e freskëta, si nenexhiku, goditen lehtë në pëllëmbë për të çliruar aromën. Frutat e prera janë të freskëta, jo të thara nga turni i djeshëm.

» Skenë nga Flower: Një mysafir porosit Old Father, signature-in tonë. Barmeni mat me jigger tekilën, Aperol-in, amaretto-n, vaniljen dhe limonin, sepse ka agrume e tund fort për rreth 12 sekonda, e kullon me double strain mbi një kub të madh akulli të kristaltë, preh një lëkurë portokalli të freskët, e shtrydh mbi gotë para mysafirit dhe e fërkon në buzë. Para se ta bëjë, pyet: “A keni ndonjë alergji? Amaretto ka aromë bajameje.” Pija vendoset mbi një coaster me një pjatë të vogël me bajame. I gjithë procesi zgjat më pak se tre minuta.`],
["Përmbledhje",`Hollimi është përbërës: akulli shton rreth 20 deri në 30 për qind ujë. Çdo kokteil matet me jigger. Tundet kur ka agrume, qumësht, krem ose vezë, për 10 deri në 12 sekonda, me double strain. Dry shake për të bardhën e vezës. Trazohet kur ka vetëm alkoole, 20 deri në 30 rrotullime, në gotë të ftohur. Build, muddle dhe layering janë teknikat e tjera. Akulli dhe garnitura janë përbërës, jo dekor.`]
];
LEC.X3=[
["Hyrje: gjuha e përbashkët e bareve",`Një mysafir nga Nju Jorku, një nga Londra dhe një nga Tokio mund të mos flasin të njëjtën gjuhë, por të tre e dinë çfarë është një Negroni. Kokteilet klasike janë gjuha e përbashkët e bareve në të gjithë botën. Kur mysafiri porosit një klasik, pret saktësisht recetën që njeh. Një klasik i gabuar është shkelje e standardit BL26. Një klasik perfekt është prova më e thjeshtë e profesionalizmit të barit.

Ky leksion shpjegon dhjetë kokteile klasike: historinë, recetën bazë, teknikën dhe si i përshkruajmë. Disa prej tyre janë në menunë tonë, si Negroni, Espresso Martini, Whiskey Sour dhe Aperol Spritz. Të tjerët mund t'i kërkojë mysafiri dhe duhet t'i dimë. Recetat e menusë sonë janë në Manualin e barit dhe kanë përparësi ndaj recetave klasike kur ndryshojnë.`],
["Negroni",`Historia: sipas traditës, lindi në Firence rreth vitit 1919, kur konti Camillo Negroni i kërkoi barmenit të forconte Americano-n e tij, duke zëvendësuar sodën me xhin.

Receta klasike: pjesë të barabarta, rreth 30 ml secila, xhin, Campari dhe vermut i ëmbël. Trazohet me akull, kullohet në gotë rocks mbi një kub të madh akulli, garniturë me lëkurë portokalli.

Profili: i hidhur-ëmbël, i fortë, me aroma agrumesh dhe barishtesh. Është aperitiv klasik, para darkës.

Si e përshkruan: “Një klasik italian me xhin, Campari dhe vermut, i hidhur dhe aromatik, perfekt para darkës.”`],
["Old Fashioned",`Historia: një nga kokteilet më të vjetër, nga shekulli i nëntëmbëdhjetë në Amerikë. Emri vjen nga mysafirët që kërkonin kokteilin “në mënyrën e vjetër”, pa shtesat që ishin bërë modë.

Receta klasike: rreth 60 ml bourbon ose rye, një lugë e vogël shurup sheqeri ose një kub sheqeri, dy deri në tri pika Angostura bitters. Trazohet me akull dhe shërbehet në gotë rocks mbi një kub të madh, me lëkurë portokalli.

Profili: i fortë, i ëmbël, aromatik. Uiski është në plan të parë.

Si e përshkruan: “Bourbon me pak sheqer dhe bitters, i thjeshtë dhe elegant, për ata që e duan uiskin.”

Mos e ngatërro me Old Father, signature-in tonë, që është një krijim krejt tjetër me tekila, Aperol dhe amaretto.`],
["Dry Martini",`Historia: lindi në Amerikë në fund të shekullit të nëntëmbëdhjetë dhe u bë simboli i kokteilit elegant në shekullin e njëzetë.

Receta klasike: rreth 60 ml xhin, ose vodka nëse mysafiri e kërkon, dhe 10 deri në 15 ml vermut i thatë. Trazohet me akull, kullohet në gotë martini ose coupe të ftohur. Garniturë me ulli ose me lëkurë limoni.

Martini është kokteili ku mysafiri ka preferencat më të sakta, dhe duhet pyetur:
• Xhin apo vodka? Dhe me cilin xhin?
• Sa i thatë? “Dry” do të thotë pak vermut, “extra dry” shumë pak ose vetëm shpëlarje e gotës.
• Me ulli apo me lëkurë limoni?
• “Dirty” do të thotë me pak lëng ullinjsh.
• I tundur apo i trazuar? Klasikisht trazohet.`],
["Margarita dhe Daiquiri",`Margarita. Kokteili më i njohur me tekila, nga Meksika ose nga kufiri me Amerikën, rreth viteve 1930 dhe 1940. Receta klasike: rreth 50 ml tekila blanco, 20 ml Cointreau ose triple sec, 25 ml lëng lime i freskët. Tundet me akull, kullohet në coupe ose në gotë rocks me akull. Buza e gotës me kripë, por gjithmonë pyet: “Me kripë në buzë?” Profili: i freskët, i thartë, me karakterin e agaves.

Daiquiri. Lindi në Kubë, rreth vitit 1900, në zonën e minierave pranë qytetit Daiquirí, dhe u bë i famshëm kur Ernest Hemingway e pinte në Havana. Receta klasike: rreth 60 ml rum i bardhë, 25 ml lëng lime i freskët, 15 ml shurup sheqeri. Tundet fort dhe kullohet në coupe të ftohur. Profili: i thjeshtë, i freskët, i balancuar midis ëmbëlsisë dhe aciditetit. Është testi klasik i një barmeni: me vetëm tre përbërës, çdo gabim në ekuilibër shihet menjëherë.

Kujdes: Daiquiri klasik nuk është pija e ngrirë me luleshtrydhe që shohim në plazhe. Nëse mysafiri kërkon “frozen daiquiri”, pyet çfarë dëshiron saktësisht.`],
["Mojito",`Historia: nga Kuba, me rrënjë në një pije të shekullit të gjashtëmbëdhjetë. U bë i famshëm në Havana dhe sot është një nga kokteilet më të porositura në botë.

Receta klasike: rreth 50 ml rum i bardhë, 25 ml lëng lime, 20 ml shurup sheqeri, tetë deri në dhjetë gjethe nenexhiku, sodë. Nenexhiku shtypet butë me shurupin dhe lime-n në gotë, shtohet rumi dhe akulli i thyer, trazohet dhe mbushet me sodë. Garniturë me një degë nenexhiku.

Kujdes: nenexhiku shtypet butë, jo grihet. Gjethet e grira lëshojnë hidhërim dhe copa të vogla që ngecin në kashtë.

Profili: i freskët, aromatik, i lehtë. Perfekt për ditët e nxehta dhe për pishinën.`],
["Espresso Martini",`Historia: krijuar në Londër në vitet 1980 nga barmeni Dick Bradsell. Sipas tregimit, një mysafire i kërkoi një pije që “ta zgjonte dhe ta dehte njëkohësisht”.

Receta klasike: rreth 50 ml vodka, 25 ml liker kafeje, 30 ml espresso i freskët. Tundet shumë fort me akull, që espresso-ja të krijojë një shkumë të dendur, dhe kullohet në coupe. Garniturë me tri kokrra kafeje, që sipas traditës përfaqësojnë shëndetin, lumturinë dhe prosperitetin.

Sekreti: espresso duhet të jetë i freskët, i sapo nxjerrë, jo i ftohur prej kohësh. Kjo është ajo që krijon shkumën.

Në menunë tonë është në seksionin e klasikëve. Është një digjestiv i shkëlqyer pas darkës.`],
["Aperol Spritz dhe Hugo",`Aperol Spritz. Spritz-i lindi në veri të Italisë në shekullin e nëntëmbëdhjetë, kur ushtarët austriakë hollonin verën italiane, që e gjenin shumë të fortë, me ujë të gazuar. Aperol-i, i krijuar në Padova në vitin 1919, u bë përbërësi i spritz-it më të famshëm në botë. Receta klasike ndjek rregullin 3-2-1: tri pjesë prosecco, dy pjesë Aperol, një pjesë sodë. Ndërtohet në gotë të madhe vere me shumë akull, me një fetë portokalli. Profili: i lehtë, i hidhur-ëmbël, me pak alkool, aperitivi perfekt i pasdites.

Hugo Spritz. Një spritz shumë më i ri, i krijuar në vitin 2005 nga barmeni Roland Gruber në Alto Adige, në veri të Italisë. Bëhet me shurup ose liker lulesh shtogu, prosecco, sodë, gjethe mente dhe lime ose limon. Profili: shumë i freskët, lulor, i lehtë. Në Garden është zgjedhja natyrale për mbrëmjet e verës.`],
["Whiskey Sour dhe Moscow Mule",`Whiskey Sour. Një nga “sour”-ët klasikë, familja e kokteileve me alkool, agrume dhe ëmbëlsues, që daton nga shekulli i nëntëmbëdhjetë. Receta klasike: rreth 50 ml bourbon, 25 ml lëng limoni, 20 ml shurup, dhe opsionalisht të bardhë veze për shkumë. Bëhet me dry shake dhe pastaj shake me akull, shërbehet në gotë rocks me pika Angostura sipër shkumës. Në menunë tonë, Whiskey Sour dhe Vodka Sour bëhen me “magic foamer” në vend të vezës, një agjent bimor që krijon shkumë. Kjo është e rëndësishme për mysafirët vegan ose me alergji ndaj vezëve: mund t'i thuash që sour-ët tanë nuk kanë vezë.

Moscow Mule. Lindi në Amerikë në vitet 1940 si një mënyrë për të shitur vodkën, që atëherë ishte pak e njohur. Receta: rreth 50 ml vodka, 15 ml lëng lime, ginger beer. Ndërtohet me akull në filxhanin tradicional prej bakri, me një fetë lime. Profili: i freskët, pikant nga xhenxhefili.`],
["Si i shërbejmë klasikët",`Kur mysafiri porosit një klasik:
• Respekto recetën që ai njeh. Nëse menuja jonë ka një version të ndryshëm, si sour-ët me magic foamer, thuaje: “Whiskey Sour-i ynë bëhet pa vezë, me një shkumë bimore.”
• Pyet për preferencat kur janë të zakonshme: xhini i Martinit, kripa e Margaritës, bourbon apo rye për Old Fashioned.
• Përdor gotën dhe akullin e duhur.
• Prezantoje me emër kur e vendos: “Negroni-ja juaj.”

» Skenë nga Flower: Një mysafir britanik pyet në bar: “Can you make a proper Dry Martini?” Barmeni: “Of course. Would you prefer gin or vodka? We have a classic London Dry or a more floral gin. And would you like it very dry, with an olive or a lemon twist?” Mysafiri zgjedh xhin London Dry, shumë të thatë, me lëkurë limoni. Barmeni ftoh gotën, trazon xhinin me pak vermut për 25 sekonda, kullon dhe shtrydh lëkurën e limonit mbi sipërfaqe. Mysafiri e provon dhe ngre gotën drejt barmenit.`],
["Përmbledhje",`Dhjetë klasikët: Negroni, Old Fashioned, Dry Martini, Margarita, Daiquiri, Mojito, Espresso Martini, Aperol Spritz, Whiskey Sour, Moscow Mule, plus Hugo si spritz modern. Secili ka historinë, recetën dhe teknikën e vet. Kokteilet me vetëm alkoole trazohen, ato me agrume tunden, spritz-ët ndërtohen. Respektojmë recetën që mysafiri njeh, pyesim për preferencat dhe shpjegojmë kur versioni ynë ndryshon.`]
];
LEC.X4=[
["Hyrje: mysafiri që nuk pi alkool",`Në çdo mbrëmje ka mysafirë që nuk pinë alkool: gra shtatzëna, shoferë, sportistë, mysafirë që nuk pinë për arsye fetare ose shëndetësore, ose thjesht njerëz që nuk duan. Në vitet e fundit, numri i tyre është rritur shumë, dhe tregu i pijeve pa alkool është një nga më të shpejtët në rritje në industrinë e pijeve.

Për shumë kohë, këta mysafirë merrnin një lëng portokalli ose një Coca-Cola, ndërsa tavolina pinte kokteile të përgatitura me kujdes. Kjo nuk është më e pranueshme në një hotel me pesë yje. Standardi BL33 kërkon që menuja e pijeve të ketë zgjedhje pijesh pa alkool, dhe mysafiri që nuk pi meriton një pije po aq të menduar sa kokteili.

Ky leksion mbulon dy tema që lidhen ngushtë: pijet pa alkool dhe shërbimin e përgjegjshëm të alkoolit.`],
["Mocktail-et: kokteile pa alkool",`Fjala “mocktail” vjen nga anglishtja, “mock”, që do të thotë imitim, dhe “cocktail”. Sot shpesh përdoren edhe termat “zero proof” ose “alcohol-free cocktail”.

Një mocktail i mirë ndjek të njëjtat parime si kokteili:
• Ekuilibër midis ëmbëlsisë, aciditetit dhe ndonjëherë hidhërimit.
• Përbërës të freskët: lëngje të shtrydhura në çast, fruta, barishte, shurupe të shtëpisë.
• Teknikë e duhur: tundje, trazim, build.
• Gotë elegante, akull i duhur, garniturë e freskët.
• Prezantim me emër dhe përshkrim.

Mocktail-i ynë në menu ka portokall, thanë, pjeshkë dhe limon. Kur e ofron, ofroje me të njëjtin entuziazëm si një kokteil: “Mocktail-i ynë ka portokall, thanë dhe pjeshkë, me freskinë e limonit, i lehtë dhe frutor.”

Hotelet më të mira kanë të paktën tre mocktail-e të shtëpisë në menu. Kjo është diçka që mund ta zhvillojmë në të ardhmen.`],
["Alternativat premium",`Përveç mocktail-eve, ka shumë alternativa cilësore pa alkool:
• Xhine dhe distilate pa alkool, që imitojnë aromat e botanikeve dhe mund të përdoren për gin tonic pa alkool.
• Birra pa alkool, që sot kanë cilësi shumë të mirë.
• Verëra pa alkool ose me pak alkool, sidomos verërat me flluska.
• Kombucha, një çaj i fermentuar me flluska të lehta dhe aciditet.
• Tonik premium, si ai me aroma të ndryshme, që mund të pihet vetëm me akull dhe agrume.
• Lëngje të freskëta të shtrydhura në çast.
• Ujë me fruta dhe barishte.
• Limonadat artizanale, si limonada me trëndafil që kemi në menu.

Kur mysafiri nuk pi alkool, sugjeroji një nga këto, jo vetëm “lëng apo pije e gazuar”.`],
["Si ofrohet pija pa alkool",`Mënyra si e ofron pijen pa alkool ka rëndësi. Mysafiri nuk duhet të ndihet i ndryshëm ose i gjykuar.

Asnjëherë:
• “Nuk pini?”
• “Pse jo një gotë verë?”
• “Vetëm ujë?”
• Insistimi pasi mysafiri ka thënë jo.

Po:
• Kur ofron pijet, përmend edhe opsionet pa alkool si pjesë normale e ofertës: “Kemi edhe një përzgjedhje kokteilesh pa alkool. Ju sugjeroj mocktail-in tonë me portokall, thanë dhe pjeshkë.”
• Kur mysafiri thotë që nuk pi, ofro menjëherë një alternativë interesante, pa komentuar.
• Shërbeje në gotë po aq elegante sa kokteilet e tavolinës, me garniturë.
• Mbaje mend dhe shënoje në profil, që herën tjetër të mos e pyesësh përsëri.`],
["Shërbimi i përgjegjshëm: ligji dhe etika",`Alkooli është pjesë e kënaqësisë së mbrëmjes, por shërbimi i tij ka përgjegjësi ligjore dhe etike.

Mosha ligjore për konsumimin e alkoolit në Shqipëri është 18 vjeç. Kur ka dyshime për moshën, stafi ka të drejtë dhe detyrim të kërkojë një dokument identifikimi, me mirësjellje dhe pa e turpëruar mysafirin: “Më falni, a mund të shoh një dokument? Është rregull i hotelit.”

Përtej ligjit, ka një përgjegjësi etike: nuk duam që mysafiri ynë të dëmtojë veten ose të tjerët. Një mysafir i dehur mund të rrëzohet, të lëndohet, të ngasë makinën ose të shqetësojë mysafirët e tjerë. Dhe e dimë që mysafiri i dehur nuk e kujton mbrëmjen si të mirë.`],
["Shenjat e dehjes dhe si reagojmë",`Shenjat që tregojnë se mysafiri ka pirë shumë:
• Të folur i ngatërruar ose shumë i shpejtë.
• Zëri që ngrihet, të qeshurit me zë të lartë.
• Lëvizje të pasigurta, humbje e ekuilibrit, derdhja e pijeve.
• Sjellje agresive, debate, fyerje.
• Sytë e skuqur, fokusi i humbur.
• Porositë shumë të shpeshta, pijet që pihen shumë shpejt.

Si reagojmë, me takt dhe privatësi:
• Ngadalëso ritmin. Mos e ofro raundin tjetër menjëherë.
• Ofro ujë. “Mund t'ju sjell pak ujë?” Ofroje me çdo raund të pijeve të forta.
• Ofro diçka për të ngrënë. Ushqimi ngadalëson thithjen e alkoolit.
• Sugjero një alternativë pa alkool.
• Nëse situata vazhdon, njofto supervizorin. Vendimi për të ndaluar shërbimin e alkoolit merret nga supervizori, dhe komunikohet me zë të ulët, privatisht, pa e turpëruar mysafirin para të tjerëve: “Për sonte, do t'ju ofrojmë diçka pa alkool. Mund t'ju sjell një kafe ose një çaj?”
• Nëse mysafiri do të ngasë makinën, ofro një taksi.

Moduli 13 për ankesat dhe situatat e vështira e shtjellon këtë më gjerë.

» Skenë nga Flower: Në bar, një mysafir ka pirë tre uiski në një orë dhe po flet gjithnjë e më me zë. Kur porosit të katërtin, barmeni sjell me uiskin një gotë të madhe ujë dhe një pjatë të vogël me bajame dhe ullinj: “Me uiskin tuaj, pak ujë dhe diçka për të shoqëruar.” Kur mysafiri kërkon të pestin pas pak minutash, barmeni njofton supervizorin. Supervizori i afrohet me zë të ulët dhe i ofron një espresso dhe një taksi për në shtëpi. Mysafiri pranon.`],
["Përmbledhje",`Mysafiri që nuk pi alkool meriton një pije po aq të menduar sa kokteili: mocktail-e me ekuilibër, gotë elegante dhe prezantim. Alternativat premium përfshijnë distilate, birra dhe verëra pa alkool, kombucha, tonik premium dhe limonada artizanale. Pija pa alkool ofrohet pa komente dhe pa insistim. Mosha ligjore është 18 vjeç. Shenjat e dehjes trajtohen me ujë, ushqim, ritëm më të ngadaltë, dhe kur duhet, me ndalimin e shërbimit nga supervizori, me takt dhe privatësi.`]
];
LEC.K1=[
["Hyrje: filxhani i vogël me pritshmëri të mëdha",`Në Shqipëri, kafeja nuk është thjesht një pije. Është një ritual shoqëror, një arsye për t'u takuar, një pjesë e çdo dite. Kjo do të thotë që mysafirët tanë shqiptarë janë ndër më kërkuesit në botë për kafenë. Dhe mysafirët ndërkombëtarë, sidomos italianët, kanë po aq pritshmëri të larta.

Espresso duket i thjeshtë: një filxhan i vogël me pak lëng të errët. Por pas tij ka një proces të saktë ku çdo parametër ka rëndësi. Standardi HD48 kërkon që kafe dhe çajra specialë të jenë të disponueshëm në çdo kohë, dhe çdo filxhan duhet të jetë i përsosur. Ky leksion shpjegon kokrrat e kafesë, parametrat e espresso-s dhe si e rregullon kur nuk del mirë.`],
["Arabica dhe Robusta",`Ka dy lloje kryesore të kafesë që konsumohen në botë.

Arabica është lloji më i vlerësuar, rreth 60 deri në 70 për qind e prodhimit botëror. Rritet në lartësi, zakonisht mbi 1000 metra, në zona tropikale si Etiopia, që është vendi i saj i origjinës, Kolumbia, Brazili, Guatemala, Kenia. Ka aroma më komplekse, më të ëmbla dhe më frutore, me një aciditet të këndshëm. Ka më pak kafeinë.

Robusta rritet në lartësi më të ulëta dhe është më rezistente ndaj sëmundjeve. Ka shije më të hidhur dhe më të fortë, aroma drithërash dhe çokollate të errët, dhe rreth dyfishin e kafeinës së Arabicës. Krijon një kremë më të trashë dhe më të qëndrueshme.

Përzierjet tradicionale italiane për espresso shpesh kanë kryesisht Arabica dhe një përqindje të vogël Robusta, që i jep trup dhe kremë. Kafetë “specialty” moderne janë zakonisht 100 për qind Arabica, shpesh nga një origjinë e vetme.

Pjekja ndikon shumë te shija. Pjekja e lehtë ruan aciditetin dhe aromat frutore. Pjekja e errët jep shije më të hidhur, të tymosur dhe çokollate. Espresso tradicional italian zakonisht përdor pjekje mesatare deri në të errët.`],
["Si funksionon espresso",`Espresso është një metodë ekstraktimi ku uji i nxehtë kalon me presion të lartë nëpër kafe të bluar shumë imët dhe të shtypur. Presioni nxjerr nga kafeja jo vetëm aromat, por edhe vajrat dhe gazrat që krijojnë kremën, shtresën e artë në sipërfaqe.

Parametrat e një espresso-je të saktë:
• Doza: rreth 18 deri në 20 gramë kafe e bluar për një espresso të dyfishtë, ose rreth 7 deri në 10 gramë për një të vetme. Shumë bare përdorin gjithmonë dozën e dyfishtë dhe ndajnë.
• Presioni: rreth 9 bar.
• Temperatura e ujit: rreth 90 deri në 94 gradë. Uji në pikën e vlimit e djeg kafenë.
• Koha e ekstraktimit: rreth 25 deri në 30 sekonda.
• Sasia në filxhan: rreth 25 deri në 30 ml për një espresso të vetme, ose 36 deri në 40 ml për një të dyfishtë.
• Krema: ngjyrë lajthie ose kafe e artë, e qëndrueshme, rreth 3 deri në 4 mm. Nëse hedh pak sheqer, duhet të qëndrojë një moment mbi kremë para se të fundosë.

Kur këto parametra janë në rregull, espresso ka ekuilibër midis ëmbëlsisë, aciditetit dhe hidhërimit, trup të mirë dhe një shije që zgjat në gojë.`],
["Rregullimi i bluarjes",`Variabli më i rëndësishëm që barmeni kontrollon çdo ditë është bluarja. Kafeja ndryshon me lagështinë e ajrit, me temperaturën dhe me moshën e kokrrave, prandaj bluarja duhet të kontrollohet dhe të rregullohet disa herë në ditë.

Si e lexon espresso-n:
• Nëse rrjedh shumë shpejt, nën rreth 20 sekonda, dhe është i hollë, i thartë, me kremë të zbehtë dhe të hollë, kafeja është “nën-ekstraktuar”. Uji kaloi shumë shpejt dhe nuk nxori mjaftueshëm. Bluarja është shumë e trashë: bëje më të imët.
• Nëse rrjedh shumë ngadalë, mbi rreth 35 sekonda, ose me pika, dhe është i hidhur, i djegur, me kremë shumë të errët ose me vrima, kafeja është “mbi-ekstraktuar”. Uji nxori edhe substancat e hidhura. Bluarja është shumë e imët: bëje më të trashë.

Rregulli i rregullimit: ndrysho vetëm një hap të vogël çdo herë dhe provo përsëri. Ndryshimet e mëdha e çojnë kafenë nga njëra skaj në tjetrin. Dhe ndrysho vetëm një variabël njëherësh: nëse ndryshon edhe dozën edhe bluarjen, nuk e di cila ndikoi.

Çdo mëngjes, para hapjes, barmeni nxjerr disa espresso prove, i mat dhe i provon, dhe rregullon bluarjen derisa të jetë perfekt.`],
["Freskia e kafesë",`Kafeja është një produkt i freskët që humbet aromat shpejt.

• Kafeja e bluar humbet një pjesë të madhe të aromave brenda pak minutash. Prandaj bluhet vetëm në momentin e nxjerrjes, kurrë paraprakisht për gjithë turnin.
• Kokrrat e pjekura janë më të mira nga rreth një javë deri në katër javë pas pjekjes. Para kësaj kanë shumë gaz, pas kësaj fillojnë të humbasin aromat.
• Kokrrat ruhen në enë të mbyllura, larg dritës, nxehtësisë dhe lagështisë. Jo në frigorifer, ku marrin lagështi dhe erëra.
• Hinka e mullirit mbushet vetëm me sasinë që do të përdoret në disa orë, jo me gjithë thesin.`],
["Procesi hap pas hapi",`Para çdo kafeje:
• Hiq portafiltrin nga grupi, hidh kafenë e përdorur, fshije dhe thaje me leckë. Një portafiltër i lagësht ose me mbetje kafeje të vjetër prish shijen.
• Lësho ujë nga grupi për rreth dy sekonda, që quhet “flush”. Kjo pastron mbetjet dhe stabilizon temperaturën.

Nxjerrja:
• Blu dozën e saktë drejtpërdrejt në portafiltër.
• Shpërndaje kafenë njësoj në filtër, pa grumbuj.
• Shtyp kafenë me tamper-in, drejt dhe me forcë të qëndrueshme. Tamper-i duhet të jetë horizontal: një shtypje e anuar krijon kanale ku uji kalon më shpejt.
• Fshi buzën e portafiltrit nga kafeja e tepërt.
• Vendose portafiltrin në grup dhe fillo nxjerrjen menjëherë, që kafeja të mos digjet nga nxehtësia e grupit.
• Vëzhgo rrjedhjen: duhet të fillojë pas disa sekondash, të duket si mjaltë e lëngshme me ngjyrë të errët që zbardhet gradualisht.
• Shërbeje menjëherë. Espresso humbet kremën dhe temperaturën brenda një minute.

Pas çdo kafeje, pastro tubin e avullit nëse është përdorur, dhe në fund të turnit bëj pastrimin e plotë të makinës sipas udhëzimeve.`],
["Shërbimi i espresso-s",`Espresso shërbehet në filxhan të ngrohur paraprakisht, zakonisht duke e mbajtur mbi makinë ose duke e shpëlarë me ujë të nxehtë. Filxhani i ftohtë e ftoh espresso-n menjëherë.

Rregullat e shërbimit, siç pamë në Modulin 2:
• Filxhan me pjatë, i pastër, pa njolla kafeje anash.
• Dorëza në orën katër, luga paralel me dorëzën.
• Sheqer i bardhë dhe kaf, ëmbëlsues, në enë të veçanta.
• Një gotë e vogël ujë me espresso-n.

Edhe kafeja pa kafeinë, “decaf”, duhet të jetë po aq e mirë. Mysafiri që pi decaf në mbrëmje meriton të njëjtin kujdes.

» Skenë nga Flower: Ora 7:30 në mëngjes. Barmeni nxjerr espresso-n e parë të provës: 18 sekonda, i hollë dhe i thartë. E bën bluarjen një hap më të imët. E dyta: 23 sekonda, më mirë, por ende pak e thartë. Edhe një hap. E treta: 27 sekonda, 38 ml, krema ngjyrë lajthie, ekuilibër i mirë. Kafeja e parë e mysafirit në 7:45 do jetë perfekte. Gjatë ditës, kur dielli ngroh sallën dhe lagështia ndryshon, barmeni e kontrollon përsëri në drekë.`],
["Përmbledhje",`Arabica është më aromatike dhe e ëmbël, Robusta më e hidhur dhe me më shumë kafeinë dhe kremë. Espresso: rreth 18 deri në 20 gramë për të dyfishtin, 9 bar, 90 deri në 94 gradë, 25 deri në 30 sekonda, krema ngjyrë lajthie. Shumë shpejt dhe i thartë: bluarje më e imët. Shumë ngadalë dhe i hidhur: bluarje më e trashë. Një hap çdo herë. Kafeja bluhet vetëm në çast. Portafiltri fshihet dhe thahet para çdo kafeje. Dhe shërbehet menjëherë, në filxhan të ngrohur.`]
];
LEC.K2=[
["Hyrje: qumështi si art",`Shumica e kafeve që porositen në bar nuk janë espresso të thjeshtë. Janë cappuccino, macchiato, latte, kafe me qumësht. Dhe në këto pije, qumështi është po aq i rëndësishëm sa kafeja. Një cappuccino me espresso perfekt dhe qumësht të djegur me flluska të mëdha është një cappuccino e dështuar.

Ky leksion shpjegon pijet kryesore me espresso dhe qumësht, dallimet midis tyre, teknikën e avullimit të qumështit dhe qumështet bimore. Menuja jonë e kafesë ka espresso, macchiato, cappuccino, café latte, americano, decaf, matcha latte dhe frappé.`],
["Variacionet e espresso-s",`• Espresso. Rreth 25 deri në 30 ml për një të vetme. Baza e të gjithave.
• Ristretto. “I kufizuar” në italisht. Espresso më i shkurtër, rreth 15 deri në 20 ml, me të njëjtën dozë kafeje por më pak ujë. Më i dendur, më i ëmbël dhe më pak i hidhur.
• Lungo. “I gjatë”. Espresso më i gjatë, rreth 50 deri në 60 ml, me më shumë ujë që kalon nëpër kafe. Më i hollë dhe më i hidhur.
• Doppio. Espresso i dyfishtë.
• Americano. Espresso i holluar me ujë të nxehtë, në një filxhan më të madh. Emri vjen nga ushtarët amerikanë në Itali gjatë Luftës së Dytë Botërore, që hollonin espresso-n për ta bërë të ngjashëm me kafenë e filtrit të shtëpisë. Teknika më e mirë: uji i nxehtë në filxhan së pari, pastaj espresso sipër, që të ruhet krema.`],
["Pijet me qumësht",`• Macchiato. “I njollosur” në italisht. Espresso me një sasi të vogël shkume qumështi sipër, sa një “njollë”. Në Shqipëri, makiato është ndoshta kafeja më e porositur, dhe mysafirët shqiptarë kanë pritshmëri shumë të sakta për të. Ka variante: makiato e madhe, me më shumë qumësht, dhe makiato e vogël, më e fortë. Pyet mysafirin kur nuk je i sigurt.
• Cortado. Nga Spanja. Espresso me sasi të barabartë qumështi të ngrohtë, me pak shkumë.
• Cappuccino. Klasikja italiane. Rreth një e treta espresso, një e treta qumësht i avulluar, një e treta shkumë. Në filxhan rreth 150 deri në 180 ml. Shkuma duhet të jetë e dendur, e lëmuar, me shkëlqim, jo me flluska të mëdha si sapun. Emri vjen nga murgjit kapucinë, ngjyra e rrobave të të cilëve i ngjante ngjyrës së kafesë.
• Flat white. Nga Australia ose Zelanda e Re, vitet 1980. Espresso i dyfishtë ose ristretto, me qumësht të avulluar me mikroshkumë shumë të hollë. Filxhan rreth 150 deri në 160 ml. Më i fortë në shijen e kafesë se latte, sepse ka më pak qumësht.
• Caffè latte. Espresso me shumë qumësht të avulluar dhe një shtresë të hollë shkume. Në gotë ose filxhan të madh, rreth 250 ml. Më i butë dhe më qumështor.
• Matcha latte. Nuk ka kafe. Pluhur çaji jeshil japonez matcha i përzier me pak ujë të nxehtë, pastaj me qumësht të avulluar. Ngjyrë jeshile e gjallë, aromë bimore dhe pak e hidhur.`],
["Avullimi i qumështit",`Avullimi i qumështit është aftësia më e vështirë në bar, por me praktikë bëhet natyrale. Qëllimi është të krijosh “mikroshkumë”: qumësht i ngrohtë me flluska kaq të vogla sa nuk duken, me teksturë të lëmuar si kadife dhe me shkëlqim.

Përgatitja:
• Qumësht i ftohtë, direkt nga frigoriferi. Qumështi i ftohtë të jep më shumë kohë për të krijuar teksturën.
• Kana e çelikut e ftohtë dhe e pastër.
• Mbushe kanën deri afërsisht në fillim të grykës, rreth një e treta, sepse qumështi rritet në vëllim.
• Lësho avull nga tubi për një sekondë para se ta fusësh në qumësht, që të heqësh ujin e kondensuar.

Teknika në dy faza:
• Ajrosja. Fute majën e tubit pak nën sipërfaqen e qumështit dhe hap avullin plotësisht. Do të dëgjosh një tingull të lehtë si “cicërimë” ose letër që grisët. Kjo do të thotë që ajri po futet. Mbaje në këtë pozicion derisa qumështi të rritet rreth 20 deri në 30 për qind për cappuccino, ose më pak për latte dhe flat white.
• Rrotullimi. Fute tubin pak më thellë dhe anoje kanën, që qumështi të fillojë të rrotullohet si vorbull. Rrotullimi thyen flluskat e mëdha dhe përzien shkumën me qumështin.

Temperatura: ndalo në rreth 60 deri në 65 gradë. Pa termometër, kjo është kur kana bëhet aq e nxehtë sa mezi e mban me dorë për më shumë se një sekondë. Mbi 70 gradë, qumështi digjet, humbet ëmbëlsinë natyrale dhe merr erë të zier.

Pas avullimit, mbyll avullin, hiq kanën, fshi tubin menjëherë me leckë të lagur dhe lësho avull për një sekondë për ta pastruar nga brenda. Trokit kanën lehtë në banak për të hequr flluskat e mbetura dhe rrotulloje që qumështi të mbetet i bashkuar dhe me shkëlqim. Derdhe menjëherë mbi espresso.`],
["Qumështet bimore",`Gjithnjë e më shumë mysafirë kërkojnë qumësht bimor, për arsye shëndetësore, intolerancë ndaj laktozës, alergji, dietë vegane ose zgjedhje personale.

• Qumështi i tërshërës. Më i popullarizuari për kafe, sepse ka ëmbëlsi natyrale dhe avullohet shumë mirë, duke krijuar shkumë të ngjashme me qumështin e lopës. Versionet “barista” janë të formuluara posaçërisht për kafe.
• Qumështi i bajames. Më i lehtë, me aromë bajameje. Shkuma është më pak e qëndrueshme. Kujdes: bajamet janë arra, alergjen.
• Qumështi i sojës. Një nga më të vjetrit, avullohet mirë, por ndonjëherë pritet në kontakt me kafen e thartë. Soja është alergjen.
• Qumështi i kokosit. Aromë e fortë kokosi, shkumë më e dobët.
• Qumështi pa laktozë. Qumësht lope ku laktoza është zbërthyer. Avullohet si qumështi normal dhe është zgjedhja për mysafirët me intolerancë ndaj laktozës, por nuk është i përshtatshëm për ata me alergji ndaj proteinave të qumështit.

Rregulla:
• Pyet gjithmonë për arsyen kur ka rëndësi: “A është për alergji?” Nëse po, kana dhe tubi duhet të jenë të pastër nga qumështi i lopës.
• Qumështet bimore zakonisht avullohen në temperaturë pak më të ulët, rreth 55 deri në 60 gradë.
• Kana e veçantë për qumështet bimore, ose të paktën pastrim i plotë midis tyre.`],
["Shërbimi dhe prezantimi",`Çdo pije me qumësht shërbehet:
• Në filxhan të ngrohur, me madhësinë e duhur për pijen.
• Me pjatë dhe lugë, dorëza në orën katër.
• Sheqer i bardhë dhe kaf, ëmbëlsues, në enë të veçanta.
• Gotë uji, sidomos me espresso dhe macchiato.
• Me një vizatim të thjeshtë në shkumë, “latte art”, si zemër ose gjethe, kur barmeni e di ta bëjë mirë. Nuk është detyrim, por është detaj i bukur.

» Skenë nga Flower: Një mysafire italiane porosit “un cappuccino”. Barmeni nxjerr një espresso të vetme në filxhanin e ngrohur prej 160 ml, avullon qumështin e ftohtë me ajrosje derisa rritet rreth një e katërta, e rrotullon deri në 62 gradë dhe e derdh me një zemër të thjeshtë në sipërfaqe. Shkuma është e lëmuar dhe me shkëlqim. Mysafirja e provon: “Perfetto.” Pak minuta më vonë, shoku i saj porosit një latte me qumësht tërshëre. Barmeni merr kanën e veçantë dhe pyet: “A është për alergji, apo preferencë?”`],
["Përmbledhje",`Ristretto i shkurtër dhe i dendur, lungo i gjatë, americano me ujë në filxhan së pari. Macchiato me pak shkumë, cortado gjysmë për gjysmë, cappuccino me tre të treta, flat white me mikroshkumë dhe shije të fortë, latte me shumë qumësht. Qumështi avullohet i ftohtë, me ajrosje dhe pastaj rrotullim, deri në 60 deri në 65 gradë, kurrë mbi 70. Qumështet bimore: tërshëra është më e mira për kafe, bajamja dhe soja janë alergjenë. Dhe çdo pije shërbehet në filxhan të ngrohur, me gjithë detajet.`]
];
LEC.K3=[
["Hyrje: çaji si ritual",`Për shumë mysafirë, sidomos nga Britania, Lindja e Mesme, Azia dhe gjithnjë e më shumë nga e gjithë bota, çaji nuk është alternativa e dorës së dytë e kafesë. Është një ritual me rregullat e veta. Një qeskë çaji e hedhur në një filxhan me ujë të vakët është për ta po aq e pakënaqshme sa një espresso i djegur për një italian.

Standardi HD21 kërkon që kafeja dhe çaji të shërbehen në mënyrë të rafinuar. Ky leksion shpjegon llojet e çajit, infuzionet bimore, temperaturat dhe kohët e infuzionit, dhe ritualin e shërbimit.`],
["Një bimë, shumë çajra",`Ka një fakt që shumë njerëz nuk e dinë: çaji i bardhë, jeshil, oolong, i zi dhe pu-erh vijnë të gjithë nga e njëjta bimë, Camellia sinensis. Dallimi midis tyre nuk është bima, por mënyra si përpunohen gjethet, kryesisht sa oksidohen.

Oksidimi është i njëjti proces që e bën një mollë të prerë të marrë ngjyrë kafe. Kur gjethet e çajit priten ose shtypen, ato reagojnë me oksigjenin dhe ndryshojnë ngjyrë dhe shije.

• Çaji i bardhë. Gjethe dhe sytha shumë të rinj, të mbledhur me dorë dhe të tharë butë, me oksidim minimal. Shije shumë delikate, e ëmbël, lulore.
• Çaji jeshil. Gjethet ngrohen menjëherë pas mbledhjes, me avull në Japoni ose në tigan në Kinë, për të ndalur oksidimin. Ngjyrë jeshile, shije bimore, e freskët, ndonjëherë si deti ose si bari. Shembuj: sencha japonez, matcha, Dragon Well kinez.
• Oolong. Oksidim i pjesshëm, nga i lehtë deri në mesatar. Është midis jeshilit dhe të ziut, me aroma lulesh, frutash dhe ndonjëherë mjalti. Nga Kina dhe Tajvani.
• Çaji i zi. Oksidim i plotë. Ngjyrë e errët, shije e fortë dhe e plotë. Shembuj: Assam dhe Darjeeling nga India, Ceylon nga Sri Lanka, English Breakfast, që është një përzierje, dhe Earl Grey, çaj i zi i aromatizuar me vaj bergamoti.
• Pu-erh. Çaj nga Kina, i fermentuar dhe i plakur, ndonjëherë për vite, me shije toke dhe druri.`],
["Infuzionet bimore",`Infuzionet bimore, ose “tisanes”, nuk janë çaj në kuptimin teknik, sepse nuk vijnë nga Camellia sinensis. Bëhen nga lule, gjethe, rrënjë, fruta ose erëza të tjera. Shumica nuk kanë kafeinë, prandaj janë të preferuarat në mbrëmje.

• Kamomili. Lule të thara, me aromë të butë si mjaltë. Tradicionalisht për qetësim.
• Nenexhiku. Freskues, i mirë pas ushqimit.
• Rooibos. Nga Afrika e Jugut, ngjyrë e kuqe, shije e ëmbël, pa kafeinë.
• Hibiskusi. Ngjyrë e kuqe e thellë, shije e thartë dhe frutore.
• Xhenxhefili. Pikant dhe ngrohës.
• Verbena e limonit, livando, trëndafili dhe shumë të tjera.

Çaji i malit është infuzioni tradicional shqiptar. Bëhet nga bima Sideritis, që rritet në malet e Shqipërisë dhe të Ballkanit. Nuk ka kafeinë dhe ka aromë të këndshme barishtesh malore, pak lulore. Në Shqipëri pihet prej shekujsh, sidomos në dimër. Ofroje me krenari si produkt vendas, me historinë e tij: “Would you like to try our mountain tea? It's a traditional Albanian herbal tea from a plant that grows wild in our mountains, caffeine-free and very aromatic.”`],
["Temperatura dhe koha e infuzionit",`Gabimi më i zakonshëm në shërbimin e çajit është uji në pikën e vlimit për çdo lloj çaji. Uji shumë i nxehtë i djeg gjethet delikate dhe nxjerr substancat e hidhura, sidomos te çaji jeshil dhe i bardhë.

Udhëzimet bazë:
• Çaji i bardhë: rreth 75 deri në 80 gradë, 3 deri në 4 minuta.
• Çaji jeshil: rreth 75 deri në 80 gradë, 2 deri në 3 minuta. Uji i vluar e bën të hidhur dhe me ngjyrë të errët.
• Oolong: rreth 85 deri në 90 gradë, 3 deri në 4 minuta.
• Çaji i zi: rreth 95 deri në 100 gradë, 3 deri në 5 minuta. Më gjatë bëhet shumë i fortë dhe i hidhur.
• Infuzionet bimore dhe çaji i malit: 100 gradë, 5 deri në 7 minuta. Infuzionet kanë nevojë për më shumë kohë dhe nxehtësi.

Nëse nuk ke termometër ose makinë me temperatura, mund të përdorësh ujë të vluar dhe ta lësh të qëndrojë rreth dy minuta për ta ulur në 80 gradë.

Koha e infuzionit i jepet mysafirit si udhëzim, sepse ai vendos sa të fortë e do. Disa hotele luksoze përdorin kohëmatës rëre të vegjël që vendosen me çajnikun. Kjo është një detaj elegant që mund ta përdorim.`],
["Ofrimi i çajit",`Kur mysafiri kërkon çaj, nuk pyesim vetëm “çaj?”. Ofrojmë zgjedhje. Dy mënyra:
• Kutia e çajrave. Një kuti druri me ndarje, me qeska ose paketime të ndryshme, që i hapet mysafirit dhe ai zgjedh.
• Menuja e çajrave. Një listë me llojet dhe një përshkrim të shkurtër.

Kamarieri duhet të dijë të përshkruajë shkurt çdo çaj që kemi: “Kemi një Earl Grey klasik me bergamot, një çaj jeshil japonez, kamomil për mbrëmje, nenexhik, dhe çajin tonë shqiptar të malit.” Në menunë tonë kemi edhe çajra organikë, që mund t'i përmendësh si zgjedhje premium.

Pyet edhe si e dëshiron: me limon, me qumësht, me mjaltë? Por mos i sill automatikisht.`],
["Prezantimi dhe shërbimi",`Shërbimi i çajit në një hotel me pesë yje përfshin:
• Çajnik i ngrohur paraprakisht me ujë të nxehtë, që uji i çajit të mos ftohet sapo derdhet.
• Çaji brenda çajnikut, në qeskë ose me gjethe të lira në një sitë.
• Filxhan me pjatë, dorëza në orën katër, lugë paralel.
• Një pjatë e vogël për të vendosur qeskën ose sitën pas infuzionit. Mysafiri nuk duhet të kërkojë ku ta lërë qeskën e lagur.
• Kohëmatësi ose udhëzimi i kohës: “Çaji juaj jeshil është gati pas rreth tre minutash.”
• Limon në feta, në pjatë të vogël, me pirun të vogël.
• Mjaltë në enë të vogël me lugë.
• Qumësht i ftohtë, jo i nxehtë, në enë të vogël, për çajrat e zinj. Qumështi nuk shkon me çajin jeshil ose me infuzionet.
• Sheqer i bardhë dhe kaf.
• Një çajnik i vogël shtesë me ujë të nxehtë, për të rimbushur ose për ta holluar nëse çaji bëhet shumë i fortë.

» Skenë nga Flower: Një mysafire britanike kërkon “a cup of tea” pas darkës. Kamarieri sjell kutinë e çajrave dhe ia hap. Ajo zgjedh English Breakfast. Kamarieri e përgatit me ujë në pikën e vlimit në çajnik të ngrohur, sjell qumësht të ftohtë në enë të vogël, sheqer, një pjatë për qeskën dhe një çajnik me ujë shtesë. “Your tea will be ready in about four minutes.” Mysafirja buzëqesh. Pas dhjetë minutash, kamarieri e kontrollon dhe i ofron ujë të nxehtë.`],
["Përmbledhje",`Çaji i bardhë, jeshil, oolong, i zi dhe pu-erh vijnë nga e njëjta bimë dhe ndryshojnë nga oksidimi. Infuzionet bimore, si kamomili, nenexhiku dhe çaji ynë i malit, nuk kanë kafeinë. Temperaturat: 75 deri në 80 gradë për të bardhin dhe jeshilin, 85 deri në 90 për oolong, 95 deri në 100 për të ziun dhe infuzionet. Çaji ofrohet me zgjedhje, shërbehet në çajnik të ngrohur, me pjatë për qeskën, udhëzim kohe, limon, mjaltë, qumësht të ftohtë për të zinjtë dhe ujë shtesë.`]
];
LEC.K4=[
["Hyrje: fundi që mbetet në kujtesë",`Pas ëmbëlsirës, shumë mysafirë janë gati të largohen. Por ka një moment të fundit që mund ta bëjë mbrëmjen të paharrueshme: kafeja pas darkës, një digjestiv i sugjeruar mirë, ndoshta disa ëmbëlsira të vogla. Sipas rregullit pik-fund që pamë në Modulin 0, njerëzit e kujtojnë një përvojë kryesisht nga momenti më intensiv dhe nga fundi. Kafeja pas darkës është pjesë e këtij fundi.

Një espresso i ftohtë, i vonuar ose i shërbyer pa kujdes e dobëson gjithë mbrëmjen. Një kafe perfekte me një mignardise dhe një digjestiv i zgjedhur me kujdes e mbyll bukur. Ky leksion shpjegon si e ofrojmë dhe si e shërbejmë këtë moment.`],
["Ofrimi: gjithmonë, me sugjerim",`Kafeja dhe digjestivi ofrohen gjithmonë, edhe kur mysafiri duket i ngopur ose me nxitim. Shumë mysafirë nuk i porositin vetëm sepse askush nuk ua ofroi.

Momenti i ofrimit është me menunë e ëmbëlsirave ose menjëherë pas saj. Pyetja e duhur ka dy qëllime: të ofrojë kafenë dhe të kuptojë kur e dëshiron mysafiri.

“Dëshironi një kafe ose çaj me ëmbëlsirën, apo pas saj?”

Ky dallim ka rëndësi. Shumë mysafirë evropianë, sidomos italianët, e pinë espresso-n pas ëmbëlsirës, si mbyllje. Të tjerë e duan bashkë. Disa kultura nuk pinë cappuccino pas ushqimit, por vetëm espresso. Kurrë mos e sill kafenë para ëmbëlsirës pa e pyetur mysafirin.

Kur mysafiri nuk dëshiron ëmbëlsirë, ofro gjithsesi kafenë ose çajin: “Ndoshta një espresso ose një çaj për të mbyllur?”`],
["Shërbimi i kafesë pas darkës",`Shërbimi i kafesë pas darkës është po aq i kujdesshëm sa shërbimi i pjatës kryesore:
• Kafeja sillet në tabaka, jo me dorë.
• Filxhan i ngrohur, me pjatë, dorëza në orën katër, lugë paralel.
• Sheqer i bardhë dhe kaf, ëmbëlsues, në enë të veçanta.
• Gotë uji me espresso-n.
• Çdo mysafir merr kafenë e vet pa pyetur “kush e kishte cappuccino-n?”, sipas pozicioneve.
• Kafeja vjen e nxehtë, menjëherë pas nxjerrjes. Nëse tavolina ka shumë kafe, barmeni i përgatit në rend që të gjitha të dalin bashkë.

Pyet nëse dëshirojnë kafe pa kafeinë. Shumë mysafirë e preferojnë në mbrëmje, por nuk e kërkojnë nëse nuk ua ofron.`],
["Digjestivi: çfarë dhe si",`Digjestivi është një pije alkoolike që pihet pas ushqimit. Tradicionalisht besohej se ndihmonte tretjen, prandaj emri. Sot është më shumë një moment kënaqësie dhe mbylljeje.

Kategoritë kryesore:
• Konjak dhe brandy. Konjaku VSOP ose XO është digjestivi klasik i darkës elegante, në gotë të vogël me bark të gjerë.
• Grappa. Distilati italian i bërsive të rrushit. Grappa e re është e fortë dhe e freskët, grappa e plakur në fuçi është më e butë dhe e artë.
• Rakia. Rakia shqiptare e rrushit ose e manit, sidomos ajo e plakur, është digjestivi ynë vendas. Ofroje me krenari dhe me tregim.
• Amaro. Likere italiane të hidhura me barishte dhe erëza. Shumë popullore pas darkës në Itali.
• Limoncello. Liker limoni i ftohtë, i freskët dhe i ëmbël.
• Verë ëmbëlsire. Porto, Sauternes, Moscato, Passito. Shkon bukur edhe me ëmbëlsirën edhe me djathrat.
• Uiski. Një single malt i mirë është zgjedhje e shkëlqyer pas darkës për dashamirët e uiskit.
• Kokteilet digjestive. Espresso Martini, Don Amaretto ose signature-i ynë Old Father janë zgjedhje moderne pas darkës.

Si e sugjeron: me një propozim konkret, jo me pyetjen “Doni digjestiv?”. “Me espresso-n ju sugjeroj një grappa të plakur ose rakinë tonë të manit.” Ose: “Nëse ju pëlqen diçka e ëmbël, kemi një Porto shumë të mirë.”

Digjestivi shërbehet në gotën e duhur: gotë konjaku ose tulipan i vogël për konjakun, grappa-n dhe rakinë cilësore; gotë e vogël e ftohur për limoncello-n; gotë e vogël vere për verërat e ëmbëlsirës.`],
["Mignardises dhe petit fours",`Mignardises, ose petit fours, janë ëmbëlsira të vogla që shërbehen me kafenë në restorantet elegante: çokollata të vogla, makarona, biskota, fruta të glazuara, pate de fruits. Emri “petit fours” vjen nga frëngjishtja, “furra e vogël”, sepse dikur piqeshin në furrë kur temperatura ulej pas pjekjes së bukës.

Nëse kuzhina jonë i ofron, ato vijnë me kafenë, në një pjatë të vogël në mes të tavolinës, dhe kamarieri i shpjegon shkurt: “Me kafenë tuaj, disa ëmbëlsira të vogla nga kuzhina jonë: çokollatë e errët me kripë deti dhe një biskotë me bajame.” Kujdes me alergjitë, sepse mignardises shpesh kanë arra, qumësht dhe gluten.

Ky është një nga elementet e luksit që Forbes e vë re. Kushton pak dhe lë një përshtypje të madhe në fund të mbrëmjes.`],
["Koha dhe ritmi",`Momenti i kafesë nuk duhet të nxitohet, por as të vonohet.
• Kafeja del bashkë me ose menjëherë pas ëmbëlsirës, sipas kërkesës.
• Pas kafesë, mysafiri mund të dëshirojë të qëndrojë dhe të bisedojë. Mos e sill faturën pa u kërkuar.
• Rimbushja e ujit vazhdon.
• Pas rreth 10 deri në 15 minutash, mund të pyesësh me mirësjellje: “Dëshironi diçka tjetër? Një kafe tjetër ose një digjestiv?”

» Skenë nga Flower: Një çift ka mbaruar menunë degustuese. Me ëmbëlsirën e fundit, kamarieri pyet: “Dëshironi një kafe me ëmbëlsirën apo pas saj?” “Pas.” Kur heq pjatat e ëmbëlsirës: “Dy espresso? Dhe nëse dëshironi, me espresso-n ju sugjeroj rakinë tonë të manit ose një grappa të plakur.” Zotëria merr rakinë, zonja pyet për diçka të ëmbël dhe kamarieri i sugjeron një verë ëmbëlsire. Kafet vijnë në tabaka, me gotë uji dhe me një pjatë të vogël çokollatash. Kur largohen, zotëria i thotë kamarierit: “Rakia ishte surpriza e mbrëmjes.”`],
["Përmbledhje",`Kafeja pas darkës është pjesë e fundit që mbetet në kujtesë. Ofrohet gjithmonë, me pyetjen “me ëmbëlsirën apo pas saj?”, dhe kurrë para ëmbëlsirës pa pyetur. Shërbehet në tabaka, në filxhan të ngrohur, me gotë uji. Digjestivi sugjerohet konkretisht: konjak, grappa, raki, amaro, limoncello, verë ëmbëlsire ose kokteil digjestiv, në gotën e duhur. Mignardises shoqërojnë kafenë kur kuzhina i ofron. Dhe fatura nuk sillet pa u kërkuar.`]
];
LEC.F1=[
["Hyrje: çfarë është Flower",`Flower Restaurant është restoranti ynë i peshkut dhe i frutave të detit. Kuzhina është mesdhetare bashkëkohore, me ndikime nga teknikat aziatike, si kimchi, wasabi, soja dhe letra e orizit, dhe nga tradita greke, si retsina dhe taramosalata. Mysafiri vjen në Flower për freskinë e detit. Çdo përshkrim yt duhet ta përçojë këtë: freskinë, origjinën kur e dimë dhe teknikën.

Ky leksion fokusohet te koncepti dhe te antipastat, që janë pjesa më e pasur dhe më e larmishme e menusë. Me katërmbëdhjetë antipasta, nga goca deti te oktapodi i zi, kamarieri i Flower ka në dorë mjetet për të krijuar momentin e parë të fortë të mbrëmjes. Faqja Menutë tona në platformë ka çdo pjatë me përbërësit, alergjenët dhe kartat e kujtesës.`],
["Logjika e antipastave",`Antipastat e Flower mund t'i ndash në katër grupe, dhe kjo të ndihmon t'i mbash mend dhe t'i rekomandosh.

• Të gjallat, ose crudo. Carpaccio toni, carpaccio peshku murgu, tartar peshku, tartar karkalecash, goca deti. Peshk ose fruta deti pa gatim, ku freskia është gjithçka.
• Frutat e detit të gatuara. Karkaleca të skuqur në tigan, langustinë, midhje me kimchi, karkaleca Viola, oktapod i zi, oktapod.
• Krokantet dhe të vogla. Fritter krokant merluci, brusketë me açuge.
• Me drithëra. Kuskus me sepje.

Kur mysafiri pyet “çfarë më rekomandoni për të filluar?”, pyet fillimisht: “Preferoni diçka të gjallë dhe të freskët, apo diçka të gatuar?” Kjo një pyetje e ngushton zgjedhjen menjëherë.`],
["Të gjallat: crudo",`Pjatat e gjalla janë krenaria e një restoranti peshku, sepse tregojnë besimin në freskinë e produktit.

• Carpaccio toni, 950 lekë. Ton i prerë hollë, me midhje, perla limoni, lime dhe alga deti. Perlat e limonit janë kokrra të vogla që shpërthejnë në gojë me aciditet. Përshkrimi: “ton i prerë shumë hollë, me freskinë e agrumeve dhe shijen e detit nga algat.”
• Carpaccio peshk murgu, 800 lekë. Me qitro, lime dhe kastravec turshi. Më i lehtë dhe më acid.
• Tartar peshku, 1.100 lekë. Peshk i gjallë i prerë me thikë, me krem Philadelphia dhe avokado. Kremoz.
• Tartar karkalecash, 1.700 lekë. Me çips wasabi, jalapeño, djegës dhe letër orizi. Pikant dhe krokant. Ndikimi aziatik.
• Goca deti, 550 lekë copa. Me retsina, verë greke me rrëshirë pishe, koriandër, fara kopre dhe verë Sigalas nga Santorini.

Dallimi midis carpaccio dhe tartar: carpaccio është i prerë në feta shumë të holla, tartar është i prerë me thikë në kube të vegjël.

Pjatat e gjalla kërkojnë një pyetje të veçantë. Peshku dhe frutat e detit të gjalla nuk rekomandohen për gratë shtatzëna, për njerëzit me imunitet të dobët dhe për fëmijët e vegjël. Thuaje me takt, pa e bërë temë të rëndë: “Kjo pjatë shërbehet e gjallë, a ju përshtatet?”`],
["Goca deti: rituali",`Goca deti meritojnë një kapitull më vete sepse kanë ritualin e tyre dhe mysafirët që i porositin janë shpesh njohës.

• Shiten me copë, 550 lekë secila. Pyet sa dëshiron mysafiri. Porositë e zakonshme janë gjashtë ose dymbëdhjetë.
• Shërbehen në një pjatë me akull të thyer, që të mbeten të ftohta.
• Retsina, koriandri dhe farat e koprës janë stinimi ynë. Retsina është një verë e bardhë greke me rrëshirë pishe, me një aromë unike. Verë Sigalas nga Santorini është pjesë e përgatitjes.
• Gocat hahen të gjalla, shpesh direkt nga guaska, duke e kthyer guaskën në gojë.
• Çiftimi klasik: një e bardhë minerale dhe e kripur, si vetë Sigalas, një Chablis ose shampanjë.

Kur e rekomandon: “Gocat tona shërbehen me retsina, verën greke me rrëshirë pishe, dhe me pak koriandër. Me to ju sugjeroj Sigalas nga Santorini, e kripur dhe minerale si vetë deti.”`],
["Frutat e detit të gatuara",`• Oktapod i zi, 2.000 lekë. Pjata signature e antipastave. Me piper të tymosur, xhenxhefil, karkalec, soje dhe flakes oktapodi. Ngjyra e errët dhe shija e thellë e bëjnë spektakolare. Përmban edhe molusqe edhe krustace. Rekomandoje kur mysafiri dëshiron diçka të veçantë: “Oktapodi ynë i zi është pjata që na përfaqëson.”
• Oktapod, 1.950 lekë. Versioni tjetër, me marmelatë domateje dhe infuzion djegësi. Më mesdhetar, më i thjeshtë në shije.
• Karkaleca të skuqur në tigan, 1.400 lekë. Me emulsion nduja, një sallam pikant i butë nga Kalabria, dhe crumble domateje. Pikant dhe i pasur.
• Langustinë, 1.200 lekë. Me barishte të egra, pita integrale dhe stracciatella, një djathë i freskët shumë kremoz nga Puglia.
• Midhje me kimchi, 1.500 lekë. Midhje në salcë kimchi, lakra e fermentuar koreane, pikante. Kimchi zakonisht ka salcë peshku.
• Karkaleca Viola, 12.000 lekë për kilogram. Me krem Philadelphia, vaj borziloku dhe grejpfrut. Karkaleca Viola janë një nga llojet më të çmuara të karkalecave të Mesdheut, me ngjyrë vjollcë dhe mish shumë të ëmbël.

Dallimi i rëndësishëm: oktapodi, midhjet, sepjet dhe gocat janë molusqe. Karkalecat dhe langustinat janë krustace. Janë dy alergjenë të ndryshëm.`],
["Krokantet dhe të voglat",`• Fritter krokant merluci, 1.000 lekë. Merluc i skuqur krokant me pluhur popcorn. Krokant nga jashtë, i butë brenda. E përsosur për të ndarë dhe për t'u shoqëruar me flluska.
• Brusketë me açuge, 450 lekë. Me açuge, fava dhe domate të thara. Antipasta më e lirë, e shkëlqyer për të filluar me një aperitiv.
• Kuskus me sepje, 800 lekë. Me hudhër të zezë, sepje dhe bajame. Hudhra e zezë është hudhër e fermentuar ngadalë që merr ngjyrë të zezë dhe shije të ëmbël, si balsam.

Këto janë pjatat ideale për tavolinat që duan të ndajnë disa antipasta në family style.`],
["Çmimi për kilogram dhe për copë",`Disa pjata në Flower nuk kanë çmim fiks: karkalecat Viola me 12.000 lekë për kilogram, shojza me 7.000 lekë për kilogram dhe gocat me 550 lekë copa. Këto janë pjatat ku ndodhin më shumë keqkuptime për faturën.

Rregulli është i thjeshtë dhe pa përjashtim: thuaj gjithmonë peshën e përafërt dhe çmimin para porosisë.

“Karkalecat Viola janë 12.000 lekë për kilogram. Për dy persona si antipastë, ju sugjeroj rreth 400 gramë, pra afro 4.800 lekë.”

Mysafiri që e merr vesh çmimin në faturë ndihet i mashtruar, edhe nëse çmimi ishte në menu. Mysafiri që e di para porosisë ndihet i respektuar dhe vendos vetë.

Kur kuzhina e peshon, njofto mysafirin nëse pesha ndryshon shumë nga ajo e thënë.`],
["Përmbledhje",`Flower është restoranti ynë i peshkut: mesdhetar bashkëkohor me ndikime aziatike dhe greke. Antipastat ndahen në të gjalla, fruta deti të gatuara, krokante dhe me drithëra. Carpaccio pritet hollë, tartar me thikë në kube. Për pjatat e gjalla pyesim me takt nëse i përshtaten mysafirit. Gocat shiten me copë, me retsina dhe Sigalas. Oktapodi i zi është signature-i. Molusqet dhe krustacet janë dy alergjenë të ndryshëm. Dhe për çdo pjatë me kilogram ose copë, thuajmë peshën dhe çmimin para porosisë.`]
];
LEC.F2=[
["Hyrje: zemra e menusë",`Pas antipastave vijnë pjatat kryesore, pastat, ëmbëlsirat dhe menuja e degustimit. Këtu kamarieri i Flower duhet të jetë këshilltar i vërtetë, sepse mysafiri shpesh nuk e njeh peshkun aq mirë sa mishin. Pyetja “çfarë peshku është ky?” është një nga më të zakonshmet. Ky leksion të jep njohuritë për t'iu përgjigjur me siguri dhe për të rekomanduar sipas shijes së mysafirit.`],
["Njih peshkun, jo vetëm pjatën",`Për të rekomanduar peshk, duhet të dish si është secili peshk, jo vetëm si quhet pjata.

• Levreku, ose sea bass. Mish i bardhë, i ëmbël dhe delikat, me lëkurë që bëhet krokante kur pjeket. Peshku më i njohur dhe më i sigurt për shumicën e mysafirëve.
• Peshku murgu, ose monkfish. Mish i fortë dhe i dendur, shpesh krahasohet me mishin e karavidhes. Pa kocka të vogla, prandaj ideal për mysafirët që kanë frikë nga kockat.
• Merluci, ose hake. Mish i bardhë, i butë, që ndahet në lamela të mëdha. Shije e lehtë.
• Shojza, ose sole. Peshk i sheshtë, shumë delikat dhe i çmuar. Klasiku i kuzhinës franceze me gjalpë.
• Salmoni. Peshk i yndyrshëm, me ngjyrë portokalli, shije e plotë dhe e pasur.
• Sinagrida, ose dentex. Peshk premium i shkëmbinjve të Mesdheut, me mish të fortë dhe shije të pastër.

Kjo të lejon të rekomandosh sipas preferencës: “A preferoni peshk të lehtë dhe delikat, apo me mish më të fortë?” Për të lehtin, levreku ose shojza. Për të fortin, peshku murgu. Për të plotin, salmoni.`],
["Pjatat kryesore",`• Levrek me kore barishtesh, 1.900 lekë. Me pure fasuleje dhe karota ylber. I lehtë, tokësor, i freskët.
• Levrek në tigan me hollandaise, 1.800 lekë. Me angjinare, asparagus, salcë hollandaise dhe flakes bonito. Hollandaise-ja është salcë klasike franceze me gjalpë dhe të verdhë veze. Bonito-ja janë ashkla peshku të tharë japonez që “kërcejnë” nga nxehtësia. I pasur dhe klasik.
• Fileto levreku me taramosalata, 1.850 lekë. Taramosalata është një krem grek me vezë peshku, dhe pesto majdanozi. I kripur dhe mesdhetar.
• Peshk murgu, 1.100 lekë. Me fava, mascarpone, barishte të egra dhe kumquat, një agrum i vogël që hahet me lëkurë.
• Merluc me krem preshi, 1.300 lekë. Me krem preshi të fermentuar, bajame, arra dhe arra pishe. Kujdes me alergjinë ndaj arrave.
• Shojzë, 7.000 lekë për kilogram. Me qepë perla, gjalpë dhe uthull sherry. Klasikja franceze. Thuaj peshën dhe çmimin para porosisë.
• Salmon me glazurë aziatike, 1.700 lekë. Me oriz basmati, perime julienne dhe soje.

Tre levrekë, tri histori. Kur mysafiri thotë “dua levrek”, pyete: “Si e preferoni: më të lehtë me barishte, më të pasur me hollandaise, apo me shije greke me taramosalata?”`],
["Pastat dhe rizotoja",`• Pasta me goca deti, 1.200 lekë. Me fara kopre dhe koriandër. E njëjta logjikë aromatike si gocat.
• Paccheri me peshk murgu, 1.200 lekë. Paccheri janë tuba të mëdhenj pastë nga Napoli. Me shkumë qumështi dhe flakes domateje.
• Pasta me karkaleca dhe vaj açugeje, 1.400 lekë. Me barishte.
• Risoto me trufë, 950 lekë. Me kantarela, një kërpudhë e egër me ngjyrë të artë, dhe crumble wasabi. E vetmja pjatë kryesore vegjetariane e menusë së Flower.

Rizotoja kërkon kohë sepse gatuhet në çast. Thuaje mysafirit kur e porosit.`],
["Sallatat dhe supat",`Sallatat:
• Domate qershi të marinuara, 750 lekë, me rikota dhe stracciatella.
• Sallata Underground, 650 lekë, me perime rrënjë, alabash, karotë, selino rrënjë, me avokado. Emri vjen nga perimet që rriten nën tokë.
• Medley domatesh, 790 lekë, me krem djathi, kore barishtesh dhe speca.
• Sallatë jeshile e përzier, 700 lekë, me kikirikë të pjekur, luleshtrydhe dhe grejpfrut. Kujdes: kikirikët janë alergjen i rëndë.

Supat:
• Supë peshku, 650 lekë, klasike.
• Hithra me trahana, 550 lekë. Trahana është grurë i fermentuar me kos, një produkt tradicional shqiptar. Me hithra. Një pjatë vendase për të treguar.
• Supë sinagride, 1.000 lekë. Supë me sinagridë, peshk premium shkëmbor.`],
["Ëmbëlsirat",`Menuja e ëmbëlsirave të Flower ka nëntë ëmbëlsira. Disa kryesoret:
• Bakllava signature e Genti Malavecit, 650 lekë. Me kadaif dhe fistik të karamelizuar. Interpretim modern i një klasikeje shqiptare. Përmban gluten dhe arra.
• Sufle, 750 lekë. Me akullore, karamel dhe ashkla bajameje. Përgatitet në çast, prandaj porositet që në fillim ose thuhet koha e pritjes.
• Crème brûlée me brioche, 700 lekë. Me pjeshkë dhe akullore.
• Çokollatë Dubai, stili Flower, 600 ose 650 lekë sipas formatit. Me praline fistiku, frymëzuar nga çokollata që u bë fenomen në rrjetet sociale.
• Tortë Cipriani me beze agrumesh, 750 lekë. Me kumquat.
• Cheesecake me kamomil, 650 lekë. Me xhelatinë kamomili. Kujdes: xhelatina zakonisht nuk është vegjetariane.
• Dacquoise, 590 lekë. Bazë beze me lajthi, çokollatë dhe mousse vanilje.
• Biskotë muscovado, 900 lekë, dhe tartë çokollate, 800 lekë.

Kur mysafiri është i ngopur, sugjero diçka të lehtë për ta ndarë, si crème brûlée ose cheesecake. Kur feston, sufle-ja ka teatrin e saj.`],
["Menuja e degustimit",`Menuja e degustimit ka dhjetë servirje për 6.500 lekë për person:
• Pita e shtëpisë me kos aromatik.
• Domate qershi të marinuara.
• Tartar karkalecash.
• Carpaccio peshk murgu.
• Goca deti me retsina.
• Kuskus me sepje.
• Oktapod i zi.
• Pasta me goca deti.
• Merluc me krem preshi.
• Ëmbëlsira e shefit.

Si e shet: “Nëse dëshironi të provoni më të mirën e Flower, kemi menunë e degustimit me dhjetë servirje, nga goca deti te oktapodi ynë i zi, për 6.500 lekë për person. Zgjat rreth dy orë.” Vlera është e qartë: oktapodi i zi vetëm kushton 2.000 lekë.

Kujdes: menuja ka molusqe, krustace, peshk, gluten, qumësht dhe arra. Për mysafirët me alergji, pyet që në fillim dhe konfirmo me kuzhinën çfarë mund të zëvendësohet.

» Skenë nga Flower: Një çift në përvjetor nuk di çfarë të zgjedhë. Kamarieri: “Nëse doni ta lini mbrëmjen në duart e kuzhinës, menuja e degustimit me dhjetë servirje është mënyra më e mirë për të njohur Flower. A keni ndonjë alergji ose diçka që nuk e hani?” Zonja nuk ha goca. Kamarieri e njofton kuzhinën menjëherë dhe sugjeron Riesling Hugel me gotë si çiftim që shoqëron gjithë menunë e detit.`],
["Përmbledhje",`Njih peshkun: levreku i ëmbël dhe delikat, peshku murgu i fortë pa kocka, merluci i butë me lamela, shojza e çmuar me gjalpë, salmoni i yndyrshëm. Tre levrekë: me barishte, me hollandaise, me taramosalata. Shojza me kilogram, me peshë dhe çmim para porosisë. Rizotoja me trufë është e vetmja kryesore vegjetariane. Bakllavaja e Genti Malavecit dhe sufle-ja janë ëmbëlsirat me histori. Menuja e degustimit: dhjetë servirje, 6.500 lekë, me alergjitë të konfirmuara që në fillim.`]
];
LEC.G1=[
["Hyrje: Garden dhe menuja Brutal",`Garden është restoranti ynë i mishit. Menuja e tij quhet “Brutal”, dhe emri e thotë qartë karakterin: e fortë, e drejtpërdrejtë, me zjarr. Kuzhina bazohet te skara Josper, te prerjet premium të mishit, te mishi i gatuar ngadalë dhe te teknikat moderne si kimchi, chimichurri dhe demi-glace.

Përshkrimi i kamarierit të Garden duhet të ketë zjarr, kohë dhe teksturë: “i pjekur në qymyr druri”, “i gatuar ngadalë për orë”, “jashtëzakonisht i butë”. Ky leksion shpjegon skarën Josper, pesë prerjet premium, gradat e pjekjes dhe si merret porosia e mishit me kilogram pa asnjë gabim.`],
["Josper: zemra e Garden",`Josper është një furrë-skarë spanjolle me qymyr druri, e krijuar pranë Barcelonës në fund të viteve 1960. E veçanta e saj është që është e mbyllur. Kombinon nxehtësinë direkte të skarës, me temperatura që kalojnë 300 gradë, me ajrin e nxehtë të mbyllur të një furre.

Çfarë do të thotë kjo për mishin:
• Korja. Nxehtësia e lartë krijon një kore të errët dhe të karamelizuar, me reaksionin Maillard që pamë në Modulin 8.
• Aroma. Qymyri i drurit i jep mishit një aromë të lehtë tymi që nuk mund ta japë një skarë me gaz.
• Lëngu. Sepse furra është e mbyllur dhe gatimi është i shpejtë, mishi mbetet i lëngshëm brenda.

Josper-i përdoret jo vetëm për mishin, por edhe për perimet, si specat e pjekur në Josper dhe angjinaret në Pasta Sunshine.

Kur mysafiri pyet “si gatuhet?”, thuaj: “Në Josper, një skarë me qymyr druri e mbyllur, që i jep mishit kore të errët dhe aromë tymi, por e mban të lëngshëm brenda.”`],
["Pesë prerjet premium",`Garden ka pesë prerje premium, të gjitha me çmim për kilogram.

• Ribeye, 14.000 lekë për kilogram. Prerje nga brinjët, me yndyrë të ndërthurur brenda mishit, që quhet “marbling”. Yndyra shkrihet gjatë pjekjes dhe i jep mishit lëng dhe shije. Është prerja më aromatike dhe më e shijshme për Josper. Rekomandimi: medium-rare.
• Picanha, 9.000 lekë për kilogram. Prerje braziliane nga kofsha e sipërme, me një shtresë yndyre sipër, “kapakun”, që shkrihet në skarë dhe e ushqen mishin. Shije e fortë dhe karakteristike. Në Brazil është prerja kombëtare e churrasco-s.
