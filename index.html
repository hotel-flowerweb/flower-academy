• Tomahawk USA, 12.000 lekë për kilogram. Një ribeye me kockën e gjatë të brinjës, që i ngjan një sëpate, prandaj emri. Prerje spektakël për dy ose më shumë persona. Kur del në tavolinë, të gjithë sytë e sallës kthehen.
• T-Bone, 12.000 lekë për kilogram. Kocka në formë T ndan dy prerje: në njërën anë fileto e butë, në tjetrën sirloin me shije të fortë. Dy përvoja në një copë.
• Wagyu, 50.000 lekë për kilogram. Racë japoneze me marbling ekstrem, ku yndyra është aq e shpërndarë sa mishi ka një teksturë jashtëzakonisht të butë. Është shumë i pasur, prandaj shërbehet në porcione të vogla, rreth 100 deri në 200 gramë.

Si rekomandon sipas mysafirit:
• “Dua më të shijshmen”: ribeye.
• “Jemi dy dhe festojmë”: tomahawk.
• “Dua diçka të ndryshme”: picanha.
• “Nuk di nëse dua fileto apo diçka më të fortë”: T-bone.
• “Dua përvojën më të veçantë”: wagyu, në porcion të vogël.`],
["Gradat e pjekjes në Garden",`Gradat e pjekjes u shpjeguan në Modulin 8. Në Garden, ato janë pyetja më e rëndësishme e porosisë.

• Rare: rreth 50 deri në 52 gradë, qendra e kuqe dhe e ftohtë.
• Medium-rare: rreth 55 deri në 57 gradë, qendra e kuqe e ngrohtë. Rekomandimi i shefit për ribeye, tomahawk dhe picanha, sepse yndyra fillon të shkrihet por mishi mbetet i lëngshëm.
• Medium: rreth 60 deri në 63 gradë, qendra rozë.
• Medium-well: rreth 65 deri në 68 gradë, pak rozë.
• Well done: mbi 70 gradë, pa rozë.

Për wagyu-n, shumë shefa rekomandojnë rare ose medium-rare, sepse yndyra e tij shkrihet shpejt dhe pjekja e tepërt e humbet karakterin.

Kur mysafiri kërkon well done për një prerje premium, respektohet pa gjykim. Mund t'i thuash me mirësjellje: “Shefi zakonisht e rekomandon medium-rare për këtë prerje, por do ta përgatisim siç e dëshironi.” Dhe pastaj përgatitet ashtu.

Konfirmo gjithmonë me ngjyrë: “Medium-rare, pra e kuqe e ngrohtë në qendër?”`],
["Porosia e mishit me kilogram",`Mishi me kilogram është pika ku mund të ndodhin dy gabimet më të rënda në Garden: gabimi në peshë dhe surpriza në faturë. Prandaj ndjekim një protokoll të saktë.

• Pyet për sa persona është dhe sa uri kanë.
• Sugjero peshën. Si udhëzim i përgjithshëm: rreth 300 deri në 400 gramë për person për ribeye dhe picanha, rreth 1 deri në 1,2 kilogramë për tomahawk-un për dy persona, sepse kocka peshon. Wagyu në porcione të vogla.
• Thuaj çmimin e përafërt para porosisë: “Tomahawk-u sonte është rreth 1,2 kilogramë, pra rreth 14.400 lekë, për dy persona.”
• Konfirmo pjekjen me ngjyrë.
• Shëno në POS peshën e kërkuar, pjekjen dhe numrin e personave.
• Kur kuzhina e peshon, nëse pesha është shumë më e madhe se ajo e thënë, njofto mysafirin para se ta pjekë.

Mysafiri nuk duhet të ketë kurrë surprizë në faturë.`],
["Shërbimi i prerjeve premium",`Prerjet premium shërbehen me ceremoninë e tyre.
• Para se mishi të dalë, vendosen thikat e biftekut, të mprehta, dhe pjatat e ngrohta.
• Kripa me kokrra dhe piperi vendosen pa u kërkuar.
• Tomahawk-u dhe prerjet e mëdha për ndarje mund të prezantohen të plota në tavolinë para se të priten, siç shpjegohet në leksionin S4 për guéridon-in.
• Mishi prehet kundër fijeve, në feta të barabarta.
• Pas rreth dy minutash, kontrolli: “A është pjekja sipas dëshirës suaj?”

Çiftimi: një e kuqe e plotë. Me gotë, Primitivo di Manduria Gocce. Me shishe, për tavolinën që feston, Manuali i verës sugjeron opsione si Montes Alpha Cabernet Sauvignon, Brunello Col d'Orcia ose, për rastin e madh, Gaja Barbaresco.

» Skenë nga Garden: Katër miq festojnë. Njëri pyet: “Çfarë është më e mira që keni?” Kamarieri: “Për katër persona që festojnë, do t'ju sugjeroja dy tomahawk, rreth 1,2 kilogramë secili, pra rreth 14.400 lekë secili, të pjekur në Josper. Ose, nëse dëshironi të provoni më shumë, një tomahawk dhe një T-bone për të ndarë, që të keni edhe filetën edhe sirloin-in.” Ata zgjedhin tomahawk dhe T-bone, medium-rare. Kamarieri i prezanton të plotë në dërrasë para se t'i presë.`],
["Përmbledhje",`Garden, me menunë Brutal, është restoranti ynë i mishit. Josper-i është skarë me qymyr druri e mbyllur, mbi 300 gradë, që jep kore, tym dhe lëng. Pesë prerjet: ribeye me marbling, 14.000 për kilogram; picanha me kapak yndyre, 9.000; tomahawk për dy ose më shumë, 12.000; T-bone me dy prerje, 12.000; wagyu me marbling ekstrem, 50.000, në porcione të vogla. Medium-rare është rekomandimi. Pesha dhe çmimi thuhen para porosisë. Dhe mishi shërbehet me thika të mprehta, pjata të ngrohta dhe kontroll pas dy minutash.`]
];
LEC.G2=[
["Hyrje: përtej mishit",`Garden nuk është vetëm prerje premium. Menuja ka antipasta krijuese, sallata, supa, pasta, pjata kryesore të gatuara ngadalë, ëmbëlsira dhe një degustim me nëntë servirje. Te Garden, teknika është historia. Patëllxhani “i gatuar ngadalë”, specat “të pjekur në Josper”, veza “e glazuruar me soje”, qengji “në brumë me palcë”. Kur përmend teknikën para përbërësit, pjata shitet vetë: “speca të pjekur në Josper, me pesto arrash” tingëllon shumë më mirë se “sallatë me speca”.`],
["Antipastat",`• Carpaccio viçi, 1.950 lekë. Pjata signature e antipastave dhe më spektakolarja. Me fruta pasioni, angjinare, crumble trufe dhe një sferë frutash pylli. Ofroje si “pjatë për të filluar me efekt”.
• Tartar viçi me kimchi, 1.450 lekë. Viç i gjallë i prerë me thikë, me salcë kimchi. Kimchi ka zakonisht salcë peshku.
• Tartar wagyu, 1.500 lekë. Wagyu i prerë me thikë, me crumble wasabi.
• Asparagus me foie gras, 1.300 lekë. Me hudhër të egër, spinaq dhe foie gras të karamelizuar. Foie gras është mëlçi e majmur rose ose pate, produkt klasik francez.
• Pulë krokante, 800 lekë. E marinuar në dhallë, me salcë kosi, krem kosi dhe havjar.
• Arancini, 1.100 lekë. Topa orizi të skuqur, tradicionalë sicilianë, me chorizo, kimchi dhe pecorino.
• Brusketë me palcë, 450 lekë. Palcë kockash me gremolata, një përzierje italiane me limon, hudhër dhe majdanoz, dhe pecorino.
• Patëllxhan i gatuar ngadalë, 600 lekë. Me shurup xhenxhefili dhe barishte. Vegjetarian.
• Polentë, 500 lekë. Me majonezë me hudhër të pjekur dhe parmixhan.

Tartaret dhe carpaccio janë mish i gjallë. Pyet me takt si te peshku: shtatzënia, fëmijët e vegjël, imuniteti.`],
["Sallatat dhe supat",`Sallatat:
• Speca të pjekur në Josper, 900 lekë. Me uthull luleshtrydheje, rukola, fasule të bardha, angjinare dhe pesto arrash.
• Domate zemër kau, 1.000 lekë. Me krisur me gjalpë dhe krem djathi vendas. “Zemër kau” është një varietet domateje i madh dhe mishtor.
• Sallatë e përzier me parmixhan, 1.250 lekë. Me avokado, arra dhe soje.
• Avokado me feta, 950 lekë. Me domate të thara.

Supat:
• Trahana me tru qengji, 650 lekë. Trahana tradicionale me tru qengji. Për mysafirin aventurier. Thuaje qartë çfarë ka, pa e fshehur.
• Supë asparagusi, 500 lekë. Krem asparagusi. Vegjetariane.`],
["Pjatat kryesore",`• Qengj në brumë me palcë, 2.200 lekë. Pjata signature e kryesoreve. Me domate të thara, treshe kërpudhash dhe krem pecorino.
• Qengj i gatuar ngadalë, 2.000 lekë. Me qepë të karamelizuara, pure karote të bardhë dhe gjethe kaperi.
• Brinjë qengji me kimchi, 4.000 lekë për kilogram. Me salcë kimchi.
• Short rib me polentë, 2.500 lekë. Me krem patëllxhani, spec të pjekur, krem kosi dhe demi-glace me piper Timur.
• Short rib me lakër të Golemit, 2.000 lekë. Me lakër të egër të Golemit, klorofil barishtesh, marmelatë kumbulle të egër dhe chimichurri, salca argjentinase me majdanoz, hudhër dhe uthull.

Short rib-i është brinja e lopës, një prerje me shumë kolagen që gatuhet ngadalë për orë të tëra derisa bëhet aq e butë sa ndahet me pirun.`],
["Pastat",`• Pasta Sunshine, 1.350 lekë. Me krem cacio e pepe, salca romake me djathë pecorino dhe piper të zi, vezë të glazuruar me soje dhe angjinare në Josper. Vegjetariane.
• Rigatoni me tartar viçi, 1.250 lekë. Me tartar viçi dhe trufë të zezë.
• Pastiço, 1.600 lekë. Versioni ynë i pastiços shqiptare, me viç, sallam artizanal dhe reduksion kockash.
• Pasta me salcë kremoze domateje, 850 lekë. Me erëz Korfuzi. Vegjetariane.

Pastiço është një nga pjatat ku tradita shqiptare takon kuzhinën moderne. Për mysafirin e huaj: “Pastiço is our version of the Albanian baked pasta, with beef, artisanal sausage and a bone reduction.”`],
["Ëmbëlsirat",`• Tiramisu Brutal, 650 lekë. Ëmbëlsira signature e Garden, me ganache karameli dhe ashkla bajameje. Emri lidhet me menunë Brutal.
• Bakllava me fistik, 700 lekë. Me akullore me tonka, një farë aromatike me aroma vaniljeje dhe bajameje.
• Revani me mastikë, 700 lekë. Revani është ëmbëlsirë tradicionale e Ballkanit me bollgur dhe shurup. Mastika është rrëshirë aromatike nga ishulli grek Kios. Me krem fruta pasioni dhe fletë ari.
• Cheesecake kremoz me liçi, 800 lekë.
• Semifreddo vanilje, 750 lekë. Me ftua të karamelizuar dhe çips fruta pasioni.
• Tarta de queso, 500 lekë. Cheesecake baske e pjekur në temperaturë të lartë, me sipërfaqe të djegur dhe brendësi kremoze. Nga San Sebastián.
• Tartë frutash pylli, 650 lekë. Me çokollatë të bardhë, karamel dhe fistik.`],
["Degustimi i Garden",`Degustimi ka nëntë servirje për 6.500 lekë për mysafir:
• Domate zemër kau.
• Tartar wagyu.
• Brusketë me palcë.
• Carpaccio viçi.
• Asparagus me foie gras.
• Patëllxhan i gatuar ngadalë.
• Pasta Sunshine.
• Qengj i gatuar ngadalë.
• Revani me mastikë.

Si e shet: “Degustimi ynë me nëntë servirje ju çon nga tartari i wagyu-t te qengji i gatuar ngadalë, me carpaccio-n tonë të viçit dhe foie gras në mes, për 6.500 lekë për person.” Vlera është e qartë: carpaccio i viçit vetëm kushton 1.950 lekë.

Kujdes me alergjitë dhe me kufizimet: degustimi ka mish të gjallë, foie gras, gluten, qumësht dhe vezë. Pyet që në fillim.

» Skenë nga Garden: Një mysafir i huaj thotë: “I want to try something local.” Kamarieri: “Then I'd suggest the pastiço, our version of a traditional Albanian baked pasta, and for dessert the revani, a Balkan semolina cake, ours with mastic and passion fruit. If you're adventurous, we also have trahana, a traditional fermented grain soup, with lamb brain.” Mysafiri qesh dhe zgjedh pastiço-n dhe revani-n.`],
["Përmbledhje",`Te Garden, teknika është historia: përmend Josper-in, gatimin e ngadaltë dhe glazurën para përbërësit. Carpaccio i viçit është antipasta signature, qengji në brumë me palcë kryesorja signature, tiramisu Brutal ëmbëlsira signature. Tartaret dhe carpaccio janë mish i gjallë. Pastiço, trahana dhe revani janë tradita e rishpikur. Degustimi ka nëntë servirje për 6.500 lekë, me alergjitë të pyetura që në fillim.`]
];
LEC.F3=[
["Hyrje: alergjitë në menutë tona",`Moduli 8 shpjegoi 14 alergjenët e BE-së dhe protokollin e përgjithshëm. Ky leksion e zbaton në menutë konkrete të Flower dhe Garden. Qëllimi është që kamarieri të dijë menjëherë, pa kërkuar, cilat pjata kanë rrezik për alergjitë më të shpeshta, dhe ku fshihen alergjenët që një kamarier i papërgatitur nuk i sheh.

Një paralajmërim i rëndësishëm që në fillim: lista e alergjenëve në këtë platformë është nxjerrë nga përbërësit e shkruar në menu, jo nga recetat e plota të kuzhinës. Prandaj është një mjet ndihme, jo një garanci. Rregulli mbetet gjithmonë: “Më lejoni ta konfirmoj me kuzhinën.”`],
["Alergjenët e fshehur në menutë tona",`Disa përbërës në menutë tona kanë alergjenë që nuk duken nga emri:
• Kimchi. Në midhjet me kimchi, tartarin e viçit, arancini dhe brinjët e qengjit. Kimchi zakonisht përgatitet me salcë peshku dhe ndonjëherë me karkaleca të kripura. Pra mund të ketë peshk dhe krustace edhe në një pjatë mishi.
• Salca e sojës. Në oktapodin e zi, salmonin, sallatën me parmixhan, Pasta Sunshine, tartarin e viçit. Ka sojë, dhe shumica e salcave të sojës kanë edhe gluten nga gruri.
• Kadaifi. Në bakllavanë e Genti Malavecit dhe në çokollatën Dubai. Është brumë gruri: gluten.
• Pesto. Në fileton e levrekut me taramosalata dhe në specat e pjekur në Josper. Pesto mund të ketë arra, arra pishe ose djathë.
• Taramosalata. Ka vezë peshku dhe shpesh bukë: peshk dhe gluten.
• Majoneza. Në polentë. Ka vezë.
• Crumble-t. Crumble wasabi, crumble domateje, crumble trufe. Zakonisht kanë miell: gluten.
• Uthulla dhe vera. Në shojzë me uthull sherry, në goca me retsina dhe Sigalas: sulfite.
• Xhelatina. Në cheesecake me kamomil. Zakonisht me origjinë shtazore, jo për vegjetarianët strikt.
• Hollandaise. Ka vezë dhe gjalpë.
• Bonito flakes. Peshk i tharë, në levrekun me hollandaise.
• Havjari. Në pulën krokante: peshk.

Këto janë pikërisht pyetjet ku kamarieri i papërgatitur gabon. Mësoji përmendsh.`],
["Krustace kundër molusqe",`Në listën e BE-së, krustacet dhe molusqet janë dy alergjenë të ndryshëm, dhe një mysafir mund të jetë alergjik ndaj njërit dhe jo ndaj tjetrit.
• Krustace: karkaleca, langustinë, karavidhe, gaforre, omar.
• Molusqe: midhje, goca deti, oktapod, sepje, kallamar, kërmij.

Në Flower, pothuajse çdo pjatë ka peshk, krustace ose molusqe. Oktapodi i zi ka edhe molusqe, sepse është oktapod, edhe krustace, sepse ka karkalec. Kuskus me sepje ka molusqe. Mysafiri me alergji ndaj frutave të detit ka nevojë për një listë të saktë, jo për “shumica janë peshk”.

Kur mysafiri thotë “jam alergjik ndaj frutave të detit”, pyet: “Ndaj krustaceve si karkalecat, ndaj molusqeve si midhjet dhe oktapodi, apo ndaj të dyjave? Dhe ndaj peshkut?”`],
["Gjashtë alergjitë më të shpeshta",`• Gluteni. Pothuajse të gjitha pastat, bukët, brusketat, crumble-t, kadaifi, ëmbëlsirat me brumë, salca e sojës. Opsione pa gluten natyrisht: shumë pjata mishi të Garden, si prerjet premium, por gjithmonë konfirmo garniturat.
• Qumështi. Gjalpi, kremi, djathrat, mascarpone, stracciatella, rikota, Philadelphia, pecorino, parmixhani, kosi, hollandaise, shumica e ëmbëlsirave.
• Vezët. Majoneza, hollandaise, pasta e freskët, shumica e ëmbëlsirave, veza e glazuruar në Pasta Sunshine, arancini.
• Arrat. Merluci me krem preshi, fileto levreku me pesto, kuskus me sepje me bajame, specat me pesto arrash, sallata me parmixhan, bakllavatë, dacquoise, çokollata Dubai, sufle, tiramisu Brutal, tartë frutash pylli. Kujdes: fistiku dhe bajamet janë arra.
• Kikirikët. Sallata jeshile e përzier në Flower ka kikirikë të pjekur. Kikiriku është alergjen i veçantë dhe shpesh shumë i rëndë.
• Peshku dhe frutat e detit. Gjithë Flower, plus kimchi dhe havjari në Garden.

Faqja Menutë tona ka filtrin që përjashton pjatat me një alergjen të caktuar. Përdore për t'u përgatitur, por konfirmo gjithmonë me kuzhinën.`],
["Mysafirët vegjetarianë dhe veganë",`Pjatat e shënuara si vegjetariane në menutë tona:
• Flower: domate qershi të marinuara, sallata Underground, medley domatesh, sallatë jeshile e përzier, hithra me trahana, risoto me trufë.
• Garden: patëllxhan i gatuar ngadalë, polentë, speca të pjekur në Josper, domate zemër kau, sallatë e përzier me parmixhan, avokado me feta, supë asparagusi, Pasta Sunshine, pasta me salcë kremoze domateje.

Kujdes:
• Vegjetariane nuk do të thotë vegane. Shumica kanë qumësht, djathë ose vezë.
• Parmixhani tradicional bëhet me enzima shtazore.
• Rizotoja mund të gatuhet me lëng mishi ose pule: konfirmo me kuzhinën.
• Patëllxhani i gatuar ngadalë dhe sallata Underground janë ndër më të afërtat me vegane, por konfirmo gjithmonë.`],
["Fjalia që mbron",`Ka një fjali që e përdorim çdo herë kur nuk jemi njëqind për qind të sigurt: “Më lejoni ta konfirmoj me kuzhinën.”

Ka disa fjali që nuk i përdorim kurrë:
• “Nuk besoj që ka.”
• “Mendoj se jo.”
• “Pak nuk bën dëm.”
• “Zakonisht nuk ka.”

Arsyeja është e thjeshtë. Recetat ndryshojnë, kuzhinierët zëvendësojnë përbërës, furnitorët ndryshojnë produktet. Vetëm kuzhina e di me siguri çfarë ka në pjatë sonte.

» Skenë nga Flower: Një mysafire thotë që është alergjike ndaj arrave dhe dëshiron levrek. Kamarieri e di që fileto levreku me taramosalata ka pesto, që mund të ketë arra, ndërsa levreku me kore barishtesh nuk ka arra në listë, por ka gluten në kore. “Ju sugjeroj levrekun me kore barishtesh. Nuk ka arra në përbërës, por më lejoni ta konfirmoj me kuzhinën edhe për kontaminimin.” E shënon në POS “ALERGJI: ARRA”, njofton shefin e turnit me gojë dhe kthehet pas një minute me konfirmimin. Për ëmbëlsirën, e di që bakllavaja, dacquoise, çokollata Dubai dhe sufle-ja kanë arra, dhe i sugjeron crème brûlée-në, pas konfirmimit.`],
["Përmbledhje",`Lista e alergjenëve në platformë vjen nga përbërësit e menusë, jo nga recetat, prandaj çdo gjë konfirmohet me kuzhinën. Alergjenët e fshehur në menutë tona: kimchi me peshk, soja me gluten, kadaifi me gluten, pesto me arra, taramosalata, majoneza, crumble-t, xhelatina, bonito, havjari. Krustacet dhe molusqet janë dy alergjenë të ndryshëm, dhe oktapodi i zi ka të dyja. Arrat janë kudo në ëmbëlsira. Kikirikët janë te sallata jeshile e Flower. Dhe fjalia që mbron: “Më lejoni ta konfirmoj me kuzhinën.”`]
];
LEC.F4=[
["Hyrje: një bibliotekë me 123 etiketa",`Lista e verërave të Flower ka 123 etiketa, nga një Malvasia me gotë për 600 lekë te një Gaja Barbaresco për 35.000 lekë. Për kamarierin e ri, kjo listë mund të duket e pamundur për t'u mësuar. Por kur e kupton strukturën e saj, ku janë pikat e forta dhe cilat janë verërat që shiten më shumë, ajo bëhet mjeti më i fuqishëm për të rritur përvojën dhe vlerën e çdo tavoline.

Ky leksion shpjegon si është ndërtuar lista, verërat me gotë, shishet e vogla, seleksionin shqiptar, nivelet e çmimit dhe si e përdorim për çiftimin me menutë tona. Manuali i verës në platformë ka fishën e çdo vere, me rajonin, rrushin, stilin, aromat dhe një fakt për ta treguar.`],
["Struktura e listës",`Lista ka shtatë seksione:
• Me gotë: katër verëra, dy të bardha dhe dy të kuqe.
• Shampanjë dhe shkumëzuese: shtatë, nga Prosecco Col Mesian për 3.000 lekë te Moët Ice Impérial për 20.000.
• Të bardha: 39 verëra, nga 2.500 deri në 33.000 lekë.
• Rozé: katër, nga 3.000 deri në 7.000 lekë.
• Të kuqe: 55 verëra, nga 2.000 deri në 35.000 lekë.
• Seleksioni shqiptar: nëntë verëra nga Tufa, Duka dhe Andurem, nga 2.000 deri në 6.000 lekë.
• Shishe të vogla 0,375 litra: pesë, nga 1.500 deri në 7.000 lekë.

Brenda çdo seksioni, rendi është alfabetik, jo sipas çmimit. Kjo do të thotë që mysafiri nuk e sheh menjëherë ku janë verërat e shtrenjta dhe ku të lirat, dhe kamarieri duhet t'i dijë nivelet përmendsh për të ndihmuar.`],
["Pikat e forta: Franca dhe Italia",`Lista është veçanërisht e fortë në dy vende.

Franca:
• Të bardhat e Chablis dhe Burgundy, nga Petit Chablis te Grand Cru Les Clos i Domaine William Fèvre, dhe emra si Meursault, Montrachet dhe Pouilly-Fuissé. Chablis është Chardonnay pa dru, mineral dhe i freskët, perfekt me peshkun e Flower.
• Të kuqet e Burgundy-së, si Nuits-Saint-Georges i Louis Jadot.
• Rhône: Châteauneuf-du-Pape dhe Côte-Rôtie.
• Bordeaux: Pomerol, si Château Nénin, dhe Saint-Julien.
• Provence: rozetë e Château Roubine, Inspire dhe Lion & Dragon.
• Champagne: Moët & Chandon dhe Gosset.

Italia:
• Piemonte: Barolo dhe Barbaresco, përfshirë Gaja-n, një nga prodhuesit më të famshëm të Italisë.
• Toskana: Brunello di Montalcino i Col d'Orcia.
• Veneto: Amarone.
• Puglia: shumë Primitivo, si ato të Feudi Salentini.
• Alto Adige: Tramin, me Gewürztraminer-in Nussbaumer, Chardonnay dhe Pinot Noir Maglen.
• Lombardia: Franciacorta dhe Lugana e Ca' dei Frati.

Bota e Re është e përfaqësuar nga Kili, me Montes, dhe Argjentina, me Trapiche. Greqia ka Sigalas nga Santorini, një Assyrtiko i kripur dhe mineral që përdoret edhe në vetë pjatën e gocave.`],
["Verërat me gotë",`Katër verërat me gotë janë ato që shiten më shumë dhe që çdo kamarier duhet t'i dijë përmendsh:
• Malvasia del Salento, 600 lekë. E bardhë aromatike nga Puglia, me lule të bardha, pjeshkë dhe pak bajame. E lehtë dhe e butë. Vera më e lirë me gotë, ideale si aperitiv.
• Riesling Hugel, 1.000 lekë. E bardhë nga Alsace, me lime, mollë jeshile dhe gur të lagur. E thatë, me aciditet të fortë. Hugel është në Riquewihr që nga viti 1639. Është vera më e gjithanshme e listës për peshkun e Flower.
• Primitivo di Manduria Gocce, 1.000 lekë. E kuqe e plotë nga Puglia, nga Feudi Salentini, me kumbulla, qershi të pjekura, çokollatë dhe pak vanilje. E butë dhe e ngrohtë. Primitivo është i njëjti rrush me Zinfandel-in kalifornian.
• Trapiche Impure Malbec, 600 lekë. E kuqe me trup mesatar nga Mendoza, Argjentinë, me fruta të zeza dhe vjollcë. E butë dhe e lehtë për t'u pirë.

Kur ofron verë me gotë, ofro dy opsione nga stile të ndryshme: “Për të filluar, një Riesling Hugel, e thatë dhe minerale, ose Malvasia, më e butë dhe aromatike?”`],
["Shishet e vogla",`Shishet e vogla prej 0,375 litra janë gjysma e një shisheje normale, rreth dy deri në tri gota. Janë një zgjidhje e shkëlqyer për disa situata:
• Çifti ku njëri dëshiron të bardhë dhe tjetri të kuqe.
• Mysafiri që darkon vetëm dhe dëshiron më shumë se një gotë, por jo një shishe të plotë.
• Tavolina që dëshiron dy verëra të ndryshme për pjata të ndryshme.
• Mysafiri që dëshiron të provojë një verë të madhe pa paguar shishen e plotë, si Barolo Batasiolo për 7.000 ose Brunello Col d'Orcia për 4.500.

Lista ka: Riesling Hugel, Sauvignon, Primitivo Gocce, Barolo Batasiolo dhe Brunello Col d'Orcia, të gjitha në 0,375 litra.`],
["Seleksioni shqiptar",`Seleksioni shqiptar ka nëntë verëra nga tri kantina:
• Tufa nga Tirana: Tufa e Bardhë, Tufa Sheshi i Bardhë, Tufa e Kuqe, Tufa Sheshi i Zi.
• Duka nga Durrësi: Duka Sheshi i Bardhë, Duka Cabernet, Duka Riserva 2019.
• Andurem: Merlot dhe Riserva.

Mysafiri i huaj shpesh dëshiron të provojë diçka vendase. Ofroje me krenari: “Shesh i Bardhë është rrushi autokton i Shqipërisë së mesme, nuk rritet askund tjetër.” Çiftimet e sugjeruara: Shesh i Bardhë me peshkun, Shesh i Zi me supën e peshkut, oktapodin ose qengjin.

Disa nga verërat e listës janë shënuar në Manualin e verës me “Konfirmo me sommelier-in”, sepse prodhuesi ose stili nuk u konfirmua plotësisht. Për këto, mos jep detaje që nuk i di me siguri.`],
["Nivelet e çmimit dhe çiftimi",`Kamarieri duhet të dijë të ofrojë verë në tri nivele çmimi, që mysafiri të zgjedhë pa u ndjerë i shtyrë. Për çdo pjatë kryesore të Flower dhe Garden, Manuali i verës ka një sugjerim me gotë dhe tri sugjerime me shishe: vlerë, mesatare dhe premium.

Shembuj nga Flower:
• Goca deti: me gotë Riesling Hugel; me shishe Pecorino Nerube, Sigalas, ose Chablis Grand Cru Les Clos i Fèvre-it.
• Levrek me kore barishtesh: me gotë Malvasia; me shishe Tramin Chardonnay, Chablis William Fèvre, ose Chablis Premier Cru Vaillons.
• Shojzë: me gotë Riesling; me shishe Chardonnay Livon, Chablis Premier Cru, ose Meursault.
• Oktapod i zi: me gotë Riesling; me shishe Gewürztraminer Hugel, Geheimrat J Riesling, ose Nussbaumer.

Shembuj nga Garden:
• Tomahawk: me gotë Primitivo Gocce; me shishe Montes Alpha Cabernet Sauvignon, Brunello Col d'Orcia, ose Gaja Barbaresco.
• Qengj i gatuar ngadalë: me gotë Malbec; me shishe Tufa Sheshi i Zi, Châteauneuf-du-Pape 2018, ose Côte-Rôtie.

Teknika e ofrimit: fillo nga niveli mesatar, jo nga më i shtrenjti. “Me shojzën ju sugjeroj një Chablis Premier Cru, klasiku francez. Nëse dëshironi diçka më të thjeshtë, Chardonnay i Livon-it është shumë i mirë, dhe për një rast të veçantë, Meursault-i është i jashtëzakonshëm.”

» Skenë nga Flower: Një çift porosit gocat dhe shojzën. Kamarieri: “Me gocat, Sigalas nga Santorini është çiftimi perfekt, sepse e përdorim edhe në vetë pjatën. Dhe nëse dëshironi një verë për të gjithë darkën, një Chablis Premier Cru shkon me të dyja.” Ata zgjedhin Chablis-in.`],
["Përmbledhje",`Lista ka 123 etiketa në shtatë seksione, me rend alfabetik. Pikat e forta: Chablis dhe Burgundy, Piemonte, Toskana, Puglia, Alto Adige, Rhône dhe Provence. Katër me gotë: Malvasia dhe Malbec 600 lekë, Riesling Hugel dhe Primitivo Gocce 1.000. Pesë shishe të vogla për çiftet dhe mysafirët vetëm. Nëntë verëra shqiptare nga Tufa, Duka dhe Andurem. Dhe çdo pjatë ka një çiftim me gotë dhe tri me shishe; ofro duke filluar nga niveli mesatar.`]
];
LEC.F5=[
["Hyrje: nga 123 verëra në 8 stile",`Askush nuk mban mend 123 verëra përnjëherë. Por çdo verë e listës i përket një nga tetë stileve, dhe kur e di stilin, di shumë gjëra njëherësh: temperaturën e shërbimit, gotën, nëse duhet dekantuar dhe me çfarë pjatash shkon. Fillo nga stili, pastaj mëso emrat.

Ky leksion shpjegon tetë stilet e Manualit të verës, temperaturat, gotat dhe si e përdorim manualin në punën e përditshme.`],
["Tetë stilet",`• Shkumëzuese. Shampanjë, Franciacorta, Prosecco. E lehtë, me flluska dhe aciditet të lartë. Shembuj: Moët & Chandon Impérial, Gosset, Col Mesian.
• E bardhë, e freskët dhe minerale. Trup i lehtë deri mesatar, aciditet i lartë, pa dru. Chablis, Sigalas, Tramin Chardonnay, Shesh i Bardhë.
• E bardhë aromatike. Aroma të forta lulesh dhe frutash. Riesling, Gewürztraminer, Malvasia, Müller-Thurgau.
• E bardhë e plotë, me dru. Trup i plotë, teksturë kremoze, aroma gjalpi, vanilje dhe frutash të verdha. Meursault, Montrachet, Tramin Stoan.
• Rozé. E freskët, me fruta të kuqe të lehta. Rozetë e Château Roubine, Ca' Maiol, Ca' dei Frati.
• E kuqe e lehtë dhe elegante. Trup i lehtë, tanine të buta, aciditet. Pinot Noir: Nuits-Saint-Georges, Maglen.
• E kuqe me trup mesatar. Ekuilibër midis frutës dhe strukturës. Malbec, Merlot, Carmenère, Côtes du Rhône si Setier Côtes.
• E kuqe e plotë dhe e strukturuar. Trup i plotë, tanine të forta ose fruta të pjekura, alkool më i lartë. Barolo, Brunello, Châteauneuf-du-Pape, Primitivo, Cabernet Sauvignon, Duka Riserva.

Për çdo stil, Manuali i verës tregon pjatat e Flower dhe të Garden me të cilat shkon dhe pse.`],
["Temperatura ndryshon shijen",`Temperatura nuk është detaj. Një e bardhë shumë e ftohtë humbet aromat, sepse të ftohtit i “mbyll”. Një e kuqe e ngrohtë, mbi 20 gradë, duket alkoolike, e rëndë dhe pa freski.

Temperaturat e Manualit:
• Shkumëzueset: 6 deri në 8 gradë.
• Të bardhat e freskëta, aromatike dhe rozetë: 8 deri në 10 gradë.
• Të bardhat e plota me dru: 10 deri në 12 gradë.
• Të kuqet e lehta: 14 deri në 16 gradë.
• Të kuqet mesatare: rreth 16 gradë.
• Të kuqet e plota: 16 deri në 18 gradë.

“Temperatura e dhomës” që përmendin librat e vjetër është 16 deri në 18 gradë, temperatura e kështjellave franceze në shekujt e kaluar. Nuk është 25 gradë e një salle në verë. Prandaj të kuqet tona ruhen në frigorifer vere ose në vend të freskët, dhe në verë mund të duhen disa minuta në kovë me ujë dhe akull para shërbimit.`],
["Gota është pjesë e verës",`Gota e duhur i lejon verës të shprehë aromat dhe ta drejtojë në pjesën e duhur të gojës.
• Flute ose gotë e bardhë tulipan për shkumëzueset. Flute mban flluskat më gjatë. Tulipani lejon më shumë aromë, dhe shumë sommelier-ë sot e preferojnë për shampanjat e mira.
• Gotë e bardhë standarde për të bardhat e freskëta, aromatike dhe rozetë. Më e vogël, që vera të mbetet e ftohtë.
• Gotë e madhe Burgundy për të bardhat e plota, që aromat komplekse të kenë vend.
• Gotë Burgundy, me kupë të gjerë, për të kuqet e lehta si Pinot Noir dhe për Nebbiolo. Kupa e gjerë mbledh aromat delikate.
• Gotë Bordeaux, e lartë, për të kuqet mesatare dhe të plota. Drejton verën në mes të gjuhës dhe zbut taninet.

Skema e gotave në Modulin 4 i tregon vizualisht.`],
["Dekantimi sipas stilit",`Manuali tregon për çdo stil nëse vera dekantohet:
• Shkumëzueset, të bardhat e freskëta, aromatiket dhe rozetë: jo.
• Të bardhat e plota me dru: ndonjëherë, rreth 15 minuta, që të hapen.
• Të kuqet e lehta: jo, mjafton gota, sepse aromat delikate mund të humbasin.
• Të kuqet mesatare: opsionale, 20 deri në 30 minuta.
• Të kuqet e plota dhe të reja, si një Barolo ose një Châteauneuf i ri: po, për ajrosje, rreth 30 deri në 60 minuta para.
• Të kuqet e vjetra me sediment: po, me kujdes, për të ndarë sedimentin, siç shpjegohet në leksionin V3.

Gjithmonë pyet mysafirin para se të dekantosh.`],
["Si ta përdorësh manualin në punë",`Manuali i verës ka disa faqe që përdoren në situata të ndryshme:
• Hyrja: si është ndërtuar lista dhe si të mendosh.
• Stilet: tetë stilet me temperaturën, gotën, dekantimin dhe pjatat.
• Fishat: çdo verë e listës, me filtër sipas stilit dhe çmimit, me aromat dhe një fakt për ta treguar.
• Çiftimet: për çdo pjatë, një verë me gotë dhe tri me shishe.
• Rajonet: rajonet e verës të përfaqësuara në listë, me rrushet dhe karakterin e tyre.
• Shqiptimi: si shqiptohen emrat francezë dhe italianë, si Chablis, Meursault, Châteauneuf-du-Pape.

Si ta përdorësh:
• Para turnit: zgjidh pesë verëra që nuk i njeh dhe lexo fishat e tyre.
• Para se të shkosh te një tavolinë që ka porositur pjatat: kontrollo çiftimet.
• Kur mysafiri pyet për një verë që nuk e njeh: mos shpik. “Më lejoni ta kontrolloj”, kontrollo fishën ose pyet sommelier-in.
• Për verërat e shënuara “Konfirmo me sommelier-in”: jep vetëm informacionin e sigurt.

» Skenë nga Flower: Mysafiri pyet për “Côte-Rôtie”. Kamarieri nuk e ka provuar kurrë, por e di stilin: e kuqe e plotë nga Rhône veriore. “Është një Syrah nga Rhône veriore, nga terraca shumë të pjerrëta. E plotë dhe elegante, me piper të zi, vjollca dhe fruta të errëta. Shërbehet rreth 16 deri në 18 gradë dhe e dekantojmë pak që të hapet.” Pastaj kontrollon shpejt fishën në stacion për të shtuar emrin e prodhuesit.`],
["Përmbledhje",`Tetë stilet: shkumëzuese, e bardhë minerale, e bardhë aromatike, e bardhë e plotë, rozé, e kuqe e lehtë, e kuqe mesatare, e kuqe e plotë. Kur e di stilin, di temperaturën, gotën, dekantimin dhe çiftimin. Temperaturat nga 6 gradë për flluskat te 18 për të kuqet e plota. Gotë Burgundy për Pinot dhe Nebbiolo, Bordeaux për të kuqet e plota. Dekantohen të kuqet e plota dhe të reja, dhe të vjetrat me sediment. Dhe manuali përdoret para turnit, para tavolinës dhe sa herë nuk e di përgjigjen.`]
];
LEC.C1=[
["Hyrje: kokteili si pjesë e darkës",`Shumë kamarierë e mendojnë kokteilin si punë të barit. Por mysafiri e porosit kokteilin te kamarieri, dhe kamarieri është ai që e sugjeron, e përshkruan dhe e shërben. Një kokteil i sugjeruar mirë në fillim të darkës krijon atmosferën, dhe një kokteil i sugjeruar pas darkës mund ta zgjasë mbrëmjen.

Ky leksion shpjegon menunë e kokteileve, katër krijimet e shtëpisë, klasikët dhe historitë e tyre, si sugjerohet sipas momentit dhe shijes, teknikat e barit që duhet t'i kuptojë kamarieri dhe alergjenët.`],
["Struktura e menusë",`Menuja e kokteileve ka katër grupe:
• Premium: katër krijime të shtëpisë. Clover Kiss 950, Mint Fizz 900, Old Father 1.100, Don Amaretto 1.000.
• Klasikë: Negroni, Espresso Martini, Vodka Sour, Whiskey Sour, të gjithë 800.
• Long drinks dhe spritz: Aperol Spritz dhe Hugo Spritz 700, Sunrise dhe Rose Colada 800.
• Mocktail pa alkool, 600.

Çmimet janë të ngjashme, prandaj kamarieri nuk ka pse të ketë frikë të sugjerojë një premium. Diferenca midis një klasiku dhe një krijimi të shtëpisë është 100 deri në 300 lekë, por përvoja është krejt tjetër.`],
["Katër krijimet e shtëpisë",`Clover Kiss, 950 lekë. Xhin, mjedër dhe lëng limoni. Tundet me akull (shake), kullohet dy herë (double strain) dhe shërbehet në gotë coupe të ftohur, me një mjedër ose petal luleje. I freskët, frutor dhe pak i thartë. Është frymëzuar nga Clover Club, një klasik i Filadelfias nga rreth viti 1900. Është aperitivi perfekt.

Mint Fizz, 900 lekë. Vodka, kastravec, mente, lime, ujë tonik dhe shurup agave. Kastraveci dhe menta shtypen (muddle), pastaj pija mbushet me tonik. Shërbehet në highball me akull, me një rrip kastraveci dhe degë mente. Shumë i freskët dhe i lehtë, ideal për ditët e nxehta dhe për pishinën.

Old Father, 1.100 lekë. Tekila, Aperol, amaretto, vanilje dhe limon. Tundet me akull dhe shërbehet në gotë rocks mbi një kub të madh, me lëkurë portokalli. Hidhur-ëmbël, me bajame dhe agrume. Është kokteili firmato i Flower, i krijuar në shtëpi, që përfaqëson trashëgiminë dhe shpirtin vizionar të një babai. Tregoje me krenari si krijimin tonë. Është më i përshtatshëm pas darkës.

Don Amaretto, 1.000 lekë. Rum Don Papa, amaretto, lëng limoni dhe shurup vanilje. Tundet dhe shërbehet në rocks mbi akull. I butë dhe i ëmbël, me bajame dhe vanilje. Është një version i Amaretto Sour me Don Papa, një rum nga ishulli Negros në Filipine, i plakur në dru. Digjestiv i shkëlqyer.`],
["Klasikët dhe historitë e tyre",`Çdo klasik ka një histori që mund ta tregosh shkurt:
• Negroni: xhin, vermut i ëmbël dhe Campari, nga 3 cl secili. Trazohet (stir) me akull dhe shërbehet mbi një kub të madh, me lëkurë portokalli. Firence, 1919: konti Camillo Negroni i kërkoi barmenit Americano-n e tij me xhin në vend të sodës.
• Espresso Martini: 5 cl vodka, 3 cl liker kafeje dhe një espresso të freskët. Tundet fort për shkumën dhe shërbehet në coupe të ftohur me tri kokrra kafeje. E krijoi Dick Bradsell në Londër në vitet 1980. Tri kokrrat simbolizojnë shëndetin, pasurinë dhe lumturinë.
• Vodka Sour: vodka, shurup fruta pasioni, limon dhe magic foamer. Fillimisht tundet pa akull (dry shake) për shkumën, pastaj me akull.
• Whiskey Sour: bourbon, shurup kallami, limon dhe magic foamer. Recetat e para të shkruara janë nga Jerry Thomas në 1862.
• Aperol Spritz: rregulli 3-2-1, 9 cl prosecco, 6 cl Aperol, 3 cl sodë, në gotë të madhe vere me akull dhe fetë portokalli. Aperol lindi në Padova në 1919.
• Hugo Spritz: lule shtogu, prosecco, limon dhe mente. U krijua në 2005 nga barmeni Roland Gruber në Alto Adige.
• Sunrise: 4,5 cl tekila, 9 cl lëng portokalli dhe 1,5 cl grenadine që derdhet ngadalë për të rënë në fund dhe krijuar “lindjen e diellit”. U bë i famshëm kur The Rolling Stones e pinin gjatë turneut të 1972.
• Rose Colada: ananas i freskët, rum, kokos, shurup frutash pylli dhe limon. Një version i Piña Colada-s, që lindi në Puerto Rico në vitet 1950.`],
["Sugjero sipas momentit",`Momenti i darkës përcakton kokteilin:
• Para darkës, si aperitiv: Clover Kiss, Aperol Spritz, Hugo, Negroni, Mint Fizz. Janë të freskëta, të thara ose hidhur-ëmbla, dhe hapin oreksin.
• Pas darkës, si digjestiv: Old Father, Don Amaretto, Espresso Martini, Whiskey Sour. Janë më të plota, më të ëmbla ose me kafe.
• Pishina dhe dita e nxehtë: Mint Fizz, Rose Colada, Sunrise, Hugo.

Pse jo kokteile të ëmbla para darkës? Sheqeri dhe kremi e mbyllin oreksin. Një Rose Colada para një menuje degustimi me dhjetë servirje nuk është ideja më e mirë. Pyet thjesht: “Dëshironi diçka për të filluar?”`],
["Sugjero sipas shijes",`Kur mysafiri nuk di çfarë dëshiron, pyet për shijen: “Preferoni diçka të freskët, të ëmbël apo më të fortë dhe të hidhur?”
• I freskët: Mint Fizz, Hugo, Clover Kiss.
• I ëmbël dhe frutor: Rose Colada, Sunrise, Vodka Sour, Don Amaretto.
• I fortë dhe i hidhur: Negroni, Old Father.
• Me kafe: Espresso Martini.

Pastaj përshkruaje me tri fjalë shije dhe një detaj: “Clover Kiss është i freskët, frutor dhe pak i thartë, me xhin dhe mjedër. Shërbehet në coupe të ftohur.”

» Skenë nga Flower: Një çift ulet në tetë të mbrëmjes. Kamarieri: “Për të filluar, mund t'ju sugjeroj Clover Kiss, me xhin, mjedër dhe limon, i freskët dhe i lehtë, ose një Aperol Spritz klasik.” Ajo zgjedh Clover Kiss, ai një Negroni. Pas ëmbëlsirës, kamarieri kthehet: “Për të mbyllur, Old Father është krijimi ynë, me tekila, Aperol dhe amaretto. Ka bajame, a keni ndonjë alergji?”`],
["Teknikat e barit që duhet t'i kuptosh",`Kamarieri nuk e bën kokteilin, por duhet ta kuptojë, për ta përshkruar dhe për t'iu përgjigjur mysafirit:
• Shake: tundet fort me akull. Përdoret kur ka agrume, shurup ose shkumë: sour-et, Clover Kiss, Espresso Martini. E ftoh, e hollon dhe e ajros pijen.
• Stir: trazohet me lugë me akull. Përdoret kur ka vetëm alkoole: Negroni. Pija mbetet e qartë dhe e mëndafshtë.
• Build: ndërtohet drejt në gotë: spritz-et, Sunrise.
• Muddle: shtypen frutat ose barishtet në fund të gotës: Mint Fizz.
• Dry shake: tundet pa akull, për të krijuar shkumë: sour-et.
• Double strain: kullohet dy herë që të mos kalojnë copëza akulli ose frutash: Clover Kiss.

Gota dhe akulli:
• Coupe: Clover Kiss, Espresso Martini. Ftohet paraprakisht.
• Rocks me kub të madh: Negroni, Old Father. Kubi i madh shkrihet ngadalë dhe nuk e hollon pijen.
• Highball: Mint Fizz, Sunrise, mocktail.
• Gotë e madhe vere: spritz-et.

Kontrollo kokteilin para se ta çosh: gota e pastër dhe e ftohtë, akulli i ri, garnitura e freskët, asnjë pikë në bazë.`],
["Alergjenët dhe mocktail-i",`Kokteilet kanë alergjenë që mysafiri shpesh nuk i mendon:
• Amaretto ka aromë bajameje. Old Father dhe Don Amaretto: pyet gjithmonë për alergji ndaj arrave.
• Rose Colada ka kokos.
• Vodka Sour dhe Whiskey Sour përdorin magic foamer në vend të së bardhës së vezës. Zakonisht janë pa vezë, por konfirmo produktin me barin.
• Espresso Martini ka kafeinë; mbaje parasysh për mysafirët që e shmangin në mbrëmje.

Mocktail-i, 600 lekë, me portokall, thanë, pjeshkë dhe limon, ofrohet me të njëjtin respekt si kokteilet. Mysafiri që nuk pi alkool, shoferi, gruaja shtatzënë, meritojnë të njëjtën përvojë: gotë e bukur, garniturë, prezantim. Mos thuaj “vetëm lëng”, thuaj “kemi edhe një mocktail me portokall, thanë dhe pjeshkë”.`],
["Përmbledhje",`Katër krijime të shtëpisë: Clover Kiss aperitiv, Mint Fizz i freskët, Old Father firmato për pas darkës, Don Amaretto digjestiv. Klasikët kanë historitë e tyre: Negroni 1919, Espresso Martini vitet 1980, Hugo 2005. Sugjero sipas momentit dhe shijes, me tri fjalë shije dhe një detaj. Kupto shake, stir, build dhe gotat. Pyet për arrat te amaretto, kokosi te Rose Colada, dhe ofro mocktail-in me respekt.`]
];
LEC.C2=[
["Hyrje: përtej kokteileve",`Bari i Flower nuk është vetëm kokteile. Mysafiri porosit një gin tonik para darkës, një birrë me mishin e Garden, një konjak pas darkës dhe një espresso në fund. Secila nga këto ka rregullat e veta të shërbimit, dhe kamarieri që i di bën diferencën midis një shërbimi të zakonshëm dhe një shërbimi të nivelit Forbes.

Ky leksion shpjegon kategoritë e pijeve të forta, birrat, kafen dhe pijet e buta, si sugjerohen dhe si shërbehen.`],
["Vodka dhe tekila",`Vodka:
• Belvedere, 800. Polake, nga thekra Dankowskie, e distiluar katër herë.
• Grey Goose, 800. Franceze, nga gruri i Picardie-s dhe ujë burimi nga Cognac. E butë dhe pak e ëmbël.
• Irish Vodka, 800.
• Eristoff, 500. Vodka standarde për kokteile.

Tekila:
• Patrón, 900. 100 për qind agave blu Weber, nga Jalisco, Meksikë. Tekila “100% agave” është më e mira; tekila “mixto” mund të ketë deri në 49 për qind sheqerna të tjerë.
• Tiscaz, 900.
• Cuervo Silver, 600. Jose Cuervo është marka më e vjetër e tekilës, nga viti 1795. “Silver” do të thotë e paplakur, për kokteile.

Kur mysafiri porosit “një vodka” ose “një tekila” pa markë, pyet: “Keni ndonjë preferencë? Kemi Belvedere dhe Grey Goose.” Kjo është sugjerim, jo presion.`],
["Xhini dhe gin toniku",`Bari ka shtatë xhinë, dhe secili ka garniturën e vet të duhur:
• Hendrick's, 800. Skocez, me kastravec dhe trëndafil. Shërbehet me tonik dhe fetë kastraveci, jo limon.
• Gin Mare, 1.000. Spanjoll, mesdhetar, me ulli Arbequina, borzilok, rozmarinë dhe trumzë. Shërbehet me tonik dhe rozmarinë.
• Gunpowder, 900. Irlandez, me çaj kinez gunpowder. Shërbehet me grejpfrut.
• Bulldog, 800. London Dry me 12 botanikë, përfshirë lotusin.
• Bombay Sapphire, 500. Me dhjetë botanikë që aromatizojnë alkoolin me avull.
• Tanqueray, 600. London Dry klasik me vetëm katër botanikë.
• Emporia, 800. Xhin mesdhetar italian.

Gin toniku shërbehet në gotë të madhe me shumë akull, me tonik premium Thomas Henry. Shumë mysafirë dëshirojnë ta hedhin vetë tonikun: sille shishen e tonikut të hapur pranë gotës dhe pyet “Ta hedh unë?” Akulli i bollshëm e mban pijen të ftohtë dhe e hollon më pak se pak akull.`],
["Uiski dhe konjak",`Uiski:
• Scotch i përzier (blended): Red Label 500, Black Label 600, Chivas Regal 600. Black Label dhe Chivas janë 12 vjeç.
• Single malt: Glenfiddich 12 vjeç, 800, me dardhë dhe mollë; Glenfiddich 15 vjeç, 1.200, me mjaltë dhe fruta të thata. “Single malt” do të thotë nga një distileri e vetme, vetëm nga elbi i maltuar.
• Irlandez: Jameson, 500, i distiluar tri herë, shumë i butë.
• Amerikan: Jack Daniel's 500, i filtruar ngadalë nëpër qymyr panje; Jack Single Barrel 1.000, ku çdo shishe vjen nga një fuçi e vetme.

Konjak dhe brandy:
• Hennessy VS, 750. “Very Special”, të paktën dy vjet në dru. Konjaku më i shitur në botë.
• Hennessy X.O, 3.000. “Extra Old”, të paktën dhjetë vjet. Konjaku i parë XO në histori, nga 1870. Pija më e shtrenjtë e barit.
• Courvoisier, 700. “Konjaku i Napoleonit”.
• Frapin VSOP, 800. Vetëm nga rrushi i Grande Champagne, zona më e mirë e Cognac.
• Metaxa 5 dhe 7 yje, 600 dhe 700. Kujdes: Metaxa nuk është konjak, është brandy greke e përzier me verë Muscat dhe botanikë.
• Vecchia Romagna, 500. Brandy italiane klasike.

Si shërbehen: uiski pyet “I thatë, me akull apo me pak ujë?” Single malt-i shpesh pihet i thatë ose me pak ujë, që i hap aromat. Konjaku shërbehet i thatë, në gotë të vogël me bark (snifter ose tulipan), në temperaturën e dhomës, që dora ta ngrohë pak. Kurrë me akull, përveç kur mysafiri e kërkon.`],
["Birrat",`Bari ka shtatë birra:
• Augustiner, 600. Mynih, birraria më e vjetër e Mynihut, nga 1328. Lager Helles e lehtë.
• Augustiner Marie, 500.
• Paulaner, 600. Mynih, 1634, e themeluar nga murgjit.
• Corona, 500. Meksikane, shërbehet tradicionalisht me një fetë lime në qafën e shishes.
• Stella Artois, 400. Belgjikë, nga 1366. Ka ritualin e saj me nëntë hapa dhe gotën kupë.
• Peja, 300. Birra më e njohur shqiptare, nga Peja, Kosovë.
• Birrë pa alkool, 300. Ofroje te shoferët dhe mysafirët që nuk pinë.

Si shërbehet birra: gota e pastër dhe e ftohtë, e mbajtur pak e pjerrët. Derdh ngadalë pranë murit të gotës, pastaj drejtoje në fund për të krijuar një kurorë shkume prej rreth dy gishtash. Shishja vendoset në tavolinë me etiketën nga mysafiri, nëse nuk derdhet e gjitha. Me mishin e Garden në Josper, një birrë e mirë gjermane është çiftim i shkëlqyer.`],
["Kafeja dhe pijet e buta",`Kafeja është gjëja e fundit që mysafiri shijon, dhe mbetet në kujtesë. Menuja: Espresso 180, Macchiato 190, Decafeinato 180, Cappuccino 250, American Coffee 170, Café Latte 220, Matcha Latte 300, Nescafé ose Frappé 250, Çaj 150, Çaj organik 250.

Rregullat:
• Espresso shërbehet menjëherë sapo del nga makina, me krem në sipërfaqe, në filxhan të ngrohur, me lugë dhe sheqer në pjatë dhe një gotë ujë.
• Cappuccino tradicionalisht pihet në mëngjes; në mbrëmje nuk e korrigjojmë kurrë mysafirin.
• Pas darkës, ofro gjithmonë dekafeinatin dhe çajin.
• Mysafirit me intolerancë ndaj laktozës, konfirmo me barin çfarë qumështi kemi para se t'i premtosh diçka.

Pijet e buta: Coca Cola, Fanta, Schweppes 250, Ice Tea 250, Rauch 250, Red Bull 400, Orange Juice 400, Rose Lemonade 500 dhe Thomas Henry 400, një mikser premium gjerman për tonik, ginger ale dhe ginger beer. Pijet e buta shërbehen në gotë me akull dhe limon, me shishen pranë nëse nuk derdhet e gjitha, dhe pyet nëse mysafiri e do me akull.`],
["Shitja dhe kontrolli",`Kamarieri ka dy përgjegjësi me pijet: të sugjerojë mirë dhe të shërbejë me përgjegjësi.

Sugjerimi:
• Ofro gjithmonë markën: “Një gin tonik me Hendrick's apo Gin Mare?”
• Pas darkës, ofro digjestivin: “Për të mbyllur, një konjak, një uiski apo një kokteil i shtëpisë?”
• Për rastet e veçanta, Hennessy X.O ose Glenfiddich 15 vjeç.

Përgjegjësia, siç u shpjegua në leksionin X4:
• Mos shërbe alkool të miturve.
• Vëzhgo shenjat e dehjes dhe njofto menaxherin.
• Ofro ujë, ushqim dhe alternativa pa alkool.
• Për mysafirin që ka pirë shumë, ofro taksi për në shtëpi.

» Skenë nga Garden: Pas një tomahawk-u, katër miq porosisin “diçka të fortë”. Kamarieri: “Kemi Glenfiddich 15 vjeç, me mjaltë dhe fruta të thata, ose Hennessy X.O, konjaku ynë më i mirë. Nëse preferoni diçka më të lehtë, Don Amaretto është kokteili ynë me rum, bajame dhe vanilje.” Dy marrin Glenfiddich, të thatë, dhe dy Hennessy X.O. Kamarieri shërben konjakun në gotë të vogël me bark, pa akull.`],
["Përmbledhje",`Vodka dhe tekila: ofro markën, Patrón është 100 për qind agave. Xhini: çdo markë me garniturën e vet, Hendrick's me kastravec, Gin Mare me rozmarinë, Gunpowder me grejpfrut. Uiski: blended, single malt, irlandez, amerikan. Konjaku: VS, VSOP, XO; Metaxa është brandy, jo konjak. Birra me kurorë shkume dhe etiketë nga mysafiri. Espresso menjëherë, në filxhan të ngrohur. Dhe gjithmonë me përgjegjësi.`]
];
LEC.R1=[
["Hyrje: banaku si skenë",`Banaku është i vetmi vend në hotel ku mysafiri e sheh punën duke u bërë para syve të tij. Në restorant, kuzhina është e fshehur; në bar, çdo lëvizje e banakierit, çdo shishe, çdo leckë është në skenë. Prandaj Forbes ka një standard të veçantë për këtë, BL44: stacionet e shërbimit, banaku dhe banaku i pasmë duhet të jenë gjithmonë të rregullt dhe tërheqës.

Por organizimi i banakut nuk është vetëm estetikë. Standardi BL17 kërkon që pija e parë të mbërrijë brenda 3 minutash në banak dhe 4 minutash në tavolinë. Me një banak të çrregullt, ku banakieri kërkon xhinin, hap frigoriferin tri herë dhe ecën deri në fund për një limon, këto minuta humbasin shpejt. Ky leksion shpjegon si organizohet banaku që të jetë njëkohësisht i shpejtë dhe i bukur.`],
["Ergonomia: gjithçka brenda një krahu",`Banakët profesionalë organizohen sipas frekuencës së përdorimit. Rregulli është i thjeshtë: atë që e përdor më shpesh, e ke më afër.

Zona e punës së banakierit ndahet në tri nivele:
• Brenda krahut, pa lëvizur këmbët: speed rail me alkoolet bazë, akulli, jigger-at, shaker-i, garniturat kryesore, gotat më të përdorura.
• Një hap larg: frigoriferi i birrave dhe verërave me gotë, lavamani, makina e akullit.
• Disa hapa larg: banaku i pasmë me shishet premium, rezervat.

Çdo banakier në turn duhet të ketë stacionin e vet të plotë. Kur dy banakierë ndajnë të njëjtin jigger ose të njëjtën kovë akulli, ata përplasen dhe presin njëri-tjetrin.

Rendi është i njëjtë çdo ditë. Banakieri duhet të mund ta zgjasë dorën dhe ta gjejë xhinin pa parë, siç gjen shoferi ndërruesin e shpejtësive. Nëse banakieri i mëngjesit e lë stacionin ndryshe nga ai i mbrëmjes, të dy humbasin kohë.`],
["Speed rail dhe alkoolet bazë",`Speed rail është shina para gjunjëve të banakierit, ku qëndrojnë shishet që përdoren për shumicën e kokteileve. Në barin tonë kjo do të thotë:
• Vodka bazë për kokteile, si Eristoff, për Vodka Sour dhe Mint Fizz.
• Xhini bazë, për Negroni dhe Clover Kiss, sipas recetës së shtëpisë.
• Tekila bazë, si Cuervo Silver, për Sunrise dhe Old Father.
• Rumi, për Rose Colada.
• Bourbon-i, për Whiskey Sour.
• Aperol dhe Campari, për spritz-et dhe Negroni-n.
• Vermuti i ëmbël dhe amaretto.

Shishet në speed rail kanë grykë derdhëse (pourer) që rrjedhja të jetë e njëtrajtshme. Grykat lahen çdo natë, sepse sheqeri i likerëve ngjitet dhe tërheq insekte.

Markat premium, si Hendrick's, Gin Mare, Patrón, Glenfiddich ose Hennessy X.O, qëndrojnë në banakun e pasmë, të dukshme për mysafirin. Kur mysafiri porosit me markë, banakieri e merr shishen, ia tregon dhe e derdh para tij.`],
["Akulli: përbërësi më i rëndësishëm",`Akulli është përbërësi që përdoret në çdo pije dhe që mendohet më pak. Standardi BL27 kërkon “akullin e stilit të duhur”: kub i madh për Negroni-n dhe Old Father, kube standarde për highball-et, akull i shtypur kur receta e kërkon.

Rregullat e akullit:
• Kova e akullit mbushet para shërbimit dhe rimbushet para se të mbarojë.
• Akulli merret gjithmonë me lugë metalike ose plastike, kurrë me gotë. Gota mund të thyhet brenda akullit, dhe një copë xhami e padukshme në akull është rrezik serioz për mysafirin.
• Nëse thyhet një gotë pranë ose brenda kovës së akullit, i gjithë akulli hidhet. Kova pastrohet dhe mbushet përsëri. Nuk ka përjashtim, edhe në mes të shërbimit më të ngarkuar.
• Akulli nuk preket kurrë me dorë.
• Akulli i shkrirë nuk ripërdoret. Çdo gotë merr akull të ri, edhe kur mysafiri kërkon “një tjetër njësoj”.
• Kubi i madh ruhet veçmas, që të mos ngjitet me të tjerët.`],
["Garniturat dhe përgatitja",`Garniturat janë e para gjë që sheh mysafiri në kokteil. Një fetë portokalli e thatë ose një degë mente e vyshkur e prish pijen para se ta provojë.

Rregullat e garniturave:
• Priten para shërbimit, në sasi për një turn, jo për tri ditë.
• Ruhen në enë të ftohta dhe të mbuluara, në frigoriferin e banakut ose mbi akull.
• Menta dhe barishtet ruhen në ujë të ftohtë ose në leckë të lagur, si lulet.
• Agrumet priten me thikë të mprehtë, në feta të njëtrajtshme.
• Lëkura e portokallit për Negroni-n dhe Old Father pritet në çast, që të ruajë vajrat aromatikë.

Për barin tonë, garniturat kryesore janë: fetë portokalli dhe lëkurë portokalli, limon, lime, mjedra për Clover Kiss, kastravec dhe mente për Mint Fizz dhe Hendrick's, rozmarinë për Gin Mare, grejpfrut për Gunpowder, kokrra kafeje për Espresso Martini, ananas për Rose Colada dhe qershi.

Shurupet dhe lëngjet e freskëta, si limoni i shtrydhur, mbahen me datë dhe orë përgatitjeje. Limoni i shtrydhur humbet freskinë brenda pak orësh.`],
["FIFO, datimi dhe banaku i pasmë",`FIFO do të thotë “e para hyn, e para del”. Shishja që ka hyrë e para në magazinë përdoret e para. Kur vjen një shishe e re, ajo vendoset pas asaj që është në përdorim, jo përpara.

Datimi:
• Shishet e hapura të verërave me gotë shënohen me datën e hapjes. Vera e hapur mban zakonisht një deri në tri ditë me tapë vakumi.
• Vermutet janë verëra; pas hapjes ruhen në frigorifer.
• Shurupet e shtëpisë dhe lëngjet e freskëta shënohen me datë dhe orë.

Banaku i pasmë është vitrina e barit. Mysafiri e sheh gjatë gjithë kohës që pi, dhe shishet e rreshtuara janë njëkohësisht dekor dhe menu. Rregullat:
• Etiketa gjithmonë përpara.
• Shishet të pastra, pa pluhur dhe pa njolla, të fshira çdo ditë.
• Të grupuara sipas kategorisë: vodka, xhin, tekila, uiski, konjak, likerë.
• Shishet premium në pozicionin më të dukshëm dhe të ndriçuar.
• Asnjë shishe bosh, asnjë shishe pa tapë.`],
["Gjatë shërbimit: banaku gjithmonë gati",`BL28 kërkon që tavolina dhe banaku të mirëmbahen vazhdimisht. Kjo do të thotë që banaku duhet të duket njësoj në orën 23 si në orën 18.

Gjatë shërbimit:
• Fshi banakun pas çdo pije, me leckë të pastër, jo me atë që ke përdorur për gotat.
• Lecka nuk qëndron kurrë mbi banak ose mbi sup. Qëndron poshtë, jashtë pamjes së mysafirit.
• Asnjë shishe e hapur pa tapë ose grykë.
• Gotat e përdorura hiqen menjëherë nga banaku.
• Coaster-at e lagur zëvendësohen.
• Lavamani dhe zona e punës mbahen të pastra edhe pse mysafiri nuk i sheh: ai i sheh duart e banakierit.

» Skenë nga Flower: Në orën 21, banaku është plot. Një banakier ka katër porosi njëherësh. Por ai nuk vrapon: speed rail-i është në rendin e zakonshëm, akulli është i mbushur, garniturat janë gati. Ai përgatit dy Aperol Spritz, një Negroni dhe një Clover Kiss në më pak se tri minuta, fshin banakun dhe vendos coaster-at e rinj. Mysafiri në banak e sheh dhe thotë: “Duket sikur nuk po bën asnjë përpjekje.”`],
["Përmbledhje",`Banaku organizohet sipas frekuencës: gjithçka që përdoret më shpesh është brenda një krahu. Speed rail në të njëjtin rend çdo ditë, me alkoolet bazë dhe grykë derdhëse. Akulli me lugë, kurrë me gotë, dhe hidhet i gjithi kur thyhet xham. Garniturat të freskëta, për një turn. FIFO dhe data në çdo shishe të hapur dhe çdo shurup. Banaku i pasmë me etiketat përpara dhe shishet premium në dukje. Dhe banaku duhet të duket gjithmonë gati, sepse mysafiri e sheh çdo gjë.`]
];
LEC.R2=[
["Hyrje: bari është vendi i marrëdhënieve",`Mysafiri shkon në restorant për të ngrënë. Por në bar, shkon për diçka më të vështirë për t'u përcaktuar: për t'u çlodhur, për të biseduar, për të pritur dikë, për të mbyllur një ditë, ose thjesht për të mos qenë vetëm në dhomë. Banakieri është njëkohësisht prodhues pijesh, nikoqir dhe, shpesh, bashkëbisedues.

Forbes ka standarde specifike për barin. BL1: përshëndetje brenda 1 minute pasi mysafiri ulet. BL17: pija e parë brenda 3 minutash në banak, 4 në tavolinë. BL18: raundi tjetër ofrohet brenda 1 minute pasi gota mbaron. BL30: menuja e pijeve jepet automatikisht. BL34 deri BL38: snacks të freskëta, peceta dhe coaster. Ky leksion shpjegon si i realizojmë këto, dhe si i lexojmë mysafirët e ndryshëm.`],
["Minuta e parë",`Mysafiri që ulet në banak dhe nuk merr asnjë shenjë për dy minuta ndihet i padukshëm. Standardi BL1 kërkon përshëndetje brenda 1 minute, dhe “njohje sapo është e mundur”.

Çfarë do të thotë kjo në praktikë:
• Kontakti me sy dhe një buzëqeshje brenda pak sekondash, edhe kur je duke përgatitur pije të tjera.
• Nëse je i zënë: “Mirëmbrëma, jam me ju menjëherë.” Kjo fjali ndalon orën në kokën e mysafirit.
• Coaster-i vendoset menjëherë para mysafirit. Ky është sinjal i heshtur që është parë dhe që pija po vjen.
• Menuja e pijeve jepet pa u kërkuar, sipas BL30.

Nëse mysafiri ulet në lounge dhe jo në banak, kamarieri i lounge-it ka të njëjtin standard: brenda 1 minute.`],
["Menuja, snacks dhe pija e parë",`Menuja e pijeve jepet e hapur, me një sugjerim: “Kokteilet e shtëpisë janë në faqen e parë. Nëse dëshironi diçka të freskët, Clover Kiss është shumë i mirë sonte.” Standardi BL32 kërkon që të përmendet një ofertë e veçantë, dhe BL33 që të ketë opsione pa alkool.

Snacks të freskëta shoqërojnë pijen e parë, në enë të pastër, me pecetë liri ose pambuku dhe coaster të veçantë, sipas BL34 deri BL38. Snacks-at nuk janë dhuratë; janë pjesë e shërbimit. Ato duhet të jenë të freskëta, kurrë të mbetura nga mysafiri i mëparshëm, dhe rimbushen kur mbarojnë.

Pija e parë: 3 minuta në banak, 4 në tavolinë. Kjo nuk do të thotë nxitim: një Negroni ka nevojë për trazim, një Espresso Martini për espreson e freskët. Por do të thotë që porosia merret menjëherë, futet në POS menjëherë dhe përgatitet pa pritje.

Raundi i dytë: sipas BL18, brenda 1 minute pasi gota mbaron, ofrohet diskret: “Një tjetër?” ose thjesht një shikim dhe një lëvizje e kokës. Mysafiri nuk duhet të kërkojë ta shohë banakierin.`],
["Mysafiri i vetëm",`Mysafiri që vjen vetëm në bar është mysafiri më i ndjeshëm. Ai mund të jetë në udhëtim pune, i lodhur, në pritje të dikujt, ose thjesht dëshiron një pije në qetësi. Detyra jote është të lexosh sinjalin:
• Telefoni në dorë, një libër, sytë poshtë: dëshiron qetësi. Shërbeje me kujdes, pa bisedë të tepërt, por kontrollo me sy herë pas here.
• Sytë që kërkojnë kontakt, pyetjet për pijet, komentet për ditën: dëshiron një bisedë të lehtë. Bisedo, por mbaje të shkurtër dhe lëre të vendosë ai kur mbaron.

Rregulli: kurrë mos e lër mysafirin të vetëm të ndihet i vetmuar, dhe kurrë mos e bezdis.

Për gratë që vijnë vetëm në bar, kujdesi është edhe më i rëndësishëm. Nëse një mysafir tjetër e bezdis, banakieri ndërhyn me takt: “A jeni mirë? Dëshironi të uleni në një tavolinë më të qetë?” dhe njofton supervizorin nëse duhet.`],
["Grupet, çiftet dhe privatësia",`Standardi BL42 kërkon që mysafiri të ketë mundësi të ulet larg grupeve. Në praktikë:
• Çiftet dhe mysafirët që kanë takim pune ulen në tavolinat më të qeta, larg grupeve të mëdha.
• Grupet e mëdha ulen në zonën ku zhurma e tyre shqetëson më pak të tjerët.
• Kur një grup ngre zërin shumë, supervizori ndërhyn me takt: “Ju lutem, kemi disa mysafirë që po flasin për punë pranë jush. A mundeni ta ulni pak zërin? Faleminderit shumë.”

Bisedat në banak kanë rregullat e tyre:
• Asnjë temë politike, fetare ose personale e ndjeshme.
• Asnjë thashethem për mysafirë të tjerë, për stafin ose për hotelin.
• Kurrë mos përsërit atë që dëgjon në banak. Mysafirët flasin lirshëm në bar, dhe kjo besueshmëri është pjesë e luksit.
• Mos fol për problemet e tua personale ose të punës.`],
["Njohuria si shërbim",`Standardi BL8 kërkon që stafi i barit të diskutojë me njohuri pijet dhe ofertën, përfshirë llojet e alkooleve, birrave dhe verërave. Kjo do të thotë që banakieri duhet të dijë:
• Çdo kokteil të menusë, përbërësit, shijen dhe historinë e tij, siç shpjegohet në leksionin C1.
• Çdo markë të barit dhe diferencat midis tyre: pse Hendrick's shërbehet me kastravec, pse Patrón është 100 për qind agave, pse Metaxa nuk është konjak.
• Verërat me gotë dhe të paktën disa verëra të listës me shishe.
• Birrat, me origjinën dhe stilin.

Kur mysafiri pyet “Çfarë më sugjeroni?”, mos thuaj “çfarë të doni”. Pyet dy pyetje, për shijen dhe për alkoolin, pastaj sugjero një gjë konkrete me një arsye.

» Skenë nga Flower: Një burrë ulet vetëm në banak në orën 22, me kostum dhe me çantë pune. Banakieri vendos coaster-in dhe menunë: “Mirëmbrëma. Ditë e gjatë?” Burri buzëqesh: “Shumë.” Banakieri: “Diçka e fortë dhe e qetë, apo diçka e freskët?” “E fortë.” “Kemi Glenfiddich 15 vjeç, me mjaltë dhe fruta të thata. I thatë, apo me pak ujë?” Pastaj e lë të qetë, me një pjatë të vogël snacks dhe një gotë ujë. Kur gota mbaron, banakieri pyet me sy. Burri tund kokën: jo. Banakieri sjell faturën në mbajtëse.`],
["Fatura në bar",`Fatura në bar ka disa veçori:
• Tab i hapur: mysafiri mund të hapë një llogari me kartë ose me numrin e dhomës, dhe të porosisë disa raunde pa paguar çdo herë. Për mysafirët e hotelit, kontrollo emrin dhe numrin e dhomës në sistem.
• Fatura sillet diskret, në mbajtëse, kurrë e hedhur mbi banak, sipas BL45.
• Mos e sill faturën pa u kërkuar, përveç kur je në mbyllje ose kur mysafiri tregon qartë se po largohet.
• Kur mysafiri ka pirë shumë, ofro ujë dhe taksi para faturës, siç shpjegohet në leksionin X4.`],
["Përmbledhje",`Përshëndetje brenda 1 minute, edhe kur je i zënë: “Jam me ju menjëherë.” Coaster-i menjëherë, menuja automatikisht, snacks të freskëta me pijen e parë. Pija e parë brenda 3 minutash në banak, 4 në tavolinë; raundi tjetër brenda 1 minute. Lexo mysafirin e vetëm: qetësi apo bisedë. Mbaj çiftet larg grupeve. Asnjë thashethem, asnjë temë e ndjeshme, dhe kurrë mos përsërit atë që dëgjon. Dhe fatura vjen diskret, në mbajtëse.`]
];
LEC.R3=[
["Hyrje: atmosfera është produkt",`Në restorant, mysafiri paguan kryesisht për ushqimin. Në lounge, ai paguan po aq për ambientin. Një Negroni është i njëjtë në një bar të zhurmshëm dhe në një lounge të qetë, por përvoja nuk është. Drita, muzika, temperatura, ajri dhe ritmi i natës janë produkti që mysafiri blen, edhe pse nuk shfaqen në faturë.

Forbes e mat këtë me dy standarde. BL42: ambient shumë i rehatshëm, temperaturë e përshtatshme dhe ajër i freskët. BL43: muzikë në stil të përshtatshëm, me volum dhe cilësi komode, dhe muzikë live profesionale kur ka. Ky leksion shpjegon si mbahet atmosfera gjatë gjithë natës dhe si mbyllet nata me elegancë.`],
["Pesë elementët e atmosferës",`Drita. E ulët dhe e ngrohtë, por mjaftueshëm që mysafiri të lexojë menunë pa telefon. Drita e bardhë dhe e fortë e bën lounge-in të duket si zyrë; drita shumë e ulët e bën të duket i pazbuluar dhe e vështirëson shërbimin. Qirinjtë ose llambat e vogla në tavolina krijojnë intimitet.

Muzika. Duhet të lejojë bisedën pa ngritur zërin, rreth 60 deri në 70 decibel. Kjo është afërsisht niveli i një bisede normale. Nëse mysafirët duhet të përkulen drejt njëri-tjetrit për të dëgjuar, muzika është shumë e lartë. Stili duhet të përputhet me orën dhe me mysafirët: jazz, soul, lounge ose akustike në aperitiv, diçka më ritmike pas darkës.

Temperatura. Rreth 21 deri në 23 gradë. Në verë, kujdes nga ajri i kondicionuar që fryn drejt e mbi tavolina; në dimër, nga dyert që hapen dhe sjellin të ftohtë.

Ajri. Pa erë ushqimi, duhani ose produktesh pastrimi. Ajri i freskët është standard, jo luks.

Rregulli i tavolinave. Tavolinat e pastra, pa gota bosh, me coaster-a të thatë dhe qirinj të ndezur.`],
["Atmosfera ndryshon me orën",`Nata e barit ka ritmin e saj, dhe atmosfera duhet ta ndjekë atë:
• Aperitivi, rreth orës 18 deri në 20: më e ndritshme dhe më e qetë. Mysafirët vijnë para darkës, bisedojnë, pinë diçka të lehtë. Muzika e butë, drita mesatare.
• Pas darkës, rreth orës 21 deri në 23: më e ulët dhe më ritmike. Mysafirët vijnë për digjestiv, për të vazhduar mbrëmjen. Drita ulet, muzika merr pak më shumë ritëm.
• Vonë: përsëri më e qetë, ndërsa nata shkon drejt mbylljes.

Ndryshimi bëhet gradualisht, jo papritur. Mysafiri nuk duhet ta vërejë kurrë që drita u ul ose që muzika ndryshoi; duhet vetëm ta ndiejë që atmosfera është gjithmonë e duhura.`],
["Kontrolli çdo orë",`Atmosfera prishet ngadalë, dhe stafi që punon në të nuk e vëren. Muzika që dukej e përshtatshme në orën 19 mund të jetë shumë e lartë në orën 22 kur salla është gjysmë bosh. Temperatura rritet kur salla mbushet.

Prandaj supervizori bën një kontroll çdo orë, me një listë të thjeshtë:
• Drita: e duhura për orën?
• Muzika: volumi dhe stili? Ulu në një tavolinë dhe dëgjo si e dëgjon mysafiri.
• Temperatura: a ka nxehtë ose ftohtë? A fryn ajri mbi ndonjë tavolinë?
• Ajri: a ka erë?
• Tavolinat: të pastra, pa gota bosh, qirinjtë të ndezur?
• Tualetet: të pastra dhe të furnizuara?

Ky kontroll zgjat dy minuta dhe parandalon shumicën e ankesave para se të ndodhin.`],
["Muzika live",`Kur ka muzikë live, ajo duhet të jetë profesionale, siç kërkon BL43. Muzikanti është pjesë e përvojës, dhe një muzikant i keq ose shumë i zhurmshëm e prish natën.

Rregullat:
• Volumi dhe repertori bien dakord me menaxhimin para fillimit. Muzikanti duhet të dijë që mysafirët duhet të mund të bisedojnë.
• Volumi kontrollohet nga salla, jo nga skena. Muzikanti e dëgjon ndryshe.
• Pauzat mbushen me muzikë të regjistruar të qetë, jo me heshtje dhe jo me muzikë të lartë.
• Kërkesat e mysafirëve për këngë kalohen te muzikanti me takt, nëse përshtaten me repertorin.
• Stafi nuk kalon para muzikantit gjatë performancës, nëse mund ta shmangë.`],
["Thirrja e fundit dhe mbyllja",`Mënyra si mbyllet nata është kujtimi i fundit i mysafirit. Një natë e shkëlqyer mund të prishet në pesë minutat e fundit, kur dritat ndizen papritur dhe karriget ngrihen mbi tavolina.

Thirrja e fundit:
• Bëhet 30 minuta para mbylljes.
• Diskret, tavolinë për tavolinë, jo me zë të lartë për të gjithë sallën: “Dëshironi diçka tjetër para se të mbyllim banakun?”
• Pas thirrjes së fundit, nuk merren porosi të reja, por mysafirët nuk nxitohen. Ata kanë kohë të mbarojnë pijen.

Çfarë nuk bëhet kurrë para mysafirëve:
• Dritat nuk ndizen papritur.
• Karriget nuk ngrihen mbi tavolina.
• Muzika nuk ndalet papritur; ulet gradualisht.
• Pastrimi i rëndë nuk fillon, siç është fshesa ose leckat e dyshemesë.
• Stafi nuk numëron paratë ose nuk bën inventarin në sy të mysafirëve.
• Asnjë koment si “po mbyllim” ose shikim tek ora.`],
["Largimi",`Mysafiri që largohet falënderohet me emër, nëse e dimë: “Faleminderit, zoti Hoxha, natën e mirë.” Ndihmë për taksi, për ashensor ose për rrugën për në dhomë.

Për mysafirin që ka pirë shumë: siç shpjegohet në leksionin X4, ofro ujë, ofro taksi, dhe mos e lër të ngasë makinën. Nëse është mysafir i hotelit, sigurohu që arrin në dhomë.

» Skenë nga Flower: Është ora 00:30, mbyllja është në 01:00. Banakieri kalon diskret në çdo tavolinë: “Dëshironi diçka tjetër para se të mbyllim banakun?” Një çift porosit dy Espresso Martini. Muzika ulet pak çdo dhjetë minuta. Në orën 01:05, çifti ngrihet. Kamarieri: “Faleminderit për mbrëmjen. Dëshironi t'ju thërras një taksi?” Vetëm kur çifti ka dalë nga dera, stafi fillon të mbledhë tavolinat.`],
["Përmbledhje",`Atmosfera është produkt: dritë e ulët por e lexueshme, muzikë rreth 60 deri në 70 decibel që lejon bisedën, temperaturë 21 deri në 23 gradë, ajër i freskët. Ndryshon me orën, gradualisht: më e ndritshme në aperitiv, më ritmike pas darkës. Kontroll çdo orë nga supervizori. Muzika live profesionale, me volum të rënë dakord. Thirrja e fundit 30 minuta para mbylljes, diskret. Asnjë dritë e ndezur, karrige e ngritur ose pastrim para mysafirëve. Dhe largimi me emër, me ndihmë për taksi.`]
];
LEC.R4=[
["Hyrje: çdo mililitër ka një çmim",`Një shishe xhin 70 cl kushton një sasi të caktuar. Nëse çdo pije merr 5 cl, nga shishja dalin 14 pije. Nëse banakieri derdh me sy dhe çdo pije merr 6 cl, dalin vetëm 11 deri në 12 pije. Diferenca, dy deri në tri pije për shishe, nuk duket në asnjë gotë, por në fund të muajit mund të jetë qindra mijëra lekë.

Ky leksion nuk është vetëm për menaxherët. Çdo banakier dhe çdo kamarier që derdh verë me gotë ndikon drejtpërdrejt në fitimin e barit. Ky leksion shpjegon si llogaritet kostoja e pijes, pse matja e saktë mbron edhe cilësinë, edhe fitimin, dhe si kontrollohet bari.`],
["Pour cost: kostoja e derdhjes",`Pour cost është përqindja e çmimit të shitjes që shkon për koston e pijes. Llogaritet kështu: kostoja e pijes pjesëtuar me çmimin e shitjes.

Shembull i thjeshtë, me shifra ilustruese, jo me kostot tona reale:
• Një shishe 70 cl kushton 2.800 lekë.
• Kostoja për 1 cl është 40 lekë.
• Një pije 5 cl kushton 200 lekë.
• Nëse shitet për 800 lekë, pour cost është 200 pjesëtuar me 800, pra 25 për qind.

Për alkoolet e forta, barët synojnë zakonisht një pour cost prej 15 deri në 22 për qind. Për verën me gotë, 25 deri në 35 për qind. Për kokteilet, varet nga përbërësit.

Tani shiko çfarë ndodh kur derdhja nuk matet. Nëse banakieri derdh 6 cl në vend të 5, kostoja e pijes rritet me 20 për qind. Pour cost shkon nga 25 në 30 për qind, pa e ditur askush. Shumëzoje këtë me qindra pije në javë.`],
["Bujaria e kontrolluar",`Standardi BL25 kërkon që sasitë të jenë “bujare dhe të përshtatshme”. Kjo duket sikur bie në konflikt me kontrollin, por nuk është kështu.

Bujaria është standardi i shtëpisë. Nëse standardi ynë është 5 cl për pijet e forta, ky është bujaria. Por ai duhet të jetë i njëjtë çdo herë, nga çdo banakier, në çdo turn.

Problemi me derdhjen me sy nuk është vetëm kostoja. Është se mysafiri merr pije të ndryshme. Të hënën, banakieri A i jep një gin tonik të fortë; të martën, banakieri B i jep një të dobët. Mysafiri mendon që bari nuk është i qëndrueshëm, ose, edhe më keq, që dikush po e mashtron.

Për kokteilet, matja e saktë është edhe çështje cilësie. Negroni ka tri pjesë të barabarta, 3 cl secila. Nëse Campari-t i shtohet një centilitër, pija bëhet e hidhur dhe e çekuilibruar. Recetat e kokteileve janë ekuilibra të sakta, dhe vetëm matja i ruan ato.`],
["Matja",`Mjetet e matjes:
• Jigger: masa metalike me dy anë, zakonisht 2 dhe 4 cl, ose 2,5 dhe 5 cl. Përdoret për çdo pije, pa përjashtim. Banakieri profesionist e mban jigger-in drejt, e mbush plot deri në buzë dhe e derdh pa pikuar.
• Gota e verës me gotë: me shenjë ose me masë, që çdo gotë të ketë të njëjtën sasi.
• Grykat derdhëse në speed rail: ndihmojnë që rrjedhja të jetë e njëtrajtshme, por nuk zëvendësojnë jigger-in.

Disa banakierë me përvojë mendojnë që mund të derdhin me sy, me numërim. Teste të shumta tregojnë që edhe banakierët me përvojë gabojnë me 10 deri në 30 për qind. Jigger-i nuk është shenjë e mungesës së aftësisë; është shenjë e profesionalizmit.

Me mysafirin, jigger-i tregon kujdes. Mysafiri që sheh banakierin duke matur e di që pija e tij do të jetë e saktë.`],
["Regjistri i humbjeve",`Jo çdo pije shitet. Disa derdhen, disa kthehen, disa ofrohen falas. Të gjitha këto janë normale, por duhet të shënohen.

Regjistri i humbjeve shënon:
• Pijet e derdhura aksidentalisht.
• Pijet e kthyera nga mysafiri, për shembull një kokteil që nuk i pëlqeu, me arsyen.
• Pijet e ofruara falas, me miratimin e supervizorit dhe me arsyen: ankesë, mysafir VIP, rast i veçantë.
• Shishet e verës me defekt, si vera me tapë, siç shpjegohet në leksionin V5.
• Pijet e stafit, nëse lejohen.

Pse ka rëndësi? Sepse në fund të javës, inventari krahasohet me shitjet. Nëse mungojnë tri shishe xhin dhe regjistri i humbjeve shënon vetëm një, dy shishe kanë humbur pa shpjegim. Regjistri mbron edhe stafin: tregon që humbjet kanë arsye.`],
["Inventari dhe POS",`Inventari bëhet rregullisht, zakonisht çdo javë:
• Shishet e plota numërohen.
• Shishet e hapura maten, me peshë ose me vlerësim në dhjetëra, për shembull 3/10 e shishes.
• Rezultati krahasohet me shitjet në POS.

Diferenca midis asaj që është konsumuar dhe asaj që është shitur quhet “variancë”. Një variancë e vogël është normale; një variancë e madhe tregon problem: derdhje pa matje, pije pa POS, humbje të pashënuara ose vjedhje.

Rregulli më i rëndësishëm i kontrollit: asnjë pije pa POS. Çdo pije regjistrohet para se të përgatitet, edhe ato falas, edhe ato të stafit. Pija falas regjistrohet si e tillë, me miratimin e supervizorit. Kështu sistemi e di gjithmonë çfarë ka dalë nga bari.

» Skenë nga Flower: Në inventarin e javës, mungojnë dy shishe Aperol. Regjistri i humbjeve shënon vetëm një shishe të thyer. Bar manager-i nuk akuzon askënd; shikon raportet e POS. Zbulon që në tri net, spritz-et janë bërë me më shumë Aperol se receta. Në mbledhjen e ekipit, ai rikujton rregullin 3-2-1 dhe vendos jigger-a të rinj në çdo stacion. Javën tjetër, varianca bie pothuajse në zero.`],
["Përmbledhje",`Pour cost është kostoja e pijes pjesëtuar me çmimin e shitjes. Synohet 15 deri në 22 për qind për alkoolet e forta dhe 25 deri në 35 për verën me gotë. Një centilitër më shumë në çdo pije rrit koston me 20 për qind. Bujaria është standardi i shtëpisë, i matur gjithmonë njësoj. Jigger për çdo pije, pa përjashtim. Çdo humbje shënohet me arsyen. Inventari javor krahasohet me POS. Dhe asnjë pije nuk përgatitet pa u regjistruar.`]
];
LEC.B1=[
["Hyrje: vakti që ha çdo mysafir",`Jo çdo mysafir i hotelit darkon në Flower ose në Garden. Jo çdo mysafir shkon në bar ose në pishinë. Por pothuajse çdo mysafir ha mëngjes, dhe shumë prej tyre e hanë çdo ditë të qëndrimit. Kjo e bën mëngjesin vaktin më të rëndësishëm për reputacionin e hotelit, edhe pse shpesh trajtohet si më pak i rëndësishëm se darka.

Inspektori i Forbes e teston mëngjesin çdo ditë të qëndrimit, në bufe, në tavolinë dhe në dhomë. Ky leksion shpjegon pse mëngjesi është kritik, standardet që maten, kohët dhe si e lexojmë mysafirin e mëngjesit.`],
["Pse mëngjesi është kritik",`Mëngjesi ka tri veçori që e bëjnë të vështirë:

E para, mysafiri shpesh ka nxitim. Ka një takim pune, një fluturim, një ekskursion, një plan për ditën. Një mëngjes i ngadaltë nuk është vetëm i bezdisshëm; mund t'ia prishë planin.

E dyta, mysafiri ka energji të ulët. Është zgjuar sapo, ndoshta ka fjetur keq, nuk ka pirë ende kafe. Toleranca ndaj gabimeve është më e ulët se në darkë.

E treta, mëngjesi është vakti i parë i ditës dhe përcakton tonin. Një mëngjes i shkëlqyer e nis ditën mirë; një mëngjes i keq e bën mysafirin të shohë gjithçka tjetër me sy kritik.

Dhe një veçori praktike: mëngjesi ka shumë mysafirë në pak kohë. Në orët e pikut, salla mund të mbushet brenda gjysmë ore. Kjo kërkon organizim të përsosur.`],
["Standardet që maten",`Standardet kryesore të Forbes për mëngjesin:
• HD20: tavolina përshëndetet brenda 1 minute dhe ofrohen pije. Në mëngjes, kjo do të thotë kafe.
• HD22: rimbushjet ofrohen brenda 1 minute pasi pija mbaron.
• HD26: mëngjesi i ftohtë mbërrin brenda 7 minutash nga porosia, mëngjesi i nxehtë brenda 10 minutash.
• HD29: zgjedhje lëngjesh, të paktën dy të freskëta ose të veçanta.
• HD30: shumë fruta të freskëta dhe të pjekura, dhe bukë të shumëllojshme e të freskëta.
• HD31: opsione për mysafirët që kërkojnë pjata të shëndetshme.
• HD48: kafe dhe çajra specialë të disponueshëm në çdo kohë.
• HD61: mëngjes i plotë i nxehtë brenda 30 minutash kur nevojitet.

Për bufenë ka standarde të veçanta, që shpjegohen në leksionin B2. Për stilet e vezëve, në leksionin B4.`],
["Kohët: 7, 10, 30",`Tri numra që çdo anëtar i stafit të mëngjesit duhet t'i dijë përmendsh:
• 7 minuta: mëngjesi i ftohtë, si fruta, jogurt, granola, pastë, kroasanë, nga momenti i porosisë deri në tavolinë.
• 10 minuta: mëngjesi i nxehtë, si vezët, omëleta, pankeku, nga momenti i porosisë.
• 30 minuta: mëngjesi i plotë i nxehtë, kur mysafiri ka kërkesa të veçanta.

Si arrihen këto kohë:
• Porosia futet në sistem menjëherë, jo pasi kamarieri ka marrë edhe dy tavolina të tjera.
• Kuzhina e mëngjesit ka përgatitjen gati para hapjes.
• Kamarieri i thotë mysafirit kohën: “Omëleta juaj del për rreth 8 minuta.” Kjo i jep mysafirit siguri dhe e ndihmon të planifikojë.
• Nëse diçka vonohet, kamarieri e njofton mysafirin para se ai të pyesë.`],
["Kafeja e parë",`Për shumicën e mysafirëve, kafeja është arsyeja pse zgjohen. Prandaj kafeja e parë ka rëndësi më të madhe se çdo gjë tjetër në mëngjes.

Rregullat:
• Ofroje brenda 60 sekondave nga ulja, sipas HD20. Mos prit që mysafiri të shkojë në bufe.
• Pyet me opsione konkrete: “Kafe amerikane, espresso apo cappuccino?”
• Kafeja amerikane ose me filtër rimbushet pa u kërkuar, sipas HD22. Kur filxhani është në një të tretën, ofro rimbushjen.
• Kafeja shërbehet e nxehtë, me qumësht dhe sheqer pranë, dhe me filxhan të ngrohur.
• Ofro edhe çajrat specialë dhe alternativat: dekafeinato, çaj jeshil, çaj bimor.

Siç shpjegohet në Modulin 11, espresso shërbehet menjëherë sapo del nga makina. Në mëngjes, kur makina është e ngarkuar, kjo është sfida më e madhe.`],
["Mysafiri i mëngjesit",`Mysafiri i mëngjesit është ndryshe nga mysafiri i darkës. Në darkë, ai dëshiron përvojë; në mëngjes, dëshiron efikasitet të ngrohtë.

Lexo tavolinën:
• Laptop, telefon, kostum: mysafir pune me nxitim. Shërbim i shpejtë dhe diskret. Kafeja menjëherë, porosia shpejt, fatura gati.
• Familje me fëmijë, me pushime: më shumë kohë dhe ngrohtësi. Karrige për fëmijët, ndihmë me bufenë, një bisedë për planet e ditës.
• Çift me pushime: ritëm i qetë, mund të qëndrojnë gjatë.
• Mysafiri vetëm me gazetë ose libër: qetësi. Mos e ndërprit për t'i bërë pyetje që nuk janë të nevojshme.

Mysafiri i mëngjesit shpesh nuk dëshiron bisedë. Përshëndetja është e ngrohtë, por e shkurtër. Pyetjet janë vetëm ato të nevojshme.

» Skenë nga Flower: Në orën 7:15, një burrë ulet me laptop. Kamarieri: “Mirëmëngjes. Kafe?” “Po, një amerikane, të lutem.” Kafeja vjen brenda një minute. “Dëshironi diçka nga menuja, apo bufenë?” “Vetëm dy vezë poached me bukë të thekur. Kam takim në 8.” “Do t'i keni brenda 10 minutash.” Vezët vijnë në 9 minuta. Kafeja rimbushet pa u kërkuar. Në 7:45, kamarieri sjell faturën pa u kërkuar dhe thotë: “Suksese me takimin.”`],
["Përmbledhje",`Mëngjesi është vakti që ha pothuajse çdo mysafir, dhe inspektori e teston çdo ditë. Mysafiri ka nxitim, energji të ulët, dhe mëngjesi përcakton tonin e ditës. Kohët: 7 minuta për të ftohtin, 10 për të nxehtin, 30 për mëngjesin e plotë. Kafeja brenda 60 sekondave, e rimbushur pa u kërkuar. Lëngje të freskëta, fruta, bukë të shumëllojshme dhe opsione të shëndetshme. Dhe lexo tavolinën: efikasitet për mysafirin e punës, ngrohtësi për familjen.`]
];
LEC.B2=[
["Hyrje: psikologjia e bufesë",`Bufeja e mëngjesit është vendi ku mysafiri ushqehet vetë, por kjo nuk do të thotë që nuk ka shërbim. Përkundrazi, bufeja kërkon një lloj shërbimi më të vështirë: shërbimin që nuk duket. Mysafiri duhet të gjejë gjithmonë enët plot, ushqimin të freskët, takëmet në vend dhe etiketat të qarta, pa e parë kurrë stafin duke vrapuar.

Mysafiri që sheh një enë gati bosh mendon “më ka mbetur fundi”, edhe kur ushqimi është i freskët. Bufeja e mbushur jep ndjesinë e bollëkut, që është thelbi i luksit. Prandaj Forbes ka disa standarde specifike për bufenë, që ky leksion i shpjegon.`],
["Standardet e Forbes për bufenë",`• HD41: lëvizje e lehtë rreth bufesë; mjaft pjata dhe takëme.
• HD42: asnjë enë më bosh se një e katërta, asnjë kanë lëngu më bosh se gjysma.
• HD43: prezantim jashtëzakonisht tërheqës.
• HD44: stacion à la minute për vezë dhe pjata të nxehta.
• HD45: përzgjedhje e menduar ndërkombëtare.
• HD46: etiketa të qarta dhe elegante.
• HD47: stafi i bufesë i sjellshëm dhe ndihmues.

Standardi më i matshëm është HD42. Inspektori e kontrollon disa herë gjatë mëngjesit, dhe veçanërisht në fund, kur stafi mendon se nuk ka më rëndësi.`],
["Rrjedha e lëvizjes",`Bufeja organizohet në rendin që mysafiri ha:
• Pjatat dhe takëmet në fillim, që mysafiri t'i marrë para se të fillojë.
• Pastaj të ftohtat: frutat, jogurtet, djathërat, mishrat e ftohtë, sallatat.
• Pastaj të nxehtat: vezët, proshuta, sallsiçet, perimet e pjekura.
• Bukët dhe pastat, me tosterin pranë.
• Ëmbëlsirat dhe kroasanët.
• Lëngjet, kafeja dhe çaji ndaras, që të mos krijohet radhë para ushqimit.

Kjo rrjedhë shmang përplasjet dhe radhët. Kur mysafiri duhet të kthehet mbrapsht për të marrë një pjatë ose të presë pas dikujt që po mbush kafe, bufeja është e organizuar keq.

Stacioni à la minute, ku kuzhinieri gatuan vezë dhe pjata të nxehta sipas porosisë, vendoset në një pozicion ku radha nuk bllokon bufenë.`],
["Rregulli i një të katërtës",`HD42 kërkon që asnjë enë të mos jetë më bosh se një e katërta, dhe asnjë kanë lëngu më bosh se gjysma. Si arrihet kjo në praktikë:
• Një person i dedikuar për bufenë, që nuk merr porosi dhe nuk shërben tavolina.
• Rrotullim çdo 5 minuta: ky person kalon gjithë bufenë dhe kontrollon çdo enë.
• Ena e re zëvendëson të vjetrën. Nuk derdhet ushqim i ri mbi të vjetrin, sepse kjo përzien ushqim të freskët me ushqim që ka qëndruar dhe krijon rrezik higjienik.
• Ena e re përgatitet para se e vjetra të mbarojë. Kur ena arrin gjysmën, kuzhina njoftohet.
• Në orët e pikut, rrotullimi bëhet më shpesh.

Në fund të mëngjesit, rregulli vazhdon. Mysafiri që vjen 15 minuta para mbylljes paguan të njëjtën gjë si ai që vjen në hapje, dhe meriton të njëjtën bufe. Mund të përdoren enë më të vogla për të mos humbur ushqim, por ato duhet të jenë plot.`],
["Etiketat dhe alergjenët",`HD46 kërkon etiketa të qarta dhe elegante. Çdo pjatë në bufe ka etiketën e vet, me:
• Emrin e pjatës në shqip dhe në anglisht.
• Ikonat e alergjenëve kryesorë, siç shpjegohet në Modulin 8.
• Shënimin “vegjetariane” ose “vegane” kur vlen.

Etiketat duhet të jenë të sakta. Nëse kuzhina ndryshon pjatën, etiketa ndryshon. Një etiketë që thotë “pa gluten” mbi një pjatë që ka gluten është rrezik serioz për shëndetin e mysafirit.

Mysafiri me alergji të rënda nuk duhet të mbështetet vetëm te etiketa. Stafi i bufesë duhet ta ndihmojë, ta pyesë dhe, nëse duhet, t'i përgatisë një pjatë të veçantë nga kuzhina, ku rreziku i kontaminimit është më i vogël se në bufe.`],
["Temperaturat dhe higjiena",`Bufeja ka rrezik të madh higjienik, sepse ushqimi qëndron i ekspozuar për orë të tëra dhe preket nga shumë mysafirë.

Temperaturat:
• Ushqimi i nxehtë mbahet mbi 63 gradë.
• Ushqimi i ftohtë mbahet nën 5 gradë.
• Kontrolli me termometër çdo orë dhe shënim në regjistër, siç shpjegohet në Modulin 16.

Higjiena:
• Një lugë ose pirun shërbimi për çdo enë, me dorezën jashtë, që mysafiri të mos e prekë ushqimin.
• Kapakët e enëve të nxehta mbyllen kur nuk përdoren.
• Asnjë pjatë e përdorur nuk lihet mbi bufe; hiqet menjëherë.
• Bufeja fshihet vazhdimisht nga thërrimet dhe pikat.
• Mbrojtëset e spërkatjes, kur ka, mbahen të pastra.

Ushqimi që ka qëndruar në bufe gjatë gjithë mëngjesit nuk ruhet për të nesërmen.`],
["Stafi i bufesë",`HD47 kërkon që stafi i bufesë të jetë i sjellshëm dhe ndihmues. Stafi i bufesë nuk është vetëm ai që rimbush enët. Është nikoqir:
• Përshëndet mysafirët që vijnë në bufe.
• Ofron ndihmë: “Dëshironi t'jua sjell në tavolinë?” sidomos për mysafirët e moshuar, për prindërit me fëmijë të vegjël ose për ata që mbajnë shumë gjëra.
• Shpjegon pjatat, sidomos ato vendase që mysafiri i huaj nuk i njeh. Kjo kërkon që stafi të dijë çdo pjatë të bufesë së ditës.
• Në stacionin à la minute, kuzhinieri përshëndet, merr porosinë, pyet për përbërësit dhe ofron ta sjellë në tavolinë që mysafiri të mos presë në këmbë.

» Skenë nga Flower: Një gjyshe me dy nipër të vegjël po përpiqet të mbushë tri pjata. Stafi i bufesë i afrohet: “Mirëmëngjes. Më lejoni t'ju ndihmoj. Uluni, unë do t'jua sjell. Çfarë dëshirojnë fëmijët?” Pas dy minutash, tri pjatat janë në tavolinë, me dy gota lëng portokalli të freskët.`],
["Përmbledhje",`Bufeja e mbushur jep ndjesinë e bollëkut. Asnjë enë më bosh se një e katërta, asnjë kanë lëngu më bosh se gjysma. Një person i dedikuar, rrotullim çdo 5 minuta, ena e re zëvendëson të vjetrën. Rrjedha sipas rendit që mysafiri ha. Etiketa të sakta në dy gjuhë, me alergjenët. Të nxehtat mbi 63 gradë, të ftohtat nën 5, të kontrolluara çdo orë. Dhe stafi i bufesë është nikoqir, jo vetëm ai që rimbush.`]
];
LEC.B3=[
["Hyrje: efikasitet i ngrohtë",`Shërbimi i mëngjesit në tavolinë është ndryshe nga shërbimi i darkës. Në darkë, mysafiri ka kohë dhe dëshiron përvojë: prezantime, histori, ritëm të qetë. Në mëngjes, mysafiri dëshiron që gjithçka të ndodhë pa pasur nevojë të kërkojë: kafeja vjen para se ta kërkojë, porosia merret shpejt, pjatat hiqen kur shkon në bufe, fatura është gati kur ngrihet.
