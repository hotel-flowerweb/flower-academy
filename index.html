• Karroca të paktën një metër larg perdeve, dekorimeve, bimëve dhe mysafirëve.
• Alkooli derdhet nga një gotë e vogël e matur, kurrë drejtpërdrejt nga shishja. Flaka mund të ngjitet në shishe dhe ta bëjë të shpërthejë.
• Shishja nuk qëndron kurrë mbi karrocë gjatë flambé-së.
• Fikësi i zjarrit ose batanija kundër zjarrit duhet të jetë afër dhe stafi duhet ta dijë si përdoret.
• Asnjë flambé jashtë në erë ose nën tenda.
• Flokët e gjatë të lidhur, mëngët larg flakës.

Hapat e flambé-së:
• Ngroh tiganin dhe gatuaj bazën, për shembull gjalpin, sheqerin dhe frutat.
• Largo tiganin nga flaka.
• Shto alkoolin nga gota e vogël.
• Ktheje tiganin te flaka dhe anoje lehtë që avujt e alkoolit të ndizen, ose ndize me një shkrepëse të gjatë.
• Prit derisa flaka të shuhet vetë. Mos e fryj dhe mos e mbulo menjëherë.
• Shërbeje në pjatat e ngrohura.

» Skenë nga Flower: Një çift feston përvjetorin dhe kamarieri u ofron një ëmbëlsirë me flambé. Karroca vendoset larg perdeve, me fikësin poshtë. Kamarieri shpjegon çfarë po bën ndërsa punon. Kur flaka ngrihet, çifti buzëqesh dhe zonja nxjerr telefonin për ta filmuar. Flaka shuhet vetë pas disa sekondash dhe ëmbëlsira shërbehet e ngrohtë.`],
["Certifikimi në Flower",`Shërbimi guéridon dhe flambé bëhen vetëm nga stafi që shefi i kuzhinës ose drejtuesi i restorantit e ka certifikuar. Certifikimi kërkon:
• Praktikë e teknikave larg mysafirëve, me supervizim.
• Demonstrim i suksesshëm para shefit.
• Njohja e rregullave të sigurisë dhe e përdorimit të fikësit.

Kamarierët që nuk janë certifikuar mund të ndihmojnë me përgatitjen e karrocës dhe me shërbimin e pjatave pas prerjes, por nuk bëjnë vetë filetimin ose flambé-në.`],
["Përmbledhje",`Guéridon-i dhe silver service krijojnë momente teatri që mysafiri i kujton. Karroca përgatitet plotësisht para se të afrohet. Luga dhe piruni në një dorë praktikohen me bukë dhe fasule para shërbimit real. Peshku filetohet në tre deri në pesë minuta, nga lëkura te kocka. Mishi pritet kundër fijeve, në feta të barabarta. Flambé bëhet me alkool nga gota, kurrë nga shishja, një metër larg çdo gjëje që digjet, me fikësin afër. Dhe vetëm stafi i certifikuar e bën.`]
];
LEC.P1=[
["Hyrje: shërbimi fitohet para se të hapen dyert",`Ka një thënie të vjetër në kuzhinat profesionale: shërbimi fitohet ose humbet para se të hyjë mysafiri i parë. Kjo vlen po aq edhe për sallën. Një kamarier që duhet të shkojë në magazinë për një pecetë gjatë shërbimit nuk është i ngadaltë, është i papërgatitur. Dhe çdo minutë që kalon jashtë sallës është një minutë pa sy mbi tavolinat.

Ky leksion shpjegon parimin e mise en place, si e zbatojmë në stacionet e shërbimit, në sallë dhe në bar, dhe si e kontrollojmë para çdo hapjeje.`],
["Origjina e parimit",`“Mise en place” është shprehje franceze që do të thotë “vënë në vend”. Parimi u bë baza e kuzhinës profesionale moderne falë Auguste Escoffier, kuzhinierit francez që në fund të shekullit të nëntëmbëdhjetë organizoi kuzhinat e hoteleve të mëdha si Savoy në Londër dhe Ritz në Paris. Escoffier krijoi sistemin e brigadës, ku çdo kuzhinier ka stacionin e vet, dhe vendosi rregullin që çdo gjë përgatitet para shërbimit: perimet të prera, salcat gati, mjetet në vend.

Ideja është e thjeshtë. Gjatë shërbimit nuk ka kohë për të menduar ku janë gjërat ose për t'i përgatitur. Gjatë shërbimit vetëm ekzekutohet. E gjithë puna e përgatitjes bëhet më parë, në qetësi.

Në sallë, mise en place do të thotë që çdo gjë që mund të të duhet gjatë turnit është në stacionin tënd, në vendin e vet, para se të hapen dyert.`],
["Pse lidhet me Forbes",`Kur analizojmë pse humbasin standardet e efikasitetit, si përshëndetja brenda 60 sekondave, pija brenda katër minutave ose rimbushja brenda një minute, shpesh zbulojmë që stafi nuk ishte i ngadaltë. Ishte larg. Kishte vrapuar në magazinë për gota, në lavanderi për peceta, në kuzhinë për lugë ëmbëlsire.

Çdo largim nga salla ka një kosto të dyfishtë. E para, detyra që po bën zgjat më shumë. E dyta, gjatë asaj kohe askush nuk po vëzhgon zonën tënde. Tavolina e re pret pa përshëndetje, gota bosh nuk vihet re, mysafiri që kërkon me sy nuk gjen askënd.

Mise en place e mirë është mënyra më e thjeshtë për të përmirësuar të gjitha kohët njëkohësisht.`],
["Stacioni i shërbimit",`Stacioni i shërbimit, i quajtur edhe side station, është kuzhina e kamarierit. Është vendi ku gjen gjithçka që të duhet për zonën tënde. Në Flower, çdo stacion ka të njëjtin plan, që çdo koleg të gjejë gjithçka pa pyetur, edhe kur punon në një zonë që nuk është e tija.

Çfarë ka në stacion:
• Takëme rezervë për rreth dy rrotullime të tavolinave të zonës: pirunë, thika, lugë, thika peshku, thika bifteku, takëme ëmbëlsire.
• Peceta liri të hekurosura dhe të palosura.
• Pjata buke dhe sous-assiette rezervë.
• Tabaka të pastra.
• Crumber për thërrimet.
• Hapëse vere dhe peceta shërbimi.
• Karafa uji të mbushura ose gati për t'u mbushur.
• Menutë, të kontrolluara faqe për faqe, pa njolla.
• Mbajtëset e faturës, stilolapsa që punojnë.
• POS-i i lëvizshëm, i karikuar plotësisht.
• Gota uji dhe vere rezervë, të polishuara.

Stacioni mbahet i rregullt gjatë gjithë turnit. Mysafirët e shohin, prandaj nuk ka gota të përdorura, lecka ose sende personale në pamje.`],
["Salla",`Mise en place e sallës përfshin gjithçka që mysafiri sheh dhe ndjen kur hyn.

• Tavolinat të niveluara, pa lëkundje. Kontrollohet çdo tavolinë duke e shtyrë lehtë nga qoshet.
• Karriget në distancë të barabartë nga tavolina dhe nga njëra-tjetra.
• Mbulesat pa rrudha, të vendosura drejt, me të njëjtën gjatësi të varur nga çdo anë.
• Tavolinat të shtruara sipas standardit, të gjitha njësoj.
• Ndriçimi në nivelin e mbrëmjes. Drita e drekës dhe drita e darkës nuk janë të njëjta.
• Muzika në volumin e duhur, që lejon bisedën pa ngritur zërin.
• Temperatura rreth 21 deri në 23 gradë.
• Qirinjtë ose llambat e tavolinave gati për t'u ndezur.
• Në terrasën e Garden: batanijet gati, tendat ose ombrellat të kontrolluara, ngrohëset nëse ka.

Një nga mënyrat më të mira për të kontrolluar sallën është ta shohësh nga hyrja, si mysafiri, dhe pastaj të ulesh në disa karrige për ta parë nga lartësia e mysafirit të ulur.`],
["Bari",`Mise en place e barit është veçanërisht e rëndësishme sepse barmeni punon para syve të mysafirit dhe çdo mungesë duket menjëherë.

• Akulli i mbushur në sasi të mjaftueshme për të gjithë turnin, në lloje të ndryshme: kube, akull i thyer, kube të mëdha ose sfera.
• Garniturat të prera të freskëta: lëkurë portokalli dhe limoni, fetat e frutave, barishtet. Jo më shumë se për një turn, që të mos thahen.
• Shurupet dhe lëngjet e freskëta gati dhe të datuara.
• Shishet e hapura të datuara, sidomos vermutët dhe verërat me gotë, që humbasin cilësinë pas hapjes.
• Gotat e polishuara dhe të kontrolluara kundër dritës.
• Snacks-at gati për t'u shërbyer: ullinj, bajame, chips të shtëpisë.
• Coaster-at, pecetat e liri dhe menutë e pijeve të pastra.
• Mjetet e barit në vend: jigger-ë, shaker-a, lugë barmeni, sita, mjete për shtypje.

Me pak fjalë, barmeni nuk duhet të largohet nga banaku gjatë shërbimit për asnjë arsye përveç emergjencës.`],
["Kontrolli 15 minuta para hapjes",`Mise en place nuk konsiderohet e mbaruar derisa të kontrollohet. Rreth 15 minuta para hapjes, supervizori kalon nëpër sallë, stacione dhe bar me listën e kontrollit. Kjo nuk është mosbesim te stafi. Është sistemi që siguron që asgjë nuk harrohet në një ditë të ngarkuar.

Lista e kontrollit përfshin të gjitha pikat e mësipërme. Çdo gjë që mungon ose nuk është në standard rregullohet para hapjes. Asgjë nuk hapet pa këtë kontroll.

» Skenë nga Garden: E premte, ora 18:45, hapja në 19:00. Supervizori kalon nëpër sallë dhe vëren që stacioni 2 ka vetëm dy thika bifteku, ndërsa rezervimet tregojnë tri tavolina që kanë porositur paraprakisht tomahawk. Kamarieri i stacionit sjell gjashtë thika të tjera. Në tavolinën 9, një gotë uji ka një njollë të vogël kundër dritës. Ndërrohet. Ora 18:58, gjithçka gati. Në orën 21:00, kur tri tavolina porositin mish njëkohësisht, askush nuk vrapon.`],
["Përmbledhje",`Mise en place do të thotë që çdo gjë është gati dhe në vendin e vet para shërbimit. Parimi vjen nga Escoffier dhe kuzhina profesionale. Lidhet drejtpërdrejt me standardet Forbes të efikasitetit, sepse çdo largim nga salla është një minutë pa sy mbi tavolinat. Stacioni i shërbimit ka të njëjtin plan kudo, salla kontrollohet nga sytë e mysafirit, bari ka gjithçka që i duhet për të mos u larguar nga banaku. Dhe asgjë nuk hapet pa kontrollin 15 minuta para.`]
];
LEC.P2=[
["Hyrje: tavolina që flet para kamarierit",`Përpara se mysafiri të ulet, tavolina i ka thënë tashmë diçka për restorantin. Një tavolinë e shtruar në mënyrë perfekte, me takëme në vijë, gota që shkëlqejnë dhe pecetë të palosur me kujdes, i thotë “këtu çdo detaj ka rëndësi”. Një tavolinë me një pirun të shtrembër ose me një gotë jashtë vendit i thotë të kundërtën.

Ky leksion shpjegon logjikën e shtrimit klasik, masat e sakta që përdorim në Flower dhe si e shtrojmë një tavolinë à la carte dhe një me menu të plotë. Skemat në këtë mësim tregojnë të dy shtrimet vizualisht.`],
["Logjika e shtrimit",`Shtrimi klasik i tavolinës nuk është një rregull arbitrar. Ka një logjikë që e ndihmon mysafirin të mos mendojë kurrë “cilin pirun duhet të përdor?”.

Parimi bazë: takëmet përdoren nga jashtë drejt brendësisë, në rendin e pjatave. Takëmi më i largët nga pjata është për pjatën e parë. Takëmi më afër pjatës është për pjatën e fundit para ëmbëlsirës. Kështu, mysafiri thjesht merr takëmin më të jashtëm për çdo pjatë.

Rregullat e tjera:
• Pirunët në të majtë të pjatës, sepse mbahen me dorën e majtë.
• Thikat dhe lugët në të djathtë, sepse mbahen me dorën e djathtë.
• Tehu i thikës gjithmonë drejt pjatës. Kjo ka origjinë historike, si shenjë mirësjelljeje, dhe praktike, që teha të mos jetë drejt mysafirit fqinj.
• Takëmet e ëmbëlsirës mbi pjatë, horizontalisht.
• Gotat mbi thikë, në të djathtë, në rendin e përdorimit.
• Pjata e bukës në të majtë, mbi pirunët.

Kjo logjikë është e njëjtë në pjesën më të madhe të botës, prandaj një mysafir ndërkombëtar e njeh menjëherë.`],
["Mbulesa dhe pjata",`“Mbulesa”, ose “cover” në anglisht, është hapësira e një mysafiri në tavolinë. Çdo vend zë rreth 60 centimetra gjerësi. Më pak se kaq dhe mysafirët ndihen të ngushtë, bërrylat prekin njëri-tjetrin.

Në qendër të mbulesës vendoset pjata ose sous-assiette-ja, pjata dekorative që qëndron poshtë pjatave të shërbimit. Ajo vendoset rreth një deri në dy centimetra nga buza e tavolinës. Nëse ka logo, logoja vendoset në orën dymbëdhjetë, larg mysafirit, që të lexohet drejt prej tij.

Distanca nga buza duhet të jetë e njëjtë për të gjitha vendet. Kjo është ajo që e bën sallën të duket e rregullt nga larg.`],
["Takëmet",`Takëmet vendosen rreth një deri në dy centimetra nga buza e tavolinës, paralel me njëri-tjetrin dhe pingul me buzën. Fundet e dorezave janë në të njëjtën vijë, përveç kur shtrohen shumë takëme dhe disa ngrihen pak më lart për të kursyer hapësirë.

Në të majtë të pjatës:
• Piruni kryesor afër pjatës.
• Piruni i antipastës ose i sallatës më jashtë, nëse shtrohet.

Në të djathtë të pjatës:
• Thika kryesore afër pjatës, me tehun drejt saj.
• Thika e antipastës më jashtë, nëse shtrohet.
• Luga e supës më jashtë thikave, nëse ka supë.

Mbi pjatë:
• Luga e ëmbëlsirës me dorezën nga e djathta.
• Piruni i ëmbëlsirës poshtë saj, me dorezën nga e majta.

Kjo pozicion i dorezave i lejon mysafirit t'i ulë takëmet e ëmbëlsirës natyrshëm, lugën në të djathtë dhe pirunin në të majtë.`],
["Pjata e bukës",`Pjata e bukës vendoset në të majtë, mbi pirunët, rreth majave të tyre. Thika e gjalpit vendoset mbi pjatën e bukës, në anën e djathtë të saj, me tehun nga e majta.

Një truk i thjeshtë për të mos ngatërruar pjatën e bukës me atë të fqinjit: bëj një “OK” me të dy duart, duke bashkuar gishtin e madh me treguesin. Dora e majtë formon shkronjën “b”, si bread, bukë. Dora e djathtë formon “d”, si drink, pije. Buka në të majtë, pijet në të djathtë.`],
["Gotat",`Gota e ujit vendoset mbi majën e thikës kryesore. Kjo është pika e referimit për gotat e tjera.

Gotat e verës vendosen në të djathtë të gotës së ujit, në rendin e përdorimit. Në à la carte zakonisht shtrohet gota e ujit dhe një gotë vere universale, dhe gotat e tjera sillen sipas porosisë. Në menu të plotë mund të shtrohen:
• Gota e verës së bardhë, më e vogël.
• Gota e verës së kuqe, më e madhe.
• Flute ose gota e shampanjës, prapa.

Gotat mund të rregullohen në vijë diagonale, nga lart majtas poshtë djathtas, ose në trekëndësh. E rëndësishme është që sistemi të jetë i njëjtë në të gjitha tavolinat dhe që gotat të mos pengojnë njëra-tjetrën kur mysafiri merr njërën.

Gotat vendosen gjithmonë duke i kapur nga këmba, të polishuara dhe të kontrolluara kundër dritës.`],
["Peceta dhe qendra e tavolinës",`Peceta e liri paloset njësoj në të gjitha tavolinat, sipas modelit të Flower, dhe vendoset në qendër të mbulesës, mbi pjatë, ose në të majtë të pirunëve. Duhet të jetë e pastër, e hekurosur dhe pa qime. Pecetat me forma të ndërlikuara janë dalë nga moda në restorantet luksoze. Sot preferohet një palosje e thjeshtë dhe elegante, që prek sa më pak pecetën.

Në qendër të tavolinës vendosen:
• Kripa dhe piperi.
• Lule të freskëta, me lartësi të ulët dhe pa erë të fortë që ndërhyn me aromën e ushqimit dhe të verës.
• Qiri ose llambë tavoline në darkë.

Rregulli i qendrës: asgjë nuk duhet të pengojë kontaktin me sy midis mysafirëve. Nëse mysafirët duhet të anohen për të parë njëri-tjetrin, dekorimi është shumë i lartë.`],
["Kontrolli final",`Pas shtrimit, tavolina kontrollohet nga dy pikëpamje:
• Nga lartësia e mysafirit të ulur. Ulu në një karrige dhe shiko: a është çdo gjë në vijë? A ka njolla në gota? A lëkundet tavolina?
• Nga hyrja e sallës. Shiko sallën si mysafiri që hyn: a janë të gjitha tavolinat njësoj? A ka ndonjë që bie në sy?

» Skenë nga Flower: Para hapjes, kamarieri i ri shtron gjashtë tavolina. Supervizori ulet në njërën dhe vëren që thika është 3 centimetra nga buza ndërsa piruni 1 centimetër. Nga larg duket sikur takëmet janë të shtrembra. Kamarieri i rregullon me gishtat si masë, dy gishta nga buza, dhe i kontrollon të gjitha tavolinat. Nga hyrja, salla tani duket si një vijë e vetme.`],
["Përmbledhje",`Takëmet përdoren nga jashtë drejt brendësisë. Pirunët në të majtë, thikat dhe lugët në të djathtë, tehu drejt pjatës, takëmet e ëmbëlsirës sipër. Çdo vend 60 centimetra, pjata dhe takëmet një deri në dy centimetra nga buza. Pjata e bukës në të majtë, gotat në të djathtë mbi thikë. Peceta njësoj kudo, qendra e ulët. Dhe kontrolli final nga sytë e mysafirit të ulur dhe nga hyrja.`]
];
LEC.P3=[
["Hyrje: prova e asaj që nuk shihet",`Mysafiri nuk e sheh kuzhinën. Nuk e sheh lavastovilen, magazinën, frigoriferët. Por e sheh gotën që ka përpara. Dhe nga ajo gotë nxjerr përfundime për gjithçka tjetër. Një njollë në gotë, një gjurmë buzësh në buzë ose një çarje e vogël është për mysafirin “prova” që diçka nuk shkon edhe në vendet që nuk duken.

Forbes e mat pastërtinë në çdo pjesë: HD50 për pecetat dhe lirin, HD52 për gotat, porcelanin dhe takëmet, BL39 për barin. Ky leksion shpjegon si i përgatisim dhe i kontrollojmë gotat, takëmet, porcelanin dhe lirin, dhe pse teknikat që përdorim funksionojnë.`],
["Kimia e njollave dhe e polishimit",`Njollat që shohim në gota pas larjes nuk janë papastërti në kuptimin e zakonshëm. Janë kripëra minerale, kryesisht kalcium dhe magnez, që ndodhen në ujë. Kur uji avullon nga sipërfaqja e gotës, kripërat mbeten dhe formojnë ato pika dhe vija të bardha që duken kundër dritës. Sa më i fortë uji, aq më shumë njolla.

Polishimi i heq këto njolla në dy hapa. Së pari, avulli i ujit të nxehtë i tret pjesërisht kripërat dhe i lagë sipërfaqen. Së dyti, një leckë mikrofibër i mbledh pa lënë gjurmë. Lecka e mikrofibrës ka fije shumë të holla që kapin grimcat në vend që t'i shtyjnë. Leckat e zakonshme të pambukut, ose peshqirët e kuzhinës, lënë qime në gotë, që duken edhe më keq se njollat.

Kjo është arsyeja pse në Flower nuk polishojmë kurrë me leckë të zakonshme dhe nuk polishojmë gota të ftohta pa avull.`],
["Polishimi i gotave hap pas hapi",`Teknika e polishimit të gotave me këmbë:
• Merr gotën e larë dhe të ftohur pak, që të mos djegë duart.
• Mbaje mbi një enë me ujë të nxehtë, me kupën poshtë, për dy deri në tre sekonda, që avulli të hyjë brenda.
• Merr leckën e mikrofibrës me të dyja duart. Me njërën dorë, përmes leckës, mbaje gotën nga baza e këmbës.
• Me dorën tjetër, fut leckën brenda kupës me gishtin e madh dhe rrotulloje butë kupën, duke mbajtur bazën të palëvizur ose duke e rrotulluar në të njëjtin drejtim.
• Polisho pastaj pjesën e jashtme të kupës, këmbën dhe bazën.
• Kontrolloje kundër dritës.

Kujdes me një gabim që thyen shumë gota: mos e rrotullo këmbën dhe kupën në drejtime të kundërta. Kjo krijon një forcë përdredhëse në pikën më të dobët të gotës, aty ku këmba takohet me kupën, dhe gota thyhet në dorë. Kjo mund të shkaktojë edhe plagë të rënda.

Gjatë gjithë procesit, gishtat nuk prekin gotën direkt. Prekja e lëkurës lë gjurmë yndyre që duken kundër dritës.`],
["Kontrolli kundër dritës",`Çdo gotë që del në sallë kontrollohet kundër dritës. Kjo është hapi i fundit dhe më i rëndësishmi. Ngrije gotën drejt një burimi drite, ose drejt një sipërfaqeje të bardhë të ndriçuar, dhe kërko:
• Njolla uji ose pika.
• Gjurmë buzësh në buzë, sidomos buzëkuq.
• Gjurmë gishtash.
• Qime nga lecka.
• Çarje ose copa të thyera në buzë.
• Turbullim, që mund të tregojë dëmtim nga lavastovilja.

Gota me çarje ose me buzë të thyer hidhet menjëherë, edhe kur çarja është e vogël. Kjo nuk është vetëm çështje estetike. Një buzë e thyer mund të presë buzën e mysafirit, dhe një çarje mund ta bëjë gotën të thyhet në dorë.`],
["Takëmet",`Takëmet polishohen me një teknikë të ngjashme. Zhyten në ujë të nxehtë me pak uthull të bardhë, që ndihmon të tretë kripërat dhe yndyrën, dhe pastaj fshihen me leckë mikrofibër, një nga një.

Rregullat për takëmet:
• Mbahen gjithmonë nga doreza, me leckë, kurrë nga pjesa që shkon në gojë.
• Kontrollohen për njolla, gjurmë gishtash dhe mbetje ushqimi që lavastovilja nuk i ka hequr, sidomos midis majave të pirunit.
• Takëmet e përkulura ose të gërvishtura hiqen nga qarkullimi.
• Ruhen në kuti të mbuluara, të ndara sipas llojit, larg pluhurit.

Kur sillen takëme te tavolina gjatë shërbimit, sillen mbi një pjatë të vogël me pecetë ose mbi tabaka, jo në dorë të zhveshur.`],
["Porcelani",`Pjatat, filxhanët dhe enët e porcelanit kontrollohen për:
• Çarje, edhe të vogla, sidomos në buzë.
• Gërvishtje të thella në sipërfaqen e ngrënies, që krijohen nga thikat me kohë.
• Njolla që nuk dalin me larje, sidomos në filxhanët e kafesë dhe të çajit.

Pjatat e plasaritura dalin nga qarkullimi edhe kur duken “të vogla”. Një çarje është vend ku grumbullohen bakteret dhe ku pjata mund të thyhet nga nxehtësia. Për Forbes, një pjatë me çarje është standard i humbur menjëherë.

Pjatat e nxehta ruhen në ngrohëse pjatash, që ushqimi i nxehtë të mos ftohet sapo vendoset. Pjatat e ftohta ruhen në frigorifer ose në vend të freskët.`],
["Liri",`Pecetat dhe mbulesat e liri janë pjesë e elementeve të luksit. Mysafiri i prek me duar dhe me buzë, prandaj pastërtia e tyre ka rëndësi të veçantë.

• Pecetat dhe mbulesat duhet të jenë të hekurosura, pa rrudha.
• Pa njolla, edhe të vogla ose të zbehta.
• Pa vrima, pa fije të dala, pa buzë të prishura.
• Ruhen të palosura, të mbuluara dhe larg ushqimit dhe pijeve.
• Pecetat e përdorura nuk ripërdoren kurrë, as për pastrim.

Kur një pecetë bie në dysheme, zëvendësohet menjëherë me një të re, e sjellë mbi pjatë ose mbi tabaka, pa pritur që mysafiri ta kërkojë.

» Skenë nga Flower: Para turnit të darkës, kamarieri polishon gotat e verës për zonën e vet. Gjen një gotë Bordeaux që duket e pastër, por kundër dritës ka një çarje të hollë në buzë, mezi të dukshme. E vendos menjëherë në kutinë e gotave të thyera dhe njofton supervizorin për stokun. Atë mbrëmje, ajo gotë mund të kishte shkuar te një mysafir me një shishe Nuits-Saint-Georges.`],
["Përmbledhje",`Njollat janë kripëra minerale që hiqen me avull dhe me mikrofibër. Gotat polishohen me dy duar, pa e rrotulluar këmbën dhe kupën në drejtime të kundërta, dhe kontrollohen kundër dritës. Gota me çarje hidhet. Takëmet polishohen në ujë të nxehtë me uthull dhe mbahen nga doreza. Porcelani me çarje del nga qarkullimi. Liri është i hekurosur, pa njolla, dhe peceta e rënë zëvendësohet menjëherë.`]
];
LEC.P4=[
["Hyrje: shtrimi ndjek shërbimin",`Nuk ka një shtrim të vetëm të saktë. Shtrimi i duhur varet nga lloji i shërbimit: një tavolinë à la carte në një mbrëmje të zakonshme, një menu degustuese me dhjetë pjata, një darkë private për një kompani ose një banket me njëqind persona. Secili ka logjikën e vet.

Ky leksion shpjegon dallimet dhe si e përgatisim sallën për secilin rast, duke u bazuar te rregullat e shtrimit nga leksioni i mëparshëm.`],
["À la carte: minimumi dhe rregullimi",`Në à la carte, mysafiri zgjedh pjatat nga menuja, prandaj nuk e dimë që në fillim çfarë takëmesh do t'i duhen. Për këtë arsye shtrohet minimumi:
• Pjata ose sous-assiette-ja.
• Piruni dhe thika kryesore.
• Pjata e bukës me thikën e gjalpit.
• Gota e ujit dhe një gotë vere.
• Peceta.

Pasi merret porosia, kamarieri rregullon takëmet sipas pjatave të zgjedhura: shton thikën e peshkut për levrekun, lugën e supës, thikën e biftekut për tomahawk-un, dhe heq ato që nuk duhen. Ky është hapi 10 i ciklit të shërbimit.

Avantazhi i këtij sistemi është që tavolina mbetet e pastër dhe e thjeshtë, dhe mysafiri përdor vetëm atë që i duhet. Kërkon që kamarieri të jetë i vëmendshëm dhe ta bëjë rregullimin para se të vijë pjata.`],
["Menuja degustuese",`Menuja degustuese ka shumë pjata, dhjetë në Flower dhe nëntë në Garden. Nëse do të shtroheshin të gjitha takëmet që në fillim, tavolina do të ishte e mbushur me metal dhe mysafiri do të ndihej i humbur.

Praktika moderne, që përdorim edhe ne, është:
• Maksimumi tre takëme në çdo anë të pjatës.
• Takëmet e pjatave të tjera sillen me pjatën përkatëse, ose pak para saj, mbi një pjatë të vogël ose mbi një pecetë.
• Pas çdo pjate, takëmet e përdorura hiqen bashkë me pjatën.
• Për pjatat që kanë takëme të veçanta, si një lugë e vogël për një amuse-bouche, takëmi vjen bashkë me pjatën.

Gotat për çiftimin e verërave, nëse mysafiri e ka zgjedhur, mund të sillen me çdo verë të re, në vend që të shtrohen të gjitha që në fillim.

Ky sistem e mban tavolinën elegante dhe i jep kamarierit kontroll të plotë mbi ritmin.`],
["Darka private",`Darka private është një event i organizuar për një grup të caktuar: një kompani, një familje që feston, një grup miqsh. Organizatori zakonisht ka zgjedhur menunë paraprakisht dhe ka kërkesa specifike.

Përgatitja e darkës private përfshin:
• Kartat e emrave në çdo vend, sipas planit të uljes të konfirmuar me organizatorin.
• Menunë e printuar, shpesh me emrin e rastit ose të kompanisë dhe me datën.
• Alergjitë dhe kërkesat ushqimore të shënuara për çdo vend në planin e uljes, që kuzhina dhe kamarierët ta dinë saktësisht kush ka çfarë.
• Takëmet të shtruara që në fillim, sepse menuja dihet.
• Dekorimin e kërkuar nga organizatori, nëse ka.

Para darkës, supervizori bën një takim të shkurtër me ekipin për të kaluar menunë, ritmin, alergjitë dhe çdo moment të veçantë, si një fjalim ose një tortë.`],
["Banketi",`Banketi është shërbim për një grup të madh, zakonisht në tavolina të rrumbullakëta. Në banket, uniformiteti është gjithçka. Kur njëqind persona janë ulur në një sallë, çdo tavolinë që ndryshon nga të tjerat bie në sy.

Standardet e banketit:
• Tavolina të rrumbullakëta me rreth dhjetë vende, rreth 60 centimetra për çdo vend.
• Karriget në vijë, në distancë të barabartë.
• Rrugët e shërbimit midis tavolinave të lira, të gjera sa për dy kamarierë me tabaka.
• Stacionet e shërbimit të shpërndara, rreth një për çdo tre deri në katër tavolina.
• Shërbimi i njëkohshëm, me një kamarier për rreth tetë deri në dhjetë mysafirë.
• Një kapiten salle që koordinon dhe jep sinjalin për çdo pjatë.

Në banketet më formale, të gjithë kamarierët hyjnë në sallë bashkë, vendosen pas mysafirëve të tavolinës së tyre dhe vendosin pjatat në të njëjtën kohë me sinjalin e kapitenit. Kjo krijon një efekt shumë elegant.`],
["Kontrolli me shabllon",`Në eventet dhe banketet, mënyra më e mirë për të arritur uniformitet është shablloni. Supervizori shtron një vend si model, me të gjitha takëmet, gotat dhe pecetën në pozicionin e saktë. Të gjithë kamarierët e shohin modelin dhe e kopjojnë.

Për banketet e mëdha, disa hotele përdorin vizore ose shabllone kartoni me pozicionet e shënuara, sidomos për gotat. Kjo mund të duket e tepërt, por në një sallë me njëqind vende, ndryshimi i vogël midis kamarierëve shihet menjëherë.

Pas shtrimit, supervizori kontrollon nga disa pika të sallës, si nga hyrja, ashtu edhe nga mesi, dhe rregullon çdo devijim.

» Skenë nga Flower: Një kompani rezervon Garden për një darkë me 40 persona, me menu të caktuar me katër pjata. Ditën para, supervizori merr nga organizatori planin e uljes dhe listën e alergjive: dy pa gluten, një vegjetarian, një alergji ndaj arrave. Në ditën e eventit, shtron një vend si model, me takëmet për të katër pjatat. Ekipi kopjon. Në çdo kartë emri ku ka alergji vendoset një shenjë e vogël që e njeh vetëm stafi. Në takimin para eventit, kuzhina dhe salla kalojnë ritmin bashkë.`],
["Përmbledhje",`À la carte shtron minimumin dhe rregullon pas porosisë. Menuja degustuese mban maksimumi tre takëme në çdo anë dhe i sjell të tjerat me pjatat. Darka private ka karta emrash, menu të printuar dhe alergjitë për çdo vend. Banketi kërkon uniformitet, rrugë të lira, stacione të shpërndara dhe shërbim të njëkohshëm me sinjal. Dhe në çdo event, një vend model që të gjithë e kopjojnë.`]
];
LEC.U1=[
["Hyrje: fjalët e kuzhinës në gojën e kamarierit",`Mysafiri pyet më shpesh “Si gatuhet?” sesa “Çfarë ka?”. Metoda e gatimit i tregon çfarë teksture do të ketë pjata, sa e rëndë do të jetë, çfarë shije të pritet. “Levrek i pjekur në skarë” dhe “levrek i zier butë” janë dy pjata krejt të ndryshme, edhe pse peshku është i njëjti.

Kamarieri që i njeh metodat e gatimit dhe i shpjegon me fjalët e duhura bën dy gjëra njëkohësisht: shet më shumë, sepse krijon imazh dhe dëshirë, dhe gabon më pak, sepse mysafiri merr atë që priste. Ky leksion shpjegon metodat kryesore, termat që shohim në menutë tona dhe gradat e pjekjes së mishit.`],
["Si ndikon nxehtësia te ushqimi",`Për të kuptuar metodat e gatimit, duhet të kuptosh dy procese bazë që ndodhin kur ushqimi nxehet.

I pari quhet reaksioni Maillard, sipas kimistit francez që e përshkroi. Kur proteinat dhe sheqernat nxehen mbi rreth 140 gradë, krijojnë qindra komponime të reja që japin ngjyrën e artë dhe shijen e pjekur: korja e bukës, sipërfaqja e biftekut në skarë, ngjyra e qepës së skuqur. Kjo ndodh vetëm me nxehtësi të thatë dhe të lartë.

I dyti është karamelizimi, që ndodh kur vetë sheqeri nxehet dhe merr ngjyrë dhe shije të thellë. Karotat e pjekura, qepët e ëmbla, sheqeri i djegur i një crème brûlée.

Me nxehtësi të lagësht, si në zierje, këto procese nuk ndodhin, por ndodh diçka tjetër: kolageni në mishrat e forta shkrihet ngadalë dhe bëhet xhelatinë. Kjo është arsyeja pse një mish i fortë si short rib-i bëhet aq i butë sa ndahet me pirun pas disa orësh gatim të ngadaltë.

Kur e kupton këtë, mund ta shpjegosh çdo pjatë me logjikë: “E kemi pjekur në skarë për korën e karamelizuar” ose “E kemi gatuar ngadalë për shumë orë që të shkrihet.”`],
["Metodat me nxehtësi të thatë",`• Skarë, ose grill. Nxehtësi direkte dhe e lartë nga poshtë, shpesh me dru ose qymyr. Krijon shenjat karakteristike, korë të karamelizuar dhe aromë të tymosur. Përdoret për mishrat, peshqit, perimet. Tomahawk-u dhe mishrat premium të Garden, oktapodi, shumë peshq.
• Pjekje në furrë, ose roast. Nxehtësi e thatë që e rrethon ushqimin nga të gjitha anët. Për copa të mëdha mishi, shpendë, perime.
• Sauté. Gatim i shpejtë në tigan me pak yndyrë, në nxehtësi të lartë, duke e lëvizur ushqimin. Për perime, karkaleca, copa të vogla mishi. Fjala vjen nga frëngjishtja dhe do të thotë “kërcen”, sepse ushqimi kërcen në tigan.
• Pan-seared. Ushqimi skuqet fort në tigan për të krijuar korë të artë, pastaj shpesh përfundon në furrë. Për fileto peshku, fileto mishi, fiston.
• Skuqje e thellë, ose deep-fry. Ushqimi zhytet në vaj të nxehtë, rreth 170 deri në 190 gradë. Krijon sipërfaqe krokante.
• Me kore, ose en croûte dhe crusted. Ushqimi mbulohet me një shtresë, si barishte, bukë e grirë ose kripë, para pjekjes. Levreku ynë me kore barishtesh është shembull.`],
["Metodat me lëng",`• Braise. Mishi skuqet fillimisht për korë, pastaj gatuhet ngadalë për orë të tëra me pak lëng, verë ose lëng mishi, në enë të mbyllur. Për mishrat e forta me shumë kolagen: short rib, bishti i lopës, shpatulla e qengjit. Short rib-i ynë me polentë dhe demi-glace është shembull klasik.
• Stew. E ngjashme me braise, por mishi pritet në copa më të vogla dhe mbulohet plotësisht me lëng.
• Poach. Zierje e butë nën pikën e vlimit, rreth 70 deri në 80 gradë, në ujë, lëng ose verë. Për peshq delikatë, vezë, fruta. Ruan butësinë dhe lagështinë.
• Confit. Gatim i ngadaltë në yndyrë, në temperaturë të ulët, rreth 80 deri në 90 gradë. Metoda tradicionale franceze për kofshët e rosës. Krijon mish shumë të butë që ndahet vetë.
• Sous-vide. Ushqimi vendoset në qese vakumi dhe gatuhet në ujë me temperaturë të saktë, shpesh për orë të tëra. Avantazhi është saktësia: mishi del në pjekjen e saktë nga buza në buzë. Pastaj shpesh skuqet shpejt për korë.
• Zierje me avull. Për perime dhe peshq, ruan ngjyrën dhe vitaminat.`],
["Pa gatim ose me acid",`Disa pjata nuk gatuhen me nxehtësi fare:
• Tartare. Mish ose peshk i grirë ose i prerë në kube të vogla, i gjallë, i stinuar me erëza, kaperi, qepë, mustardë ose vaj. Tartare viçi është klasike. Tartare toni dhe salmoni janë të përhapura.
• Carpaccio. Feta shumë të holla mishi ose peshku të gjallë, me vaj ulliri, limon, parmixhan ose rukola. Emri vjen nga piktori venecian Vittore Carpaccio, sepse ngjyrat e kuqe e të bardha të pjatës i kujtonin pikturat e tij.
• Ceviche. Peshk i gjallë i marinuar në lëng agrumesh. Acidi i limonit ose i limes i ndryshon proteinat e peshkut ashtu si nxehtësia, prandaj peshku bëhet i bardhë dhe i fortë, sikur të ishte gatuar.
• Crudo. Fjalë italiane për “të gjallë”, peshk ose fruta deti të shërbyera të gjalla me vaj dhe kripë.

Kur shpjegon këto pjata, thuaje qartë që janë të gjalla. Disa mysafirë, sidomos gratë shtatzëna, nuk duhet t'i hanë, dhe ata duhet ta dinë para se të porositin.`],
["Gradat e pjekjes së mishit",`Pjekja e biftekut është një nga gjërat që mysafiri e kërkon me saktësi dhe që shkakton më shumë ankesa kur gabohet. Temperaturat i referohen qendrës së mishit, të matur me termometër:

• Blu, ose bleu. Vetëm sipërfaqja e pjekur, brendësia e kuqe dhe pothuajse e ftohtë.
• Rare, i gjallë. Rreth 50 deri në 52 gradë. Qendra e kuqe dhe e ftohtë, mishi shumë i butë.
• Medium-rare. Rreth 55 deri në 57 gradë. Qendra e kuqe por e ngrohtë. Ky është rekomandimi i shumicës së shefave për copat premium si tomahawk-u, sepse ruan maksimumin e lëngut dhe të butësisë.
• Medium. Rreth 60 deri në 63 gradë. Qendra rozë.
• Medium-well. Rreth 65 deri në 68 gradë. Vetëm pak rozë në qendër.
• Well done, i pjekur mirë. Mbi 70 gradë. Pa rozë fare, mishi më i fortë dhe më i thatë.

Kur mysafiri kërkon një pjekje, konfirmoje me fjalë që përshkruajnë ngjyrën: “Medium-rare, pra rozë e kuqe në qendër?” Kjo shmang keqkuptimet, sepse disa njerëz mendojnë që “medium” do të thotë diçka tjetër.

Kur mysafiri kërkon well done për një copë premium, nuk e gjykojmë dhe nuk e kundërshtojmë. Mund të themi me mirësjellje: “Me kënaqësi. Shefi zakonisht e rekomandon medium për këtë copë, por do ta përgatisim siç e dëshironi.” Pastaj respektohet zgjedhja.`],
["Disa terma të tjera nga menuja",`• Demi-glace. Salcë franceze shumë e koncentruar, e bërë nga lëng mishi i reduktuar për orë të tëra. Jep shije të thellë dhe teksturë të lëmuar.
• Beurre blanc. Salcë me gjalpë, verë të bardhë dhe qepujka, klasike për peshkun.
• Reduktim. Lëng që zihet derisa avullon një pjesë dhe koncentrohet shija.
• Emulsion. Përzierje e dy lëngjeve që zakonisht nuk përzihen, si vaji dhe uji, për shembull majoneza.
• Pure. Ushqim i shtypur deri në teksturë kremoze.
• Glazurë. Shtresë e shndritshme, shpesh e ëmbël, mbi ushqim.
• Al dente. Për pastën, “për dhëmbin”: e gatuar por ende e fortë në qendër.

» Skenë nga Garden: Mysafiri pyet për short rib-in. Kamarieri: “Është brinja e lopës, e gatuar ngadalë për shumë orë derisa bëhet aq e butë sa ndahet me pirun. Shërbehet me polentë, krem patëllxhani, spec të pjekur, krem kosi dhe një demi-glace, salcë e koncentruar mishi, me piper Timur nga Nepali, që ka një aromë agrumesh.” Mysafiri e porosit.`],
["Përmbledhje",`Nxehtësia e thatë krijon korë dhe shije të pjekur me reaksionin Maillard. Nxehtësia e lagësht shkrin kolagenin dhe zbut mishrat e forta. Metodat e thata: skarë, furrë, sauté, pan-seared, skuqje, kore. Me lëng: braise, poach, confit, sous-vide. Pa gatim: tartare, carpaccio, ceviche. Gradat e mishit nga rare në 50 gradë te well done mbi 70, me medium-rare si rekomandim për copat premium. Dhe çdo pjekje konfirmohet me ngjyrën.`]
];
LEC.U2=[
["Hyrje: kur një gabim nuk falet",`Shumica e gabimeve në restorant mund të rregullohen. Një pjatë e ftohtë ndërrohet. Një verë e gabuar kthehet. Një vonesë kompensohet. Por një gabim me alergjinë mund të çojë një mysafir në spital, dhe në rastet më të rënda mund të jetë vdekjeprurës brenda minutave.

Prandaj alergjitë janë i vetmi aspekt i shërbimit ku nuk ka asnjë hapësirë për përafrim. Ky leksion shpjegon bazën ligjore, dallimin midis alergjisë dhe intolerancës, 14 alergjenët e BE-së dhe ku fshihen, kontaminimin e kryqëzuar dhe protokollin e Flower për çdo porosi me alergji.`],
["Baza ligjore",`Rregullorja e Bashkimit Evropian 1169 e vitit 2011 detyron çdo restorant në BE të informojë mysafirin për praninë e 14 alergjenëve kryesorë në çdo pjatë. Informacioni duhet të jetë i disponueshëm me shkrim ose me gojë, dhe stafi duhet të jetë në gjendje ta japë saktë.

Shqipëria e ka përafruar legjislacionin e saj ushqimor me atë të BE-së, dhe mysafirët tanë ndërkombëtarë e presin këtë standard si të mirëqenë. Një mysafir nga Gjermania, Britania ose Italia është mësuar që kamarieri t'i japë përgjigje të sakta për alergjenët.

Por përtej ligjit, ka një arsye më të thjeshtë: mysafiri na beson jetën e vet. Kur na thotë “jam alergjik ndaj arrave”, po na kërkon ta mbrojmë.`],
["Alergji dhe intolerancë",`Mysafirët shpesh i përdorin këto fjalë njësoj, por janë gjëra të ndryshme.

Alergjia përfshin sistemin imunitar. Trupi e sheh një proteinë të caktuar, për shembull nga kikiriku, si kërcënim dhe reagon me forcë. Simptomat mund të jenë të lehta, si kruajtje ose skuqje, ose të rënda, si fryrje e gjuhës dhe e fytit, vështirësi në frymëmarrje dhe rënie e presionit. Reaksioni më i rëndë quhet anafilaksi dhe kërkon ndihmë mjekësore të menjëhershme. Edhe një sasi mikroskopike e alergjenit, si thërrimet në një dërrasë prerjeje, mund ta shkaktojë.

Intoleranca nuk përfshin sistemin imunitar. Për shembull, intoleranca ndaj laktozës do të thotë që trupi nuk e tret mirë sheqerin e qumështit. Shkakton shqetësim, si dhimbje barku, por zakonisht nuk është kërcënuese për jetën, dhe shpesh sasi të vogla tolerohen.

Rregulli në shërbim: çdo deklaratë e mysafirit trajtohet si alergji, derisa mysafiri vetë të sqarojë ndryshe. Nuk është detyra jonë të vendosim nëse alergjia është “e vërtetë” ose “e rëndë”.`],
["14 alergjenët dhe ku fshihen",`• Gluteni. Gruri, elbi, thekra, tërshëra dhe varietetet e tyre. Fshihet në salcën e sojës, brumin e skuqjes, bukën e grirë, supat dhe salcat e trasha me miell, birrën.
• Krustacet. Karkaleca, gaforre, karavidhe, omar. Fshihen në lëngun e peshkut, pastën e karkalecave, disa salca aziatike.
• Vezët. Majoneza, pasta e freskët, brumërat, glazura e bukës, salcat hollandeze dhe Caesar, disa ëmbëlsira.
• Peshku. Salca Worcestershire, salca Caesar që ka açuge, salca e peshkut në kuzhinat aziatike, disa lëngje.
• Kikirikët. Vaji i kikirikut, salcat satay, disa ëmbëlsira dhe snacks.
• Soja. Salca e sojës, tofu, lecitina e sojës që përdoret në çokollatë dhe në produkte të pjekura.
• Qumështi. Gjalpi, kremi, djathi, kosi, ghee, salcat e kremta, pureja, shumë ëmbëlsira.
• Arrat. Arra, bajame, lajthi, fëstëk, shqeme, pekan, arra braziliane, makadamia. Fshihen në pesto, pralina, marzapan, granola, vajra arrash, ëmbëlsira. Bakllavaja përmban arra.
• Selinoja. Në lëngjet e mishit, supat, disa erëza të përziera.
• Mustarda. Në salcat, marinadat, vinegret-at.
• Susami. Në tahini, humus, bukë me fara, salca aziatike.
• Sulfitet. Në verë, fruta të thata, uthull, disa perime të përpunuara. Çdo verë përmban sulfite në një masë.
• Lupina. Një bishtajore që përdoret në disa miell, sidomos në bukët pa gluten.
• Molusqet. Midhje, gocë deti, kallamarë, sepje, oktapod, kërmij.

Faqja Menutë tona në platformë ka për çdo pjatë të Flower dhe Garden alergjenët e saj dhe një filtër që përjashton pjatat me një alergjen të caktuar. Këto alergjenë janë nxjerrë nga përbërësit e menusë dhe duhet të konfirmohen gjithmonë me kuzhinën.`],
["Kontaminimi i kryqëzuar",`Kontaminimi i kryqëzuar ndodh kur një alergjen kalon nga një ushqim te tjetri pa qenë pjesë e recetës. Një pjatë pa arra, e gatuar në të njëjtin tigan ku u gatuan arrat, ose e prerë në të njëjtën dërrasë, ose e dekoruar me të njëjtat duar, nuk është e sigurt për një mysafir me alergji të rëndë.

Burimet e zakonshme të kontaminimit:
• Tiganët, dërrasat dhe thikat e përbashkëta.
• Vaji i skuqjes ku janë skuqur edhe ushqime me gluten ose peshk.
• Duart dhe dorezat e kuzhinierëve.
• Spatulat dhe lugët e salcave.
• Në sallë: buka që vendoset në tavolinë pranë pjatës, lugët e shërbimit të përbashkëta në family style, thërrimet.

Kjo është arsyeja pse kuzhina duhet ta dijë për alergjinë që në fillim, kur merret porosia, jo kur pjata është gati. Vetëm kështu mund të përdorë mjete të pastra dhe të veçanta.`],
["Protokolli i Flower për alergjitë",`Çdo herë që një mysafir përmend një alergji, ndiqet ky protokoll pa përjashtim:
• Dëgjo dhe konfirmo. “Faleminderit që na e thatë. Alergji ndaj arrave, apo edhe ndaj kikirikëve?” Pyet për rëndësinë nëse duhet: “A duhet të shmangim edhe gjurmët?”
• Shëno. Në POS, me kod të qartë: “ALERGJI: ARRA”, te pozicioni i mysafirit.
• Njofto kuzhinën me gojë, përveç shënimit. Shefi i kuzhinës ose shefi i turnit duhet ta dijë drejtpërdrejt.
• Konfirmo çdo pjatë me kuzhinën kur nuk je njëqind për qind i sigurt. Kurrë mos thuaj “mendoj se nuk ka”.
• Në pass, kontrollo që pjata është ajo e shënuar për alergjinë.
• Shërbeje veçmas ose të parën, dhe emërtoje qartë: “Pjata juaj, e përgatitur pa arra.”
• Dorëzoje informacionin te çdo koleg që i shërben tavolinës, përfshirë barmenin, sepse edhe kokteilet mund të kenë alergjenë.
• Kujdes me ëmbëlsirat dhe me petit fours, ku arrat dhe qumështi janë shumë të shpeshta.

Nëse mysafiri ka një reaksion alergjik në restorant, njofto menjëherë supervizorin dhe thirr ndihmën mjekësore. Moduli 16 për sigurinë e shpjegon protokollin e emergjencës.`],
["Përmbledhje",`Alergjitë janë i vetmi aspekt i shërbimit pa hapësirë për gabim. Rregullorja e BE-së 1169/2011 kërkon informacion për 14 alergjenë. Alergjia përfshin sistemin imunitar dhe mund të jetë vdekjeprurëse; intoleranca jo, por çdo deklaratë trajtohet si alergji. Alergjenët fshihen në salca, lëngje, brumëra dhe ëmbëlsira. Kontaminimi i kryqëzuar e bën të pasigurt edhe një pjatë pa alergjenin në recetë. Dhe protokolli ynë është: dëgjo, shëno, njofto, konfirmo, kontrollo, shërbe veçmas, dorëzo.`]
];
LEC.U3=[
["Hyrje: çdo mysafir ha ndryshe",`Një tavolinë prej gjashtë vetash sot mund të ketë një vegjetarian, një person që nuk ha gluten, një që ndjek dietë me pak karbohidrate dhe një që agjëron për arsye fetare. Kjo nuk është më përjashtim, është normë. Dhe çdo herë që mysafiri duhet të shpjegojë gjatë dietën e vet ose ndihet i gjykuar për të, përvoja humbet.

Standardi HD31 kërkon që menuja të ofrojë pjata për mysafirët që kërkojnë ushqim të shëndetshëm. Por përtej standardit, hotelet luksoze dallohen nga mënyra si i trajtojnë të gjitha kërkesat e veçanta: me njohuri, pa bezdi dhe me respekt. Ky leksion shpjegon dietat kryesore, kërkesat fetare dhe si flasim për to.`],
["Vegjetarian dhe vegan",`Dallimi midis vegjetarianit dhe veganit është një nga gjërat që stafi duhet ta dijë me siguri.

Vegjetariani nuk ha mish dhe nuk ha peshk ose fruta deti. Zakonisht ha vezë dhe bulmet: qumësht, djathë, kos, gjalpë. Ka variante: disa nuk hanë vezë, disa hanë peshk dhe quhen pescetarianë, por kjo duhet pyetur.

Vegani nuk ha asnjë produkt me origjinë shtazore. Kjo përfshin mishin, peshkun, vezët, qumështin dhe të gjitha bulmetet, mjaltin, xhelatinën. Shumë vegan nuk konsumojnë as verëra që janë filtruar me produkte shtazore, si albumina e vezës ose kazeina, edhe pse kjo është më rrallë.

Kurthet e fshehura për vegjetarianët dhe veganët:
• Lëngu i mishit ose i pulës në rizoto, supa dhe salca.
• Gjalpi që shtohet në përfundim të perimeve ose të pastës.
• Djathi parmixhan, që tradicionalisht bëhet me enzima nga stomaku i viçit.
• Xhelatina në ëmbëlsira, në disa salca dhe në disa lloje karamelesh.
• Salca e peshkut ose açuget në salca, si Caesar.
• Yndyra shtazore në brumëra.

Kur mysafiri thotë “jam vegjetarian”, mos supozo. Pyet me mirësjellje: “A hani vezë dhe bulmet?” Kjo një pyetje kursen shumë probleme.`],
["Pa gluten dhe celiakia",`Kërkesa për ushqim pa gluten ka arsye të ndryshme, dhe ndikon shumë në mënyrën si e trajtojmë.

Celiakia është një sëmundje autoimune. Te personat me celiaki, gluteni shkakton një reaksion që dëmton zorrën e hollë. Edhe sasi shumë të vogla, si thërrimet e bukës në një dërrasë ose vaji i skuqjes ku u skuq diçka me miell, mund të shkaktojnë dëm. Për një mysafir me celiaki, “pa gluten” do të thotë jo vetëm pa përbërës me gluten, por edhe pa kontaminim: tigan i veçantë, vaj i veçantë për skuqje, dërrasë e pastër, duar të pastra.

Ka mysafirë të tjerë që kanë ndjeshmëri ndaj glutenit pa qenë celiakë, ose që e shmangin si zgjedhje dietike. Për ta, gjurmët zakonisht nuk janë problem.

Si e dallojmë? Duke pyetur, me mirësjellje: “A është për arsye shëndetësore, që duhet të shmangim edhe kontaminimin?” Mysafiri me celiaki do ta vlerësojë pyetjen, sepse tregon që e kuptojmë.

Kujdes me burimet e glutenit që nuk duken: salca e sojës, birra, brumi i skuqjes, buka e grirë në kore, mielli që trashon salcat dhe supat, disa erëza të përziera.`],
["Kërkesat fetare",`Mysafirët ndërkombëtarë vijnë nga kultura dhe fe të ndryshme, dhe shumë kanë rregulla ushqimore që lidhen me besimin. Disa nga më të zakonshmet:

• Halal. Rregullat ushqimore islame. Nuk konsumohet mish derri ose produkte prej tij, si proshuta, pançeta, xhelatina e derrit ose yndyra e derrit. Mishi tjetër duhet të jetë therur sipas ritit. Shumë mysafirë myslimanë nuk konsumojnë alkool, as në gatim, si vera në salca. Mos premto “halal” nëse mishi nuk është i certifikuar si i tillë. Mund të thuash me ndershmëri: “Kjo pjatë nuk ka mish derri dhe nuk ka alkool, por mishi nuk është i certifikuar halal.”
• Kosher. Rregullat ushqimore hebraike. Janë shumë të ndërlikuara: përfshijnë mënyrën e therjes, ndarjen e mishit nga bulmeti, mjetet e veçanta të kuzhinës. Mos premto kurrë kosher nëse kuzhina nuk është e certifikuar. Për mysafirët që e kërkojnë, mund të ofrojmë alternativa të thjeshta, si peshk me luspa ose perime, dhe të jemi të sinqertë për kufizimet.
• Hinduizmi. Shumë mysafirë hindu nuk hanë mish lope, sepse lopa konsiderohet e shenjtë. Shumë janë vegjetarianë.
• Agjërimet. Gjatë Ramazanit, mysafirët myslimanë agjërojnë nga agimi deri në perëndim dhe mund të kërkojnë darkë menjëherë pas perëndimit. Gjatë agjërimeve ortodokse dhe katolike, disa mysafirë nuk hanë mish ose produkte shtazore në ditë të caktuara.

Rregulli kryesor: nëse nuk je i sigurt, pyet me respekt dhe mos supozo.`],
["Dietat shëndetësore",`Shumë mysafirë kanë kërkesa ushqimore për arsye shëndetësore ose stili jetese:

• Pak karbohidrate ose keto. Pa bukë, pastë, oriz, patate dhe sheqer. Mysafiri zakonisht ha mish, peshk, perime jeshile, vezë, djathë dhe yndyra.
• Pa sheqer, sidomos për diabetikët. Kujdes me salcat e ëmbla, glazurat, frutat e thata dhe ëmbëlsirat. Për diabetikët, edhe karbohidratet e thjeshta si buka e bardhë kanë rëndësi.
• Pa kripë ose me pak kripë, për presionin e lartë. Kuzhina mund ta përgatisë pa shtuar kripë, por disa përbërës si djathi, salca e sojës dhe mishrat e kripura kanë kripë vetë.
• Proteina të larta, për sportistët.
• Pa yndyrë ose me pak yndyrë.
• Ushqim i lehtë për mysafirët që nuk ndihen mirë ose për fëmijët.

Menuja e Flower duhet të ketë pjata të shënuara si të lehta ose të shëndetshme, dhe kamarieri duhet të dijë t'i rekomandojë. Peshqit e pjekur në skarë me perime, sallatat me proteina dhe pjatat pa salca të rënda janë zakonisht zgjedhjet e mira.`],
["Respekti dhe gjuha",`Mënyra si flasim për dietën e mysafirit është po aq e rëndësishme sa njohja.

Rregullat:
• Mos komento kurrë dietën e mysafirit. As pozitivisht (“Ah, edhe unë jam vegan”), as negativisht (“Vërtet nuk hani mish?”).
• Mos thuaj kurrë “pak nuk bën dëm” ose “nuk ka shumë”. Për mysafirin me celiaki ose alergji, pak bën shumë dëm.
• Mos e bëj mysafirin të ndihet si bezdi. “Me kënaqësi, kuzhina do ta përgatisë” është fjalia e duhur.
• Pyet sa duhet për të qenë i sigurt, dhe kaq. Mos e merr në pyetje mysafirin për arsyet e dietës së tij.
• Mbaje mend dhe shënoje në profil, që mysafiri të mos e shpjegojë herën tjetër.

» Skenë nga Flower: Një mysafire në Garden thotë “Jam vegane”. Kamarieri: “Me kënaqësi. Më lejoni t'ju tregoj çfarë mund t'ju përgatisë kuzhina.” Pa e hapur menunë, i tregon dy pjata që janë natyrshëm vegane dhe një tjetër që kuzhina mund ta përshtatë pa djathë dhe pa gjalpë. Pastaj shton: “Për ëmbëlsirë, e kontrolloj me shefin çfarë mund të përgatisim.” Mysafirja nuk ka nevojë të shpjegojë asgjë më shumë.`],
["Menuja degustuese dhe dietat",`Menuja degustuese është një rast i veçantë. Me dhjetë pjata në Flower dhe nëntë në Garden, është e vështirë të ndryshohet në moment. Prandaj:
• Pyet për kërkesat ushqimore që kur mysafiri e zgjedh menunë degustuese, ose më mirë, që në rezervim.
• Njofto kuzhinën menjëherë, që të ketë kohë të planifikojë zëvendësimet.
• Kur shërben pjatat e zëvendësuara, prezantoji me të njëjtin kujdes si pjatat origjinale, jo si “versioni pa”.

Mysafiri me dietë të veçantë që merr një menu degustuese të përshtatur me kujdes shpesh largohet më i impresionuar se të tjerët, sepse e ndjen që kuzhina mendoi posaçërisht për të.`],
["Përmbledhje",`Vegjetariani nuk ha mish dhe peshk, por zakonisht ha vezë dhe bulmet. Vegani nuk ha asnjë produkt shtazor. Kujdes me lëngjet, gjalpin, parmixhanin dhe xhelatinën. Celiakia kërkon zero kontaminim. Halal: pa derr dhe zakonisht pa alkool; mos premto certifikim që nuk e kemi. Kosher: mos e premto kurrë pa certifikim. Dietat shëndetësore kërkojnë njohuri të menusë. Dhe gjithmonë: pa komente, pa “pak nuk bën dëm”, pyet sa duhet dhe shënoje në profil.`]
];
LEC.U4=[
["Hyrje: shqiptaria si përvojë",`Kur një mysafir nga Gjermania, Amerika ose Japonia vjen në Shqipëri, nuk vjen vetëm për plazhet dhe për diellin. Vjen për të zbuluar një vend që shumica e miqve të tij nuk e njohin. Dhe një nga mënyrat më të fuqishme për ta zbuluar është ushqimi.

Një pjatë vendase e treguar mirë, me historinë dhe origjinën e saj, bëhet shpesh momenti që mysafiri e tregon kur kthehet në shtëpi. Forbes, në standardet e vitit 2019, vlerëson nëse përvoja e ushqimit dhe e pijeve dallohej në ndonjë mënyrë. Kuzhina dhe produktet shqiptare janë mënyra jonë natyrale për ta arritur këtë.

Ky leksion shpjegon si tregojmë një pjatë vendase dhe njohuritë bazë për pjatat, produktet dhe pijet shqiptare që mysafirët pyesin më shpesh.`],
["Si tregohet një pjatë vendase",`Një pjatë vendase tregohet në tre deri në katër fjali, me pesë elemente:
• Emri, në shqip, i shqiptuar qartë, dhe një përkthim ose përshkrim i shkurtër në anglisht.
• Origjina: qyteti ose rajoni nga vjen.
• Përbërësit kryesorë.
• Si gatuhet.
• Një detaj historie ose kulture, që e bën të paharrueshme.

Shembull: “This is tavë kosi, a specialty from Elbasan, in central Albania. It's lamb baked with rice, then covered with a mixture of yogurt and eggs and baked again until it forms a golden crust. Many Albanians consider it our national dish.”

Tregimi duhet të bëhet me krenari, por pa ekzagjerim. Mos thuaj “pjata më e mirë në botë”. Thuaj çfarë është dhe pse na pëlqen. Mysafiri do ta ndjejë pasionin.

Mos e përdor fjalën “tradicionale” për çdo gjë. Përdore vetëm kur është e vërtetë, dhe jep detaje konkrete.`],
["Pjatat kryesore",`• Tavë kosi. Specialiteti i Elbasanit. Qengj i pjekur me oriz, i mbuluar me kos dhe vezë, i pjekur deri sa krijon kore të artë. Në anglisht: baked lamb with a golden yogurt and egg crust, from Elbasan.
• Fërgesë. Pjatë tiranase me speca, domate dhe gjizë, e gatuar ngadalë, shpesh në tavë balte. Ka edhe version me mëlçi. Në anglisht: a warm dish of peppers, tomatoes and cottage cheese, a Tirana classic.
• Byrek. Petë të holla të hapura me dorë, të mbushura me spinaq, djathë, mish, presh ose kungull. Bëhet në tepsi të rrumbullakët. Në anglisht: hand-stretched filo pie. Mund të shpjegosh që hapja e petëve me dorë është një aftësi që kalon nga gjyshet te nipërit.
• Qofte. Mish i grirë me erëza, nenexhik dhe qepë, i pjekur në skarë, shpesh me kos, sallatë ose patate.
• Mish në hell dhe mishra të pjekur në skarë. Qengji dhe keci janë mishrat tradicionalë të festave.
• Peshku i Adriatikut dhe i Jonit. Levrek, koc, barbun, koce, të pjekur në skarë me vaj ulliri, limon dhe barishte. Tregoje origjinën: “caught in the Adriatic.”
• Speca të mbushur dhe dollma. Perime të mbushura me oriz, mish ose të dyja.

Kur një nga këto pjata, ose një interpretim modern i tyre, është në menunë tonë, kjo është rasti i përsosur për të treguar historinë.`],
["Produktet",`Shqipëria ka produkte me cilësi të lartë që shumë mysafirë nuk i njohin.
• Djathi i bardhë. Djathë i njomë, shpesh deleje ose dhie, i ruajtur në shëllirë. I ngjashëm me fetën greke, por me karakterin e vet sipas zonës.
• Gjiza. Djathë i butë dhe i freskët, që përdoret në fërgesë dhe në byrek.
• Kaçkavalli. Djathë i fortë, i vjetëruar, që mund të pjeket në skarë.
• Ullinjtë dhe vaji i ullirit. Berati, Vlora dhe zona e jugut kanë ullishte shekullore. Për disa pemë ulliri në Shqipëri thuhet se janë mbi një mijë vjeçare.
• Mjalti i malit. Nga lulet e egra të maleve shqiptare, me aromë të fortë.
• Çaji i malit. Infuzion nga një bimë që rritet në malet shqiptare, me aromë të këndshme. Mund ta ofrosh si alternativë interesante për çajin pas darkës.
• Barishtet dhe erëzat. Rigoni, sherbela, trumza, që rriten të egra në male.`],
["Ëmbëlsirat",`• Bakllava. Shtresa petësh të holla me arra, të pjekura dhe të ngopura me shurup. Është ëmbëlsira e festave në shumë familje shqiptare. Në Flower kemi bakllavanë e Genti Malavecit, dhe mund ta tregosh si një interpretim modern i një klasikeje. Kujdes: përmban arra dhe gluten.
• Trileçe. Pandispanjë e ngopur me tre lloje qumështi, me karamel sipër. Ka origjinë nga Amerika Latine, por është bërë shumë e dashur në Shqipëri dhe në Ballkan. Mund ta tregosh me këtë histori interesante.
• Kadaif. Fije brumi të holla me arra dhe shurup.
• Ballokume. Biskota tradicionale e Elbasanit, që bëhet për Ditën e Verës, më 14 mars, një festë pagane e ardhjes së pranverës.`],
["Rakia dhe verërat shqiptare",`Rakia është pija tradicionale shqiptare. Bëhet kryesisht nga bërsitë e rrushit, por ka edhe raki mani, kumbulle dhe frutash të tjera. Përmban rreth 40 deri në 50 për qind alkool. Pihet e ftohtë, në gota të vogla, si aperitiv para ushqimit ose si digjestiv pas tij, dhe shpesh shoqërohet me meze.

Kur e ofron, ofroje me një tregim, jo me presion. Thuaj shkallën e alkoolit, sepse shumë mysafirë të huaj nuk janë mësuar me pije kaq të forta. “Would you like to try our rakia? It's a traditional Albanian grape brandy, around 45 percent, usually sipped cold before or after dinner.”

Shqipëria ka edhe një traditë të lashtë të verës, që daton që në kohën ilire. Sot ka kantina që prodhojnë verëra me cilësi të lartë, shpesh nga rrush autokton si Shesh i Zi, Shesh i Bardhë, Kallmet dhe Pulës. Në listën tonë kemi verëra shqiptare si Duka nga Durrësi dhe Tufa nga Tirana. Manuali i verës në platformë ka detajet.

» Skenë nga Flower: Një çift amerikan pyet: “What's typically Albanian?” Kamarieri: “If you'd like to taste something local, I'd suggest starting with a glass of Duka Riserva, a red from Durrës, on the Albanian coast. And for dessert, our baklava by Genti Malaveci, a modern take on the dessert Albanian families make for every celebration. If you'd like, at the end we can also offer you a small glass of rakia, our traditional grape brandy.” Çifti zgjedh të tria.`],
["Përmbledhje",`Një pjatë vendase tregohet në tre deri në katër fjali: emri, origjina, përbërësit, si gatuhet dhe një detaj historie. Pjatat kryesore: tavë kosi, fërgesë, byrek, qofte, peshku i Adriatikut. Produktet: djathi i bardhë, gjiza, ullinjtë shekullorë, mjalti dhe çaji i malit. Ëmbëlsirat: bakllava, trileçe, kadaif, ballokume. Rakia ofrohet e ftohtë, me tregim dhe me shkallën e alkoolit. Dhe verërat shqiptare nga rrush autokton janë pjesë e historisë sonë.`]
];
LEC.V1=[
["Hyrje: të flasësh për verën pa frikë",`Shumë kamarierë kanë frikë nga vera. Duket një botë e mbyllur, me fjalë franceze, me emra rajonesh që nuk shqiptohen dhe me njerëz që duket se dinë gjithçka. Por në të vërtetë, për të shërbyer dhe për të rekomanduar verë me siguri, mjafton të kuptosh disa ide bazë: si bëhet vera, çfarë e dallon një verë nga tjetra dhe si e përshkruajmë.

Ky leksion jep bazat. Me to, mund të shpjegosh çdo verë të listës sonë në tridhjetë sekonda dhe të kuptosh çfarë po të thotë mysafiri kur kërkon “diçka të thatë” ose “jo shumë të rëndë”.`],
["Fermentimi: nga rrushi te vera",`Vera lind nga një proces natyral që quhet fermentim. Majatë, organizma mikroskopikë që gjenden natyrshëm në lëkurën e rrushit ose që shtohen nga prodhuesi, ushqehen me sheqerin e lëngut të rrushit dhe e shndërrojnë në dy gjëra: alkool dhe dioksid karboni. Dioksidi i karbonit zakonisht largohet në ajër. Alkooli mbetet.

Kjo do të thotë që sasia e alkoolit në verë varet nga sasia e sheqerit në rrush. Rrushi që piqet në diell të fortë, si në Puglia ose në zonat e ngrohta të Shqipërisë, ka më shumë sheqer dhe jep verëra me më shumë alkool, rreth 14 ose 15 për qind. Rrushi nga zona të freskëta, si Alsace ose Mosel, ka më pak sheqer dhe jep verëra më të lehta, rreth 11 deri në 13 për qind.

Kur fermentimi ndalet para se majatë të kenë ngrënë gjithë sheqerin, qoftë natyrshëm ose sepse prodhuesi e ndal, vera mbetet me sheqer dhe është e ëmbël. Kështu bëhen shumë verëra ëmbëlsire.`],
["E bardhë, e kuqe, roze",`Një fakt që befason shumë njerëz: lëngu i pothuajse çdo rrushi është i bardhë, edhe i rrushit të zi. Ngjyra e verës së kuqe nuk vjen nga lëngu, por nga lëkura.

• Vera e kuqe bëhet nga rrush i zi. Lëngu fermentohet bashkë me lëkurat për ditë ose javë. Gjatë kësaj kohe, lëkurat i japin verës ngjyrën, taninet dhe shumë nga aromat.
• Vera e bardhë bëhet zakonisht nga rrush i bardhë. Rrushi shtrydhet menjëherë, lëkurat ndahen dhe lëngu fermentohet vetëm. Prandaj vera e bardhë ka pak ose aspak tanine.
• Vera roze bëhet nga rrush i zi, por lëngu mban kontakt me lëkurat vetëm për një kohë të shkurtër, zakonisht disa orë, sa për të marrë një ngjyrë të lehtë rozë. Rozetë e Provence-s, si ato të Château Roubine që kemi në listë, janë shembulli klasik: ngjyrë e zbehtë, freskia e të bardhës me pak fruta të kuqe.

Ka edhe verëra “portokalli”, që janë verëra të bardha të fermentuara me lëkurat si të kuqet. Kanë ngjyrë qelibari dhe pak tanine. Janë një stil i lashtë që është rikthyer në modë.`],
["Verërat me flluska",`Flluskat në verë janë dioksid karboni që nuk lejohet të largohet. Ka dy metoda kryesore.

Metoda tradicionale, që quhet edhe metoda e Champagne-s. Prodhuesi bën një verë bazë, e vendos në shishe me pak sheqer dhe maja, dhe e mbyll. Në shishe ndodh një fermentim i dytë, dhe dioksidi i karbonit mbetet brenda. Pastaj vera qëndron në kontakt me majatë e vdekura për muaj ose vite, gjë që i jep aroma buke, briosh dhe biskote. Kështu bëhen Champagne, Franciacorta në Itali dhe Cava në Spanjë. Flluskat janë shumë të imëta dhe të qëndrueshme. Moët Impérial, që kemi në listë, bëhet me këtë metodë.

Metoda Charmat, ose metoda e rezervuarit. Fermentimi i dytë ndodh në një rezervuar të madh nën presion, dhe pastaj vera vendoset në shishe. Është më e shpejtë dhe më e lirë, dhe ruan aromat e freskëta të frutave. Kështu bëhet Prosecco, si Col Mesian që kemi në listë. Flluskat janë pak më të mëdha dhe vera është më frutore.

Termat e ëmbëlsisë në etiketë: “Brut nature” ose “Zero dosage” do të thotë pa sheqer të shtuar. “Extra brut” pothuajse pa sheqer. “Brut” e thatë, stili më i zakonshëm. “Extra dry”, në mënyrë paradoksale, është pak më e ëmbël se Brut. “Dry” ose “Sec” gjysmë e ëmbël. “Demi-sec” e ëmbël.`],
["Struktura e verës: pesë elemente",`Çdo verë mund të përshkruhet me pesë elemente strukturore. Kur i kupton, mund të kuptosh çfarë do mysafiri dhe ta përshkruash çdo verë me fjalë të sakta.

• Aciditeti. Është freskia e verës. Ndihet si një ndjesi që të bën gojën të pështyjë, si kur kafshon një mollë jeshile. Verërat nga zonat e freskëta kanë më shumë aciditet. Riesling-u i Hugel nga Alsace ka aciditet të lartë.
• Taninet. Janë substanca që vijnë nga lëkura, farat dhe kërcelli i rrushit, dhe nga fuçitë e drurit. Ndihen si një thatësi në mishrat e dhëmbëve dhe në gjuhë, si kur pi çaj të fortë. Gjenden kryesisht në verërat e kuqe. Cabernet Sauvignon dhe Nebbiolo kanë tanine të forta. Pinot Noir ka tanine të buta.
• Alkooli. Ndihet si ngrohtësi në gojë dhe në fyt, dhe i jep verës peshë.
• Sheqeri. Ëmbëlsia. Shumica e verërave të tavolinës janë të thata, pa sheqer të ndjeshëm.
• Trupi. Pesha e verës në gojë. Mendo për qumështin: qumështi i skremuar është i lehtë, qumështi i plotë mesatar, kremi i plotë. Vera me trup të lehtë ndihet si ujë, ajo me trup të plotë ndihet e dendur dhe e pasur.

Kur mysafiri thotë “diçka të thatë”, zakonisht do të thotë pa ëmbëlsi, jo me tanine. Kur thotë “jo shumë e rëndë”, flet për trupin dhe alkoolin.`],
["Shijimi në katër hapa",`Profesionistët e shijojnë verën në katër hapa. Nuk ke nevojë ta bësh me ceremoni para mysafirit, por duhet ta dish për të provuar verërat e listës dhe për t'i përshkruar.

• Shiko. Ngrije gotën kundër një sfondi të bardhë. Shiko ngjyrën dhe qartësinë. Të bardhat e reja janë të verdha të zbehta me reflekse jeshile, të vjetrat bëhen të arta. Të kuqet e reja janë vjollcë, të vjetrat bëhen me reflekse portokalli dhe tullë në buzë.
• Rrotullo. Rrotullo verën në gotë disa herë. Oksigjeni hyn në kontakt me verën dhe çliron aromat.
• Nuhat. Afroje hundën në gotë dhe merr frymë thellë. Kërko kategoritë e mëdha: fruta, të freskëta apo të pjekura, të bardha, agrume, të kuqe apo të zeza; lule; barishte; erëza; dru, vanilje, tym; tokë, kërpudha.
• Shijo. Merr një gllënjkë dhe lëre ta prekë të gjithë gojën. Ndjej aciditetin, taninet, alkoolin, ëmbëlsinë dhe trupin. Pas gëlltitjes, vëre sa zgjat shija. Kjo quhet gjatësia ose “finish”. Verërat e mëdha kanë finish të gjatë.

Fjalori që përdorim duhet të jetë i thjeshtë dhe konkret. Jo “vera ka shprehi komplekse terroari”, por “ka shije qershie, pak erëza dhe tanine të buta”. Mysafiri dëshiron të kuptojë, jo të impresionohet me fjalë.`],
["Si e shpjegon një verë në 30 sekonda",`Kur mysafiri pyet për një verë, struktura e përgjigjes është:
• Prodhuesi dhe vendi.
• Rrushi.
• Stili në dy ose tre fjalë: e lehtë, e freskët, e plotë, frutore, minerale.
• Një aromë ose shije kryesore.
• Me çfarë shkon.

» Skenë nga Flower: Mysafiri pyet për Nuits-Saint-Georges. Kamarieri: “Është nga Louis Jadot, një nga shtëpitë më të njohura të Burgundy-së, në Francë. Bëhet nga Pinot Noir. Është një e kuqe elegante, jo e rëndë, me aroma qershie dhe pak erëza, dhe tanine të buta. Shkon shumë mirë me peshkun me shije të fortë, me shpendët ose me mishin e lehtë.” Tridhjetë sekonda, pesë informacione, asnjë fjalë e vështirë.`],
["Përmbledhje",`Vera lind nga fermentimi: majatë shndërrojnë sheqerin në alkool. Ngjyra vjen nga lëkura: e kuqja fermentohet me lëkura, e bardha pa to, rozeja me kontakt të shkurtër. Flluskat vijnë nga fermentimi i dytë, në shishe për Champagne dhe në rezervuar për Prosecco. Struktura ka pesë elemente: aciditeti, taninet, alkooli, sheqeri dhe trupi. Shijimi ka katër hapa: shiko, rrotullo, nuhat, shijo. Dhe çdo verë shpjegohet në tridhjetë sekonda me prodhuesin, rrushin, stilin, një aromë dhe çiftimin.`]
];
LEC.V2=[
["Hyrje: harta e verës",`Lista e verës së Flower ka mbi njëqind etiketa nga Franca, Italia, Spanja, Shqipëria, Kroacia dhe vende të tjera. Askush nuk pritet t'i mbajë mend të gjitha përmendsh. Por kur njeh rrushet kryesore dhe rajonet ku rriten, mund të kuptosh çdo verë të listës, edhe atë që nuk e ke provuar kurrë, dhe mund t'i përgjigjesh mysafirit me siguri.

Ky leksion shpjegon dallimin midis Botës së Vjetër dhe të Re, rrushet kryesore të bardha dhe të kuqe, rajonet ku i gjejmë dhe rrushet autoktone shqiptare. Manuali i verës në platformë ka fishën e çdo vere të listës sonë.`],
["Bota e Vjetër dhe Bota e Re",`Në botën e verës flitet shpesh për “Botën e Vjetër” dhe “Botën e Re”.

Bota e Vjetër është Evropa: Franca, Italia, Spanja, Gjermania, Portugalia, Austria, Greqia, Kroacia, Shqipëria. Këtu vera bëhet prej mijëra vitesh dhe etiketa zakonisht tregon rajonin, jo rrushin. Ideja është që vendi, toka dhe klima, që francezët e quajnë “terroir”, janë më të rëndësishme se rrushi. Në etiketë lexojmë “Chablis”, “Barolo”, “Rioja”, “Sancerre”, dhe duhet të dimë që Chablis është Chardonnay, Barolo është Nebbiolo, Rioja është kryesisht Tempranillo dhe Sancerre është Sauvignon Blanc.

Bota e Re është pjesa tjetër: Shtetet e Bashkuara, Australia, Zelanda e Re, Kili, Argjentina, Afrika e Jugut. Këtu etiketa zakonisht tregon rrushin: “Chardonnay”, “Pinot Noir”, “Malbec”. Stili zakonisht është më frutor dhe më i pjekur, sepse klima është shpesh më e ngrohtë.

Kur mysafiri thotë “më pëlqen Chardonnay”, mund t'i ofrosh edhe një Burgundy të bardhë, edhe nëse në etiketë nuk shkruhet Chardonnay.`],
["Të bardhat kryesore",`• Chardonnay. Rrushi i bardhë më i përhapur në botë dhe shumë i gjithanshëm. Në zona të freskëta si Chablis, në veri të Burgundy-së, jep verëra të freskëta, minerale, me aromë molle dhe limoni. Në zona më të ngrohta dhe kur kalon në fuçi druri, si në Kaliforni ose në disa Burgundy të mëdha, jep verëra të plota, kremoze, me aroma gjalpi, vanilje dhe frutash tropikale. Është edhe rrushi kryesor i Champagne-s.
• Sauvignon Blanc. Aromatik, me aroma barishtesh, bari të prerë, agrumesh dhe ndonjëherë frutash tropikale. Aciditet i lartë dhe freski. Rajonet klasike: Sancerre dhe Pouilly-Fumé në luginën e Loire-s, Marlborough në Zelandën e Re.
• Riesling. Një nga rrushet më fisnike. Aciditet shumë i lartë, aroma lulesh, agrumesh, pjeshke dhe, me moshën, një aromë karakteristike që të kujton benzinën. Mund të jetë nga plotësisht i thatë te shumë i ëmbël. Rajonet: Mosel dhe Rheingau në Gjermani, Alsace në Francë, Austria. Riesling-u i Hugel nga Alsace që kemi në listë është i thatë dhe mineral.
• Pinot Grigio ose Pinot Gris. Në Itali, si në Veneto, Friuli dhe Alto Adige, jep verëra të lehta, neutrale dhe të freskëta. Në Alsace jep verëra më të plota dhe aromatike.
• Gewürztraminer. Shumë aromatik, me aroma trëndafili, liçi dhe erëzash. Rajonet: Alsace dhe Alto Adige, ku Tramin, prodhuesi i Maglen-it në listën tonë, është një nga emrat më të njohur.
• Vermentino. Rrush mesdhetar, me aroma agrumesh, barishtesh dhe një ndjesi të kripur. Sardenja, Toskana dhe Liguria.
• Malvasia. Familje rrushi e lashtë mesdhetare, aromatike, me aroma frutash të verdha dhe lulesh. Malvasia del Salento që kemi në listë vjen nga Puglia.`],
["Të kuqet kryesore",`• Cabernet Sauvignon. Tanine të forta, aroma rrushi pa fara të zi, kedri dhe ndonjëherë menteje. Plaket shumë mirë. Rajonet: Bordeaux, sidomos bregu i majtë si Médoc, dhe Napa Valley në Kaliforni.
• Merlot. Më i butë dhe më i rrumbullakët se Cabernet, me aroma kumbulle dhe qershie të zezë. Rajoni klasik: bregu i djathtë i Bordeaux-së, si Saint-Émilion dhe Pomerol. Shpesh përzihet me Cabernet.
• Pinot Noir. I lehtë deri në mesatar, me ngjyrë të zbehtë, aroma qershie, luleshtrydheje, kërpudhash dhe erëzash, aciditet i lartë dhe tanine të buta. Elegant dhe i vështirë për t'u kultivuar. Rajoni klasik: Burgundy, ku Nuits-Saint-Georges i Louis Jadot është shembulli ynë.
• Syrah ose Shiraz. Aroma piperi të zi, frutash të errëta dhe ndonjëherë mishi të tymosur. Në luginën e Rhône-s në Francë quhet Syrah dhe është elegant. Në Australi quhet Shiraz dhe është më i plotë dhe frutor. Në Rhône të jugut përzihet me Grenache dhe Mourvèdre, si në Châteauneuf-du-Pape që kemi në listë. Château Pégau, një nga emrat e mëdhenj të Châteauneuf, është në listën tonë me Setier Côtes, një Côtes du Rhône Villages.
• Sangiovese. Rrushi i Toskanës. Aroma qershie të thartë, domate dhe barishtesh, aciditet i lartë. Chianti, Brunello di Montalcino, Vino Nobile di Montepulciano.
• Nebbiolo. Rrushi i Piemontes. Ngjyrë e zbehtë që gënjen, sepse taninet dhe aciditeti janë shumë të forta. Aroma trëndafili, katrani dhe qershie. Barolo dhe Barbaresco.
• Primitivo. Rrushi i Puglia-s, i njëjti me Zinfandel në Kaliforni. Verëra të plota, frutore, me fruta të pjekura dhe alkool të lartë. Feudi Salentini në listën tonë është nga kjo zonë.
• Tempranillo. Rrushi i Spanjës, i Rioja-s dhe Ribera del Duero. Aroma qershie, lëkure dhe vanilje nga druri.`],
["Rrushet autoktone shqiptare",`Shqipëria ka rrushe autoktone që nuk gjenden askund tjetër, dhe mysafirët ndërkombëtarë janë shpesh kureshtarë t'i provojnë.

• Shesh i Bardhë. Rrushi i bardhë më i përhapur, sidomos në zonat e Tiranës, Durrësit dhe Shijakut. Jep verëra të freskëta, me aroma frutash të verdha dhe lulesh.
• Shesh i Zi. Rrush i kuq i zonës qendrore, që jep verëra me trup mesatar, aroma qershie dhe frutash të kuqe. Është ndër rrushet e kuqe më të kultivuara në vend.
• Kallmet. Rrush i kuq i veriut, i zonës së Lezhës dhe Shkodrës. Jep verëra me ngjyrë të thellë, fruta të errëta dhe tanine të mira. Shkon shumë mirë me mishrat e pjekur, si qengji.
• Pulës. Rrush i bardhë i jugut, i zonës së Beratit, me aroma të këndshme frutore.
• Vlosh. Rrush i kuq i zonës së Vlorës dhe Beratit.

Kur ofron një verë shqiptare, ofroje me krenari dhe me kontekst: “Kjo është nga një rrush autokton shqiptar, që nuk rritet askund tjetër në botë.” Për mysafirin, kjo është përvojë që nuk mund ta ketë në shtëpi.`],
["Si ta përdorësh në sallë",`Njohja e rrushit dhe e rajonit të ndihmon në tri situata të zakonshme:

• Mysafiri kërkon një verë që nuk e kemi. Gjen alternativën nga i njëjti rrush ose stil. “Nuk kemi Sancerre, por kemi një Sauvignon Blanc tjetër me të njëjtin karakter të freskët.”
• Mysafiri përshkruan atë që i pëlqen pa ditur emrat. “Më pëlqen e kuqja, por jo shumë e fortë.” Mendon për Pinot Noir, për një Shesh i Zi ose për një të kuqe të lehtë.
• Mysafiri pyet për një verë të listës që nuk e njeh. Nga rajoni dhe rrushi mund ta shpjegosh stilin.

» Skenë nga Flower: Një mysafir francez kërkon “un Bourgogne rouge”. Kamarieri e di që kjo do të thotë Pinot Noir nga Burgundy, dhe i ofron Nuits-Saint-Georges të Jadot-it. Pastaj shton: “Nëse dëshironi të provoni diçka vendase me karakter të ngjashëm, kemi edhe një Shesh i Zi, më i lehtë dhe me fruta të kuqe.” Mysafiri merr Burgundy-n, por kërkon një gotë Shesh i Zi me ëmbëlsirën për ta provuar.`],
["Përmbledhje",`Bota e Vjetër shkruan rajonin në etiketë, Bota e Re rrushin. Të bardhat kryesore: Chardonnay, Sauvignon Blanc, Riesling, Pinot Grigio, Gewürztraminer, Vermentino, Malvasia. Të kuqet: Cabernet Sauvignon, Merlot, Pinot Noir, Syrah, Sangiovese, Nebbiolo, Primitivo, Tempranillo. Rrushet shqiptare: Shesh i Bardhë, Shesh i Zi, Kallmet, Pulës, Vlosh. Dhe njohja e tyre të lejon të gjesh alternativë, të kuptosh mysafirin dhe të shpjegosh çdo verë.`]
];
LEC.V3=[
["Hyrje: pse rituali",`Mysafiri që porosit një shishe vere po bën shpesh blerjen më të madhe të darkës. Një shishe mund të kushtojë sa gjithë ushqimi i tavolinës, ose më shumë. Rituali i shërbimit të shishes nuk është ceremoni për hir të ceremonisë. I jep mysafirit tri siguri: që vera është pikërisht ajo që zgjodhi, që është në gjendje të mirë dhe që trajtohet me respektin që meriton.

Kur rituali bëhet me qetësi dhe saktësi, mysafiri ndihet në duar të sigurta. Kur bëhet me nxitim, me zhurmë ose me tapë të thyer, i gjithë investimi duket i rrezikuar. Ky leksion shpjegon çdo hap të ritualit, nga prezantimi te dekantimi.`],
["Përgatitja",`Para se të shkosh te tavolina, përgatit:
• Shishen e saktë, e kontrolluar: prodhuesi, emri dhe viti siç i ka zgjedhur mysafiri. Nëse viti nuk përputhet me listën, njofto mysafirin para se ta hapësh.
• Temperaturën e duhur. E bardha dhe shkumëzuesja nga frigoriferi i verës, e kuqja nga dhoma e freskët ose nga frigoriferi i të kuqeve.
• Hapësen e verës, të quajtur edhe “thika e kamarierit”, me thikë të vogël, spirale dhe levë.
• Një pecetë shërbimi të pastër.
• Një pjatë të vogël për tapën.
• Gotat e duhura, të polishuara, nëse nuk janë në tavolinë.
• Për të bardhat dhe shkumëzueset: kovën me akull dhe ujë, me pecetë.
• Për dekantimin: dekantuesin, të pastër, dhe një qiri ose dritë nëse vera ka sediment.`],
["Prezantimi",`Shko te organizatori, ose te personi që porositi verën, dhe qëndro në të djathtën e tij. Mbaje shishen me dorën e djathtë nga fundi dhe me të majtën nga qafa, ose mbi pecetën e palosur, me etiketën drejt mysafirit.

Thuaj qartë prodhuesin, emrin dhe vitin: “Duka Riserva, 2019.” ose “Châteauneuf-du-Pape, 2018.” Prit konfirmimin. Mysafiri mund të pohojë me kokë ose të thotë “po”.

Ky moment duket i shkurtër, por është i rëndësishëm. Nëse ka gabim në shishe ose në vit, kjo është koha për ta zbuluar, para se shishja të hapet.`],
["Hapja",`Shishja hapet pranë tavolinës, para mysafirit, në ajër ose e mbështetur lehtë në buzë të tavolinës, por kurrë duke e mbajtur mes këmbëve ose nën sqetull. Hapat:

• Me thikën e vogël të hapëses, prit folien nën buzën e dytë të qafës, rreth fytit të shishes. Bëj dy prerje gjysmërrethore, njërën nga përpara dhe tjetrën nga prapa, pa e rrotulluar shishen. Etiketa mbetet gjatë gjithë kohës drejt mysafirit.
• Hiq pjesën e sipërme të folies dhe fute në xhep, jo në tavolinë.
• Fshi majën e qafës dhe tapën me pecetën.
• Vendos majën e spirales pak jashtë qendrës së tapës, që spiralja të hyjë në qendër, dhe rrotulloje drejt poshtë. Ndalo para se spiralja të shpojë tapën nga poshtë, që copat e tapës të mos bien në verë. Zakonisht kjo do të thotë një rrotullim para fundit të spirales.
• Vendos levën në buzë të shishes dhe ngrije tapën butë, në dy kohë nëse hapësja ka dy shkallë.
• Pjesën e fundit të tapës nxirre me dorë, duke e lëkundur lehtë, që të dalë pa zhurmë. Hapja me “pop” të fortë konsiderohet joprofesionale.
• Fshi sërish qafën e shishes nga brenda dhe jashtë.

Nëse tapa thyhet, mos u shqetëso para mysafirit. Kërko ndjesë shkurt, fut spiralen me kujdes në pjesën e mbetur dhe nxirre. Nëse copa të vogla bien në verë, derdh pak verë në një gotë të veçantë për t'i hequr.`],
["Tapa dhe prova",`Vendose tapën në një pjatë të vogël pranë organizatorit. Nuk është nevoja që ti ose mysafiri ta nuhatni. Tapa ka gjithmonë erë tape. Kontrollo vizualisht që nuk është e thyer, e shkërmoqur ose e lagur deri në fund, që mund të tregojë probleme ruajtjeje.

Derdh rreth 2 cl verë në gotën e organizatorit dhe prit. Mysafiri do ta shikojë, do ta nuhasë dhe do ta provojë. Kjo provë nuk është për të vendosur nëse i pëlqen vera. Është për të kontrolluar që vera nuk ka defekte, si era e tapës ose oksidimi, që shpjegohen në leksionin V5.

Nëse mysafiri thotë që vera ka problem, mos debato. Kërko ndjesë, hiqe shishen, njofto sommelier-in ose shefin e barit dhe sill një shishe të re, ose ofro alternativë. Edhe nëse ti mendon që vera është në rregull, mysafiri ka të drejtë ta refuzojë dhe vlerësimi bëhet më pas, larg tavolinës.`],
["Derdhja",`Pas miratimit, derdh verën te mysafirët e tjerë, duke lëvizur në drejtim të akrepave të orës: zonjat fillimisht, pastaj zotërinjtë, dhe organizatori i fundit, duke plotësuar gotën e tij të provës.

Sasia e derdhjes:
• E kuqja, deri në rreth një të tretën e gotës. Gota e madhe lë hapësirë që vera të ajroset dhe aromat të mblidhen.
• E bardha dhe roze, deri në rreth një të katërtën, që vera të mbetet e ftohtë.
• Shkumëzuesja, në dy kohë. Fillimisht derdh pak deri sa shkuma të ngrihet, prit që të bjerë, pastaj plotëso deri në rreth dy të tretat e gotës.

Teknika: mbaje shishen nga fundi ose nga trupi, me etiketën drejt mysafirit. Derdh nga e djathta, pa e prekur gotën me shishen. Në fund të derdhjes, rrotullo lehtë shishen ndërsa e ngre, që pika e fundit të mbetet në buzë dhe të mos bjerë në mbulesë. Mund të fshish buzën me pecetën.

Llogarit sasinë: një shishe 750 ml jep rreth pesë gota prej 150 ml. Për një tavolinë prej gjashtë vetash, derdhja e parë duhet të jetë pak më e vogël që të gjithë të marrin.`],
["Pas derdhjes dhe rimbushja",`Pas derdhjes:
• E bardha, roze dhe shkumëzuesja vendosen në kovë me akull dhe ujë, jo vetëm akull, me një pecetë mbi kovë për të fshirë shishen kur e nxjerr. Kova vendoset pranë tavolinës, në të djathtën e organizatorit.
• E kuqja vendoset mbi tavolinë, mbi një coaster ose pjatë të vogël, ose në stacion nëse tavolina është e vogël.

Rimbushja bëhet pa u kërkuar, sipas leksionit L2: kur gota ka mbetur pak, rimbushet. Por pa e mbushur tepër, dhe pa e shpejtuar fundin e shishes për të shitur të dytën. Kur shishja po mbaron, pyet organizatorin me zë të ulët nëse dëshiron një shishe tjetër, të njëjtën ose diçka tjetër.`],
["Dekantimi",`Dekantimi është derdhja e verës nga shishja në një enë qelqi, dekantuesin. Bëhet për dy arsye të ndryshme.

E para, për sedimentin. Verërat e kuqe të vjetra, zakonisht mbi dhjetë vjet, dhe disa verëra të pafiltruara krijojnë sediment, kristale dhe grimca që mblidhen në fund të shishes. Sedimenti nuk është i dëmshëm, por është i hidhur dhe i pakëndshëm në gotë. Për këtë dekantim, shishja duhet të qëndrojë në këmbë për disa orë para shërbimit që sedimenti të mblidhet në fund. Pastaj vera derdhet shumë ngadalë në dekantues, me qafën e shishes mbi një qiri ose dritë, dhe derdhja ndalet sapo sedimenti arrin në qafë.

E dyta, për ajrosjen. Verërat e kuqe të reja dhe të fuqishme, me tanine të forta, si një Châteauneuf-du-Pape i ri ose një Barolo, mund të jenë të mbyllura sapo hapen. Kontakti me oksigjenin i hap aromat dhe i zbut taninet. Këtu derdhja mund të jetë më e shpejtë, që vera të marrë ajër.

Gjithmonë pyet mysafirin para se të dekantosh: “Dëshironi ta dekantojmë që të hapet?” Disa mysafirë preferojnë ta ndjekin verën ndërsa ndryshon në gotë. Shishja e zbrazët lihet në tavolinë pranë dekantuesit, që mysafiri të shohë etiketën.`],
["Përmbledhje",`Rituali i shishes ka tetë hapa: përgatitja, prezantimi me prodhuesin, emrin dhe vitin, hapja pa e rrotulluar shishen dhe pa zhurmë, tapa në pjatë pa e nuhatur, prova 2 cl pa debat nëse refuzohet, derdhja në drejtim të akrepave me organizatorin të fundit, ruajtja në kovë për të bardhat dhe në tavolinë për të kuqet, dhe dekantimi kur duhet, gjithmonë duke pyetur mysafirin. Praktiko hapjen me shishe bosh të mbyllura me tapë derisa ta bësh pa menduar.`]
];
LEC.V4=[
["Hyrje: çiftimi si rekomandim",`Mysafiri që ka zgjedhur pjatën shpesh pyet: “Çfarë vere më rekomandoni?” Ky është momenti ku kamarieri mund ta bëjë darkën më të mirë dhe njëkohësisht të rrisë shitjen. Por shumë kamarierë ngurrojnë, sepse mendojnë që çiftimi i verës me ushqimin është shkencë e vështirë për sommelier-ët.

Në të vërtetë, gjashtë parime të thjeshta zgjidhin shumicën dërrmuese të çiftimeve. Ky leksion i shpjegon me shembuj nga menutë tona. Faqja Çiftimet në Manualin e verës ka sugjerime të gatshme për çdo pjatë, në tri nivele çmimi.`],
["Parimi 1: pesha me peshë",`Parimi më i rëndësishëm, që zgjidh rreth shtatëdhjetë për qind të çiftimeve, është që pesha e verës duhet të përputhet me peshën e pjatës.

Pjatat e lehta, si peshku i bardhë, frutat e detit, sallatat, perimet, shkojnë me verëra të lehta: të bardha të freskëta, roze, të kuqe të lehta. Pjatat e rënda, si mishi i kuq, mishrat e gatuar ngadalë, salcat me krem ose me gjalpë, shkojnë me verëra të plota.

Nëse çifton një pjatë të lehtë me një verë të rëndë, vera e mbulon ushqimin dhe mysafiri nuk ndjen më shijen e pjatës. Nëse çifton një pjatë të rëndë me një verë të lehtë, vera duket e hollë dhe e ujshme.

Shembull: levreku me kore barishtesh është i lehtë dhe i freskët. Shkon me një të bardhë të freskët si Riesling-u i Hugel. Tomahawk-u është i rëndë dhe i yndyrshëm. Shkon me një të kuqe të plotë si Duka Riserva ose një Châteauneuf-du-Pape.`],
["Parimi 2: aciditeti",`Aciditeti në verë ka dy funksione në çiftim.

I pari, pastron yndyrën. Vera me aciditet të lartë ndihet si një fshirje e gojës pas një kafshate të yndyrshme, dhe e përgatit për kafshatën tjetër. Kjo është arsyeja pse shampanja shkon aq mirë me ushqimet e skuqura, dhe pse Sauvignon Blanc shkon me djathin e dhisë.

I dyti, përputhet me acidin në pjatë. Kur pjata ka limon, domate, uthull ose vinegret, vera duhet të ketë aciditet të paktën të barabartë. Përndryshe vera duket e sheshtë dhe pa jetë. Një sallatë me vinegret ose një peshk me limon kërkon një të bardhë me aciditet të lartë, jo një Chardonnay të plotë dhe kremoz.`],
["Parimi 3: taninet me proteinën",`Taninet e verës së kuqe lidhen me proteinat dhe yndyrën e mishit. Kur pi një verë me tanine të forta vetëm, ndjen thatësi në gojë. Kur e pi me një copë mishi të kuq, taninet kapen me proteinat dhe zbuten, dhe vera ndihet më e butë dhe më frutore. Kjo është arsyeja pse Cabernet Sauvignon me biftek është një nga çiftimet më klasike të botës.

Në të kundërt, taninet me peshk të yndyrshëm, si salmoni, toni ose skumbri, krijojnë shpesh një shije metalike të pakëndshme në gojë. Prandaj, për peshkun, zgjedhim zakonisht të bardha. Kur mysafiri dëshiron patjetër një të kuqe me peshkun, zgjidh një të kuqe me tanine të buta dhe aciditet, si Pinot Noir.`],
["Parimi 4: ëmbëlsia dhe pikanti",`Rregulli për ëmbëlsirat: vera duhet të jetë të paktën po aq e ëmbël sa ëmbëlsira. Nëse çifton një ëmbëlsirë me një verë të thatë, vera duket e thartë dhe e hidhur. Me ëmbëlsirat, ofrojmë verëra ëmbëlsire, si një Moscato d'Asti i lehtë me frutat, një verë e ëmbël me çokollatën, ose një Porto me djathrat.

Për ushqimet pikante, si pjatat me spec djegës ose me erëza të forta, alkooli i lartë dhe taninet i forcojnë djegien. Verërat më të mira me pikantin janë ato me pak ëmbëlsi, alkool të ulët dhe aciditet, si një Riesling gjysmë i thatë ose një Gewürztraminer.`],
["Parimi 5: rajoni me rajonin",`Një nga rregullat më të vjetra dhe më të sigurta: ajo që rritet bashkë, shkon bashkë. Kuzhinat dhe verërat e një rajoni janë zhvilluar bashkë për shekuj dhe përshtaten natyrshëm.

Shembuj:
• Chianti me pastat me ragù toskan.
• Barolo me mishrat e Piemontes dhe me tartufin.
• Muscadet me midhjet e Bretanjës.
• Primitivo i Puglia-s me pjatat jugore italiane me domate dhe mish.
• Kallmet me qengjin e pjekur shqiptar.
• Shesh i Bardhë me peshkun e Adriatikut.
• Duka nga Durrësi me mishrat e pjekur në skarë.

Ky parim është veçanërisht i fuqishëm për pjatat shqiptare dhe mesdhetare, sepse i jep mysafirit edhe një histori.`],
["Parimi 6: kontrasti ose ngjashmëria",`Mund të çiftosh duke përsëritur një shije ose duke e kundërshtuar.
