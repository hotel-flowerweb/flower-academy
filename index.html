/* ---- FLOWER · Antipasta ---- */
"Carpaccio toni":{x:"Feta shumë të holla toni të gjallë, të shtrira në pjatë. Midhjet japin kripën e detit, perlat e limonit çlirojnë një freski agrumi, lime-i dhe alga deti japin freski dhe jod. Pjatë e lehtë, e ftohtë dhe e freskët.",say:"Ju sugjeroj carpaccio-n e tonit: feta delikate toni të freskët, me midhje, perla limoni dhe alga deti. Një fillim i lehtë dhe elegant, me shijen e pastër të detit.",tip:"Peshk i gjallë: pyet për shtatzëninë dhe imunitetin. Me gotë: Malvasia; me shishe: rozé Ca' Maiol ose shampanjë."},
"Karkaleca të skuqur në tigan":{x:"Karkaleca të pjekur shpejt në tigan të nxehtë, që marrin kore të artë dhe mbeten të lëngshëm brenda. Emulsioni me nduja, sallami pikant kalabrez, jep djegie të butë dhe tym; crumble-i i domates jep krokantësi dhe ëmbëlsi.",say:"Karkalecat tona të pjekura në tigan, me një emulsion të butë nduja, sallami artizanal nga Kalabria, dhe thërrime domateje. Një ekuilibër i bukur midis ëmbëlsisë së karkalecit dhe një note të ngrohtë pikante.",tip:"Ka mish derri (nduja): pyet për mysafirët që nuk hanë derr. Krustace dhe gluten."},
"Langustinë":{x:"Langustina është krustace e vogël me mish shumë të ëmbël dhe delikat. Shoqërohet me barishte të egra, pita integrale për të marrë lëngun, dhe stracciatella, djathë shumë i butë kremoz nga Puglia, që zbut kripën e detit.",say:"Langustina është një nga frutat më delikate të detit, me mish natyrshëm të ëmbël. E shërbejmë me stracciatella kremoze nga Puglia dhe barishte të egra. Për mua, një nga antipastat më të rafinuara të menusë.",tip:"Krustace, gluten dhe qumësht."},
"Fritter krokant merluci":{x:"Copa merluci të veshura me brumë dhe të skuqura, krokante jashtë dhe të buta brenda. Pluhuri i popcorn-it shton krokantësi dhe një aromë të lehtë misri të pjekur. Pjatë argëtuese, mirë për ndarje.",say:"Fritter-i i merlucit është ideal për ta ndarë me aperitivin: merluc i butë në një kore të artë dhe krokante, me një prekje të lehtë misri të pjekur.",tip:"Peshk, gluten, vezë. Me Prosecco ose shampanjë: flluskat pastrojnë yndyrën."},
"Carpaccio peshk murgu":{x:"Peshku murg ka mish të bardhë, të fortë dhe të ëmbël, që shpesh krahasohet me mishin e karavidheve. Këtu prehet shumë hollë dhe shoqërohet me qitro, lime dhe kastravec turshi, që japin thartirë dhe freski.",say:"Carpaccio i peshkut murg: mish i bardhë, i ëmbël dhe i hollë si mëndafsh, me qitro, lime dhe kastravec turshi. I freskët, i pastër dhe shumë elegant.",tip:"Peshk i gjallë ose i marinuar: konfirmo me kuzhinën dhe pyet për shtatzëninë. Turshia mund të ketë sulfite."},
"Midhje me kimchi":{x:"Midhje të gatuara në salcë kimchi, lakra e fermentuar koreane me djegës, hudhër dhe xhenxhefil. Shije pikante, e thartë dhe umami, që lidhet shumë mirë me kripën e midhjeve. Lëngu është shumë i shijshëm me bukë.",say:"Nëse ju pëlqejnë shijet me karakter, midhjet me kimchi janë një zgjedhje e veçantë: lakra koreane e fermentuar u jep një notë të ngrohtë, pak pikante dhe shumë aromatike.",tip:"Pikante: paralajmëro. Kimchi mund të ketë peshk ose karkaleca të fermentuar. Me Riesling ose Gewürztraminer, kurrë verë me dru."},
"Kuskus me sepje":{x:"Kuskus, kokrra të vogla bollguri, me sepje, një molusk me mish të trashë dhe të ëmbël. Hudhra e zezë jep ëmbëlsi dhe shije si balsamik, bajamet japin krokantësi. Është edhe në menunë e degustimit.",say:"Kuskusi me sepje ka një kombinim që befason: ëmbëlsinë e sepjes, thellësinë e hudhrës së zezë, që ka nota si balsamik, dhe krokantësinë e bajameve të pjekura.",tip:"Gluten, molusqe dhe arra (bajame)."},
"Tartar peshku":{x:"Peshk i gjallë i prerë me thikë në kubikë të vegjël, i përzier me krem Philadelphia dhe avokado. Tekstura kremoze e djathit dhe avokados e mbështjell peshkun.",say:"Tartar peshku, i prerë me thikë, me një krem të butë djathi dhe avokado. Teksturë mëndafshi dhe shije shumë e pastër.",tip:"Peshk i gjallë: pyet për shtatzëninë. Pyet kuzhinën cili peshk është sot."},
"Oktapod i zi":{x:"Pjata signature e antipastave. Oktapodi shoqërohet me piper të tymosur, xhenxhefil, karkalec dhe soje, dhe sipër flakes oktapodi, ashkla të holla krokante. Shije e thellë, e tymosur, umami dhe pak aziatike.",say:"Ju rekomandoj Oktapodin e zi, një nga pjatat signature të shefit: oktapod i butë me piper të tymosur, xhenxhefil dhe soje, i kurorëzuar me ashkla krokante oktapodi. Thellësi, tym dhe një prekje aziatike.",tip:"Molusqe, krustace (karkaleci), soje, gluten. Me gotë: Riesling; me shishe: Gewürztraminer Hugel ose Geheimrat J."},
"Karkaleca Viola":{x:"Karkaleca të mëdhenj premium, të shitur me peshë. Shoqërohen me krem Philadelphia, vaj borziloku dhe grejpfrut, që japin kremozitet, aromë barishte dhe thartirë agrumi.",say:"Karkalecat Viola janë nga më të çmuarat e Mesdheut. I shërbejmë me krem djathi, vaj borziloku dhe grejpfrut, që nxjerrin në pah ëmbëlsinë e tyre natyrale. Çmimi është 12.000 lekë për kilogram; me kënaqësi ju them peshën para se t'i përgatisim.",tip:"Çmimi për kg: thuaj gjithmonë peshën dhe çmimin para porosisë. Krustace dhe qumësht."},
"Goca deti":{x:"Goca të freskëta, të shërbyera me copë. Retsina, vera greke me rrëshirë pishe, koriandri dhe farat e koprës japin aromë mesdhetare, dhe vera Sigalas Assyrtiko nga Santorini shton mineralitet.",say:"Gocat tona shërbehen me retsina, koriandër, kopër dhe pak Sigalas nga Santorini, një verë minerale që i shoqëron në mënyrë perfekte. 550 lekë copa; shumë mysafirë fillojnë me tri ose gjashtë.",tip:"Molusqe të gjalla: pyet për shtatzëninë. Përmban verë (sulfite). Çiftimi perfekt: Sigalas, Chablis ose shampanjë."},
"Tartar karkalecash":{x:"Karkaleca të gjallë të prerë imët, me çips wasabi, jalapeño dhe djegës, mbi letër orizi krokante. Freski, djegie dhe krokantësi njëherësh.",say:"Tartar-i i karkalecave është freski e pastër: karkaleca të freskët me wasabi dhe jalapeño, mbi një fletë orizi të hollë dhe krokante. Një notë e lehtë pikante e bën shumë të gjallë.",tip:"Pikante. Krustace të gjalla: pyet për shtatzëninë."},
"Brusketë me açuge":{x:"Fetë buke e pjekur me açuge, pure fava, e butë dhe kremoze, dhe domate të thara, të ëmbla dhe të përqendruara. Pjatë e vogël dhe e lirë, perfekte me aperitivin.",say:"Për ta shoqëruar gotën e parë, brusketa me açuge: krem i butë fava, domate të thara dhe açuge mesdhetare. E thjeshtë, por plot shije.",tip:"Peshk dhe gluten."},
"Oktapod":{x:"Oktapod i gatuar, me marmelatë domateje, ëmbël-kripur, dhe infuzion djegësi për pak djegie. Versioni më klasik dhe mesdhetar, krahasuar me Oktapodin e zi.",say:"Nëse preferoni një version më klasik mesdhetar, oktapodi me marmelatë domateje dhe një infuzion të lehtë djegësi është shumë i ekuilibruar.",tip:"Molusqe. Nëse mysafiri pyet diferencën: oktapodi i zi është më aziatik dhe i tymosur, ky më mesdhetar."},
/* ---- FLOWER · Sallata ---- */
"Domate qershi të marinuara":{x:"Domate qershi të lëna në marinadë që thithin shije, me rikota dhe stracciatella, dy djathëra të butë italianë. E freskët dhe kremoze. Është edhe në degustim.",say:"Domatet qershi të marinuara, me rikota dhe stracciatella: e freskët, kremoze dhe shumë e lehtë. Një sallatë që flet për verën mesdhetare.",tip:"Qumësht. Vegjetariane, sipas përbërësve: konfirmo marinadën me kuzhinën."},
"Sallata Underground":{x:"\"Underground\" do të thotë \"nën tokë\": sallatë me perime rrënjë, alabash, karotë dhe selino rrënjë, me avokado. Krokante, e freskët dhe e lehtë.",say:"Sallata Underground është homazh për perimet që rriten nën tokë: alabash, karotë dhe selino rrënjë, me avokado. Krokante, e freskët dhe shumë e lehtë.",tip:"Selino (alergjen). Vegjetariane, sipas përbërësve."},
"Medley domatesh":{x:"Përzierje e disa llojeve domatesh, me krem djathi, kore barishtesh krokante dhe speca.",say:"Një përzgjedhje domatesh të ndryshme, me krem djathi dhe një kore krokante barishtesh. Shije të pastra dhe një teksturë shumë e këndshme.",tip:"Qumësht; kora mund të ketë gluten: konfirmo."},
"Sallatë jeshile e përzier":{x:"Sallatë me gjethe të gjelbra, kikirikë të pjekur, luleshtrydhe dhe grejpfrut: krokante, e ëmbël dhe e thartë.",say:"Sallata jeshile me kikirikë të pjekur, luleshtrydhe dhe grejpfrut: një ekuilibër i bukur midis ëmbëlsisë, thartirës dhe krokantësisë.",tip:"Kikirikë: alergjen i rëndë, pyet gjithmonë."},
/* ---- FLOWER · Supa ---- */
"Supë peshku":{x:"Supë klasike peshku. Pyet kuzhinën para turnit cilët peshq përdoren sot dhe nëse ka krustace ose molusqe.",say:"Supa jonë e peshkut, sipas recetës klasike: e ngrohtë, e pasur dhe plot aromat e detit.",tip:"Peshk; konfirmo krustacet, molusqet dhe selinon. Me një të bardhë vendase si Tufa Sheshi i Bardhë."},
"Hithra me trahana":{x:"Supë tradicionale me trahana, grurë dhe kos i fermentuar dhe i tharë, dhe hithra, bimë e egër që pas gatimit ka shije si spinaq. E ngrohtë dhe pak e thartë.",say:"Për ata që duan të njohin traditën shqiptare: trahana me hithra, një recetë e vjetër, e ngrohtë dhe me një thartirë të këndshme kosi.",tip:"Gluten dhe qumësht. Mysafirit të huaj shpjegoja trahanën."},
"Supë sinagride":{x:"Supë me sinagridë, dentex, një peshk i bardhë shkëmbor premium i Mesdheut, me mish të fortë dhe shije të pastër.",say:"Supa me sinagridë është e veçanta jonë: sinagrida është një nga peshqit më të çmuar të Mesdheut, me mish të bardhë dhe shije shumë të pastër.",tip:"Peshk."},
/* ---- FLOWER · Kryesore ---- */
"Merluc me krem preshi":{x:"Merluc me krem preshi të fermentuar, me aromë të butë qepe dhe pak thartirë, dhe tri fruta të thata: bajame, arra dhe arra pishe, për krokantësi. Është edhe në degustim.",say:"Merluci me krem preshi është shumë i rafinuar: një krem i butë preshi me një notë të lehtë të fermentuar, dhe krokantësia e tri llojeve të arrave.",tip:"Peshk dhe arra (tre lloje): pyet gjithmonë. Me Lugana Ca' dei Frati ose Beaune."},
"Peshk murgu":{x:"Peshk murgu, me mish të bardhë dhe të fortë, me fava, mascarpone kremoz, barishte të egra dhe kumquat, agrumi i vogël që hahet me lëkurë.",say:"Peshku murg ka mish të fortë dhe të ëmbël, që shpesh krahasohet me karavidhen. Këtu shoqërohet me krem fava, mascarpone dhe kumquat, një agrum i vogël ëmbël-thartë.",tip:"Peshk dhe qumësht."},
"Shojzë":{x:"Shojza është peshk i sheshtë me mish shumë delikat, një klasik i kuzhinës franceze. Me qepë perla, gjalpë dhe uthull sherry, që balancon gjalpin me një thartirë të butë. Shitet me peshë.",say:"Shojza është mbretëresha e peshqve të sheshtë në kuzhinën franceze. E përgatisim në mënyrë klasike, me gjalpë, qepë perla dhe uthull sherry. Çmimi është 7.000 lekë për kilogram; ju them me kënaqësi peshën e peshkut të sotëm.",tip:"Thuaj peshën dhe çmimin. Pyet nëse e do të filetuar në tavolinë ose në kuzhinë, sipas praktikës sonë. Me Chablis Premier Cru ose Meursault."},
"Levrek me kore barishtesh":{x:"Levrek i pjekur me një kore barishtesh sipër, mbi pure fasuleje kremoze dhe karota ylber, karota në ngjyra të ndryshme.",say:"Levreku me kore barishtesh, mbi një pure të butë fasuleje dhe karota ylber. Një pjatë e freskët, e ekuilibruar dhe shumë e bukur për syrin.",tip:"Peshk dhe gluten (kora). Me Chablis ose Tramin Chardonnay."},
"Salmon me glazurë aziatike":{x:"Salmon i lyer me një glazurë ëmbël-kripur aziatike, me oriz basmati, perime julienne dhe soje.",say:"Salmoni me glazurë aziatike, ëmbël-kripur, me oriz basmati aromatik dhe perime të prera hollë. Një pjatë e ngrohtë dhe shumë e ekuilibruar.",tip:"Peshk, soje, gluten. Me Gewürztraminer ose Pinot Noir i lehtë."},
"Levrek në tigan me hollandaise":{x:"Levrek i pjekur në tigan me lëkurë krokante, me angjinare, asparagus, salcë hollandaise, salca franceze me të verdhë veze dhe gjalpë, dhe flakes bonito që japin umami.",say:"Levreku në tigan, me lëkurë krokante, shoqërohet me salcën klasike hollandaise, angjinare dhe asparagus. Një pjatë me shpirt francez, e pasur dhe elegante.",tip:"Peshk, vezë, qumësht. Me Chardonnay e plotë: Braide Alte ose Meursault."},
"Fileto levreku me taramosalata":{x:"Fileto levreku me taramosalata, krem grek me vezë peshku të kripura, dhe pesto majdanozi.",say:"Fileto levreku me taramosalata, kremi tradicional grek me vezë peshku, dhe pesto majdanozi. Shije e thellë deti, me shumë karakter.",tip:"Peshk; taramosalata ka shpesh gluten ose qumësht dhe pesto mund të ketë arra: konfirmo."},
/* ---- FLOWER · Pasta dhe risoto ---- */
"Pasta me goca deti":{x:"Pasta me goca deti, me fara kopre dhe koriandër, të njëjtat aroma si te gocat e antipastës. Është edhe në degustim.",say:"Pasta me goca deti, me koriandër dhe kopër: e gjithë freskia e gocave, në një pjatë të ngrohtë dhe elegante.",tip:"Gluten, molusqe. Me Pecorino Nerube ose Sigalas."},
"Paccheri me peshk murgu":{x:"Paccheri, tuba të gjerë pastë napolitane, me peshk murgu, shkumë qumështi dhe flakes domateje.",say:"Paccheri, pasta e madhe napolitane, me peshk murgu, një shkumë e lehtë qumështi dhe ashkla domateje. Kremoze, por e lehtë.",tip:"Gluten, peshk, qumësht."},
"Pasta me karkaleca dhe vaj açugeje":{x:"Pasta me karkaleca, barishte dhe vaj açugeje, që jep kripë dhe umami pa e mbuluar karkalecin.",say:"Pasta me karkaleca dhe vaj açugeje: açugeja i jep thellësi dhe kripë delikate, pa e mbuluar ëmbëlsinë e karkalecave.",tip:"Gluten, krustace, peshk."},
"Risoto me trufë":{x:"Risoto kremoz me trufë, kërpudha kantarela dhe crumble wasabi, që jep një prekje të lehtë djegëse dhe krokante.",say:"Risoto-ja me trufë është një klasik i menusë: kremoze, me kërpudha kantarela dhe aromën e thellë të trufës, me një prekje të lehtë wasabi që e freskon.",tip:"Zakonisht ka qumësht dhe gjalpë: konfirmo. Me Chardonnay e plotë ose Pouilly-Fuissé."},
/* ---- FLOWER · Ëmbëlsira ---- */
"Biskotë muscovado":{x:"Biskotë me sheqer kaf muscovado, me aromë melase dhe karameli, me çokollatë dhe mjedër.",say:"Biskota me muscovado, një sheqer kaf me nota karameli, shoqërohet me çokollatë dhe mjedër. Ngrohtë dhe frutore.",tip:"Gluten, vezë, qumësht: konfirmo."},
"Tortë Cipriani me beze agrumesh":{x:"Tortë me beze agrumesh dhe kumquat. Emri lidhet me stilin e familjes Cipriani të Venecias (Harry's Bar); pyet pastiçerin për historinë e recetës sonë.",say:"Torta Cipriani, me një beze të lehtë agrumesh dhe kumquat: e freskët dhe elegante, ideale pas peshkut.",tip:"Vezë, gluten, qumësht: konfirmo."},
"Crème brûlée me brioche":{x:"Crème brûlée, krem vanilje me kore sheqeri të karamelizuar, me brioche, pjeshkë dhe akullore.",say:"Crème brûlée, me koren e saj të karamelizuar, me brioche, pjeshkë dhe akullore. Një klasik francez i interpretuar me ngrohtësi.",tip:"Vezë, qumësht, gluten."},
"Cheesecake me kamomil":{x:"Cheesecake me xhelatinë kamomili, me aromë të butë si mjaltë dhe lule.",say:"Cheesecake me kamomil: kremoze dhe e lehtë, me një aromë delikate lulesh dhe mjalti.",tip:"Qumësht, gluten, vezë. Xhelatina zakonisht nuk është vegjetariane: konfirmo."},
"Dacquoise":{x:"Ëmbëlsirë franceze me bazë beze me lajthi, çokollatë dhe mousse vanilje: krokante, kremoze dhe e lehtë.",say:"Dacquoise është një ëmbëlsirë franceze me shtresa beze lajthie, çokollatë dhe mousse vanilje: krokante, kremoze dhe e lehtë njëkohësisht.",tip:"Arra (lajthi), vezë, qumësht."},
"Çokollatë Dubai, stili Flower":{x:"Versioni i Flower i çokollatës së famshme të Dubait, me praline fistiku dhe zakonisht kadaif krokant brenda. 600 ose 650 lekë sipas formatit.",say:"Versioni ynë i çokollatës së famshme të Dubait, me praline fistiku. Nëse ju pëlqen fistiku, është një kënaqësi e vërtetë.",tip:"Arra (fistik), qumësht, gluten nëse ka kadaif: konfirmo."},
"Bakllava signature e Genti Malavecit":{x:"Bakllavaja signature e pastiçerit Genti Malaveci, me kadaif, brumi në fije të holla, dhe fistik të karamelizuar. Specialiteti i ëmbëlsirave të Flower.",say:"Ju rekomandoj me gjithë zemër bakllavanë signature të pastiçerit tonë, Genti Malaveci: kadaif i artë dhe fistik i karamelizuar. Me një espresso, është mbyllja perfekte e darkës.",tip:"Gluten, arra (fistik), qumësht (gjalpë). Me espresso."},
"Tartë çokollate":{x:"Tartë me bazë brumi dhe mbushje çokollate.",say:"Për të dashuruarit e çokollatës, tarta jonë e çokollatës: e pasur, e thellë dhe klasike.",tip:"Gluten, vezë, qumësht."},
"Sufle":{x:"Sufle e përgatitur në çast, me akullore, karamel dhe ashkla bajameje. Duhet pak kohë: sugjeroje para se të mbarojë pjata kryesore.",say:"Sufleja përgatitet në çast për ju, me akullore, karamel dhe bajame. Kërkon pak minuta, prandaj nëse dëshironi, mund ta porosisim që tani që të jetë gati në momentin e duhur.",tip:"Vezë, qumësht, arra, gluten. Pyet kuzhinën sa minuta duhen."},
/* ---- GARDEN · Antipasta ---- */
"Pulë krokante":{x:"Pulë e marinuar në dhallë, që e bën shumë të butë, pastaj e skuqur krokante. Shoqërohet me salcë kosi, krem kosi dhe havjar, që shton kripë deti dhe luks.",say:"Pula jonë krokante marinohet në dhallë që të mbetet shumë e butë, dhe shërbehet me krem kosi dhe havjar. Një kombinim i guximshëm dhe shumë elegant.",tip:"Qumësht, gluten, vezë peshku (havjar). Me Prosecco, Franciacorta ose shampanjë."},
"Patëllxhan i gatuar ngadalë":{x:"Patëllxhan i gatuar për një kohë të gjatë derisa bëhet shumë i butë, si krem, me shurup xhenxhefili dhe barishte. Është edhe në degustim.",say:"Patëllxhani gatuhet ngadalë për shumë kohë, derisa merr një teksturë të butë si krem, me shurup xhenxhefili. Befasues për ata që mendojnë se nuk e duan patëllxhanin.",tip:"Vegjetariane sipas përbërësve: konfirmo me kuzhinën."},
"Asparagus me foie gras":{x:"Asparagus me hudhër të egër, spinaq dhe foie gras të karamelizuar, mëlçi rose e majmur, shumë kremoze. Pjatë luksoze dhe e pasur. Është edhe në degustim.",say:"Asparagus me foie gras të karamelizuar, hudhër të egër dhe spinaq: freskia e pranverës bashkë me një nga produktet më luksoze të kuzhinës franceze.",tip:"Foie gras: disa mysafirë nuk e hanë për arsye etike, ofro alternativë pa koment."},
"Polentë":{x:"Polentë, nga mielli i misrit, me majonezë hudhre të pjekur dhe parmixhan.",say:"Polenta, me majonezë hudhre të pjekur dhe parmixhan: e ngrohtë, e butë dhe shumë e shijshme për ta ndarë.",tip:"Vezë (majoneza), qumësht."},
"Tartar viçi me kimchi":{x:"Mish viçi i gjallë i prerë me thikë, me salcë kimchi pikante dhe të thartë.",say:"Tartar viçi i prerë me thikë, me kimchi: freskia e mishit të gjallë me një notë koreane të ngrohtë dhe pak pikante.",tip:"Mish i gjallë: pyet për shtatzëninë. Kimchi mund të ketë peshk: konfirmo."},
"Brusketë me palcë":{x:"Fetë buke e pjekur me palcë kockash, të butë dhe të yndyrshme, me gremolata, limon, hudhër dhe majdanoz, që pastron yndyrën, dhe pecorino. Është edhe në degustim.",say:"Brusketa me palcë është një klasik i kuzhinës së mishit: palca e pasur e kockave, e freskuar me gremolata limoni dhe pecorino. Shumë e mirë për ta ndarë në fillim.",tip:"Gluten, qumësht. Mirë për ndarje."},
"Carpaccio viçi":{x:"Feta të holla viçi të gjallë, me fruta pasioni, angjinare, crumble trufe dhe një sferë delikate frutash pylli. Është edhe në degustim.",say:"Carpaccio i viçit, me trufë, angjinare dhe fruta pasioni, i kurorëzuar me një sferë delikate frutash pylli. Një pjatë shumë e rafinuar.",tip:"Mish i gjallë: pyet për shtatzëninë. Me Pinot Noir i lehtë: Maglen ose Nuits-Saint-Georges."},
"Arancini":{x:"Topa orizi të skuqur, krokantë jashtë, me chorizo, kimchi dhe pecorino brenda: pikante dhe e shijshme.",say:"Arancini, topat sicilianë të orizit, me një kore të artë dhe zemër kremoze, me chorizo, kimchi dhe pecorino. Ideale për ta ndarë.",tip:"Ka mish derri (chorizo). Gluten, qumësht, vezë: konfirmo."},
"Tartar wagyu":{x:"Wagyu i prerë me thikë, me crumble wasabi. Yndyra e wagyu-së e bën shumë të butë.",say:"Tartar-i me wagyu, mishi japonez më i vlerësuar në botë, me një prekje wasabi. Teksturë jashtëzakonisht e butë dhe shije shumë e pasur.",tip:"Mish i gjallë. Është edhe në degustim."},
/* ---- GARDEN · Sallata ---- */
"Speca të pjekur në Josper":{x:"Speca të pjekur në Josper, me tym dhe ëmbëlsi, me uthull luleshtrydheje, rukola, fasule të bardha, angjinare dhe pesto arrash.",say:"Specat e pjekur në Josper marrin një aromë të lehtë tymi dhe ëmbëlsi natyrale. I shërbejmë me fasule të bardha, angjinare dhe pesto arrash.",tip:"Arra (pesto), qumësht nëse pesto ka djathë: konfirmo."},
"Domate zemër kau":{x:"Domate zemër kau, varietet i madh dhe mishor, me gjalpë dhe krem djathi vendas. Është pjata e parë e degustimit.",say:"Domatet zemër kau janë nga më të ëmbla dhe më mishoret; i shërbejmë me krem djathi vendas. E thjeshtë, por me produkt të shkëlqyer.",tip:"Qumësht."},
"Sallatë e përzier me parmixhan":{x:"Sallatë me parmixhan, avokado, arra dhe soje.",say:"Sallata e përzier me parmixhan, avokado dhe arra: e freskët, e plotë dhe shumë e ekuilibruar.",tip:"Qumësht, arra, soje."},
"Avokado me feta":{x:"Avokado me domate të thara dhe djathë feta grek.",say:"Avokado me feta greke dhe domate të thara: kremoze, e kripur lehtë dhe shumë mesdhetare.",tip:"Qumësht."},
/* ---- GARDEN · Kryesore ---- */
"Qengj në brumë me palcë":{x:"Qengj i mbështjellë në brumë dhe i pjekur, me palcë, domate të thara, tri lloje kërpudhash dhe krem pecorino.",say:"Qengji i pjekur në brumë, me palcë, kërpudha dhe krem pecorino, është një pjatë e pasur dhe festive, ideale për një darkë të veçantë.",tip:"Gluten, qumësht. Me Duka Cabernet, Barolo ose Châteauneuf 2012."},
"Brinjë qengji me kimchi":{x:"Brinjë qengji me salcë kimchi, të shitura me peshë.",say:"Brinjët e qengjit me kimchi: shija e plotë e qengjit me një notë të ngrohtë koreane. Çmimi është 4.000 lekë për kilogram, dhe ju them me kënaqësi peshën e porcionit.",tip:"Thuaj peshën dhe çmimin. Kimchi mund të ketë peshk."},
"Short rib me lakër të Golemit":{x:"Short rib, brinjë e shkurtër viçi e gatuar ngadalë derisa bëhet shumë e butë, me lakër të egër të Golemit, klorofil barishtesh, marmelatë kumbulle të egër dhe chimichurri.",say:"Short rib gatuhet ngadalë për shumë orë, derisa bëhet jashtëzakonisht e butë. E shërbejmë me lakër të egër të Golemit, kumbull të egër dhe chimichurri të freskët.",tip:"Pyet kuzhinën për origjinën e lakrës së Golemit, që ta tregosh mirë."},
"Qengj i gatuar ngadalë":{x:"Qengj i gatuar ngadalë, me qepë të karamelizuara, pure karote të bardhë dhe gjethe kaperi. Është pjata kryesore e degustimit.",say:"Qengji ynë gatuhet ngadalë derisa mishi ndahet vetë nga kocka, me qepë të karamelizuara dhe një pure të butë karote të bardhë. Është edhe kulmi i degustimit tonë.",tip:"Me Malbec me gotë; me shishe Tufa Sheshi i Zi, Châteauneuf-du-Pape ose Côte-Rôtie."},
"Short rib me polentë":{x:"Short rib me polentë, krem patëllxhani, spec të pjekur, krem kosi dhe demi-glace me piper Timur, që jep aromë grejpfruti dhe pak mpirje.",say:"Short rib me polentë dhe një demi-glace të thellë me piper Timur nga Nepali, që ka një aromë delikate grejpfruti. Pjatë e ngrohtë dhe shumë e pasur.",tip:"Qumësht. Me Montepulciano, Primitivo ose Amarone."},
/* ---- GARDEN · Supa ---- */
"Trahana me tru qengji":{x:"Supë tradicionale trahane me tru qengji, një pjatë e vjetër popullore.",say:"Për ata që duan të provojnë kuzhinën më tradicionale shqiptare: trahana me tru qengji, një recetë e vjetër dhe plot karakter.",tip:"Gluten, qumësht. Mysafirit të huaj shpjegoja qartë që ka tru."},
"Supë asparagusi":{x:"Krem asparagusi, i butë dhe me aromë të freskët.",say:"Krem asparagusi, i butë dhe i freskët, një fillim i lehtë para mishit.",tip:"Zakonisht ka qumësht ose krem: konfirmo."},
/* ---- GARDEN · Pasta dhe risoto ---- */
"Pasta Sunshine":{x:"Pasta me krem cacio e pepe, djathë pecorino dhe piper i zi, me një vezë të glazuruar me soje sipër dhe angjinare të pjekura në Josper. Është edhe në degustim.",say:"Pasta Sunshine është e veçanta jonë: krem cacio e pepe me pecorino dhe piper të zi, një vezë e glazuruar me soje dhe angjinare të pjekura në Josper.",tip:"Gluten, qumësht, vezë, soje."},
"Rigatoni me tartar viçi":{x:"Rigatoni me tartar viçi dhe trufë të zezë.",say:"Rigatoni me tartar viçi dhe trufë të zezë: një kombinim i guximshëm, elegant dhe shumë aromatik.",tip:"Gluten. Pyet kuzhinën nëse viçi mbetet i gjallë apo ngrohet nga pasta."},
"Pastiço":{x:"Pasta e pjekur në furrë me viç, sallam artizanal dhe reduksion kockash.",say:"Pastiço-ja jonë, pasta e pjekur me viç dhe sallam artizanal, me një reduksion të thellë kockash. Ngrohtë, e pasur dhe tradicionale.",tip:"Gluten, qumësht, vezë: konfirmo. Sallami mund të jetë derri."},
"Pasta me salcë kremoze domateje":{x:"Pasta me salcë kremoze domateje dhe erëz Korfuzi, ndoshta përzierja e erëzave të Korfuzit: pyet kuzhinën.",say:"Pasta me salcë kremoze domateje dhe erëza nga Korfuzi: e thjeshtë, e ngrohtë dhe e dashur për të gjithë, edhe për më të vegjlit.",tip:"Gluten, qumësht."},
/* ---- GARDEN · Ëmbëlsira ---- */
"Bakllava me fistik":{x:"Bakllava me fistik dhe akullore me tonka, farë me aromë vanilje dhe bajameje.",say:"Bakllavaja me fistik, e shoqëruar me akullore tonka, me nota vaniljeje dhe bajameje. Tradita, me një prekje moderne.",tip:"Gluten, arra, qumësht."},
"Tiramisu Brutal":{x:"Tiramisu, versioni \"Brutal\" i Garden, me ganache karameli dhe ashkla bajameje.",say:"Tiramisu Brutal është ëmbëlsira emblematike e Garden: kremoze, me ganache karameli dhe bajame të thekura. Mbyllja perfekte pas mishit.",tip:"Vezë, qumësht, gluten, arra; ka kafe."},
"Cheesecake kremoz me liçi":{x:"Cheesecake kremoze me pure liçi, një fryt tropikal me aromë si trëndafil.",say:"Cheesecake kremoze me liçi, një fryt tropikal me aromë delikate trëndafili. E lehtë dhe shumë e freskët.",tip:"Qumësht, gluten, vezë."},
"Semifreddo vanilje":{x:"Semifreddo, \"gjysmë i ngrirë\", me vanilje, ftua të karamelizuar dhe çips frutash pasioni.",say:"Semifreddo me vanilje, ftua të karamelizuar dhe fruta pasioni: e freskët, e butë dhe elegante.",tip:"Qumësht, vezë."},
"Tarta de queso":{x:"Cheesecake baske, e pjekur shumë e nxehtë: sipër e karamelizuar dhe pothuajse e djegur, brenda kremoze.",say:"Tarta de queso, cheesecake-u bask nga San Sebastián: sipërfaqe e karamelizuar dhe zemër shumë kremoze.",tip:"Qumësht, vezë."},
"Revani me mastikë":{x:"Revani, ëmbëlsira tradicionale me bollgur dhe shurup, me mastikë nga Kios, krem frutash pasioni dhe fletë ari. Mbyll degustimin e Garden.",say:"Revani tradicional, i aromatizuar me mastikë nga Kios, me krem frutash pasioni dhe një fletë ari. Mbyllja e degustimit tonë.",tip:"Gluten, vezë, qumësht."},
"Tartë frutash pylli":{x:"Tartë me fruta pylli, çokollatë të bardhë, karamel dhe fistik.",say:"Tarta me fruta pylli, çokollatë të bardhë dhe fistik: frutore, e ëmbël me masë dhe shumë e freskët.",tip:"Gluten, qumësht, arra."},
/* ---- GARDEN · Mish premium ---- */
"Ribeye":{x:"Prerje nga brinjët, me marbling të lartë. Yndyra shkrihet në Josper dhe e mban mishin të lëngshëm. Shitet me peshë: 14.000 lekë për kilogram.",say:"Ribeye është prerja më e shijshme për Josper: yndyra e ndërthurur e mban mishin të lëngshëm dhe plot aromë. Shefi e rekomandon medium-rare. Çmimi është 14.000 lekë për kilogram.",tip:"Thuaj peshën dhe çmimin; pyet gradën e pjekjes. Me Primitivo Gocce ose Barolo."},
"Picanha":{x:"Prerje braziliane nga pjesa e sipërme e kofshës, me shtresë yndyre sipër që shkrihet në skarë. 9.000 lekë për kilogram.",say:"Picanha është prerja klasike braziliane: shtresa e saj e yndyrës, e pjekur në Josper, i jep mishit një shije të plotë dhe të tymosur. 9.000 lekë për kilogram.",tip:"Thuaj peshën dhe çmimin. Me Malbec argjentinas."},
"Tomahawk USA":{x:"Ribeye me kockën e gjatë të brinjës, nga SHBA. Prerje spektakël për dy ose më shumë persona. 12.000 lekë për kilogram.",say:"Tomahawk-u amerikan është prerja më spektakolare e menusë: ribeye me kockën e gjatë të brinjës, perfekt për t'u ndarë. Me 12.000 lekë për kilogram, për shembull një prej 1,2 kg del rreth 14.400 lekë.",tip:"Thuaj gjithmonë peshën reale dhe çmimin para porosisë. Me Montes Alpha, Brunello ose Gaja."},
"T-Bone":{x:"Biftek me kockë në formë T: nga njëra anë fileto e butë, nga tjetra sirloin me shije më të fortë. 12.000 lekë për kilogram.",say:"T-Bone ju ofron dy prerje në një: fileton, shumë të butë, dhe sirloin-in, me shije më të fortë. 12.000 lekë për kilogram.",tip:"Thuaj peshën dhe çmimin."},
"Wagyu":{x:"Racë japoneze me marbling ekstrem; mishi ka teksturë jashtëzakonisht të butë. Shërbehet në porcione të vogla sepse është shumë i pasur. 50.000 lekë për kilogram.",say:"Wagyu është një nga mishrat më të çmuar në botë, me një teksturë jashtëzakonisht të butë dhe shije shumë të pasur. E shërbejmë në porcione të vogla, për ta shijuar si një përvojë më vete. Çmimi është 50.000 lekë për kilogram.",tip:"Thuaj peshën e porcionit dhe çmimin para porosisë. Me Barbera d'Alba ose Pomerol."}
};

/* MANUALI I VERËRAVE TË FLOWER
   Burimi: fotot e listës së verërave (2 nëntor 2026) + kërkim online për prodhuesit.

/* Leksionet e gjata: LEC[id] = [[titull, tekst]]. Paragrafët ndahen me rresht bosh; "• " = listë; "» " = skenë / shembull nga Flower. */
const LEC={};
LEC.L1=[
["Hyrje: pse 60 sekondat e para vendosin gjithë mbrëmjen",`Mysafiri formon një mendim për restorantin përpara se të shohë menunë, përpara se të provojë verën, madje përpara se të ulet. Studimet e mikpritjes dhe vetë logjika e Forbes Travel Guide e thonë të njëjtën gjë: përshtypja e parë ndërtohet në hyrje dhe gjithçka që vjen më pas krahasohet me të. Nëse hyrja është e ngrohtë dhe e sigurt, mysafiri fal një vonesë të vogël në kuzhinë. Nëse hyrja është e ftohtë ose kaotike, edhe pjata më e mirë e shefit fillon me pikë negative.

Kjo është arsyeja pse Forbes e mat pritjen me sekonda. Standardi HD1 kërkon që mysafiri të njihet sapo është e mundur, dhe HD19 kërkon që të përshëndetet verbalisht brenda një minute, të shoqërohet te tavolina dhe të ndihmohet me karrigen. Në bar, BL1 kërkon të njëjtën gjë: njohje sapo është e mundur dhe përshëndetje brenda një minute pasi mysafiri ulet.

Në këtë leksion do të shohim çdo hap të pritjes, nga momenti kur dera hapet deri te momenti kur kamarieri merr tavolinën. Do të shohim edhe situatat e vështira: kur nuk ka tavolinë gati, kur je i zënë me telefon, kur vjen një grup pa rezervim, kur mysafiri është i bezdisur që në hyrje.`],
["Dallimi midis njohjes dhe përshëndetjes",`Shumë staf i ngatërron këto dy veprime, por Forbes i mat veçmas. Njohja është sinjali i parë, pa fjalë: kontakt me sy, buzëqeshje, një lëvizje e lehtë e kokës. Ajo i thotë mysafirit “të pashë, je i rëndësishëm, po vij”. Njohja duhet të ndodhë brenda rreth 10 sekondave nga momenti kur mysafiri hyn në fushëpamjen tënde.

Përshëndetja është veprimi verbal: “Mirëmbrëma, mirë se vini në Flower.” Ajo duhet të vijë brenda 60 sekondave. Pse dy afate? Sepse në një mbrëmje të ngarkuar nuk mund të lësh gjithmonë menjëherë atë që po bën. Por gjithmonë mund të ngresh sytë dhe të buzëqeshësh. Mysafiri që e ka marrë njohjen pret i qetë 40 sekonda. Mysafiri që nuk e ka marrë njohjen ndihet i harruar pas 15 sekondash.

• Njohja: 10 sekonda, pa fjalë, edhe kur je në telefon ose me një mysafir tjetër.
• Përshëndetja: 60 sekonda, me fjalë, me emër kur e di.
• Nëse je i zënë më gjatë se kaq, sinjalizo një koleg. Hyrja nuk lihet kurrë bosh.

» Skenë nga Flower: Hosti është në telefon me një rezervim për të shtunën. Hyn një çift. Hosti ngre sytë, buzëqesh, ngre lehtë dorën me pëllëmbë të hapur (“një moment”). Mbaron telefonatën brenda 30 sekondave me “Ju falemnderit, ju presim të shtunën”, e ul telefonin dhe i drejtohet çiftit: “Mirëmbrëma, mirë se vini në Flower. Keni rezervim sonte?” Çifti ka pritur, por nuk është ndjerë i harruar asnjë sekondë.`],
["Fjalia e parë dhe fuqia e emrit",`Fjalia e parë duhet të jetë e thjeshtë, e ngrohtë dhe e plotë: përshëndetja sipas orës, mirëseardhja dhe emri i restorantit. “Mirëmbrëma, mirë se vini në Flower.” Shmang përshëndetjet e rastit si “Ç'kemi”, “Hë, urdhëroni” ose thjesht “Sa veta?”. Ato nuk janë të gabuara në një lokal të zakonshëm, por në një restorant hoteli me standard Forbes ulin nivelin menjëherë.

Emri i mysafirit është fjala më e fuqishme që ke. Kur e di emrin nga rezervimi, nga recepsioni ose sepse mysafiri ka qenë më parë, përdore që në fjalinë e parë: “Mirëmbrëma, zonja Leka, mirë se vini përsëri.” Mysafirët e hotelit shpesh e kanë emrin në sistem dhe recepsioni mund ta njoftojë restorantin. Kjo është një nga mënyrat më të lira dhe më efektive për të krijuar ndjenjën e njohjes personale.

Megjithatë, emri përdoret me masë. Një herë në hyrje, një herë kur prezanton kamarierin, një herë në lamtumirë. Përdorimi i tepërt tingëllon i mësuar përmendësh. Dhe nëse nuk je i sigurt për shqiptimin e një emri të huaj, pyet me mirësjellje një herë dhe mbaje mend, në vend që ta shqiptosh gabim tri herë.`],
["Konfirmimi, preferencat dhe rastet e veçanta",`Pas përshëndetjes, konfirmo rezervimin dhe numrin e personave. Kjo duket formale, por ka një qëllim: të hap derën për informacionin që e bën mbrëmjen personale. “Kemi tavolinën tuaj për dy persona. Preferoni pranë dritares apo më në qetësi?” Edhe kur tavolina është caktuar më parë, pyetja i jep mysafirit ndjenjën e zgjedhjes.

Gjatë këtyre sekondave hosti vëzhgon. Ka një buqetë lulesh, një kuti dhuratë, një fëmijë në karrocë, një person me shkop ose me vështirësi në lëvizje, një mysafir me laptop që duket se ka takim pune? Secila nga këto është informacion që duhet t'i kalojë kamarierit dhe që ndryshon mënyrën e shërbimit.

• Ditëlindje ose përvjetor: njofto kamarierin dhe kuzhinën që në fillim, jo në fund kur është vonë për një detaj në ëmbëlsirë.
• Takim pune: tavolinë më e qetë, shërbim më diskret, fatura e gatshme pa u kërkuar shumë herë.
• Fëmijë: karrige fëmije gati, një përmendje e ujit dhe e bukës që vjen shpejt.
• Lëvizshmëri e kufizuar: tavolinë afër, rrugë pa pengesa, karrige me mbështetëse krahësh nëse ka.
• Alergji e përmendur në rezervim: konfirmoje me zë të ulët dhe kaloja kamarierit me shkrim.`],
["Kur tavolina nuk është gati: arti i kohës së pritjes",`Standardi HD2 thotë se kur mysafiri duhet të presë, i jepet një kohë e vlerësuar dhe kjo kohë respektohet, me një tolerancë rreth plus ose minus pesë minuta. Kjo është një nga pikat ku restorantet humbasin më shpesh pikë, sepse instinkti i stafit është të zbusë lajmin e keq me “vetëm një minutë” ose “pak sekonda”. Pastaj minuta bëhet pesëmbëdhjetë dhe mysafiri ndihet i gënjyer.

Rregulli është i thjeshtë: jep një kohë reale, pak më të gjatë se sa mendon. Nëse mendon tetë minuta, thuaj “rreth dhjetë minuta”. Nëse e mbaron në tetë, mysafiri është i kënaqur. Nëse thua pesë dhe e mbaron në tetë, mysafiri është i zemëruar, edhe pse ka pritur të njëjtën kohë.

HD3 kërkon që të ketë një zonë të rehatshme pritjeje. Në Flower kjo do të thotë ta shoqërosh mysafirin në lounge ose në bar, t'i ofrosh një pije dhe t'i japësh menunë për ta parë ndërkohë. Pritja që kalon me një gotë Hugo në dorë nuk ndihet si pritje.

Dhe pika më e rëndësishme: rikthehu brenda kohës që ke thënë. Nëse e kupton që do të vonohet më shumë, shko te mysafiri para se të kalojë afati dhe jepi një kohë të re. “Ju kërkoj ndjesë, tavolina po mbaron tani dhe do jetë gati për pesë minuta të tjera.” Mysafiri që informohet para se të pyesë e ruan besimin. Mysafiri që duhet të vijë vetë te podiumi për të pyetur e ka humbur atë.

» Skenë nga Flower: E premte, ora 20:30. Një familje prej katër vetash pa rezervim. Salla është plot, një tavolinë po paguan. Hosti: “Mirëmbrëma, mirë se vini. Kemi një tavolinë që do lirohet për rreth 15 minuta. Mund t'ju ofroj diçka për të pirë në bar ndërkohë?” Hosti njofton barin, shënon orën në listë dhe pas 10 minutash shkon te familja: “Tavolina juaj po përgatitet, edhe pak minuta.” Pas 14 minutash i shoqëron.`],
["Shoqërimi: ec përpara, jo larg",`Mysafiri nuk dërgohet te tavolina me një gjest dore nga podiumi. Ai shoqërohet. Kjo është një nga gjërat që Forbes e vë re menjëherë. Hosti ecën një hap përpara, në anën e mysafirit, me ritmin e mysafirit dhe jo me ritmin e vet. Herë pas here kthen kokën për t'u siguruar që mysafiri e ndjek dhe nuk ka mbetur pas.

Gjatë ecjes mund të thuhet diçka e shkurtër dhe natyrale, si “Sonte kemi menunë degustuese me dhjetë pjata” ose “Tavolina juaj është pranë dritares, siç e kërkuat.” Nuk duhet monolog. Qëllimi është që heshtja të mos ndihet e rëndë.

Rruga duhet të jetë e lirë. Nëse një kamarier po kalon me një tabaka, hosti ndalon dhe i lë vend, duke i treguar mysafirit me një gjest të butë që të presë një moment. Kurrë nuk e çon mysafirin nëpër zonën e shërbimit ose pranë kuzhinës nëse ka rrugë tjetër.`],
["Karrigia, menuja dhe dorëzimi te kamarieri",`Te tavolina, hosti tërheq karrigen dhe e shtyn butë ndërsa mysafiri ulet. Përparësi u jepet zonjave dhe të moshuarve, por pa e bërë veprimin teatral. Nëse mysafiri e tërheq vetë karrigen, nuk insistohet. Karrigia e ndihmuar është një shenjë e vogël që komunikon klasë më shumë se çdo fjalë.

Menutë jepen të hapura ose i vendosen në dorë mysafirit, jo lihen të mbyllura mbi pjatë. Nëse ka menu të veçantë sonte, ose nëse mysafiri është në Garden ku menuja degustuese ka nëntë pjata, hosti mund ta përmendë shkurt.

Hapi i fundit, dhe ndoshta më i rëndësishmi, është dorëzimi i informacionit. Hosti prezanton kamarierin me emër: “Ardit do t'ju shërbejë sonte.” Pastaj, larg mysafirit, i kalon kamarierit gjithçka që ka mësuar: emrin, numrin e dhomës nëse është mysafir hoteli, rastin e veçantë, alergjinë, preferencën. Rregulli i artë: mysafiri nuk duhet ta përsërisë kurrë diçka që ia ka thënë një herë stafit. Nëse i ka thënë hostit se është alergjik ndaj arrave dhe kamarieri e pyet përsëri, mysafiri mendon se askush nuk e dëgjon dhe fillon të shqetësohet për sigurinë e vet.`],
["Situata të vështira në hyrje",`Hyrja është vendi ku ndodhin shumë situata që nuk janë në manual. Ja disa nga më të zakonshmet dhe si i trajtojmë.

• Mysafiri vjen i nervozuar (trafik, vonesë, debat): mos e merr personalisht. Ul tonin, fol më ngadalë, ofroji një gotë ujë sapo ulet. Shpesh tensioni bie brenda dy minutave nëse nuk ndesh rezistencë.
• Mysafiri vjen shumë herët për rezervimin: “Jeni pak më herët, tavolina juaj do jetë gati në orën 20:00. Mund t'ju ofroj një pije në bar?” Nëse tavolina është gati, uleni.
• Mysafiri vjen me vonesë të madhe dhe tavolina është dhënë: kërkoni ndjesë pa fajësuar, shpjegoni çfarë mund t'i ofroni dhe kur, mos e diskutoni kush ka faj.
• Grup më i madh se rezervimi: “Me kënaqësi, më jepni dy minuta ta përgatisim tavolinën për gjashtë.” Mos thuaj kurrë “por ju rezervuat për katër”.
• Mysafir që kërkon tavolinë tjetër: nëse ka mundësi, jepet pa diskutim. Nëse jo, shpjegohet dhe ofrohet alternativa ose pritja.
• Dy mysafirë hyjnë njëkohësisht: njohje me sy për të dy, përshëndetje e plotë me të parin dhe një fjali për të dytin: “Ju përshëndes edhe ju, jam me ju menjëherë.”`],
["Përmbledhje",`Pritja është momenti më i shkurtër i mbrëmjes, por ai që ka ndikimin më të madh. Mbaj mend sekuencën: njih brenda 10 sekondave, përshëndet brenda 60 sekondave, përdor emrin, konfirmo dhe vëzhgo, jep kohë reale nëse ka pritje dhe respektoje, shoqëro duke ecur përpara, ndihmo me karrigen, prezanto kamarierin dhe kaloji çdo informacion.

Nëse çdo mysafir i Flower kalon këto hapa pa asnjë përjashtim, në çdo turn, kemi siguruar pikët e para të inspektimit Forbes dhe, më e rëndësishmja, kemi nisur mbrëmjen në anën e duhur.`]
];
LEC.L2=[
["Hyrje: tavolina, jo kamarieri",`Kur mysafiri ulet, fillon një orë e re. Forbes nuk pyet nëse kamarieri i tavolinës ishte i zënë. Pyet vetëm një gjë: sa kohë kaloi nga momenti kur mysafiri u ul deri te momenti kur dikush nga stafi e përshëndeti dhe i ofroi diçka për të pirë. Standardi HD20 e vendos këtë kufi në një minutë.

Kjo do të thotë që përshëndetja e tavolinës është përgjegjësi e të gjithë sallës. Nëse kamarieri i zonës është në kuzhinë, kolegu që kalon pranë ndalon, përshëndet, ofron ujë dhe thotë “Kolegu im Ardit do jetë me ju menjëherë.” Fraza “s'është tavolina ime” nuk ekziston në Flower. Për mysafirin, të gjithë jemi një ekip.

Ky leksion mbulon tri gjëra: përshëndetjen e parë te tavolina, ofertën e pijeve dhe ritmin e pijeve gjatë gjithë vaktit, përfshirë rimbushjet, raundin e ri, kafenë dhe çajin.`],
["Përshëndetja e tavolinës: struktura",`Përshëndetja e tavolinës ka katër pjesë dhe zgjat rreth 20 sekonda.

• Përshëndetja sipas orës: “Mirëmbrëma.”
• Prezantimi me emër: “Unë jam Ardit dhe do kujdesem për ju sonte.”
• Personalizimi, kur ka informacion nga hosti: “Më thanë që sot festoni përvjetorin, urime!”
• Oferta e parë: uji. “Preferoni ujë natyral apo me gaz?”

Uji është oferta e parë sepse është e thjeshtë, i përgjigjet një nevoje reale dhe i jep kamarierit një arsye për t'u rikthyer pas një minute. Kur e ofron, përmend markën që shërbejmë, sepse kjo tregon kujdes dhe i lejon mysafirit të zgjedhë me informacion.

Pozicioni i trupit gjatë përshëndetjes: qëndro në fund të tavolinës ose në një pikë ku sheh të gjithë mysafirët pa u kthyer. Mos u përkul mbi tavolinë dhe mos u mbështet me dorë në karrige. Mbaj menunë e verës ose tabletin në dorë, jo nën sqetull.`],
["Oferta konkrete kundër pyetjes së hapur",`Pyetja “Doni diçka për të pirë?” duket e sjellshme, por në fakt i kalon mysafirit punën. Ai duhet të mendojë, të hapë listën, të zgjedhë mes 120 verërash dhe 13 kokteilesh, ndërkohë që sapo është ulur dhe ende nuk e di as çfarë do të hajë. Shumica e mysafirëve përgjigjen “vetëm ujë për tani”, jo sepse nuk duan, por sepse u mungon informacioni.

Oferta konkrete e zgjidh këtë problem. “Për të filluar, ju sugjeroj një gotë Riesling Hugel nga Alsace, i freskët dhe mineral, ose Malvasia del Salento, më aromatike.” Dy opsione, secili me një përshkrim prej katër fjalësh. Mysafiri ka diçka për të vendosur dhe ndjen që kamarieri e njeh produktin. Nëse asnjë nuk i pëlqen, biseda ka filluar dhe ti mund të pyesësh “Ju pëlqen më shumë e bardha apo e kuqja?”

Oferta përshtatet sipas momentit dhe mysafirit. Në Garden në një mbrëmje vere, një kokteil i freskët si Hugo është oferta natyrale. Për një çift që feston, një gotë shampanjë ose prosecco. Për një mysafir biznesi që duket i lodhur, një aperitiv klasik si Negroni ose një nga krijimet tona premium si Clover Kiss. Signature-in Old Father ruaje për pas darkës. Për një familje me fëmijë, limonada jonë dhe uji për të gjithë.

» Skenë nga Garden: Dy miq, rreth të tridhjetave, ulen në orën 19:00. Kamarieri: “Mirëmbrëma, unë jam Elsa. Preferoni ujë natyral apo me gaz? Dhe nëse doni të filloni me diçka të freskët, Hugo Spritz-i ynë me lule shtogu, prosecco dhe mente është shumë i kërkuar këtë stinë, ose një gotë Malvasia.” Njëri porosit Hugo, tjetri pyet për birrat. Elsa përmend dy birrat gjermane, Augustiner dhe Paulaner, dhe Peja-n për atë që do diçka vendase. Porosia mbaron në 40 sekonda.`],
["Koha e pijes së parë",`Standardi BL17 thotë se pija e parë duhet të arrijë brenda katër minutave nga porosia kur mysafiri është në tavolinë dhe brenda tre minutave kur është në banak. Në banak koha është më e shkurtër sepse mysafiri e sheh barmenin dhe pritja ndihet më e gjatë.

Për të respektuar këto kohë, kamarieri duhet ta hedhë porosinë në sistem menjëherë, jo pasi ka marrë edhe dy tavolina të tjera. Pijet thjeshtë, si uji, vera me gotë ose birra, mund të shërbehen shumë më shpejt se katër minuta dhe duhet të jenë. Kokteilet me shumë përbërës janë rasti ku koha mund të kalojë.

Nëse e di që një pije do kërkojë më shumë kohë, paralajmëro që në momentin e porosisë: “Ky kokteil kërkon rreth gjashtë minuta sepse e përgatisim me dorë. Ndërkohë t'ju sjell ujin?” Pritja e paralajmëruar nuk është gabim. Pritja e papritur po.`],
["Rimbushjet: gota që nuk mbetet bosh",`Gota bosh është një nga sinjalet më të dukshme të një shërbimi të dobët, dhe Forbes e mat me kujdes. HD22 thotë se rimbushjet ofrohen brenda një minute pasi pija mbaron. BL18 thotë të njëjtën gjë për raundin tjetër në bar: ofrohet në mënyrë diskrete, brenda një minute.

Kjo kërkon që kamarieri të mos ecë në sallë me sy përpara, por me sy mbi tavolina. Çdo herë që kalon në zonën tënde, kontrollo gotat e ujit, gotat e verës dhe shishet në tavolinë. Mos prit që gota të jetë plotësisht bosh. Kur uji ka mbetur në një të katërtën, rimbushe. Kur vera ka mbetur pak, afrohu dhe ofro.

Si mbushen gotat: uji rreth dy të tretat e gotës. Vera e kuqe deri në rreth një të tretën e gotës, që të ketë vend për t'u ajrosur. Vera e bardha dhe roze pak më pak, rreth një të katërtën, që të mbetet e ftohtë. Shampanja në dy kohë, fillimisht deri sa shkuma të ngrihet, pastaj deri në rreth dy të tretat. Mbushja e tepërt nuk është bujari, është mungesë teknike, dhe në rastin e verës me shishe i shpejton mysafirit fundin e shishes.

Ka një përjashtim: verën me shishe që mysafiri e ka kërkuar ta mbajë vetë. Nëse mysafiri thotë “e mbush vetë”, respektohet, por kamarieri vazhdon të kontrollojë temperaturën dhe sasinë dhe ofron shishen e dytë në kohë.`],
["Raundi i ri pa ndërprerë bisedën",`Oferta e raundit të ri është një moment delikat. Mysafirët janë në bisedë dhe nuk duan të ndërpriten, por as nuk duan të presin me gotë bosh. Teknika është e thjeshtë: afrohu në anën e mysafirit, prit një pauzë natyrale në bisedë, kontakt me sy, dhe pyetje e shkurtër me zë të ulët. “Edhe një Negroni, zoti Smith?” ose thjesht një gjest drejt gotës me sytë pyetës.

Nëse mysafiri thotë jo, nuk insistohet. Mund të ofrosh alternativë: “Ndoshta një gotë ujë me gaz?” Kurrë mos e ofro raundin e ri me zë të lartë nga larg dhe kurrë mos merr gotën bosh pa e pyetur mysafirin nëse ka mbaruar.

Në bar, raundi i ri ka edhe një dimension të përgjegjësisë. Barmeni vëzhgon sjelljen e mysafirit dhe, nëse sheh shenja të konsumit të tepërt, ofron ujë, diçka për të ngrënë ose një alternativë pa alkool, siç shihet në modulin për shërbimin e përgjegjshëm.`],
["Kafeja dhe çaji: detaji që mbetet në kujtesë",`Kafeja zakonisht është gjëja e fundit që mysafiri merr. Prandaj është ajo që mbetet në kujtesë. HD21 kërkon që kafeja dhe çaji të shërbehen në mënyrë të rafinuar, dhe HD48 kërkon që kafe dhe çajra specialë të jenë të disponueshëm në çdo kohë.

Rregullat e shërbimit të kafesë:
• Filxhani vjen gjithmonë me pjatë, i pastër dhe pa njolla anash.
• Dorëza e filxhanit kthehet nga e djathta e mysafirit, rreth orës katër, dhe luga vendoset paralel me dorëzën.
• Sheqeri, ëmbëlsuesi dhe qumështi vijnë në enë të veçanta, kurrë të hedhur mbi pjatë.
• Espresso shoqërohet me një gotë të vogël ujë.
• Kur ka shumë filxhanë, çdo mysafir merr të vetin pa pyetur “kush e kishte kapuçinon?”.

Çaji kërkon edhe më shumë kujdes. Mysafiri merr kutinë ose listën e çajrave për të zgjedhur. Uji duhet të jetë në temperaturën e duhur, rreth 80 gradë për çajin jeshil, afër vlimit për çajin e zi dhe infuzionet. Shoqërohet me një ibrik me ujë shtesë të nxehtë dhe, nëse ka, me një kohëmatës ose udhëzim për kohën e infuzionit. Limoni, qumështi dhe mjalti ofrohen, nuk vendosen automatikisht.`],
["Përmbledhje",`Mbaj mend këto katër numra: 60 sekonda nga ulja te përshëndetja, 4 minuta për pijen e parë në tavolinë, 3 minuta në banak, 60 sekonda për rimbushjen ose raundin e ri. Mbaj mend edhe parimin: oferto, mos pyet. Dy sugjerime konkrete me një përshkrim të shkurtër shesin më shumë dhe krijojnë besim më shumë se çdo pyetje e hapur.

Dhe mbaj mend që gota bosh është përgjegjësi e kujtdo që e sheh. Në një sallë ku të gjithë kontrollojnë gotat, asnjë mysafir nuk duhet të ngrejë dorën për ujë.`]
];
LEC.L3=[
["Hyrje: si flasim është pjesë e produktit",`Mysafiri nuk e kujton çdo pjatë që ka ngrënë, por e kujton si e kanë trajtuar. Gjuha, toni i zërit dhe gjuha e trupit janë mjetet me të cilat ne e trajtojmë. Forbes ka një grup të tërë standardesh për këtë, nga HD4 deri te HD8, plus HD12 dhe HD13 dhe HD17, me ekuivalentet e tyre në bar. Ato mbulojnë fjalorin, mënyrën e të folurit, ngrohtësinë, personalizimin dhe mënyrën si mbyllim çdo ndërveprim.

Qëllimi nuk është të flasim si robotë me fraza të mësuara përmendësh. Përkundrazi, Forbes penalizon shërbimin që duket i skriptuar. Qëllimi është të kemi një gjuhë profesionale natyrale, të ngrohtë dhe të saktë, që e bën mysafirin të ndihet i respektuar pa u ndjerë i largët.`],
["Fjalori: çfarë themi dhe çfarë nuk themi",`Ka fjalë dhe shprehje që i përdorim çdo ditë me miqtë, por që në sallë ulin nivelin e shërbimit. Nuk janë fjalë të këqija, thjesht nuk i përkasin regjistrit të një restoranti hoteli.

• Në vend të “Ç'kemi” ose “Hë”: “Mirëmbrëma” ose “Mirëdita”.
• Në vend të “Ok”, “S'ka problem”, “Merak mos ki”: “Me kënaqësi”, “Sigurisht”, “Patjetër”.
• Në vend të “S'kemi” ose “Ka mbaruar”: “Sonte nuk e kemi, por ju sugjeroj...” me një alternativë.
• Në vend të “Prisni” ose “Një sekondë”: “Më lejoni një moment ta kontrolloj” dhe pastaj kthehu realisht brenda një momenti.
• Në vend të “Djema” ose “Guys” për një grup: “Zonja dhe zotërinj” ose thjesht pa emërtim.
• Në vend të “Mbaruat?” kur merr pjatat: “A mund ta marr?”

Zhargoni i kuzhinës nuk del në sallë. “Tavolina katër ka dy levrekë në fire” është gjuhë e brendshme. Mysafirit i thua “Levreku juaj është gati dhe po vjen.”

Edhe në anglisht ka regjistër. “Yeah”, “Sure thing”, “No worries” janë shumë të rastit. “Certainly”, “Of course”, “My pleasure” janë standardi. Shumë mysafirë të hotelit janë të huaj dhe anglishtja jonë duhet të jetë po aq e kujdesshme sa shqipja.`],
["Toni dhe ritmi i zërit",`I njëjti fjali mund të tingëllojë e ngrohtë ose e ftohtë vetëm nga toni. “Mirëmbrëma” e thënë me zë të ulët, pa buzëqeshje dhe duke parë tabletin, tingëllon si detyrim. E thënë me zë të qetë, me kontakt me sy dhe me buzëqeshje të lehtë, tingëllon si mirëseardhje.

Disa rregulla praktike:
• Fol pak më ngadalë se zakonisht, sidomos me mysafirë të huaj ose të moshuar.
• Volumi përshtatet me sallën. Në një mbrëmje të qetë në Flower flitet me zë të ulët. Në Garden me muzikë mund të duhet pak më lart, por kurrë mbi bisedën e tavolinave pranë.
• Buzëqeshja dëgjohet edhe në telefon. Kur merr rezervime, buzëqesh ndërsa flet.
• Mos fol me kolegët me zë në sallë, as për punë. Komunikimi me kolegët bëhet me gjeste ose afër, me zë të ulët.
• Mos u nxito kur shpjegon një pjatë, edhe kur salla është plot. Nxitimi i transmetohet mysafirit.`],
["Gjuha e trupit: çfarë thotë trupi para se të flasësh",`Mysafiri lexon gjuhën e trupit tënd para se të dëgjojë fjalët. Një kamarier me krahë të kryqëzuar pranë murit duket i mërzitur, edhe kur nuk është. Një kamarier që ecën me shpejtësi duke parë poshtë duket i stresuar dhe i paarritshëm.

Qëndrimi profesional në sallë:
• Qëndrim drejt, me peshën mbi të dyja këmbët, duart para trupit ose anash, jo në xhepa, jo të kryqëzuara, jo të mbështetura te muri ose te banaku.
• Kontakti me sy me mysafirin kur flet me të, dhe me secilin anëtar të tavolinës, jo vetëm me atë që porosit.
• Kur flet me një mysafir të ulur, mos qëndro shumë larg dhe as shumë afër. Rreth një hap nga tavolina. Për biseda më të gjata, si shpjegimi i menusë degustuese, mund të ulesh pak në gjunjë për të qenë në nivelin e syve, nëse stili i sallës e lejon dhe mysafiri duket i rehatshëm.
• Ecja në sallë është e qetë dhe e sigurt, as e ngadaltë, as me vrap. Edhe kur je me nxitim, nuk duhet të duket.
• Telefoni personal nuk del kurrë në sallë.

Kur nuk ke punë direkte, mos u zhduk dhe mos u grumbullo me kolegët. Zër një pozicion nga ku sheh zonën tënde dhe skano tavolinat. Ky është momenti kur vëren gotën bosh, mysafirin që kërkon diçka me sy, pecetën që ka rënë.`],
["Personalizimi: mysafiri si person, jo si numër tavoline",`HD12 dhe HD13 kërkojnë që shërbimi të jetë personal dhe që mysafiri të trajtohet si individ. Kjo nuk do të thotë të bëhesh mik me çdo mysafir. Do të thotë të vëresh dhe të përshtatesh.

Përdor emrin e mysafirit dy ose tri herë gjatë vaktit, natyrshëm: në përshëndetje, kur sjell një pjatë të veçantë, në lamtumirë. Mbaj mend çfarë ka porositur herën e fundit mysafiri i rregullt. “Zoti Hoxha, herën e kaluar morët tomahawk-un, sonte kemi edhe një copë të shkëlqyer.” Kjo është një nga gjërat që e bën mysafirin të kthehet.

Përshtat stilin me tavolinën. Një çift në darkë romantike dëshiron shërbim të heshtur dhe diskret. Një grup miqsh që feston mund të dojë pak më shumë bisedë dhe energji. Një mysafir që ha vetëm me libër ose me laptop nuk dëshiron bisedë të gjatë, por dëshiron të ndihet i kujdesur. Leximi i tavolinës është një aftësi që mësohet duke vëzhguar: sa flasin mes tyre, sa të hapur janë me ty, a të shikojnë kur afrohesh.`],
["Mbyllja e çdo ndërveprimi",`Çdo herë që largohesh nga tavolina, ndërveprimi duhet të mbyllet. Kjo është një nga pikat që Forbes e vë re dhe që stafi e harron më shpesh. Largimi pa mbyllje e lë mysafirin me pyetjen “A më dëgjoi? A po vjen?”.

Mbyllja është një fjali e shkurtër që konfirmon atë që do ndodhë:
• Pas porosisë: “Faleminderit, porosia juaj po shkon në kuzhinë.”
• Pas një kërkese: “Me kënaqësi, jua sjell menjëherë.”
• Pas servirjes: “Ju bëftë mirë.”
• Pas një pyetjeje që nuk di ta përgjigjesh: “Më lejoni ta pyes kuzhinierin dhe kthehem për dy minuta.”

Mbyllja përfundimtare, në fund të vaktit, është lamtumira. Ajo duhet të jetë po aq e ngrohtë sa përshëndetja: falënderim, emri nëse e di, ftesë për t'u rikthyer. “Ju faleminderit shumë, zonja Leka, shpresojmë t'ju shohim përsëri së shpejti.” Mysafiri që largohet pa lamtumirë e mban mend si mbrëmje që mbaroi keq, edhe nëse gjithçka tjetër ishte perfekte.`],
["Kur gabojmë: si kërkojmë ndjesë",`Gabimet ndodhin. Ajo që e dallon shërbimin e mirë nuk është mungesa e gabimeve, por mënyra si i trajtojmë. Kërkesa për ndjesë duhet të jetë e menjëhershme, e sinqertë dhe pa justifikime.

“Ju kërkoj ndjesë, kjo nuk duhej të ndodhte. Po e rregulloj menjëherë.” Kjo fjali mjafton. Mos shpjego që kuzhina është e ngarkuar, që kolegu ka gabuar ose që sistemi nuk punon. Mysafirit nuk i intereson pse ka ndodhur, i intereson që po rregullohet. Pastaj rikthehu dhe konfirmo që është rregulluar, dhe njofto supervizorin nëse gabimi ishte i rëndësishëm. Moduli për trajtimin e ankesave e shtjellon këtë më gjerë.`],
["Përmbledhje",`Gjuha profesionale është e ngrohtë, e saktë dhe pa zhargon. Toni është i qetë dhe i përshtatur me sallën. Gjuha e trupit është e hapur, e drejtë dhe e vëmendshme. Mysafiri trajtohet si person, me emër dhe me kujtesë. Dhe çdo ndërveprim mbyllet me një fjali që i thotë mysafirit çfarë do ndodhë më pas.

Këto nuk janë rregulla që i mëson një herë. Janë zakone që ndërtohen çdo turn. Në line-up, zgjidh një gjë nga ky leksion dhe fokusohu te ajo gjatë gjithë mbrëmjes.`]
];
LEC.L4=[
["Hyrje: shërbimi që vjen para kërkesës",`Ka tre nivele shërbimi. Në nivelin e parë, stafi bën atë që i kërkohet, kur i kërkohet. Në nivelin e dytë, stafi e bën shpejt dhe mirë. Në nivelin e tretë, stafi e bën para se t'i kërkohet. Ky nivel i tretë quhet shërbim parashikues dhe është ai që e dallon një hotel me pesë yje nga një restorant i mirë.

Forbes e mat këtë me standardet HD9, HD10 dhe HD18. Pyetja që bën inspektori është e thjeshtë: sa herë gjatë vaktit më duhej të kërkoja diçka që stafi mund ta kishte parashikuar? Thika e biftekut që nuk erdhi para mishit. Lugës që i mungonte për të ndarë ëmbëlsirën. Uji që mbaroi. Shalli në terrasë kur filloi të frynte. Synimi ynë është zero.

Ky leksion shpjegon si e lexojmë tavolinën, cilat janë parashikimet bazë që duhet t'i bëjë çdo kamarier në Flower, si e ruajmë kujtesën e ekipit dhe si themi “jo” pa e thënë kurrë vetëm “jo”.`],
["Leximi i tavolinës",`Mysafiri komunikon gjithë kohën, por rrallë me fjalë. Kamarieri i mirë mëson t'i lexojë sinjalet nga larg, sa herë kalon pranë zonës së vet.

• Menuja e mbyllur mbi tavolinë: mysafiri ka vendosur dhe është gati për porosi.
• Sytë që kërkojnë nëpër sallë: mysafiri ka nevojë për diçka. Shko menjëherë, mos prit që të ngrejë dorën.
• Takëmet paralel në pjatë, rreth orës katër: mysafiri ka mbaruar.
• Takëmet të kryqëzuara ose në formë V: mysafiri po pushon, nuk ka mbaruar.
• Gota që mbahet në dorë dhe shikohet: mysafiri po mendon për një tjetër.
• Fëmijë që lëvizin në karrige: po mërziten. Ndoshta duhet buka, ndoshta pjata e tyre duhet të dalë më shpejt.
• Laptop, dokumente, telefon mbi tavolinë: takim pune. Shërbim më diskret dhe ritëm më i shpejtë.
• Mysafir që fërkon duart ose mbledh xhaketën në terrasë: ka ftohtë. Ofro batanije ose tavolinë brenda.
• Mysafir që shikon orën: ka nxitim. Pyet nëse dëshiron ta përshpejtojmë.

Kjo aftësi nuk vjen vetvetiu, por mund të stërvitet. Çdo herë që kalon pranë zonës tënde, bëj një skanim të shpejtë: gota, pjata, takëme, fytyra. Tri sekonda për tavolinë mjaftojnë.

» Skenë nga Garden: Ora 21:30 në terrasë. Një çift ka porositur tomahawk-un për dy. Kamarieri vëren që zonja ka mbledhur supet dhe ka vendosur duart rreth gotës. Pa pyetur, sjell një batanije të palosur dhe ia ofron: “Filloi të freskohet pak, dëshironi një batanije?” Pastaj, para se mishi të dalë, sjell thikat e biftekut, kripën me kokrra dhe piperin, dhe dy pjata të ngrohta për ndarjen. Asnjë kërkesë nga tavolina gjatë gjithë vaktit.`],
["Parashikimet bazë: lista e Flower",`Disa parashikime janë kaq të zakonshme sa duhet të bëhen gjithmonë, pa menduar. Ato janë lista minimale që çdo kamarier e di përmendsh.

• Thika e biftekut vendoset para se të vijë mishi i kuq, për shembull para tomahawk-ut ose short rib-it.
• Thika e peshkut vendoset para levrekut, peshkut murgu ose çdo peshku të plotë.
• Lugë shtesë dhe pjata të vogla kur dy mysafirë porositin një ëmbëlsirë për ta ndarë.
• Pjata për kockat ose lëvozhgat kur porositen karkaleca, oktapod me lëkurë ose midhje.
• Pecetë shtesë dhe enë me ujë e limon për pjatat që hahen me duar.
• Karrige fëmije, pecetë shtesë dhe takëme të vogla kur ka fëmijë.
• Gotë uji me espresson, pa u kërkuar.
• Kripa dhe piperi me mishin, pa u kërkuar.
• Batanije në terrasë pas perëndimit të diellit, ose kur fryn erë.
• Karikues telefoni për mysafirin që e ka telefonin në ngarkesë të ulët dhe e përmend.
• Ombrellë në dalje kur bie shi.

Lista nuk është e mbyllur. Çdo turn, kur një mysafir kërkon diçka që mund ta kishim parashikuar, e shtojmë në line-up dhe e diskutojmë. Kështu lista rritet nga përvoja jonë.`],
["Kujtesa e ekipit",`Mysafiri nuk e di cili kamarier e ka marrë porosinë, cili runner e ka sjellë pjatën dhe kush është në bar. Për të, i gjithë stafi është një. Prandaj çdo gjë që i thotë një personi duhet ta dinë të gjithë ata që i shërbejnë.

Rregulli i artë: mysafiri nuk e thotë asgjë dy herë.

Kjo realizohet me disa mjete të thjeshta. Çdo kërkesë, alergji ose preferencë shënohet në POS me kod të qartë, për shembull “ALERGJI: ARRA” ose “PA KRIPË”, në mënyrë që kuzhina dhe runner-i ta shohin. Kur kamarieri ndryshon për shkak të ndërrimit të turnit ose pushimit, informacioni dorëzohet i plotë, me gojë dhe me shënim. Kur një mysafir i hotelit ka preferenca të njohura, si tavolina e preferuar ose vera e preferuar, ato ruhen në profilin e tij dhe kontrollohen para se të mbërrijë.

Kujtesa e ekipit vlen edhe ndërmjet ditëve. Mysafiri që qëndron pesë net në hotel dhe darkon çdo mbrëmje në Flower nuk duhet të shpjegojë çdo mbrëmje që nuk pi alkool ose që preferon ujë me gaz. Në mbrëmjen e dytë, kamarieri e pyet: “Ujë me gaz si mbrëmë?”`],
["Si themi jo: formula E-P-A-V",`Ka raste kur nuk mund t'i japim mysafirit atë që kërkon. Pjata ka mbaruar, vera nuk është në stok, tavolina në terrasë është e zënë. HD10 kërkon që stafi të mos thotë thjesht “jo”, por të ofrojë alternativa.

Formula që përdorim quhet E-P-A-V:
• Empati: “Për fat të keq...” Fillon duke njohur zhgënjimin e mysafirit.
• Pse: një arsye e shkurtër, jo një shpjegim i gjatë. “...shojza ka mbaruar sonte.”
• Alternativa: dy opsione konkrete. “Ju sugjeroj levrekun me kore barishtesh ose peshkun murgu me fava dhe mascarpone.”
• Veprim: e kthen vendimin te mysafiri. “Cilin preferoni?”

E gjithë fjalia zgjat dhjetë sekonda dhe e kthen një moment negativ në një bisedë rekomandimi. Mysafiri nuk largohet me “s'kemi”, por me një zgjedhje të re.

Kujdes me alternativat. Ato duhet të jenë të ngjashme me kërkesën. Mysafirit që kërkon një peshk të bardhë dhe të lehtë nuk i ofron tomahawk-un. Mysafirit që kërkon një Pinot Noir nga Burgundy nuk i ofron një Primitivo të plotë, por diçka me trup të lehtë dhe aciditet, si një tjetër Pinot ose një të kuqe të lehtë nga lista.`],
["Kur nuk e di përgjigjen",`HD11 kërkon që stafi të ketë njohuri të mjaftueshme për të përgjigjur pyetjeve të mysafirëve. Por askush nuk i di të gjitha. Mysafiri mund të pyesë për origjinën e një djathi, për orarin e spa-s, për një muze në qytet, për një verë që nuk e kemi provuar.

Përgjigja “nuk e di” nuk ekziston në Flower. Në vend të saj: “Më lejoni ta kontrolloj menjëherë.” Pastaj rikthehu brenda dy minutave me përgjigjen, ose me personin që e di: shefin e kuzhinës, sommelier-in, barmenin, recepsionin. Nëse përgjigja kërkon më shumë kohë, rikthehu brenda dy minutave për të thënë që po e kontrollon ende.

Ajo që nuk bëjmë kurrë është të shpikim. “Mendoj se nuk ka arra” është më e rrezikshme se “nuk e di”. Për alergjitë, përgjigja konfirmohet gjithmonë me kuzhinën.`],
["Njih hotelin, jo vetëm restorantin",`Mysafiri i hotelit e sheh kamarierin si përfaqësues të të gjithë hotelit. Ai pyet në darkë për orarin e mëngjesit, për fjalëkalimin e WiFi-t, për një taksi për aeroportin, për plazhin, për një restorant tjetër në qytet për nesër.

Çdo kamarier në Flower duhet të dijë përgjigjet bazë:
• Oraret e mëngjesit, të spa-s, të pishinës dhe të check-out-it.
• WiFi dhe si lidhet.
• Si porositet një taksi dhe sa kushton afërsisht deri në aeroport ose në qendër.
• Restorantet dhe bari i hotelit dhe oraret e tyre.
• Tre restorante dhe tre atraksione në qytet që mund t'i rekomandosh me besim.

Kur nuk e di diçka për hotelin, përdor të njëjtin rregull: “Më lejoni ta kontrolloj me recepsionin.” Dhe rikthehu.`],
["Përmbledhje",`Shërbimi parashikues ka tri shtylla: leximi i tavolinës, parashikimet bazë dhe kujtesa e ekipit. Kur një kërkesë nuk mund të plotësohet, përdorim E-P-A-V dhe ofrojmë dy alternativa. Kur nuk e dimë përgjigjen, e kontrollojmë dhe rikthehemi brenda dy minutave.

Matja e suksesit është e thjeshtë: në fund të vaktit, sa herë mysafiri kërkoi diçka që mund ta kishim parashikuar? Çdo herë që përgjigja është zero, kemi dhënë shërbim të nivelit Forbes.`]
];
LEC.L5=[
["Hyrje: kamarieri si këshilltar",`Mysafiri që ulet në Flower ka përpara një menu me dhjetëra pjata, një menu degustuese me dhjetë pjata dhe një listë vere me mbi njëqind etiketa. Në Garden e pret një menu tjetër, me nëntë pjata degustuese dhe copa mishi premium që shiten me kilogram. Ai nuk ka si t'i dijë të gjitha. Kamarieri është ura midis kuzhinës dhe mysafirit.

Standardet HD11, HD23 dhe HD24 e bëjnë këtë rol të qartë. HD11 kërkon që stafi të ketë njohuri të plota për produktin. HD23 kërkon që stafi të bëjë rekomandime të personalizuara. HD24 kërkon që stafi t'i përshkruajë pjatat me detaje kur i serviron ose kur pyetet. Në bar, BL9 kërkon të njëjtën gjë për pijet.

Ky leksion mbulon çfarë duhet të dish për çdo pjatë, si e ndërton një rekomandim, si flet për ushqimin në mënyrë që të shesë pa u dukur si shitës, dhe si trajton alergjitë me siguri absolute.`],
["Gjashtë faktet e çdo pjate",`Për çdo pjatë në menu, kamarieri duhet të dijë gjashtë fakte. Jo përafërsisht, por me siguri.

• Tre përbërësit kryesorë. Jo vetëm “peshk”, por “levrek, pure fasuleje, karota ylber”.
• Metoda e gatimit. E pjekur në skarë, e gatuar ngadalë, e kripur, e marinuar, e pjekur në furrë me kore.
• Alergjenët. Cilët nga 14 alergjenët e Bashkimit Evropian përmban.
• Koha e përgatitjes. Disa pjata, si mishrat e mëdhenj ose rizotoja, kërkojnë më shumë kohë dhe mysafiri duhet ta dijë.
• Origjina e produktit kyç. Peshk i Adriatikut, mish nga një fermë e njohur, ullinj nga një zonë e caktuar. Kjo është një nga gjërat që i bën përshtypje mysafirit më shumë.
• Çiftimi. Një verë me gotë ose një pije që shkon mirë me të.

Kjo duket shumë, por në praktikë mësohet shpejt kur e lidh me provën e pjatës. Faqja Menutë tona në platformë ka çdo pjatë të Flower dhe Garden me përbërësit dhe alergjenët, dhe kartat e kujtesës për t'i mësuar.`],
["Metoda P-A-S për rekomandim",`Rekomandimi i mirë nuk fillon me pjatën, fillon me mysafirin. Metoda që përdorim ka tre hapa.

• Pyet. Një ose dy pyetje të shkurtra për të kuptuar çfarë dëshiron. “Preferoni mish apo peshk? Diçka të lehtë apo më të plotë? Keni uri të madhe sonte apo diçka më të thjeshtë?”
• Ankoro. Jep dy opsione konkrete, jo pesë. Me pesë opsione mysafiri humbet. Me një opsion ndihet i shtyrë. Me dy, zgjedh.
• Shpjego me ndjesi. Përshkruaj teksturën, shijen, origjinën dhe, kur e ke vërtet, jep mendimin tënd personal: “Favoriti im është...”

Mendimi personal ka fuqi të madhe, por vetëm kur është i sinqertë. Nëse çdo pjatë është “favoriti im”, mysafiri e kupton menjëherë. Prandaj provoji pjatat. Nuk mund ta rekomandosh me besim atë që nuk e ke shijuar.

» Skenë nga Garden: Një mysafir biznesi, vetëm, pyet “Çfarë më rekomandoni?” Kamarieri: “Me kënaqësi. Preferoni peshk apo mish sonte?” “Mish, por jo shumë të rëndë.” “Atëherë dy opsione: short rib-i ynë i gatuar ngadalë, aq i butë sa ndahet me pirun, me polentë, krem patëllxhani dhe demi-glace me piper Timur; ose qengji i gatuar ngadalë, pak më i lehtë. Personalisht, short rib-i është favoriti im, dhe shkon shumë mirë me një gotë Primitivo di Manduria Gocce, e butë dhe me fruta të pjekura.”`],
["Fjalët që shesin",`Mënyra si e përshkruan një pjatë ndryshon mënyrën si e përjeton mysafiri. “Është e mirë” nuk thotë asgjë. “Është shumë e kërkuar” thotë diçka, por pak. “Oktapod i zi, i pjekur në skarë me lëkurë krokante dhe i butë brenda” krijon një imazh dhe një dëshirë.

Fjalët që funksionojnë janë ato që përshkruajnë një ndjesi konkrete:
• Tekstura: krokant, i butë, kremoz, i shkrifët, i lëngshëm, i freskët.
• Metoda: i pjekur në skarë me dru, i gatuar ngadalë, i tymosur, i marinuar për 24 orë.
• Origjina: nga Adriatiku, nga fermat e Myzeqesë, ullinj nga Berati.
• Kontrasti: “ëmbëlsia e karotës me kripën e korës”.

Fjalët që duhen shmangur janë ato boshe ose negative: “normale”, “e thjeshtë”, “s'e kam provuar”, “njerëzit thonë që është mirë”. Dhe kurrë mos e ul një pjatë për të shitur një tjetër: “Mos merrni atë, merrni këtë” e bën mysafirin të dyshojë për të gjithë menunë.

Për mishrat premium të Garden që shiten me kilogram, si tomahawk-u me çmim 12.000 lekë për kilogram, ka një rregull të veçantë: thuaji mysafirit peshën e përafërt dhe çmimin para se të porosisë. “Tomahawk-u sonte peshon rreth 1,2 kilogramë, pra rreth 14.400 lekë, dhe mjafton për dy persona.” Mysafiri që e merr vesh çmimin në faturë ndihet i mashtruar, edhe nëse çmimi ishte në menu.`],
["Menuja degustuese: si e prezantojmë",`Menuja degustuese është një përvojë më vete dhe kërkon një prezantim të veçantë. Në Flower ka dhjetë pjata, në Garden nëntë, dhe të dyja kushtojnë 6.500 lekë për person.

Kur e prezanton, thuaj qartë:
• Sa pjata ka dhe sa zgjat afërsisht. Një menu degustuese zgjat rreth dy deri në dy orë e gjysmë.
• Që zakonisht merret nga e gjithë tavolina. Nëse vetëm një person dëshiron ta marrë, kontrollo me kuzhinën si koordinohet ritmi.
• Që kuzhina mund ta përshtatë për alergji dhe kufizime, nëse njoftohet që në fillim.
• Që ka një çiftim verërash, nëse ofrohet, dhe çfarë përfshin.

Kur serviron çdo pjatë të menusë degustuese, prezantimi duhet të jetë i shkurtër por i plotë: emri, dy ose tre përbërësit kryesorë dhe, nëse ka, një detaj interesant. “Pjata e shtatë: oktapod i zi, me piper të tymosur, xhenxhefil dhe soje.” Mos e lexo nga letra. Mësoje.`],
["Pijet: çfarë duhet të dish",`Rekomandimi nuk mbaron te pjata. Mysafiri pret që kamarieri të njohë edhe pijet. Minimumi që duhet të dish përmendsh:

• Katër verërat që shërbejmë me gotë, Malvasia del Salento, Riesling Hugel, Primitivo di Manduria Gocce dhe Trapiche Impure Malbec: rrushi, rajoni dhe profili në tri fjalë. Për shembull, “Riesling Hugel, Alsace, i thatë, mineral dhe i freskët”.
• Dallimin midis një single malt dhe një blend, midis një xhini London Dry dhe një xhini më aromatik, dhe çfarë është rakia shqiptare.
• Shtatë birrat që kemi, nga Augustiner dhe Paulaner te Peja dhe birra pa alkool.
• Kokteilet e shtëpisë, sidomos signature-in tonë Old Father, dhe mocktail-et.

Manuali i verës dhe Manuali i barit në platformë kanë të gjitha këto me detaje. Moduli për verën dhe pijet i shtjellon më thellë.`],
["Alergjitë: zero kompromis",`Alergjia nuk është preferencë. Për disa mysafirë, një gabim mund të çojë në spital. Prandaj trajtimi i alergjive ka rregulla që nuk ndryshojnë kurrë.

• Njih 14 alergjenët e BE-së: gluteni, krustacet, vezët, peshku, kikirikët, soja, qumështi, arrat, selinoja, mustarda, susami, sulfitet, lupina dhe molusqet.
• Kur mysafiri përmend një alergji, shkruaje menjëherë në POS me kod të qartë dhe njofto kuzhinën me gojë.
• Kur nuk je njëqind për qind i sigurt nëse një pjatë përmban një alergjen, konfirmo me shefin e kuzhinës. Kurrë mos thuaj “mendoj se jo”.
• Kujdes me alergjenët e fshehur: salcat, gjalpi në përfundim të pjatës, fara në bukë, vera me sulfite, arrat në pesto.
• Pjata e mysafirit me alergji shërbehet e para ose veçmas, në mënyrë që të mos ngatërrohet.

» Skenë nga Flower: Një mysafire thotë “Jam alergjike ndaj arrave.” Kamarieri: “Faleminderit që na e thatë. E shënoj dhe e konfirmoj me shefin e kuzhinës për çdo pjatë që zgjidhni.” Kur mysafirja zgjedh ëmbëlsirën dhe pyet për bakllavanë e Genti Malavecit, kamarieri nuk ka nevojë as ta kontrollojë: “Bakllavaja përmban arra, prandaj nuk jua rekomandoj. Ju sugjeroj crème brûlée-në me brioche dhe pjeshkë, por e konfirmoj menjëherë me kuzhinën që nuk ka gjurmë arrash.”`],
["Përmbledhje",`Kamarieri në Flower është këshilltar, jo marrës porosish. Di gjashtë faktet e çdo pjate, përdor metodën P-A-S për rekomandim, flet me fjalë që krijojnë imazh, prezanton menunë degustuese me qartësi, njeh pijet me gotë dhe kokteilet e shtëpisë, dhe trajton alergjitë pa asnjë kompromis.

Mësimi i menusë nuk bëhet një herë. Sa herë ndryshon një pjatë, provohet nga stafi dhe diskutohet në line-up. Përdor kartat e kujtesës në faqen Menutë tona për t'u testuar çdo javë.`]
];
LEC.L6=[
["Hyrje: koreografia e vaktit",`Pas rekomandimit vjen ekzekutimi: marrja e porosisë, përgatitja e tavolinës, servirja e pjatave dhe ritmi midis tyre. Kjo është pjesa më teknike e shërbimit dhe ajo ku shihet më qartë nëse një ekip punon si ekip.

Forbes e mat me disa standarde: HD39 për saktësinë e porosisë, HD54 për servirjen pa pyetur “kush e kishte”, HD33 dhe HD27 për ritmin dhe kohët, HD62 për kontrollin pas servirjes, dhe standarde të tjera për takëmet dhe pjatat. Nëse çdo pjatë arrin te mysafiri i duhur, në temperaturën e duhur, me takëmet e duhura dhe në kohën e duhur, mysafiri nuk e vëren as shërbimin. E vëren vetëm ushqimin. Ky është qëllimi.`],
["Numrat e pozicioneve",`Baza e gjithë sistemit është numri i pozicionit. Çdo karrige në tavolinë ka një numër, dhe çdo artikull i porosisë shënohet me numrin e karriges ku ulet mysafiri që e porositi. Kështu, kushdo që sjell pjatën, qoftë kamarieri, runner-i apo supervizori, e di saktësisht kujt i takon.

Në Flower, pozicioni 1 është karrigia më afër hyrjes së sallës, ose ajo me shpinë nga kuzhina sipas planit të sallës, dhe numërimi vazhdon në drejtim të akrepave të orës. Skema e pozicioneve në këtë mësim e tregon vizualisht. Rregulli duhet të jetë i njëjtë për të gjitha tavolinat dhe për të gjithë stafin, përndryshe sistemi nuk funksionon.

Rezultati i një sistemi pozicionesh të mirë është se fraza “Kush e kishte levrekun?” nuk dëgjohet kurrë në sallë. Ajo frazë i thotë mysafirit që askush nuk e mban mend çfarë porositi dhe e kthen shërbimin në një ankand.`],
["Marrja e porosisë",`Porosia merret në një rend të caktuar. Fillohet me zonjat dhe të ftuarit, dhe organizatori ose personi që do të paguajë porosit i fundit. Kur nuk është e qartë kush është organizatori, fillohet nga pozicioni 1 dhe vazhdohet në drejtim të akrepave.

Gjatë porosisë, kamarieri qëndron në anën e mysafirit që porosit, ose në një pikë ku e dëgjon qartë. Nuk shkruan me shpinë nga tavolina. Pas çdo mysafiri, mund të përsërisë shkurt pikat kritike:
• Pjekja e mishit: “Tomahawk-u, mesatarisht i pjekur.”
• Alergjitë dhe ndryshimet: “Pa gjalpë, siç e kërkuat.”
• Garniturat ose zgjedhjet: “Me pure apo me sallatë?”

Në fund, pyet për ritmin: “Dëshironi pjatat njëra pas tjetrës, apo antipastat të gjitha bashkë?” Dhe nëse dikush porosit një pjatë që kërkon kohë më të gjatë, thuaje qartë: “Rizotoja kërkon rreth 20 minuta. A ju shkon mirë?”

Pjekja e mishit ka emërtime ndërkombëtare që duhen ditur: blu, gjysmë e gjallë (rare), gjysmë e pjekur ose mesatarisht e gjallë (medium rare), mesatare (medium), mesatarisht e pjekur mirë (medium well) dhe e pjekur mirë (well done). Kur mysafiri thotë “mesatare”, konfirmoje: “Rozë në mes?”`],
["Takëmet para pjatës",`Para se pjata të dalë nga kuzhina, tavolina duhet të jetë gati. Kjo do të thotë që takëmet rregullohen sipas porosisë: thika e peshkut për levrekun, luga e supës për supën, thika e biftekut për mishin, piruni dhe luga e ëmbëlsirës para ëmbëlsirës. Takëmet që nuk duhen hiqen, në mënyrë që tavolina të mos jetë e mbushur me metal të panevojshëm.

Takëmet vendosen nga e djathta për thikat dhe lugët, nga e majta për pirunët, gjithmonë duke i mbajtur nga doreza dhe, në shërbimin luksoz, mbi një pecetë ose tabaka të vogël, jo me dorë të zhveshur drejt e mbi tavolinë. Skema e shtrimit në Modulin 1 tregon pozicionin e saktë të çdo takëmi.

Pjata që del para takëmeve është një gabim i dukshëm. Mysafiri sheh pjatën e nxehtë përpara dhe pret që dikush të sjellë thikën, ndërkohë që ushqimi ftohet.`],
["Kontrolli në pass",`Pass-i është banaku ku kuzhina vendos pjatat e gatshme. Ky është pika e fundit e kontrollit para mysafirit, dhe kamarieri ose runner-i është kontrollori i fundit. Mos e merr pjatën nëse:

• Buza e pjatës ka njolla, pika salce ose gishta.
• Temperatura nuk është e duhur. Pjatat e nxehta shërbehen në pjata të ngrohta, pjatat e ftohta në pjata të ftohta.
• Prezantimi nuk përputhet me standardin e pjatës.
• Mishi nuk duket në pjekjen e kërkuar.
• Mungon një garniturë ose një element i pjatës.
• Pjata nuk përputhet me shënimin e alergjisë.

Kthimi i një pjate në pass bëhet me qetësi dhe me respekt për kuzhinën: “Shef, buza ka pak salcë”, jo me zë të lartë dhe jo para mysafirëve. Kuzhina dhe salla janë në të njëjtën anë.`],
["Servirja",`Rregulli bazë i servirjes në Flower: pjatat vendosen nga e djathta e mysafirit, me dorën e djathtë, dhe hiqen po nga e djathta. Pijet shërbehen gjithashtu nga e djathta. Përjashtimet, si bukët dhe pjatat anësore që vendosen nga e majta, i shpjegon skema e anëve të shërbimit në Modulin 1.

Të gjitha pjatat e tavolinës vendosen njëkohësisht. Kjo do të thotë që, për një tavolinë me katër persona, dy ose më shumë kamarierë dhe runner-ë vijnë bashkë dhe i vendosin pjatat në të njëjtën kohë. Nuk ka asgjë më të pakëndshme se tri persona që presin me pjatë përpara ndërsa i katërti pret ende të vijë e tija.

Kur vendos pjatën, emërtoje: “Levreku me kore barishtesh, me pure fasuleje.” Pjata vendoset me elementin kryesor, për shembull mishin ose peshkun, nga mysafiri, rreth orës gjashtë. Pastaj: “Ju bëftë mirë.”

Kurrë mos u shtri mbi një mysafir për t'i shërbyer tjetrit. Nëse nuk mund ta arrish pozicionin nga e djathta pa e penguar dikë, kërko leje me zë të ulët ose shko nga ana tjetër.

» Skenë nga Flower: Tavolina 12, katër persona. Kamarieri dhe runner-i dalin bashkë nga kuzhina me katër pjata. Kamarieri shkon te pozicionet 1 dhe 2, runner-i te 3 dhe 4. Vendosen njëkohësisht. Kamarieri: “Oktapodi i zi për zonjën, shojza për ju zotëri, dhe levreku me kore barishtesh për ju të dy.” Thikat e peshkut ishin vendosur katër minuta më parë.`],
["Kontrolli dy minuta pas",`Rreth dy minuta pas servirjes, ose pasi mysafiri ka marrë dy kafshata, kamarieri afrohet për kontrollin: “Gjithçka sipas dëshirës suaj?” Kjo është koha e duhur sepse mysafiri e ka provuar pjatën, por ka ende kohë që një problem të rregullohet pa e prishur vaktin.

Kontrolli nuk është një formalitet. Kamarieri shikon tavolinën ndërsa pyet: a i mungon dikujt diçka, a ka nevojë për më shumë verë, a e ka mishin siç e kërkoi? Nëse mysafiri thotë që mishi është shumë i pjekur, nuk diskutohet. “Ju kërkoj ndjesë, ju sjell një tjetër menjëherë.” Dhe njoftohet kuzhina dhe supervizori.

Pas kontrollit, kamarieri tërhiqet. Mysafiri nuk duhet të ndërpritet çdo pesë minuta me “a është mirë?”.`],
["Ritmi midis pjatave",`Ritmi është ndoshta aftësia më e vështirë e shërbimit, sepse varet nga koordinimi midis sallës dhe kuzhinës. Në darkë, koha midis pjatave zakonisht është tetë deri në dymbëdhjetë minuta, përveç kur mysafiri kërkon ndryshe. Shumë shpejt dhe mysafiri ndihet i nxituar. Shumë ngadalë dhe ndihet i harruar.

Kamarieri e kontrollon ritmin duke vëzhguar tavolinën dhe duke i dhënë sinjal kuzhinës kur tavolina është gati për pjatën tjetër. Pjata e ardhshme nuk thirret derisa e mëparshmja të jetë hequr.

Kur kuzhina vonohet, njofto mysafirin para se ta vërejë ai vetë. “Qengji juaj del pas pesë minutash.” Kjo e kthen pritjen në diçka të menaxhuar. Nëse vonesa është e madhe, njofto supervizorin, i cili mund të vendosë të ofrojë diçka për të shoqëruar pritjen.

Për mëngjesin, standardet e kohës janë të ndryshme. Pjatat e ftohta duhet të arrijnë brenda rreth shtatë minutave dhe pjatat e nxehta brenda rreth dhjetë minutave nga porosia, sepse mysafiri i mëngjesit shpesh ka nxitim.`],
["Përmbledhje",`Sistemi i servirjes ka disa elemente që lidhen me njëri-tjetrin: numrat e pozicioneve, porosia në rendin e duhur me përsëritjen e pikave kritike, takëmet para pjatës, kontrolli në pass, servirja njëkohësisht nga e djathta me emërtim, kontrolli dy minuta pas dhe ritmi tetë deri në dymbëdhjetë minuta. Nëse një element mungon, të tjerët vështirësohen.

Karta e kohëve në platformë i ka të gjitha këto numra në një faqe. Mbaje pranë stacionit tënd.`]
];
LEC.L7=[
["Hyrje: pija si pjesë e përvojës",`Për shumë mysafirë, vera ose kokteili është po aq i rëndësishëm sa pjata. Një gotë e mirë vere me temperaturë të gabuar humbet gjysmën e vlerës. Një kokteil i bërë me sy, pa jigger, ndryshon nga njëra herë te tjetra. Një gotë me njolla kundër dritës e prish edhe shishen më të shtrenjtë.

Forbes ka një seri të gjatë standardesh për barin dhe pijet, nga BL20 deri te BL38. Ato mbulojnë prezantimin e verës, temperaturat, gotat, akullin, saktësinë e kokteileve dhe detajet që e bëjnë barin të ndihet luksoz. Ky leksion i përmbledh në një sistem praktik për kamarierin dhe barmenin e Flower. Manuali i verës dhe Manuali i barit në platformë kanë listën e plotë të produkteve tona.`],
["Vera me gotë në katër hapa",`Vera me gotë shërbehet me të njëjtin respekt si vera me shishe. Kjo do të thotë që shishja sillet në tavolinë, jo gota e mbushur nga bari.

• Prezantimi. Sill shishen dhe tregoja mysafirit me etiketën përpara. Thuaj prodhuesin, rrushin dhe vitin. “Kjo është Riesling i Hugel, nga Alsace.”
• Prova. “Dëshironi ta provoni fillimisht?” Derdh rreth 2 cl në gotë dhe prit miratimin. Mysafiri nuk po vlerëson nëse i pëlqen vera, por nëse vera është në gjendje të mirë, pa erë tape dhe pa defekte.
• Derdhja. Pas miratimit, derdh sasinë standarde të Flower, 150 ml, nga e djathta e mysafirit, me etiketën nga ai. Në fund të derdhjes, rrotullo lehtë shishen për të mos lënë pika.
• Ruajtja. Shishja e hapur mbyllet menjëherë me tapë ose me sistem vakumi dhe ruhet në temperaturën e duhur, me datën e hapjes të shënuar.

Prova e verës me gotë ka edhe një vlerë tjetër: i jep mysafirit mundësinë të ndryshojë mendje pa kosto. Nëse vera nuk i pëlqen, ofro një alternativë. “Nëse e preferoni më të butë, kemi edhe...”

» Skenë nga Garden: Një mysafir porosit një gotë të kuqe për tomahawk-un. Kamarieri sjell shishen e Primitivo-s: “Kjo është Primitivo di Manduria Gocce e Feudi Salentini, nga Puglia, një e kuqe e plotë dhe e butë, me fruta të pjekura, që shkon shumë mirë me mishin e Josper-it. Dëshironi ta provoni?” Derdh 2 cl. Mysafiri e provon, pohon me kokë. Kamarieri derdh 150 ml dhe e lë shishen në stacion, gati për gotën e dytë.`],
