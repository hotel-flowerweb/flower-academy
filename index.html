<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Flower F&amp;B Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky brand bar + tab rail, single reading column (max 1080) with cards only for interactive objects */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#ECEEEA; --ink:#17201B; --muted:#5B6660; --line:#D9DED8;
  --accent:#8C1D4A; --accent-ink:#FFFFFF; --accent-soft:#F5E6EC; --gold:#94701F; --gold-soft:#F4EDDC;
  --ok:#2C7A4B; --ok-soft:#E3F1E8; --warn:#9A5B00; --warn-soft:#F8EDD9; --bad:#B0281F; --bad-soft:#F8E3E1;
  --f-display:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"Inter","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#18201C; --sunk:#141B17; --ink:#E7ECE8; --muted:#9BA69F; --line:#2B3530;
  --accent:#E583AB; --accent-ink:#2A0A17; --accent-soft:#3A1C29; --gold:#D8B460; --gold-soft:#332B17;
  --ok:#62C08A; --ok-soft:#173023; --warn:#E6A54B; --warn-soft:#352812; --bad:#F07F76; --bad-soft:#3A1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201C; --sunk:#141B17; --ink:#E7ECE8; --muted:#9BA69F; --line:#2B3530;
  --accent:#E583AB; --accent-ink:#2A0A17; --accent-soft:#3A1C29; --gold:#D8B460; --gold-soft:#332B17;
  --ok:#62C08A; --ok-soft:#173023; --warn:#E6A54B; --warn-soft:#352812; --bad:#F07F76; --bad-soft:#3A1A18; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;margin:0;letter-spacing:-.022em}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1.12;font-weight:700}
h2{font-size:clamp(20px,2.6vw,24px);line-height:1.2}
h3{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum","cv11"}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.who .chip{white-space:nowrap}
nav{overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;padding-bottom:0}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:10px 12px;border-bottom:2px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tabs a:hover{color:var(--ink)}

main{padding-block:28px 64px;display:grid;gap:28px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.fsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fpwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:860px){.fpwrap{grid-template-columns:1fr}}
.fpmap{padding:10px}.fpsvg{width:100%;height:auto;display:block}
.fz rect{fill:var(--sunk);stroke:var(--line);stroke-width:2}.fz.dim,.ft.dim{opacity:.3}
.fzl{fill:var(--muted);font:600 22px Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.ft{cursor:pointer}.ft rect,.ft circle{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.ft:hover rect,.ft:hover circle,.ft:focus rect,.ft:focus circle{stroke:var(--accent);stroke-width:3}.ft:focus{outline:none}
.ft.sel rect,.ft.sel circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.ft.good rect,.ft.good circle{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}.ft.badt rect,.ft.badt circle{fill:var(--bad-soft);stroke:var(--bad);stroke-width:3}
.ftn{fill:var(--ink);font:700 26px Inter,sans-serif;text-anchor:middle}.ftc{fill:var(--muted);font:600 18px Inter,sans-serif;text-anchor:middle}
.fmk path{stroke:var(--accent);stroke-width:4;marker-end:none}.fmk text{fill:var(--accent);font:600 18px Inter,sans-serif}
.fb{margin:0;font-weight:600}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel{background:var(--sunk);border-radius:var(--r);padding:18px;min-width:0}
hr{border:0;border-top:1px solid var(--line);margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:14.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.ref{font-family:var(--f-mono);font-size:11.5px;color:var(--gold);background:var(--gold-soft);padding:2px 7px;border-radius:5px;white-space:nowrap}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:end}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero p.lead{font-size:17px;color:var(--muted);max-width:60ch;margin-top:12px}
.clock{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.clock div{background:var(--surface);padding:14px 16px}
.clock b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:700;color:var(--accent);line-height:1.1}
.clock span{font-size:12.5px;color:var(--muted)}

.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* lessons list */
.lessons{display:grid;gap:0;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lrow:hover{background:var(--surface)}
.lnum{font-family:var(--f-display);font-weight:600;font-size:22px;color:var(--muted);text-align:center}
.lrow.done .lnum{color:var(--ok)}
.lrow h3{font-size:17.5px}
.lrow small{color:var(--muted);font-size:13px}

/* modules */
.mod{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.mod .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;color:var(--accent);width:30px}
.mod.off .n{color:var(--line)}
.mod.off h3{color:var(--muted)}

/* lesson */
.lhead{display:grid;gap:10px}
.goal{font-family:var(--f-body);font-weight:500;font-size:clamp(17px,2vw,19px);line-height:1.45;border-left:3px solid var(--accent);padding-left:16px;max-width:62ch}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--surface)}
.kpi b{font-family:var(--f-mono);font-size:20px;color:var(--accent);display:block;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
.stdlist{display:grid;gap:8px}
.stdlist .ref{justify-self:start}
.stdlist div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:baseline;font-size:14.5px}
@media (max-width:520px){.stdlist div{grid-template-columns:1fr;gap:2px}}
.steps{counter-reset:s;display:grid;gap:0}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-weight:700;color:var(--accent);background:var(--accent-soft);width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:13px}
.step b{display:block;margin-bottom:2px}
.say{display:grid;gap:10px}
.say div{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
@media (max-width:620px){.say div{grid-template-columns:1fr}}
.say q{font-family:var(--f-body);font-weight:500;font-size:15.5px;quotes:"„" "“"}
.say i{color:var(--muted);font-size:14px}
.avoid{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.avoid li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14.5px}
.avoid li::before{content:"✕";color:var(--bad);font-weight:700}
.drill ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}

.theory{display:grid;gap:0;border-top:1px solid var(--line)}
.theory article{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:8px 28px;padding:16px 0;border-bottom:1px solid var(--line)}
.theory article h3{font-size:16px}
.theory article p{max-width:68ch}
@media (max-width:700px){.theory article{grid-template-columns:1fr}}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin:0}
.concepts dt{font-weight:650}
.concepts dd{margin:2px 0 0;color:var(--muted);font-size:14px}
a.mod.card:hover{border-color:var(--muted)}
.mod.card{padding:16px}
/* quiz */
.q{display:grid;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q p.qt{font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--muted)}
.opt .dot{flex:0 0 18px;height:18px;border-radius:99px;border:2px solid var(--line);margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.score{font-family:var(--f-mono);font-size:44px;font-weight:700;line-height:1}

/* timer */
.timers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.tbtn{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.tbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.tbtn b{display:block;font-size:14px}
.tbtn span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.face{font-family:var(--f-mono);font-size:clamp(56px,12vw,96px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.face.over{color:var(--bad)}
.face.ok{color:var(--ok)}
.tlog{display:grid;gap:6px;font-size:14px}
.tlog div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}

/* audit */
.agroup{display:grid;gap:0}
.aitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.aitem small{display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.y{background:var(--ok);color:var(--surface)}
.seg button.on.n{background:var(--bad);color:var(--surface)}
.seg button.on.na{background:var(--muted);color:var(--surface)}
@media (max-width:520px){.aitem{grid-template-columns:1fr}}
.figs{display:grid;gap:16px}
.fig{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:grid;gap:12px;margin:0}
.fig svg{width:100%;height:auto;display:block}
.fig .fig-sv{max-width:640px;margin:0 auto;width:100%}
.fig ol{margin:0;padding-left:22px;display:grid;gap:4px;font-size:14px}
.fg-c path,.fg-s,.fg-l,.fg-gl{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.fg-s{fill:var(--sunk)}
.fg-l{stroke:var(--line);stroke-width:1.2}
.fg-c .fg-h{stroke-width:6}
.fg-c .fg-edge,.fg-edge{stroke:var(--accent);stroke-width:2.2;fill:none}
.fg-edge2{stroke:var(--muted);stroke-width:3;fill:none}
.fg-nap{fill:var(--surface);stroke:var(--muted);stroke-dasharray:4 3}
.fg-t{fill:var(--muted);font-size:13px;font-family:inherit}
.fg-n circle{fill:var(--accent)}.fg-n text{fill:#fff;font-size:12px;font-weight:700}
.fg-seat circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.fg-seat text{fill:var(--ink);font-size:15px;font-weight:700}
.fg-seat.acc circle{fill:var(--accent-soft);stroke:var(--accent)}.fg-seat.acc text{fill:var(--accent)}
.fg-arr{stroke:var(--muted);stroke-width:2;fill:none}.fg-arr.ok{stroke:var(--accent)}
.fg-arrh{fill:var(--muted)}
.fg-dim{stroke:var(--gold);stroke-width:1.4;stroke-dasharray:4 3;fill:none}
.fg-liq{fill:var(--accent-soft);stroke:none}
.glassgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.glassgrid figure{margin:0;display:grid;gap:6px;text-align:center}
.glassgrid svg{height:150px}
.glassgrid figcaption{display:grid;gap:2px;font-size:12.5px;color:var(--muted)}
.glassgrid figcaption b{color:var(--ink);font-size:14px}
.glassgrid .pour{color:var(--accent);font-weight:600}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.wcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;break-inside:avoid}
.wcard header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.wcard h3{margin:0;font-size:16px}
.wcard .pr{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.wcard .pr small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.wdl{display:grid;gap:6px;margin:0}
.wdl div{display:grid;grid-template-columns:118px 1fr;gap:8px;font-size:13.5px}
.wdl dt{color:var(--muted);font-weight:600}
.wdl dd{margin:0}
.wsay{margin:0;font-size:13.5px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.wstyles{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.wstyles h3{margin:0}
@media (max-width:520px){.wcards,.wstyles{grid-template-columns:1fr}.wdl div{grid-template-columns:1fr;gap:0}}
.lec{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:32px;align-items:start}
.lec-toc{position:sticky;top:112px;display:grid;gap:2px;font-size:14px}
.lec-toc button{all:unset;cursor:pointer;padding:6px 10px;border-left:2px solid var(--line);color:var(--muted);line-height:1.35}
.lec-toc button:hover,.lec-toc button:focus-visible{color:var(--ink);border-left-color:var(--accent)}
.lec-body{max-width:70ch;font-size:17px;line-height:1.72}
.lec-body section{padding:4px 0 18px;scroll-margin-top:120px}
.lec-body h3{font-size:20px;line-height:1.3;margin:18px 0 10px}
.lec-body p{margin:0 0 14px}
.lec-body ul{margin:0 0 16px;padding-left:22px;display:grid;gap:6px}
.lec-scene{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin:6px 0 16px;font-size:16px}
.lec-scene b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.lec-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
@media (max-width:820px){.lec{grid-template-columns:1fr;gap:16px}.lec-toc{position:static}}
@media print{.lec{grid-template-columns:1fr}.lec-toc{display:none}.lec-scene{background:none}}
@media print{header,nav,.seg,#wprint,.btn,.mfilters,.toast{display:none!important}body{background:#fff}.wcard,.card{border-color:#ccc}}
.mfilters{display:grid;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.algrid{display:flex;flex-wrap:wrap;gap:6px}
.algrid button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.algrid button[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad);border-color:transparent;text-decoration:line-through}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dish{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.dish header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dish h3{font-size:15.5px;margin:0}
.dish .en{font-size:12.5px;color:var(--muted);font-style:italic}
.dish .pr{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.dish p{margin:0;font-size:14px}
.dish .als{display:flex;flex-wrap:wrap;gap:4px}
.dish .als .chip{font-size:11px;padding:2px 7px}
.dmore{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.dmore summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent,#8d1c4b)}
.dmore p{font-size:14px;margin:8px 0 0}
.dsay{background:var(--gold-soft,#f4ecdc);padding:8px 10px;border-radius:8px}
.dtip{font-size:13px!important}
.dgl{display:grid;gap:8px;margin:10px 0 0}
.dgl dt{font-weight:650;font-size:13.5px}.dgl dd{margin:2px 0 0;font-size:13.5px;line-height:1.5}
.gl2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px 20px}
.flash{max-width:560px;margin:0 auto;text-align:center;display:grid;gap:14px}
.flash .fcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:32px 22px;min-height:220px;display:grid;place-content:center;gap:10px}
.flash .fcard h2{margin:0;font-size:24px}
.deg{display:grid;gap:4px;margin:0;padding-left:20px;font-size:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%}
.sticky-score{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.08)}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile b{font-family:var(--f-mono);font-size:30px;display:block;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 40px;gap:12px;align-items:center;font-size:14px}
.barrow .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--bad);border-radius:99px}
@media (max-width:520px){.barrow{grid-template-columns:minmax(0,1fr) 70px 34px}}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--gold-soft);color:var(--ink);font-size:14px}
.notice b{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  steps:[

    ["Përshëndet brenda 60 sekondave","“Mirëmbrëma, mirë se vini në Flower.” Nëse e di emrin (rezervim, recepsion, dhoma), përdore që në fjalinë e parë."],
    ["Konfirmo dhe personalizo","Konfirmo rezervimin dhe numrin e personave. Pyet për preferencë (dritare, terrasë, qetësi). Vëre çdo rast të veçantë (ditëlindje, takim pune)."],
    ["Nëse ka pritje, jep kohë reale","“Tavolina juaj do jetë gati për rreth 10 minuta.” Ofro ulëse në lounge dhe një pije. Rikthehu brenda kohës së thënë. Nëse do vonohet, njofto para se të kalojë koha, jo pas."],
    ["Shoqëro, mos trego","Ec një hap përpara, në ritmin e mysafirit, duke kthyer kokën herë pas here. Asnjëherë mos trego tavolinën me dorë nga podiumi."],
    ["Ndihmë me karrigen","Tërhiq karrigen, shtyje butë ndërsa ulet. Përparësi zonjave dhe të moshuarve. Vendos menutë të hapura ose ia jep në dorë."],
    ["Dorëzo informacionin","Prezanto kamarierin (“Ardit do t’ju shërbejë sonte”) dhe kaloji atij emrin, dhomën dhe çdo detaj (alergji, rast i veçantë). Mysafiri nuk duhet ta përsërisë."]
  ],
  say:[["Mirëmbrëma, zoti Hoxha, mirë se vini përsëri në Flower.","Good evening, Mr. Hoxha, welcome back to Flower."],["Tavolina juaj do jetë gati për rreth 10 minuta. A mund t’ju ofroj një pije në lounge ndërkohë?","Your table will be ready in about 10 minutes. May I offer you a drink in the lounge meanwhile?"],["Ju lutem, më ndiqni.","Please, allow me to show you to your table."]],
  avoid:["Podiumi bosh: mysafiri pret në hyrje pa njeri.","“Vetëm një sekondë” pa kohë konkrete, pastaj pritje 15 minuta.","Tregon tavolinën me gisht: “Uluni atje.”","Lë menutë mbi tavolinë dhe largohet pa ndihmuar me karrigen.","Mysafiri i thotë hostit alergjinë dhe kamarieri e pyet përsëri."],
  drill:{t:"Hyrja 60 sekondash",dur:"10 min",how:["Shefi luan mysafirin dhe hyn nga dera në 4 situata: me rezervim, pa rezervim me pritje 10 min, klient i njohur, çift me fëmijë.","Hosti/kamarieri e pret nga fillimi deri te karrigia. Shefi mat kohën me kronometër.","Pas çdo kalimi, 1 minutë feedback: çfarë u bë mirë, një gjë për të përmirësuar."],pass:"Përshëndetje ≤ 60 s, emri përdoret kur dihet, shoqërim dhe karrige në të 4 situatat."},
  quiz:[
    {q:"Je në telefon duke marrë një rezervim kur hyn një çift. Çfarë bën?",o:["Mbaron telefonatën, pastaj i përshëndet","U bën me kokë dhe buzëqesh menjëherë, pastaj i përshëndet verbalisht brenda 60 sekondave","I lë për kamarierin e sallës","Mbyll telefonin pa u përshëndetur me klientin"],a:1,e:"Njohja duhet të jetë e menjëhershme (HD1). Gjesti me kokë e bën mysafirin të ndihet i parë, dhe përshëndetja verbale vjen brenda 60 sekondave (HD19)."},
    {q:"Tavolina do jetë gati pas 10 minutash. Cila përgjigje e plotëson standardin?",o:["“Pak minuta.”","“Prisni pak, ju lutem.”","“Rreth 10 minuta. Ju lutem uluni në lounge, do t’ju thërras unë.” Pastaj rikthehesh brenda 10–15 minutave","“Nuk e di, varet nga klientët e tjerë.”"],a:2,e:"HD2 kërkon kohë të vlerësuar konkrete, të respektuar brenda 5 minutash, dhe HD3 një vend të rehatshëm pritjeje."},
    {q:"Si e shoqëron mysafirin te tavolina?",o:["I tregon tavolinën nga podiumi","Ecën shpejt përpara që të lirosh hyrjen","Ecën një hap përpara në ritmin e tij, e ndihmon me karrigen dhe i jep menutë","E lë të zgjedhë vetë tavolinën"],a:2,e:"HD19: shoqërim te tavolina dhe ndihmë me karrigen. Ritmi i mysafirit, jo i yti."},
    {q:"Hosti mëson që zonja ka alergji nga arrat. Çfarë duhet të ndodhë?",o:["Kamarieri e pyet sërish për alergjitë, për siguri","Hosti ia kalon kamarierit para se ai të shkojë te tavolina, dhe kamarieri e konfirmon pa e detyruar ta përsërisë","Asgjë derisa zonja të porosisë","Shënohet vetëm në fund të faturës"],a:1,e:"HD10: komunikimi mes stafit është i plotë, mysafiri nuk e përsërit kërkesën. Kamarieri mund të thotë: “Kuptova që keni alergji nga arrat, do ta kemi parasysh.”"}

  std:[["HD20","Tavolina përshëndetet brenda 1 min dhe ofrohen pije"],["HD21","Kafeja dhe çaji shërbehen në mënyrë të rafinuar"],["HD22","Rimbushjet ofrohen brenda 1 min pasi pija mbaron"],["HD48","Kafe/çajra specialë të disponueshëm në çdo kohë"],["BL17","Pija e parë: 4 min në tavolinë, 3 min në banak"],["BL18","Raundi tjetër ofrohet diskret brenda 1 min pasi gota mbaron"]],

    ["Kafe dhe çaj me stil","Filxhan me pjatë, dorëza në orën 4, lugë paralel. Sheqeri dhe qumështi në enë të veçanta, ujë me espresson. Çaji: kuti me zgjedhje, ujë shtesë i nxehtë, kohëmatës infuzioni sipas llojit."]

    {q:"Cila nga këto është ofertë pije sipas standardit?",o:["“Diçka për të pirë?”","“Çfarë doni?”","“Ju sugjeroj një gotë Riesling Hugel ose Malvasia del Salento për të filluar.”","“Uji është në tavolinë.”"],a:2,e:"HD20 kërkon që pijet të ofrohen. Një sugjerim konkret me dy opsione është ofertë, pyetja e hapur jo."},
    {q:"Në banak, një mysafir porosit një Old Fashioned. Sa është koha maksimale për ta shërbyer?",o:["2 minuta","3 minuta","5 minuta","Pa limit, kokteilet duan kohë"],a:1,e:"BL17: 3 minuta në banak, 4 minuta në tavolinë, përveç rastit kur e paralajmëron mysafirin për kohë më të gjatë."},
    {q:"Gota e verës së mysafirit sapo mbaroi. Kur ofrohet raundi tjetër?",o:["Kur mysafiri thërret","Brenda 60 sekondave, në mënyrë diskrete","Kur sjell pjatën tjetër","Në fund, me faturën"],a:1,e:"BL18 dhe HD22: brenda 1 minute pasi gota mbaron, pa e ndërprerë bisedën."}

{

},

  std:[["HD9 · BL7","Nuk ka nevojë t’i kujtosh stafit: çdo gjë është parashikuar dhe ofruar"],["HD10","Komunikimi mes stafit është i plotë; mysafiri nuk përsërit kërkesat"],["HD18 · BL16","Asnjë kërkesë nuk refuzohet pa alternativa"],["HD11 · BL9","Stafi njeh të gjithë hotelin ose merr ndihmë të shpejtë"]],

    ["Lexo tavolinën","Shenjat: menuja e mbyllur (gati për porosi), sytë që kërkojnë, gota bosh, takëme në orën 4 (mbaroi), fëmijë që lëvizin, laptop (takim pune), shall në terrasë (ftohtë)."],
    ["Parashikimet bazë","Thikë bifteku para mishit. Lugë shtesë për ndarje. Pecetë shtesë dhe karrige për fëmijë. Ujë me espresson. Kripë/piper pa kërkuar te mishi. Batanije në terrasë pas orës 20:00. Karikues për telefonin."],
    ["Kujtesa e ekipit","Çdo kërkesë, alergji, preferencë shkruhet në POS me kod të qartë (p.sh. ALERGJI: ARRA). Kur ndryshon kamarieri, informacioni dorëzohet i plotë. Mysafiri nuk e thotë dy herë."],
    ["Asnjëherë “jo” pa alternativë","Formula E-P-A-V: Empati (“Për fat të keq…”), Pse (shkurt), 2 Alternativa, Veprim (“Cilën preferoni?”)."],
    ["Kur nuk e di","“Më lejoni ta kontrolloj menjëherë.” Rikthehu brenda 2 minutash me përgjigje ose me personin që e di. Kurrë: “Nuk e di.”"],
    ["Njih hotelin","Oraret: mëngjesi, spa, pishina, check-out. WiFi, taksi, plazhi, 3 restorante dhe 3 atraksione në qytet. Pyetjet për hotelin përgjigjen nga kushdo."]
  ],
  say:[["Për fat të keq, shojza ka mbaruar sonte. Ju sugjeroj levrekun me kore barishtesh ose peshkun murgu me fava dhe mascarpone. Cilin preferoni?","Unfortunately the sole is finished tonight. May I suggest the herb-crusted sea bass, or the monkfish with fava and mascarpone? Which would you prefer?"],["Më lejoni ta kontrolloj menjëherë dhe kthehem.","Let me check that for you right away."],["Vura re që jeni ulur pranë dritares. Dëshironi një shall?","I noticed it’s getting cooler by the window. May I bring you a blanket?"]],
  avoid:["“Nuk kemi.” Pikë.","“S’e di, pyet recepsionin.”","Mysafiri kërkon kripë, pastaj piper, pastaj thikë tjetër.","Kamarieri i ri pyet sërish për alergjinë që u tha më parë.","Mysafiri me fëmijë kërkon karrige fëmijësh pasi është ulur."],
  drill:{t:"“Jo” me dy alternativa",dur:"10 min",how:["Shefi lexon 8 kërkesa që nuk mund të plotësohen (pjatë e mbaruar, tavolinë e zënë, ndryshim pas orës 23:00, verë e mbaruar…).","Çdo person përgjigjet me formulën E-P-A-V në më pak se 20 sekonda.","Grupi vlerëson: a kishte empati, 2 alternativa reale dhe pyetje mbyllëse?"],pass:"8/8 përgjigje me 2 alternativa reale dhe pa fjalën “nuk kemi” të vetme."},
  quiz:[
    {q:"Mysafiri porosit biftek. Çfarë duhet të jetë në tavolinë para se të mbërrijë pjata?",o:["Asgjë shtesë","Thikë bifteku, dhe ofertë për salca/kripë sipas standardit të shtëpisë","Vetëm piper","Do ta kërkojë nëse i duhet"],a:1,e:"HD9 dhe HD54: takëmet e duhura dhe shtesat parashikohen. Mysafiri nuk duhet të kërkojë."},
    {q:"Vera që kërkoi mysafiri ka mbaruar. Përgjigjja korrekte?",o:["“Ka mbaruar.”","“Ka mbaruar, shikoni menunë përsëri.”","“Për fat të keq ka mbaruar. Ju sugjeroj [verë A] me profil të ngjashëm ose [verë B], pak më e plotë. Dëshironi t’i provoni?”","“Mund të merrni birrë.”"],a:2,e:"HD18/BL16: asnjë refuzim pa alternativa të përshtatshme. Formula E-P-A-V."},
    {q:"Mysafiri të pyet për orarin e spa-s dhe nuk e di. Çfarë bën?",o:["“Nuk e di, pyesni recepsionin.”","“Më lejoni ta kontrolloj menjëherë”, dhe rikthehesh brenda 2 minutash me përgjigjen","E hamendëson","Ndryshon temën"],a:1,e:"HD11/BL9: stafi njeh të gjithë hotelin ose merr ndihmë të shpejtë dhe efektive."},
    {q:"Ndryshon turni dhe tavolina 12 kalon te kolegu. Çfarë i jep kolegut?",o:["Vetëm numrin e tavolinës","Emrin, alergjitë, preferencat, ç’kanë porositur dhe çfarë vjen më pas","Asgjë, ai e sheh në POS","Faturën"],a:1,e:"HD10: kanalet e komunikimit janë të plota, mysafiri nuk e përsërit asgjë."}
  ]
},
{
  id:"L5", t:"Njohja e menusë dhe rekomandimi", min:20,
  goal:"Çdo kamarier dhe banakier përshkruan çdo pjatë dhe pije me siguri, rekomandon me bindje dhe njeh alergjenët pa hezitim.",
  std:[["HD11 · BL9","Kryen punën me njohuri dhe aftësi"],["HD23","Jep rekomandime të dobishme kur pyetet"],["HD24","Diskuton detajet e pjatave"],["HD25 · BL8","Diskuton pijet: verërat, birrat, alkoolet"]],
  kpi:[["6","fakte për çdo pjatë"],["14","alergjenët e BE-së"],["7","verëra me gotë që di përmendsh"]],
  steps:[
    ["6 faktet e çdo pjate","1) 3 përbërësit kryesorë, 2) metoda e gatimit, 3) alergjenët, 4) koha e përgatitjes, 5) origjina e produktit kyç (p.sh. peshk i Adriatikut), 6) çiftimi me verë ose pije."],
    ["Metoda P-A-S","Pyet: “Preferoni mish apo peshk, diçka të lehtë apo më të plotë?” Ankoro: 2 opsione konkrete. Shpjego me ndjesi: tekstura, shija, origjina, dhe “favoriti im është…”"],
    ["Fjalë që shesin","Jo “është e mirë”. Po: “levrek me kore barishtesh, me pure fasuleje dhe karota ylber” ose “short rib i gatuar ngadalë, me polentë dhe demi-glace me piper Timur”."],
    ["Pijet","Di përmendsh 3 verërat e kuqe, 3 të bardhat dhe shampanjën me gotë: rrushi, rajoni, profili (i thatë, i freskët, i plotë). Di dallimin single malt / blend, xhin London Dry, rakitë shqiptare, birrat në menu dhe kokteilet e shtëpisë."],
    ["Alergjitë","Njih 14 alergjenët e BE-së për çdo pjatë. Kur s’je 100% i sigurt, konfirmo me kuzhinën. Kurrë: “Mendoj se nuk ka.”"],
    ["Testi i pjatës","Çdo pjatë e re provohet nga stafi para se të shkojë në menu. Nuk mund të rekomandosh atë që s’e ke shijuar."]
  ],
  say:[["Nëse preferoni peshk, ju rekomandoj levrekun me kore barishtesh, me pure fasuleje dhe karota ylber. Është i lehtë dhe shkon shumë mirë me një të bardhë të freskët.","If you enjoy fish, I recommend the herb-crusted sea bass with bean purée and rainbow carrots. It is light and pairs beautifully with a crisp white wine."],["Personalisht, favoriti im është…","My personal favourite is…"],["E konfirmoj menjëherë me shefin e kuzhinës që pjata nuk ka arra.","I’ll confirm with our chef right away that the dish is nut-free."]],
  avoid:["“Të gjitha janë të mira.”","Lexon përshkrimin nga menuja para mysafirit.","Nuk e di rrushin e verës që po shërben.","Hamendëson për alergjenët.","Rekomandon pjatën më të shtrenjtë pa pyetur për preferencën."],
  drill:{t:"60 sekonda për një pjatë",dur:"15 min",how:["Shefi zgjedh rastësisht 5 pjata dhe 3 pije nga menuja.","Çdo person ka 60 sekonda për t’i përshkruar me 6 faktet dhe një çiftim.","Pyetje kontrolli nga shefi: “A ka gluten? Po laktozë?”"],pass:"6/6 fakte për çdo pjatë dhe 100% saktësi për alergjenët."},
  quiz:[
    {q:"Mysafiri pyet: “Çfarë më rekomandoni?” Cila është përgjigjja më e mirë?",o:["“Gjithçka është e mirë.”","“Varet nga ju.”","“Preferoni mish apo peshk? …Atëherë ju sugjeroj oktapodin e zi ose peshkun murgu me fava. Oktapodi është favoriti im.”","“Merrni më të shtrenjtën.”"],a:2,e:"HD23: rekomandim i dobishëm. Metoda P-A-S: pyet, ankoro në 2 opsione, shpjego."},
    {q:"Mysafiri ka alergji nga glutenti dhe nuk je i sigurt për salcën. Çfarë bën?",o:["“Mendoj se nuk ka.”","Konfirmon me kuzhinën para se të përgjigjesh","I thua të zgjedhë diçka tjetër","Nuk thua asgjë"],a:1,e:"Siguria e mysafirit dhe HD11: njohuri profesionale ose ndihmë e shpejtë dhe efektive."},
    {q:"Sa verëra me gotë kërkon minimumi i Forbes për barin?",o:["1 e kuqe, 1 e bardhë","3 të kuqe, 3 të bardha, 1 shampanjë/shkumëzuese","5 të kuqe","Nuk ka minimum"],a:1,e:"BL31: të paktën 3 të kuqe, 3 të bardha dhe 1 shampanjë ose verë shkumëzuese, të zgjedhura mirë dhe të ndryshme."},
    {q:"Cili përshkrim e plotëson HD24?",o:["“Është peshk.”","“Është shumë i mirë.”","“Peshk murgu me fava, mascarpone, barishte të egra dhe kumquat. Përmban peshk dhe qumësht; e konfirmoj me kuzhinën.”","“Shikojeni në menu.”"],a:2,e:"HD24: stafi diskuton detajet e pjatave: përbërësit, gatimi, alergjenët."}
  ]
},
{
  id:"L6", t:"Porosia, servirja dhe ritmi", min:20,
  goal:"Çdo pjatë shkon te personi i duhur pa pyetur, me takëmet e duhura, në temperaturën e duhur dhe në një ritëm ku mysafiri nuk pyet kurrë “kur vjen?”.",
  std:[["HD39 · BL19","Çdo gjë shërbehet saktë, pa pyetur “kush e kishte?”"],["HD54","Të gjitha takëmet e duhura janë vendosur"],["HD33 · BL24","E nxehta e nxehtë, e ftohta e ftohtë"],["HD27","Ritmi i vaktit është i qëndrueshëm"],["HD62","Shërbim pa vonesa ose ndërprerje të tepërta"],["HD26 · HD61","Mëngjesi: i ftohtë ≤ 7 min, i nxehtë ≤ 10 min; mëngjes i plotë ≤ 30 min"],["HD37 · HD38","Prezantim i saktë, gatim siç u kërkua"]],
  kpi:[["0","herë “Kush e kishte…?”"],["2 min","kontrolli pas servirjes"],["7 / 10 min","mëngjesi i ftohtë / i nxehtë"]],
  steps:[
    ["Numri i pozicionit","Pozicioni 1 është karrigia më afër hyrjes së sallës (ose me shpinë nga kuzhina, sipas planit të Flower). Numërohet në drejtim të akrepave. Çdo artikull shënohet me pozicion në POS."],
    ["Porosia","Fillo me zonjat dhe të ftuarit, organizatori i fundit. Përsërit shkurt pikat kritike: pjekja e mishit, alergjitë, ndryshimet. Pyet për ritmin: “Dëshironi pjatat njëra pas tjetrës apo të gjitha bashkë?”"],
    ["Takëmet para pjatës","Rregullo takëmet sipas porosisë para se të vijë pjata: thikë peshku, lugë supe, thikë bifteku, pirun dhe lugë ëmbëlsire. Hiq ato që nuk duhen."],
    ["Kontrolli në pass","Mos e merr pjatën nëse: buza është e pistë, temperatura nuk është e duhur, prezantimi nuk përputhet me standardin, mishi nuk është siç u kërkua. Pjata e nxehtë në pjatë të ngrohtë."],
    ["Servirja","Nga e djathta, me dorën e djathtë, sipas pozicioneve. Të gjitha pjatat e tavolinës vendosen njëkohësisht (me runner). Emërto pjatën: “Levreku me kore barishtesh.” Kurrë: “Kush e kishte peshkun?”"],
    ["Kontrolli 2 minuta","Pas 2 minutave ose 2 kafshatave: “Gjithçka sipas dëshirës suaj?” Pastaj tërhiqu."],
    ["Ritmi","Midis pjatave 8–12 min në darkë, përveç kur mysafiri kërkon ndryshe. Nëse kuzhina vonon, njofto para se mysafiri ta vërejë: “Qengji juaj del pas 5 minutash.”"]
  ],
  say:[["Si dëshironi ta keni të pjekur biftekun?","How would you like your steak cooked?"],["Levreku me kore barishtesh, me pure fasuleje. Ju bëftë mirë.","The herb-crusted sea bass, with bean purée. Enjoy."],["Gjithçka sipas dëshirës suaj?","Is everything to your liking?"]],
  avoid:["“Kush e kishte peshkun?”","Pjata del, pastaj kamarieri vrapon për thikën.","Supë e vakët, sallatë e ngrohtë.","Pjatat e tavolinës mbërrijnë me 3 minuta diferencë.","Mysafiri pret 25 minuta pa asnjë informacion."],
  drill:{t:"Servirja pa pyetur",dur:"12 min",how:["Tavolinë me 6 “mysafirë” dhe 6 pjata të ndryshme (mund të përdoren karta me emra pjatash).","Kamarieri merr porosinë me pozicione, runner-i (tjetër person) shërben vetëm nga shënimi.","Shefi kontrollon: pozicionet, takëmet para pjatës, njëkohshmëria."],pass:"6/6 pjata te personi i duhur pa asnjë pyetje, takëmet e duhura 100%."},
  quiz:[
    {q:"Runner-i mbërrin në tavolinë me 4 pjata. Cila sjellje humbet pikë?",o:["Shërben sipas pozicioneve në POS","Pyet: “Kush e kishte peshkun?”","Emërton pjatën gjatë vendosjes","Vendos pjatat njëkohësisht me kolegun"],a:1,e:"HD39/BL19: shërbimi i saktë pa pyetur kush porositi çfarë. Kjo njihet si “ankandi” i pjatave."},
    {q:"Mysafiri porosit mëngjes të nxehtë (omëletë). Sa është limiti?",o:["5 minuta","10 minuta, përveç rastit kur paralajmërohet","15 minuta","20 minuta"],a:1,e:"HD26: i ftohtë ≤ 7 minuta, i nxehtë ≤ 10 minuta, përveç rastit kur kamarieri njofton ndryshe."},
    {q:"Kur rregullohen takëmet për pjatën e peshkut?",o:["Pas vendosjes së pjatës","Para se pjata të mbërrijë","Vetëm nëse kërkohet","Nuk ndryshohen"],a:1,e:"HD54: të gjitha takëmet e duhura janë vendosur. Rregullimi bëhet para pjatës, që mysafiri të mos presë."},
    {q:"Kuzhina vonon pjatën kryesore me 10 minuta. Çfarë bën?",o:["Asgjë, mysafiri do presë","Njofton mysafirin proaktivisht dhe ofron diçka (bukë shtesë, pije)","Pret derisa mysafiri të pyesë","Thotë që është faji i kuzhinës"],a:1,e:"HD27/HD62: mysafiri nuk duhet të pyesë ose të habitet kur vjen hapi tjetër."}
  ]
},
{
  id:"L7", t:"Vera me gotë, kokteilet dhe bari", min:20,
  goal:"Çdo pije shërbehet si në një bar 5 yje: etiketa tregohet, ofrohet provë, gota dhe akulli janë të duhurat, recetat janë të sakta dhe prezantimi është i veçantë.",
  std:[["BL20","Vera me gotë: tregohet etiketa dhe derdhet në tavolinë"],["BL21","Ofrohet provë"],["BL22 · BL23","Prezantim i veçantë, gota cilësore të përshtatshme"],["BL24 · BL25","Temperaturë e duhur, sasi bujare"],["BL26","Kokteile të balancuara, me garniturë, saktësisht si u kërkua"],["BL27","Akulli i stilit të duhur"],["BL30 · BL32 · BL33","Menuja e pijeve ofrohet automatikisht, me ofertë speciale dhe opsione pa alkool"],["BL34–38","Snacks të freskëta, peceta liri ose pambuku, coaster i veçantë"]],
  kpi:[["2 cl","provë vere"],["150 ml","gotë vere (standardi Flower)"],["6–18°C","temperaturat e verës"]],
  steps:[
    ["Vera me gotë në 4 hapa","1) Sill shishen në tavolinë dhe trego etiketën: prodhuesi, rrushi, viti. 2) Ofro provë: “Dëshironi ta provoni?” dhe derdh rreth 2 cl. 3) Pas miratimit, derdh 150 ml në tavolinë, nga e djathta, me etiketën nga mysafiri. 4) Kurrë mos sill gotë të mbushur nga banaku."],
    ["Temperaturat","Shampanjë 6–8°C. E bardhë dhe rozé 8–10°C. E kuqe e lehtë 14–16°C. E kuqe e plotë 16–18°C. Birra 4–6°C."],
    ["Gota e duhur","Bordeaux/Burgundy për të kuqen, gotë e bardhë, flute ose tulipan për shampanjën, rocks për uiski, highball për gin & tonic, coupe për martini/daiquiri. Kapet nga këmba, pa njolla, pa çarje."],
    ["Akulli","Kub i madh ose sferë për uiski “on the rocks”. Kube standarde për highball. Akull i thyer për mojito/julep. “Neat” do të thotë pa akull. Akulli i kristaltë, pa erë frigoriferi."],
    ["Kokteilet","Gjithmonë me jigger, kurrë me sy. Receta e shtëpisë për çdo kokteil. Garniturë e freskët (lëkurë portokalli e prerë në çast). Saktësisht si kërkon mysafiri: “dirty”, “pa sheqer”, “me Hendrick’s”."],
    ["Detajet e luksit","Çdo pije mbi coaster liri ose lëkure. Snacks të freskëta me pijen e parë (ullinj, bajame, chips shtëpie), me pecetë liri. Menuja e pijeve jepet pa u kërkuar, e pastër dhe e paprekur. Ofro kokteilin firmato dhe mocktail-et."]
  ],
  say:[["Kjo është Nuits-Saint-Georges i Louis Jadot, Pinot Noir nga Burgundy. Dëshironi ta provoni fillimisht?","This is the Nuits-Saint-Georges by Louis Jadot, a Pinot Noir from Burgundy. Would you like to taste it first?"],["E preferoni Martinin tuaj të tundur apo të përzier, me ullinj apo me lëkurë limoni?","Would you prefer your martini shaken or stirred, with olives or a lemon twist?"],["Për diçka me flluska kemi Prosecco Col Mesian ose, për një festë, Moët Impérial.","For something sparkling we have Col Mesian Prosecco or, to celebrate, Moët Impérial."]],
  avoid:["Gotë vere e mbushur te banaku dhe e sjellë pa shishe.","Uiski “on the rocks” me akull të thyer që shkrin menjëherë.","Gin tonic në gotë verë pa e pyetur mysafirin.","Pije pa coaster, mbi tavolinë xhami.","Menuja e pijeve me njolla ose e grisur."],
  drill:{t:"Ceremonia e verës",dur:"12 min",how:["Me një shishe të hapur (ose ujë në shishe vere), çdo kamarier bën 4 hapat në tavolinë para shefit.","Banakierët përgatisin 3 kokteile të shtëpisë me jigger; shefi kontrollon recetën, akullin, gotën dhe garniturën.","Shefi pyet 3 temperatura dhe 3 gota rastësisht."],pass:"4/4 hapa të verës; 3/3 kokteile me recetë, gotë, akull dhe garniturë korrekte."},
  quiz:[
    {q:"Mysafiri porosit një gotë Chardonnay. Si shërbehet?",o:["Mbushet te banaku dhe sillet","Sillet shishja, tregohet etiketa, ofrohet provë, derdhet në tavolinë","Derdhet në tavolinë pa treguar etiketën","Sillet shishja dhe lihet mbi tavolinë"],a:1,e:"BL20 dhe BL21: demonstrim i etiketës, derdhje në tavolinë dhe ofertë prove."},
    {q:"Cili akull është i duhuri për një uiski “on the rocks”?",o:["Akull i thyer","Kub i madh ose sferë","Pa akull","Akull i grirë me ujë"],a:1,e:"BL27: stili i duhur i akullit. Kubi i madh shkrin ngadalë dhe nuk e hollon pijen."},
    {q:"Në cilën temperaturë shërbehet shampanja?",o:["2–4°C","6–8°C","12–14°C","16–18°C"],a:1,e:"BL24: pijet në temperaturën e duhur. Shampanja 6–8°C."},
    {q:"Cili element NUK kërkohet nga standardi i barit?",o:["Coaster liri ose i veçantë","Snacks të freskëta me pijet","Menuja e pijeve e ofruar automatikisht","Muzikë live çdo natë"],a:3,e:"BL38, BL34, BL30 janë standarde. Muzika live nuk kërkohet; nëse ka, duhet të jetë profesionale (BL43)."}
  ]
},
{
  id:"L8", t:"Tavolina, pastrimi dhe fatura", min:15,
  goal:"Tavolina është gjithmonë e rregullt, gjithçka është e pastër dhe e paprekur, dhe fatura vjen menjëherë, e saktë dhe diskrete.",
  std:[["HD49–52 · BL39–40","Tavolina, pecetat, gotat, porcelani dhe takëmet të pastra dhe në gjendje perfekte"],["HD55","Heqja e pjatave bëhet në kohën e duhur"],["BL28","Tavolina/banaku mirëmbahen vazhdimisht"],["HD58 · BL41","Salla e organizuar; tavolinat e liruara pastrohen shpejt"],["BL44","Stacionet e shërbimit dhe banaku i pasmë të rregullt"],["HD56 · HD57 · BL45","Fatura vjen shpejt, e saktë dhe diskrete"]],
  kpi:[["2 min","nga kërkesa te fatura"],["5 min","ri-shtrimi i tavolinës së liruar"],["0","gabime në faturë"]],
  steps:[
    ["Inspektimi para shërbimit","Çdo gotë kundër dritës, çdo pirun i polishuar, pecetat liri të hekurosura, tavolina pa lëkundje, menutë pa njolla. Çdo gjë me çarje ose njollë hiqet nga qarkullimi."],
    ["Heqja e pjatave","Kur të gjithë kanë mbaruar ose mysafiri vendos takëmet në orën 4. Nga e djathta, pa zhurmë, pa i grumbulluar pjatat para mysafirit. Në bar: gota bosh, pecetat e përdorura hiqen menjëherë."],

const WHY = {
L1:[
 ["Përshtypja e parë vendos kornizën","Mysafiri formon mendimin për restorantin në sekondat e para dhe pastaj kërkon prova që e konfirmojnë. Psikologët e quajnë efekt i përparësisë: një hyrje e ftohtë e bën mysafirin të vërejë çdo gabim më pas, ndërsa një hyrje e ngrohtë e bën më tolerant. Prandaj Forbes e mat hyrjen me sekonda."],
 ["Psikologjia e pritjes","David Maister, studiuesi i radhëve në shërbim, tregoi pse e njëjta pritje ndihet më e gjatë ose më e shkurtër: pritja e pashpjeguar ndihet më e gjatë se ajo e shpjeguar; pritja e pasigurt më e gjatë se ajo me kohë të njohur; pritja pa asgjë për të bërë më e gjatë se ajo me një pije në dorë. Standardi HD2 dhe HD3 janë pikërisht këto tre parime: kohë konkrete, e respektuar, në një vend të rehatshëm."],
 ["Shoqërimi është transferim kujdesi","Kur hosti shoqëron mysafirin, mesazhi është “tani je në duart tona”. Kur tregon me dorë, mesazhi është “gjeje vetë”. Dorëzimi i informacionit te kamarieri e vazhdon këtë zinxhir: mysafiri ndjen se e njeh i gjithë ekipi, jo vetëm një person."]

L2:[
 ["Pse 60 sekonda","Pas uljes, mysafiri është në gjendjen më të pasigurt: ka ardhur, por ende nuk i është kujdesur askush. Çdo sekondë pa kontakt lexohet si harresë. Një minutë është kufiri ku pritja kalon nga “normale” në “më kanë harruar”."],
 ["Arkitektura e zgjedhjes","Pyetja e hapur “Doni diçka për të pirë?” e lë mysafirin të mendojë nga e para dhe zakonisht përfundon me “ujë”. Dy sugjerime konkrete e lehtësojnë vendimin. Studimet mbi mbingarkesën e zgjedhjes (Iyengar dhe Lepper) treguan se më pak opsione të qarta çojnë në më shumë vendime. Kjo rrit edhe shitjen e pijeve, që kanë marzhin më të lartë në restorant."],
 ["Gota bosh është sinjali më i dukshëm","Inspektori e sheh gotën bosh pa pasur nevojë të kërkojë asgjë. Është prova më e thjeshtë që salla nuk po shikohet. Rimbushja brenda 60 sekondave tregon një ekip që vëzhgon, jo që pret thirrje."]
],
L3:[
 ["Gjuha si sinjal statusi","Në hotelet luksoze, regjistri i gjuhës është pjesë e produktit, njësoj si porcelani. Zhargoni dhe fragmentet (“OK”, “Kartë?”) ulin perceptimin e vlerës, edhe kur shërbimi teknik është perfekt. Formula e Ritz-Carlton, “zonja dhe zotërinj që u shërbejnë zonjave dhe zotërinjve”, e përmbledh këtë: stafi flet si i barabartë i kulturuar, jo si shërbëtor dhe jo si mik i lagjes."],
 ["Fuqia e emrit","Studimet me imazheri të trurit tregojnë se dëgjimi i emrit tonë aktivizon zona të veçanta të vëmendjes dhe vetë-identitetit. Emri i thënë natyrshëm është njohja më e lirë dhe më e fuqishme. I thënë tepër shpesh, tingëllon si teknikë shitjeje."],
 ["Mbyllja mbetet në kujtesë","Sipas rregullit pik-fund (peak-end) të Daniel Kahneman, njerëzit e kujtojnë një përvojë kryesisht nga momenti më intensiv dhe nga fundi i saj. Një mbyllje e ftohtë mund ta prishë kujtimin e një darke të mirë. Prandaj çdo ndërveprim, edhe më i shkurtri, mbyllet me fjalë të sjellshme."]
],
L4:[
 ["Katër nivelet e shërbimit","Modeli i Karl Albrecht ndan vlerën në katër nivele: bazike (ajo pa të cilën nuk funksionon), e pritshme (çfarë merr mysafiri si të sigurt), e dëshiruar (çfarë do të donte, por nuk e kërkon) dhe e papritur (çfarë nuk e imagjinonte). Shërbimi 5 yje jeton te dy nivelet e fundit. Thika e biftekut para pjatës është “e pritshme”; batanija në terrasë para se mysafiri të ndiejë ftohtë është “e papritur”."],
 ["Pse “jo” me alternativa","Një refuzim i thatë i heq mysafirit ndjesinë e kontrollit. Dy alternativa ia kthejnë kontrollin: ai ende zgjedh. Kjo e kthen një moment negativ në provë kujdesi. Në rikuperimin e shërbimit, mysafiri që ka pasur problem dhe është trajtuar mirë shpesh bëhet më besnik se ai që nuk ka pasur asnjë problem."],

],
L5:[
 ["Njohuria krijon besim","Mysafiri nuk e di nëse levreku është i freskët, por e di nëse kamarieri flet me siguri. Hezitimi lexohet si mungesë cilësie. Njohuria e produktit është mënyra se si mysafiri e “shijon” cilësinë para se ta provojë."],
 ["Gjuha shqisore shet","Kërkimet e Brian Wansink mbi menutë treguan se përshkrimet shqisore dhe me origjinë (“short rib i gatuar ngadalë, me polentë dhe demi-glace me piper Timur”) rrisin shitjet dhe vlerësimin e shijes krahasuar me emrat e thatë. E njëjta pjatë shijon më mirë kur përshkruhet mirë."],
 ["Alergjenët janë përgjegjësi ligjore","Rregullorja e BE-së 1169/2011 përcakton 14 alergjenë që duhen deklaruar: glutenin, krustacet, vezët, peshkun, kikirikët, sojën, qumështin, arrat, selinon, mustardën, susamin, sulfitet, lupinën dhe molusqet. Një gabim këtu nuk humbet vetëm pikë Forbes: mund të rrezikojë jetën e mysafirit."]
],
L6:[
 ["Pse numri i pozicionit","“Ankandi” i pjatave (“Kush e kishte peshkun?”) e ndërpret bisedën dhe tregon që ekipi nuk komunikon. Sistemi i pozicioneve, i përdorur në restorantet e mëdha që nga shekulli XX, lejon që çdo person i ekipit, edhe ai që nuk e mori porosinë, të shërbejë si të ishte kamarieri i tavolinës."],
 ["Temperatura dhe shija","Temperatura ndryshon perceptimin e shijes: ushqimi i vakët duket pa shije dhe pa freski, e ftohta e ngrohur humbet teksturën. Pjata e ngrohtë mban temperaturën rreth 3–4 minuta më shumë, që është koha nga pass-i te tavolina dhe kafshatat e para."],
 ["Ritmi është kontroll i ankthit","Mysafiri nuk e mat kohën me orë, por me pasiguri. Pesëmbëdhjetë minuta me informacion ndihen më shkurt se dhjetë pa informacion. Kontrolli 2 minutash dhe njoftimi proaktiv i vonesës janë mjetet që e mbajnë ritmin nën kontroll edhe kur kuzhina vonon."]
],
L7:[
 ["Rituali i verës ka arsye","Demonstrimi i etiketës konfirmon që mysafiri merr verën dhe vitin që pagoi. Prova lejon të dallohen defektet: era e tapës (TCA), oksidimi, temperatura e gabuar. Derdhja në tavolinë eliminon dyshimin për verë të hapur prej ditësh ose për sasi të vogël."],
 ["Gota dhe temperatura ndryshojnë verën","Forma e gotës drejton aromat drejt hundës dhe lëngun në pjesë të ndryshme të gojës. Vera shumë e ftohtë i mbyll aromat; shumë e ngrohtë e nxjerr në pah alkoolin. Prandaj Forbes kërkon gotë “plotësisht të përshtatshme” dhe temperaturë të saktë."],
 ["Akulli është përbërës","Sa më e madhe sipërfaqja e akullit, aq më shpejt shkrin dhe e hollon pijen. Kubi i madh ose sfera e ftohin uiskin pa e holluar shpejt; akulli i thyer e ftoh dhe e hollon mojiton qëllimisht. Akulli i gabuar e prish recetën, edhe kur përbërësit janë perfektë."]
],
L8:[
 ["Koha e heqjes së pjatave","Heqja e pjatës së një personi kur të tjerët ende hanë krijon presion të padukshëm: ata që hanë ndihen të nxituar. Prandaj standardi klasik është të prisni sa të mbarojnë të gjithë, përveç kur mysafiri e kërkon."],
 ["Fatura është momenti i fundit","Sipas rregullit pik-fund, fundi i përvojës peshon shumë në kujtesë. Një faturë që vonon 10 minuta ose që ka gabim e kthen mbrëmjen e mirë në zhgënjim. Diskrecioni me paratë respekton privatësinë dhe statusin e mysafirit para shoqëruesve të tij."],
 ["Detajet e vogla flasin për të mëdhatë","Një gotë me njollë e bën mysafirin të mendojë: “Nëse nuk e shohin këtë, çfarë nuk shohin në kuzhinë?” Pastërtia e dukshme është prova e pastërtisë që nuk shihet."]
],
L9:[
 ["Gjykimi në sekonda","Studimet e Nalini Ambady mbi “fetat e holla” (thin-slicing) treguan se njerëzit formojnë gjykime të qëndrueshme për kompetencën dhe ngrohtësinë e dikujt brenda pak sekondash, kryesisht nga pamja dhe qëndrimi. Mysafiri të vlerëson para se të flasësh."],
 ["Uniforma është marka","Uniforma e pastër dhe e përshtatur është pjesë e dizajnit të hotelit, njësoj si dekori. Një përparëse me njolla ul vlerën e gjithë sallës, jo vetëm të personit."],
 ["Qëndrimi komunikon disponueshmëri","Stafi i mbështetur ose me duar në xhepa duket “jashtë shërbimit”. Qëndrimi i drejt dhe sytë drejt sallës i thonë mysafirit: “Jam këtu për ju, mund të më thërrisni.” Kjo ul nevojën që mysafiri të kërkojë me sy, gjë që Forbes e mat si shërbim i parashikuar."]
]

  ["Kush është Forbes Travel Guide","Forbes Travel Guide, i njohur më parë si Mobil Travel Guide që nga viti 1958, është sistemi më i vjetër i pavarur i vlerësimit me yje për hotelet, restorantet dhe spa-të. Vlerësimet janë Five-Star, Four-Star dhe Recommended. Ndryshe nga yjet shtetërore, që matin kryesisht ndërtesën dhe pajisjet, Forbes mat kryesisht shërbimin."],
  ["Inspektori anonim","Inspektori rezervon dhe paguan si çdo mysafir tjetër, pa u identifikuar. Qëndron zakonisht 2 netë, ha në restorant, pi në bar, porosit room service, teston spa-n, bën kërkesa dhe ndonjëherë krijon situata të vështira me qëllim. Vetëm në fund mund të prezantohet. Kjo do të thotë: çdo mysafir mund të jetë inspektori."],
  ["Standardet janë binare","Çdo standard vlerësohet “po” ose “jo”. Nuk ka “pothuajse”. Tavolina u përshëndet brenda 60 sekondave ose jo. Pija e parë erdhi brenda 4 minutave ose jo. Prandaj trajnimi ynë punon me kohë dhe sjellje të sakta, jo me “mundohu të jesh i shpejtë”."],
  ["Shërbimi peshon më shumë","Standardet ndahen në Service (si sillet stafi) dhe Facility (gjendja e ambientit dhe pajisjeve). Forbes deklaron se rreth 75% e vlerësimit lidhet me shërbimin. Në restorant (Hotel Dining) ka 62 standarde, në bar (Bar/Lounge) 45, dhe shumica janë të shërbimit. Pra rezultati varet kryesisht nga stafi, jo nga muret."],
  ["Lidhja emocionale","Përveç standardeve objektive, Forbes mat edhe si u ndje inspektori në çdo moment, në një shkallë nga “i zemëruar” (0%) te “i mahnitur” (100%). Mes tyre: i frustruar, i pakënaqur, i zhgënjyer, indiferent, i kënaqur, i lumtur, shumë i impresionuar, i habitur. Synimi ynë nuk është “i kënaqur”, por “shumë i impresionuar” e lart."]
 ],
 concepts:[["Standard Service","Sjellje e stafit që vëzhgohet (p.sh. përdorimi i emrit)."],["Standard Facility","Gjendja fizike (p.sh. menu pa njolla, gota pa çarje)."],["Binar","Çdo standard është ose i plotësuar, ose jo."],["Emotional Engagement","Shkalla 0–100% e ndjenjës së mysafirit në çdo moment."]],
 quiz:[
  {q:"Si e dallon inspektorin e Forbes?",o:["Ka uniformë","Paraqitet në recepsion","Nuk e dallon dot: rezervon dhe paguan si çdo mysafir","Vjen gjithmonë të hënën"],a:2,e:"Inspektori është anonim. Prandaj standardi zbatohet me çdo mysafir, çdo ditë."},
  {q:"Si vlerësohet një standard?",o:["Nga 1 te 10","Po ose jo","Me komente","Me yje"],a:1,e:"Standardet janë binare: ose plotësohen plotësisht, ose jo."},
  {q:"Çfarë peshon më shumë në vlerësimin Forbes?",o:["Ndërtesa dhe dekori","Çmimet","Shërbimi i stafit, rreth 75%","Vendndodhja"],a:2,e:"Forbes deklaron se rreth 75% e vlerësimit lidhet me shërbimin."},
  {q:"Cili është synimi ynë në shkallën emocionale?",o:["I kënaqur (60%)","Indiferent (45%)","Shumë i impresionuar (80%) e lart","Nuk matet"],a:2,e:"“I kënaqur” është vetëm pozitiv. Hotelet 5 yje synojnë “shumë i impresionuar”, “i habitur” dhe “i mahnitur”."}
 ]
},
{
 id:"T2", t:"9 kategoritë e standardeve", min:15,
 goal:"Stafi njeh 9 kategoritë me të cilat Forbes klasifikon çdo standard dhe di t’i lidhë me punën e vet në sallë dhe në bar.",
 theory:[
  ["Pse kategoritë","Çdo standard Forbes ka një klasifikim që tregon çfarë aspekti të përvojës mat. Kur e kupton kategorinë, kupton qëllimin e standardit dhe mund të reagosh drejt edhe në situata që manuali nuk i përmend."],
  ["1. Courtesy & Manners · Mirësjellja","Edukata bazë dhe aftësitë sociale: përshëndetja, toni, buzëqeshja, kontakti me sy, mbyllja. Shembull: HD5, toni i ngrohtë gjatë gjithë bashkëbisedimit."],
  ["2. Efficiency · Efikasiteti","Koha e pritshme e shërbimit: 60 sekonda, 4 minuta, 7/10 minuta. Shembull: BL17, pija e parë."],
  ["3. Guest Comfort & Convenience · Rehatia","Të mos e vësh mysafirin në siklet ose të mos e bësh të përpiqet. Shembull: HD3, zona e pritjes; HD9, mysafiri nuk ka nevojë të kërkojë."],
  ["4. Graciousness, Thoughtfulness & Personalized Service · Kujdesi personal","Parashikimi i nevojave dhe njohja e mysafirit si individ. Shembull: HD12, përdorimi i emrit; HD18, asnjë “jo” pa alternativë."],
  ["5. Technical Execution, Skill & Knowledge · Aftësia teknike","Saktësia dhe njohuria profesionale. Shembull: HD24, detajet e menusë; BL19, servirja pa pyetur kush porositi."],
  ["6. Elements of Luxury · Elementet e luksit","Detajet që e dallojnë 5 yjet nga 4 yjet: coaster liri, kafe e servirur me stil, 3+3+1 verëra me gotë."],
  ["7. Food & Beverage Quality · Cilësia","Freskia, shija, temperatura, prezantimi, sasia."],
  ["8. Staff Appearance · Paraqitja","Uniforma, kujdesi personal, qëndrimi."],
  ["9. Cleanliness & Condition · Pastërtia dhe gjendja","Higjiena dhe mirëmbajtja: menutë, gotat, tavolinat, banaku."]
 ],
 concepts:[["Klasifikim","Kategoria e aspektit që mat një standard."],["Elements of Luxury","Detajet e dallimit midis 4 dhe 5 yjeve."],["Personalized Service","Trajtimi i mysafirit si individ, jo si numër tavoline."]],
 quiz:[
  {q:"“Pija e parë brenda 4 minutave” i përket kategorisë:",o:["Mirësjellja","Efikasiteti","Pastërtia","Paraqitja"],a:1,e:"Efficiency mat kohën e shërbimit."},
  {q:"Përdorimi natyral i emrit të mysafirit i përket:",o:["Kujdesit personal (Graciousness & Personalized Service)","Pastërtisë","Cilësisë së ushqimit","Efikasitetit"],a:0,e:"HD12 klasifikohet si Graciousness, Thoughtfulness & Sense of Personalized Service."},
  {q:"Coaster-i liri nën çdo pije i përket:",o:["Paraqitjes","Elementeve të luksit","Efikasitetit","Mirësjelljes"],a:1,e:"BL38 klasifikohet si Elements of Luxury."},
  {q:"Kamarieri nuk di të përgjigjet për alergjenët. Cila kategori dështon?",o:["Aftësia teknike dhe njohuria","Paraqitja","Pastërtia","Elementet e luksit"],a:0,e:"Technical Execution, Skill & Knowledge mbulon njohurinë profesionale."}
 ]

{
 id:"T3", t:"Psikologjia e mikpritjes", min:20,
 goal:"Stafi kupton pse mysafirët ndihen ashtu siç ndihen dhe përdor këtë njohuri për të krijuar kujtime, jo vetëm për të kryer detyra.",
 theory:[
  ["Shërbimi dhe mikpritja nuk janë e njëjta gjë","Danny Meyer, restoratori i Nju Jorkut, e përkufizon kështu: shërbimi është dorëzimi teknik i produktit; mikpritja është si ndihet mysafiri ndërsa i dorëzohet. Mund të shërbesh perfekt dhe mysafiri të ndihet i ftohtë. Forbes mat të dyja: standardet teknike dhe ndjenjën."],
  ["Momentet e së vërtetës","Jan Carlzon, drejtuesi i linjës ajrore SAS, e quajti “moment të së vërtetës” çdo kontakt ku mysafiri formon një mendim për kompaninë. Një darkë në restorantin tonë ka 15–25 momente të tilla: hyrja, përshëndetja, uji, porosia, çdo pjatë, fatura, largimi. Çdo moment është i vogël, por kujtimi ndërtohet nga të gjithë bashkë."],
  ["Rregulli pik-fund","Daniel Kahneman, fitues i çmimit Nobel, tregoi se njerëzit nuk e kujtojnë një përvojë si mesatare të të gjitha momenteve. E kujtojnë kryesisht nga momenti më intensiv (pik) dhe nga fundi. Kjo do të thotë dy gjëra për ne: krijo të paktën një moment “wow” në çdo vizitë, dhe mos e lësh kurrë fundin (fatura, largimi) të jetë i dobët."],
  ["Psikologjia e pritjes","David Maister: koha e pazënë duket më e gjatë; pritja e pasigurt duket më e gjatë; pritja e pashpjeguar duket më e gjatë; pritja e padrejtë (dikush tjetër u shërbye më parë) duket më e gjatë. Mysafiri nuk mat minutat, mat ndjenjën."],
  ["Nevoja për kontroll","Mysafiri në një vend të huaj ka humbur pak nga kontrolli i zakonshëm. Kur i ofrojmë zgjedhje, informacion dhe parashikim, ia kthejmë atë kontroll. Kjo është arsyeja pse “jo” e thatë dhe pritja pa informacion janë kaq të dëmshme."]
 ],
 concepts:[["Momenti i së vërtetës","Çdo kontakt ku mysafiri formon mendim."],["Pik-fund","Kujtimi ndërtohet nga momenti më i fortë dhe nga fundi."],["Mikpritja","Si ndihet mysafiri, përtej asaj që merr."]],
 quiz:[
  {q:"Sipas Danny Meyer, ndryshimi midis shërbimit dhe mikpritjes është:",o:["Nuk ka ndryshim","Shërbimi është teknik; mikpritja është si ndihet mysafiri","Mikpritja është vetëm për recepsionin","Shërbimi është më i rëndësishëm"],a:1,e:"Shërbimi është monolog teknik; mikpritja është dialog emocional."},
  {q:"Sipas rregullit pik-fund, cilat momente peshojnë më shumë në kujtesë?",o:["Mesi i darkës","Momenti më intensiv dhe fundi","Vetëm hyrja","Të gjitha njësoj"],a:1,e:"Kahneman: kujtimi formohet kryesisht nga piku dhe fundi."},
  {q:"Cila pritje ndihet më e gjatë?",o:["10 minuta me një pije në lounge dhe kohë të thënë","10 minuta në këmbë, pa asnjë informacion","Të dyja njësoj","Ajo me pije"],a:1,e:"Maister: pritja e pazënë, e pasigurt dhe e pashpjeguar ndihet më e gjatë."},
  {q:"Pse dy alternativa pas një “jo” funksionojnë?",o:["Sepse shesin më shumë","Sepse i kthejnë mysafirit ndjesinë e kontrollit","Sepse janë rregull ligjor","Nuk funksionojnë"],a:1,e:"Zgjedhja ia kthen mysafirit kontrollin që refuzimi ia mori."}
 ]
},
{
 id:"T4", t:"Nivelet e shërbimit dhe parashikimi", min:15,
 goal:"Stafi di të dallojë shërbimin e pritshëm nga ai i papritur dhe ndërton çdo ditë momentet që e çojnë mysafirin nga “i kënaqur” në “i habitur”.",
 theory:[
  ["Modeli Albrecht: 4 nivele","1) Bazik: pa këtë nuk ka shërbim (ushqim i sigurt, tavolinë e pastër). 2) I pritshëm: ajo që mysafiri e merr si të mirëqenë (përshëndetje, menu, faturë e saktë). 3) I dëshiruar: ajo që do ta donte, por nuk e kërkon (emri i tij, rekomandim i mirë). 4) I papritur: ajo që nuk e imagjinonte (kamarieri kujton verën që piu vitin e kaluar)."],
  ["Modeli Kano","Noriaki Kano tregoi se disa elemente vetëm shmangin pakënaqësinë (mungesa e tyre zemëron, prania nuk impresionon), të tjerat rrisin kënaqësinë në mënyrë proporcionale, dhe disa krijojnë kënaqësi të madhe sepse nuk priten. Me kalimin e kohës, “e papritura” bëhet “e pritshme”. Prandaj ekipi duhet të shpikë vazhdimisht momente të reja."],
  ["Si lexohet tavolina","Parashikimi nuk është magji, është vëzhgim i sistematizuar. Shikoji tavolinat çdo 30–60 sekonda me një skanim të shpejtë: gotat, pjatat, menutë, fytyrat, trupat (përkulur përpara = bisedë e thellë, mos ndërprit; kërkon me sy = ka nevojë)."],
  ["Kujtesa e mysafirit","Personalizimi kërkon sistem: profili në PMS/POS (alergjitë, vera e preferuar, tavolina, rastet e veçanta). Ajo që shkruhet sot është momenti “wow” i vizitës së ardhshme."]
 ],
 concepts:[["Shërbim i papritur","Ajo që mysafiri nuk e imagjinonte, por e çmon shumë."],["Skanimi i sallës","Kontroll vizual i tavolinave çdo 30–60 sekonda."],["Profili i mysafirit","Preferencat e ruajtura për vizitat e ardhshme."]],
 quiz:[
  {q:"Kamarieri kujton që mysafiri e pi espresson me ujë të ngrohtë anash, nga vizita e kaluar. Cili nivel është?",o:["Bazik","I pritshëm","I papritur","Asnjë"],a:2,e:"Mysafiri nuk e pret që ta kujtojmë: ky është niveli i papritur."},
  {q:"Fatura e saktë është:",o:["Shërbim i papritur","Shërbim i pritshëm","Element luksi","Opsional"],a:1,e:"Mysafiri e merr si të mirëqenë; gabimi zemëron, saktësia nuk impresionon."},
  {q:"Sa shpesh skanohet salla?",o:["Kur thërret mysafiri","Çdo 30–60 sekonda","Çdo 10 minuta","Në fund të çdo pjate"],a:1,e:"Skanimi i shpeshtë është baza e shërbimit parashikues (HD9)."},
  {q:"Sipas Kano, çfarë ndodh me “të papriturat” me kalimin e kohës?",o:["Mbeten të papritura","Bëhen të pritshme","Zhduken","Bëhen bazike menjëherë"],a:1,e:"Prandaj ekipi duhet të krijojë vazhdimisht momente të reja."}
 ]
},
{
 id:"T5", t:"Komunikimi në hotelerinë e luksit", min:15,
 goal:"Stafi zotëron rregullat e komunikimit verbal dhe joverbal që përdorin hotelet 5 yje dhe i zbaton natyrshëm në shqip dhe anglisht.",
 theory:[
  ["Rregulli 10/5","Shumë hotele luksoze përdorin këtë rregull: në 10 hapa (rreth 3 metra) bëj kontakt me sy dhe buzëqesh; në 5 hapa (rreth 1.5 metra) përshëndet me zë. Asnjë mysafir nuk kalon pranë stafit pa u njohur."],
  ["Regjistri formal","Në shqip përdorim gjithmonë “Ju” me shkronjë të madhe në shkrim dhe vetën e dytë shumës në të folur, edhe me mysafirë të rinj. Në anglisht: “Sir”, “Madam”, ose “Mr./Ms. + mbiemri”. Kurrë “guys”, “mate”, “dear”."],
  ["Gjuha e trupit","Qëndro në një kënd të lehtë ndaj tavolinës, jo drejt sipër saj. Në tavolinat e ulëta të lounge-it, përkulu lehtë që sytë të jenë më afër nivelit të mysafirit. Duart të dukshme, të qeta. Mos kryqëzo krahët."],
  ["Dëgjimi aktiv","Dëgjo deri në fund, mos parashiko përgjigjen. Përsërit pikat kritike (“Biftek medium-rare, pa salcë”). Bëj pyetje sqaruese kur ka dyshim. Mysafiri që ndihet i dëgjuar fal më lehtë një gabim."],
  ["Fjalët që shmangen","“Problem” (edhe në “s’ka problem”), “nuk e di”, “nuk mundem”, “është politikë e hotelit”, “nuk është tavolina ime”, “prisni”. Zëvendësimet: “Me kënaqësi”, “Më lejoni ta kontrolloj”, “Ajo që mund të bëj është…”, “Ju lutem më jepni një moment”."]
 ],
 concepts:[["Rregulli 10/5","10 hapa: sy dhe buzëqeshje. 5 hapa: përshëndetje me zë."],["Dëgjimi aktiv","Dëgjo deri në fund, përsërit pikat kritike."],["Regjistri","Niveli formal i gjuhës që përdoret."]],
 quiz:[
  {q:"Sipas rregullit 10/5, çfarë bën në 5 hapa nga mysafiri?",o:["Asgjë","Përshëndet me zë","Vetëm buzëqesh","E pyet për dhomën"],a:1,e:"10 hapa: kontakt me sy dhe buzëqeshje. 5 hapa: përshëndetje verbale."},
  {q:"Cila frazë zëvendëson “Nuk e di”?",o:["“Pyesni dikë tjetër.”","“Më lejoni ta kontrolloj menjëherë.”","“Nuk është puna ime.”","“Ndoshta.”"],a:1,e:"Gjithmonë ofro veprim, kurrë mos e mbyll me “nuk e di”."},
  {q:"Mysafiri porosit “biftek medium-rare, pa salcë”. Çfarë bën?",o:["E shkruan pa folur","E përsërit shkurt për konfirmim","E pyet tre herë","Nuk e shkruan"],a:1,e:"Dëgjimi aktiv: përsërit pikat kritike."},
  {q:"Si i drejtohesh një mysafiri anglishtfolës?",o:["“Hey guys”","“Sir / Madam” ose “Mr. Smith”","“Dear”","“Mate”"],a:1,e:"Regjistri formal është pjesë e standardit HD4 dhe HD5."}
 ]
},
{
 id:"T6", t:"Kultura e shërbimit në Flower", min:10,
 goal:"Stafi kupton si lidhet puna e tij me rezultatin e hotelit dhe si funksionon cikli ynë i përmirësimit: standard, trajnim, matje, feedback.",
 theory:[
  ["Zinxhiri shërbim–fitim","Studimi i Harvardit “Service-Profit Chain” (Heskett dhe kolegët) tregoi një zinxhir: stafi i trajnuar dhe i motivuar jep shërbim më të mirë; shërbimi më i mirë krijon mysafirë besnikë; besnikëria krijon të ardhura dhe rritje. Trajnimi nuk është kosto, është fillimi i zinxhirit."],
  ["Cikli ynë: Standard → Trajnim → Matje → Feedback","Ky është cikli i përmirësimit të vazhdueshëm (Plan-Do-Check-Act). Standardi është në këtë platformë. Trajnimi bëhet me mësimet dhe ushtrimet e line-up-it. Matja bëhet me auditin në sallë dhe me provimin. Feedback-u jepet nga shefi brenda 24 orësh. Pastaj cikli rifillon."],
  ["Përgjegjësia e përbashkët","Forbes nuk e vlerëson “kamarierin e tavolinës 7”, por restorantin. Nëse tavolina e kolegut pret, është tavolina jonë. Nëse kolegu harron ujin, e mbush ti. Ekipi fiton ose humbet bashkë."],
  ["Gabimi është informacion","Kur auditi tregon një “Jo”, nuk është ndëshkim, është informacion se ku duhet stërvitje. Kultura e ekipeve 5 yje është kultura e korrigjimit të shpejtë dhe pa turp, jo e fshehjes."]
 ],
 concepts:[["Service-Profit Chain","Staf i trajnuar → shërbim → besnikëri → fitim."],["PDCA","Planifiko, bëj, kontrollo, vepro: cikli i përmirësimit."],["Përgjegjësi e përbashkët","Çdo tavolinë është tavolina jonë."]],
 quiz:[
  {q:"Sipas “Service-Profit Chain”, ku fillon zinxhiri?",o:["Te çmimi","Te stafi i trajnuar dhe i motivuar","Te reklama","Te dekori"],a:1,e:"Zinxhiri fillon nga stafi dhe përfundon te besnikëria dhe fitimi."},
  {q:"Tavolina e kolegut pret ujë dhe ti je pranë. Çfarë bën?",o:["E lë, s’është e imja","E mbush menjëherë","I them kolegut pas 5 minutash","Asgjë"],a:1,e:"Forbes vlerëson restorantin, jo personin. Çdo tavolinë është tavolina jonë."},
  {q:"Çfarë është një “Jo” në audit?",o:["Ndëshkim","Informacion se ku duhet stërvitje","Arsye pushimi","Nuk ka rëndësi"],a:1,e:"Kultura e korrigjimit të shpejtë është baza e ekipeve 5 yje."},
  {q:"Brenda sa kohësh jep shefi feedback pas auditit?",o:["Një muaj","24 orë","Asnjëherë","Në fund të vitit"],a:1,e:"Feedback-u i shpejtë e mban ciklin të gjallë."}
 ]
}

  ["Degustimi","9 servirje për 6.500 lekë për mysafir: domate zemër kau, tartar wagyu, brusketë me palcë, carpaccio viçi, asparagus me foie gras, patëllxhan, pasta Sunshine, qengj i gatuar ngadalë dhe revani me mastikë. Ofroje kur mysafiri do “të provojë pak nga gjithçka”."]

 theory:[
  ["Alergjenët e fshehur në menutë tona","Kimchi (midhjet, tartari i viçit, arancini, brinjët e qengjit) zakonisht ka salcë peshku dhe ndonjëherë karkaleca. Salca e sojës ka gluten. Kadaifi (bakllava, çokollata Dubai) është brumë gruri. Pesto mund të ketë arra ose arra pishe. Taramosalata ka vezë peshku dhe bukë. Majoneza ka vezë. Crumble-t (wasabi, domate, trufe) zakonisht kanë miell. Këto janë pyetjet ku kamarieri i papërgatitur gabon."],
  ["Krustace kundër molusqe","Janë dy alergjenë të ndryshëm në listën e BE-së. Krustace: karkaleca, langustinë, karavidhe. Molusqe: midhje, goca, oktapod, sepje, kallamar. Oktapodi i zi ka të dyja. Te Flower pothuajse çdo pjatë ka njërën ose tjetrën: mysafiri me alergji të frutave të detit ka nevojë për listë të saktë, jo për “shumica janë peshk”."],
  ["Fjalia që mbron","Lista në këtë platformë është nxjerrë nga përbërësit e shkruar në menu, jo nga recetat. Prandaj rregulli: “Më lejoni ta konfirmoj me kuzhinën.” Asnjëherë “nuk besoj se ka”. Pas konfirmimit, shkruaj alergjinë te porosia dhe njofto shefin e pasit."],
  ["Pa gluten, pa qumësht, vegjetarian","Pa gluten në Flower: pjatat e gatuara thjesht me peshk (oktapod, murgu, shojzë) kanë më pak rrezik, por kontrollo salcat. Pa qumësht: shumë pjata kanë gjalpë, Philadelphia, stracciatella ose mascarpone. Vegjetarian në Garden: ka 6 deri 8 opsione, por kontrollo lëngjet e mishit dhe sallamet."]

["Pesto","","Salcë e papjekur me barishte të grira (borzilok ose majdanoz), vaj ulliri, djathë dhe arra. Kujdes: mund të ketë arra dhe djathë.","pesto"],
["Philadelphia","","Markë krem djathi amerikan, i butë dhe pak i thartë.","philadelphia"],
["Piper Timur","","Piper nepalez i familjes së piperit Sichuan, me aromë grejpfruti dhe një ndjesi të lehtë mpirjeje në gojë.","timur"],
["Polentë","","Qull nga mielli i misrit, i butë dhe kremoz, ose i pjekur derisa të bëhet krokant.","polent"],
["Praline","pra-LIN","Masë nga fruta të thata (këtu fistik) të karamelizuara dhe të bluara, kremoze dhe e ëmbël.","praline"],
["Pure","","Përbërës i zier dhe i bluar derisa bëhet krem i butë.","pure"],
["Qitro","","Agrum i madh me lëkurë të trashë dhe aromatike (citron, ose bergamot sipas kuzhinës). Përdoret kryesisht lëkura.","qitro"],
["Qepë perla","","Qepë shumë të vogla, të ëmbla, që gatuhen të plota.","qepë perla"],
["Reduksion","","Lëng i zier gjatë derisa avullohet dhe përqendrohet shija.","reduksion"],
["Retsina","ret-SI-na","Verë e bardhë greke me rrëshirë pishe, me aromë pishe dhe të freskët.","retsina"],
["Revani","","Ëmbëlsirë me bollgur e njomur me shurup, tradicionale në Shqipëri, Greqi dhe Turqi.","revani"],
["Rigatoni","ri-ga-TO-ni","Pasta në formë tubash të mëdhenj me vija, që e mbajnë mirë salcën.","rigatoni"],
["Rikota","","Djathë i bardhë i butë italian nga hirra, i lehtë dhe pak i ëmbël.","rikot"],
["Risoto","","Pjatë italiane me oriz që gatuhet duke shtuar lëng pak nga pak, derisa bëhet kremoz.","risot"],
["Semifreddo","se-mi-FRE-do","\"Gjysmë i ngrirë\": ëmbëlsirë e ngrirë me krem të rrahur, më e butë se akullorja.","semifreddo"],
["Sepje","","Molusk si kallamari, por me trup më të gjerë dhe mish më të trashë dhe të ëmbël.","sepje"],
["Sferë","","Kokërr e bërë në kuzhinë me një membranë shumë të hollë që mban brenda lëngun dhe e çliron në kafshatë (gastronomi molekulare).","sferë"],
["Sherry","SHE-ri","Verë e fortifikuar nga Jerez, Spanjë. Uthulla sherry është e butë, me aromë arre dhe druri.","sherry"],
["Shkumë","","Salcë e ajrosur, shumë e lehtë, si flluska.","shkumë"],
["Shojzë","","Peshk i sheshtë (sole) me mish të bardhë, të butë dhe delikat; një nga peshqit më të vlerësuar në kuzhinën franceze.","shojz"],
["Short rib","short rib","Brinjë e shkurtër viçi: prerje me shumë yndyrë dhe ind lidhës, që gatuhet ngadalë për orë derisa bëhet shumë e butë.","short rib"],
["Soje","","Salcë soje: salcë e kripur aziatike nga soja e fermentuar. Zakonisht ka edhe grurë (gluten).","soje"],
["Stracciatella","stra-ça-TE-la","Djathë italian nga Puglia: fije mocarele të përziera me krem. Shumë i butë dhe kremoz; është zemra e burratës.","stracciatella"],
["Sufle","","Ëmbëlsirë franceze e ajrosur me vezë, që fryhet në furrë dhe shërbehet menjëherë sepse bie pas pak minutash.","sufle"],
["T-Bone","ti-boun","Biftek me kockë në formë T: nga njëra anë fileto, nga tjetra sirloin.","t-bone"],
["Taramosalata","ta-ra-mo-sa-LA-ta","Krem grek me vezë peshku të kripura (zakonisht merluci ose bakaliari), bukë ose patate, limon dhe vaj ulliri. Rozë ose bezhë, i kripur dhe kremoz.","taramosalata"],
["Tarta de queso","TAR-ta de KE-so","Cheesecake baske nga San Sebastián, e pjekur në temperaturë shumë të lartë: sipër e djegur dhe karamel, brenda kremoze.","tarta de queso"],
["Tartar","","Mish ose peshk i gjallë, i prerë shumë imët me thikë dhe i stinuar. Mysafirët shtatzënë ose me imunitet të ulët duhet ta dinë që është i gjallë.","tartar"],
["Tiramisu","ti-ra-mi-SU","Ëmbëlsirë italiane me biskota të njomura në kafe dhe krem mascarpone. Emri do të thotë \"më ngri lart\".","tiramisu"],
["Tomahawk","TO-ma-hok","Ribeye me kockën e gjatë të brinjës, që i ngjan sëpatës. Prerje spektakël për ndarje.","tomahawk"],
["Tonka","","Farë aromatike nga Amerika e Jugut, me aromë vanilje, bajameje dhe karameli.","tonka"],
["Trahana","","Produkt tradicional ballkanik nga drithëra dhe kos ose qumësht i fermentuar, i tharë dhe i bërë supë. Ka gluten dhe qumësht.","trahan"],
["Treshe kërpudhash","","Tre lloje kërpudhash të gatuara bashkë.","treshe"],
["Trufë","","Kërpudhë nëntokësore shumë aromatike dhe e shtrenjtë. Trufa e zezë ka aromë dheu, pylli dhe lajthie.","trufë|trufe"],
["Turshi","","Perime të ruajtura në uthull ose shëllirë; të tharta dhe krokante.","turshi"],
["Umami","u-MA-mi","Shija e pestë, pas ëmbëlsisë, kripës, thartirës dhe hidhësisë: shija e lëngut të mishit, djathit të plakur, soje dhe kërpudhave.","umami"],
["Uthull luleshtrydheje","","Uthull e butë dhe frutore e bërë me luleshtrydhe.","uthull luleshtrydh"],
["Wagyu","UA-gju","Racë lope japoneze me marbling ekstrem; mishi është jashtëzakonisht i butë. \"Wagyu\" do të thotë \"lopë japoneze\".","wagyu"],
["Wasabi","ua-SA-bi","Rrikë japoneze e gjelbër, shumë djegëse në hundë, por djegia kalon shpejt.","wasabi"],
["Xhelatinë","","Lëng i ngurtësuar me xhelatinë, i butë dhe i dridhshëm.","xhelatin"],
["Zemër kau","","Varietet domatesh të mëdha (cuore di bue), me formë zemre, shumë mishore dhe të ëmbla.","zemër kau"]
