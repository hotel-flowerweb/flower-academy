["Tri burimet e ndjenjës",`Çfarë e ngre ndjenjën e mysafirit? Kërkimet mbi mikpritjen tregojnë tri burime kryesore:

Njohja personale. “Më kujtuan.” Mysafiri që dëgjon emrin e tij, që gjen ujin me gaz në tavolinë pa e kërkuar sepse e kërkoi dje, që kamarieri e pyet si shkoi ekskursioni për të cilin foli në mëngjes, ndihet i njohur si person, jo si numër dhome.

Surpriza. “Diçka që nuk e prisja.” Freskimi falas në pishinë pas 90 minutash. Ëmbëlsira me qiri kur mysafiri përmendi rastësisht ditëlindjen. Peceta e ngrohtë me aromë limoni pas peshkut. Surpriza punon sepse mysafiri nuk e pret.

Ngrohtësia e vërtetë. “Ndjeva se u interesonte.” Mysafiri e ndien diferencën midis një buzëqeshjeje profesionale dhe një buzëqeshjeje të sinqertë. Kamarieri që pyet “Si ishte dita juaj?” dhe dëgjon vërtet përgjigjen krijon një lidhje.

Vëre diçka të rëndësishme: asnjëra nga këto nuk kushton shumë para. Njohja kërkon vëmendje dhe sistem. Surpriza kërkon kreativitet. Ngrohtësia kërkon njerëz që kujdesen. Hotelet më të mira në botë nuk dallohen sepse shpenzojnë më shumë, por sepse kujdesen më shumë.`],
["Nga 60 në 80",`Si e ngremë mysafirin nga “i kënaqur” në “shumë i impresionuar”? Disa shembuj, për secilin burim:

Nga njohja:
• Përdor emrin natyrshëm, jo në çdo fjali, por në momentet kryesore.
• Mbaj mend preferencat: tavolina, uji, pija.
• Regjistro atë që mëson, që kolegët ta dinë, siç shpjegohet në leksionin E2.

Nga surpriza:
• Vëre detajet që mysafiri përmend: një festë, një udhëtim, një pjatë që i pëlqen.
• Vepro para se ai ta presë.

Nga ngrohtësia:
• Interesohu vërtet. Pyet dhe dëgjo.
• Mos u nxito. Edhe në mbrëmjet më të ngarkuara, çdo mysafir duhet të ndiejë që ka vëmendjen tënde.
• Ji vetvetja. Ngrohtësia e vërtetë nuk recitohet.

» Skenë nga Flower: Një mysafire përmend në mëngjes që ka ardhur për ditëlindjen e saj të 50-të. Kamarieri e regjistron. Në darkë në Flower, kamarieri i darkës e përshëndet: “Mirëmbrëma, zonja Rossi, dhe urime për ditëlindjen.” Me ëmbëlsirën, vjen një bakllava me një qiri dhe një kartë e shkruar me dorë. Mysafirja qan. Inspektori, po të ishte ajo, do të shënonte “i mahnitur”.`],
["Përmbledhje",`Forbes mat edhe si ndihet mysafiri, në dhjetë nivele nga 0 te 100 për qind. “I kënaqur” është vetëm 60 për qind: asgjë nuk shkoi keq, por asgjë nuk ishte e veçantë. Besnikëria fillon nga “shumë i impresionuar”, 80 për qind. Tri burimet që e ngrenë ndjenjën: njohja personale, surpriza dhe ngrohtësia e vërtetë. Asnjëra nuk kushton shumë para; të gjitha kërkojnë vëmendje, kreativitet dhe kujdes.`]
];
LEC.E2=[
["Hyrje: momenti që kujtohet",`Mysafiri nuk kujton të gjithë darkën. Kujton disa momente: të mirat dhe të këqijat. Psikologu Daniel Kahneman ka përshkruar “rregullin e majës dhe të fundit”: njerëzit e gjykojnë një përvojë kryesisht nga momenti më intensiv dhe nga momenti i fundit, jo nga mesatarja e të gjitha momenteve.

Kjo do të thotë që një moment i vetëm “wow” mund ta bëjë një darkë të zakonshme të paharrueshme. Dhe një fund i keq mund ta prishë një darkë të shkëlqyer. Ky leksion shpjegon si krijohen momentet “wow”, si personalizohet përvoja dhe si regjistrohet ajo që mësojmë për mysafirin.`],
["Formula e momentit wow",`Momenti “wow” nuk është rastësi. Ka një formulë me katër hapa:

Dëgjo. Mysafiri përmend një detaj: një festë, një udhëtim, një preferencë, një problem, një dëshirë. Shpesh e përmend rastësisht, pa pritur asgjë. “Kemi ardhur për përvjetorin.” “Nesër shkojmë në Berat.” “Më pëlqen shumë çaji jeshil.”

Lidh. Mendo çfarë mund të bësh me këtë detaj. Përvjetori: një ëmbëlsirë me qiri. Udhëtimi: një hartë ose një sugjerim për drekën. Çaji jeshil: një çaj jeshil i mirë në mëngjes, pa u kërkuar.

Vepro. Bëje para se mysafiri ta presë. Momenti “wow” është surprizë; nëse mysafiri e kërkon, nuk është më surprizë.

Regjistro. Shkruaje në sistem, që kolegët ta dinë dhe që të mos humbasë. Nëse mysafiri kthehet pas një viti, dikush duhet ta dijë që i pëlqen çaji jeshil.

Shembull: mysafiri përmend se ka ardhur për përvjetor. Kamarieri njofton supervizorin dhe kuzhinën. Me ëmbëlsirën, vjen një pjatë me “Gëzuar përvjetorin” dhe një kartë e shkruar me dorë nga shefi. Kamarieri e regjistron në profilin e mysafirit.`],
["Ide për momente wow",`Disa ide, që secili ekip mund t'i përshtasë:
• Ëmbëlsirë me mesazh ose me qiri për ditëlindje, përvjetor, propozim martese.
• Libri ose gazeta e preferuar në tavolinën e mëngjesit.
• Vera që mysafiri provoi dhe i pëlqeu herën e kaluar, e sugjeruar përsëri: “Herën e kaluar ju pëlqeu Riesling-u i Hugel-it. Ta sjell përsëri?”
• Receta e pjatës që i pëlqeu, e printuar si kujtim, nëse shefi pranon.
• Peceta e ngrohtë me aromë limoni pas peshkut ose pas frutave të detit.
• Shoqërim deri te ashensori ose te makina me ombrellë kur bie shi.
• Një pjatë e vogël për fëmijën, me emrin e tij të shkruar.
• Kafeja e preferuar gati kur mysafiri ulet për mëngjes.

Asnjë nga këto nuk kushton shumë. Të gjitha kërkojnë vëmendje.

Kujdes nga momentet që nuk përshtaten: jo çdo mysafir dëshiron vëmendje. Një mysafir pune që darkon vetëm mund të mos dëshirojë që të gjithë salla ta dijë që ka ditëlindje. Lexo mysafirin.`],
["Personalizimi i shkallëzuar",`Personalizimi rritet me çdo vizitë:

Vizita e parë: emri dhe preferencat që mysafiri tha sot. “Faleminderit, zoti Smith. Ujë me gaz, siç thatë.”

Vizita e dytë: preferencat nga vizita e kaluar. “Mirë se u kthyet, zoti Smith. Si zakonisht, ujë me gaz dhe tavolina pranë dritares?”

Vizitat e mëvonshme: njohja e plotë. Emrat e fëmijëve, rastet e veçanta, pjatat e preferuara, alergjitë, pija e preferuar.

Ky personalizim kërkon që informacioni të jetë në sistem, jo në kujtesën e një personi. Nëse vetëm një kamarier e di që zoti Smith pi ujë me gaz, kur ai kamarier nuk është në turn, zoti Smith trajtohet si i huaj. Dhe kur ai kamarier largohet nga hoteli, njohuria humbet.`],
["Si regjistrohet",`Informacioni për mysafirin regjistrohet në profilin e tij në sistem, PMS ose POS, sipas asaj që përdor hoteli:
• Preferencat: tavolina, uji, pija, temperatura e kafes.
• Alergjitë dhe intolerancat.
• Rastet: ditëlindja, përvjetori.
• Emrat e familjarëve, sidomos të fëmijëve.
• Pijet dhe pjatat e preferuara.
• Çdo problem që ka pasur dhe si u zgjidh.

Rregullat:
• Regjistro fakte, jo gjykime. “Preferon tavolinën pranë dritares”, jo “mysafir i vështirë”.
• Respekto privatësinë. Mos regjistro informacion të ndjeshëm që mysafiri nuk do të donte ta dinte stafi.
• Regjistro menjëherë, sa ta mbash mend.`],
["Ndarja në line-up",`Informacioni në sistem nuk vlen nëse askush nuk e lexon. Prandaj ndahet në line-up, takimi i shkurtër para çdo turni, siç shpjegohet në leksionin Q1.

Çdo ditë, dy minuta: “Kush vjen sot? Çfarë dimë për ta?”
• “Tavolina 5, zoti dhe zonja Rossi, kthehen për herë të tretë. Ajo ka alergji ndaj arrave. Ata festojnë përvjetorin sonte.”
• “Tavolina 12, zoti Müller, mysafir pune, darkon vetëm. Preferon qetësi dhe Riesling.”

Kështu, çdo kamarier në turn e di, dhe çdo kamarier mund të krijojë momentin.

» Skenë nga Garden: Në line-up, supervizori thotë: “Tavolina 8, familja Hoxha. Herën e kaluar, djali i tyre, Ardi, tetë vjeç, tha që do të bëhet kuzhinier.” Kur familja ulet, shefi del për një minutë te tavolina dhe i tregon Ardit si piqet mishi në Josper. Ardi e dëgjon me sytë që i shkëlqejnë, dhe prindërit nuk e harrojnë kurrë.`],
["Përmbledhje",`Mysafiri kujton majën dhe fundin, jo mesataren. Formula e momentit wow: dëgjo, lidh, vepro, regjistro. Momentet wow nuk kushtojnë shumë, kërkojnë vëmendje; dhe duhet t'i përshtaten mysafirit. Personalizimi rritet me çdo vizitë, dhe kërkon që informacioni të jetë në sistem, jo në kujtesën e një personi. Regjistro fakte, respekto privatësinë. Dhe ndaje në line-up: “Kush vjen sot? Çfarë dimë për ta?”`]
];
LEC.E3=[
["Hyrje: standardi që ndryshoi",`Në vitin 2019, Forbes bëri një ndryshim të vogël në dukje, por të rëndësishëm në thelb. Para këtij viti, kishte tri standarde të ndara që pyesnin nëse restoranti, bari dhe room service kishin “diçka veçanërisht mbresëlënëse”. Në 2019, këto tri standarde u zëvendësuan me një të vetëm, në kategorinë e Zonave Publike: “A u dallua përvoja e ushqimit dhe pijeve në ndonjë mënyrë?”

Ky leksion shpjegon çfarë do të thotë ky standard, pse ka rëndësi dhe si i përgjigjemi qëllimisht, në vend që ta lëmë në rastësi.`],
["Çfarë kërkon standardi",`Standardi i ri pyet nëse përvoja e ushqimit dhe pijeve u dallua në ndonjë mënyrë. Ai nxjerr në pah tri lloje dallimi:
• Shërbimin e jashtëzakonshëm: një kamarier që e bëri mbrëmjen të paharrueshme, një moment rikuperimi i shkëlqyer, një personalizim i veçantë.
• Ambientet mbresëlënëse: një pamje, një dizajn, një atmosferë që mysafiri nuk e gjen kudo.
• Detajet e veçanta: një ritual, një produkt, një prezantim unik.

Dhe ka një veçori të rëndësishme: standardi mund të vlerësojë edhe vende ose përvoja që nuk testohen veçmas, si një rooftop bar, çaji i pasdites, një stacion i veçantë në bufe, ose një përvojë në pishinë.

Ky standard nuk është listë kontrolli. Inspektori nuk kërkon një gjë të caktuar. Ai kërkon diçka që e bën këtë hotel të ndryshëm nga të tjerët.`],
["Pse ka rëndësi",`Në nivelin e hoteleve me pesë yje, shumica e hoteleve i plotësojnë standardet bazë. Të gjithë përshëndesin brenda 1 minute, të gjithë shërbejnë verën nga e djathta, të gjithë kanë peceta liri. Kjo i bën të ngjashëm.

Ajo që e dallon një hotel nga tjetri, dhe që e bën mysafirin ta zgjedhë përsëri, është ajo që nuk e gjen askund tjetër. Kjo mund të jetë një pjatë, një kokteil, një ritual, një person, një pamje. Por duhet të jetë diçka.

Hoteli që nuk ka asgjë dalluese është hotel i mirë, por i harrueshëm. Mysafiri largohet i kënaqur, por nuk ka asgjë për të treguar.`],
["Nënshkrimet e Flower dhe Garden",`Si përgjigjemi? Duke krijuar qëllimisht tre deri në pesë “nënshkrime”: elemente që i sheh çdo mysafir dhe që janë vetëm tonat. Këto nuk lihen në rastësi; janë pjesë e standardit tonë.

Nënshkrimet që kemi tashmë:
• Old Father, kokteili firmato i Flower, me historinë e tij për trashëgiminë dhe shpirtin vizionar të një babai.
• Bakllavaja signature e Genti Malavecit te Flower.
• Josper-i te Garden, furra me thëngjill që i jep mishit karakterin e tij, dhe prerjet premium si tomahawk dhe wagyu.
• Menuja “Brutal” e Garden, me Tiramisu Brutal.
• Menutë e degustimit: 10 servirje deti te Flower, 9 servirje te Garden.

Ide për nënshkrime që mund të shtohen, për t'u vendosur nga menaxhmenti:
• Një ritual mirëseardhjeje, për shembull një gotë e vogël me një produkt vendas, me një tregim të shkurtër.
• Prezantimi i prerjeve të mishit para pjekjes te Garden.
• Një histori e treguar për çdo pjatë signature.

Çdo nënshkrim duhet të tregohet mirë. Kamarieri që e shërben Old Father pa e treguar historinë humbet gjysmën e vlerës.`],
["Si e ndërtojmë dallimin",`Dallimi ndërtohet në tri nivele:

Produkti. Pjatat, pijet, prezantimet. Këto janë përgjegjësi e kuzhinës dhe e barit, por kamarieri duhet t'i njohë dhe t'i tregojë.

Shërbimi. Momentet “wow”, personalizimi, rikuperimi, siç shpjegohet në leksionet E1, E2 dhe në Modulin 13. Këto janë përgjegjësi e çdo anëtari të stafit.

Tregimi. Historitë që i japin kuptim produktit dhe shërbimit. Mysafiri nuk kujton që hëngri bakllava; kujton që hëngri “bakllavanë e Genti Malavecit” dhe që kamarieri i tregoi pse është e veçantë.

» Skenë nga Garden: Një mysafir porosit tomahawk-un. Kamarieri sjell prerjen e papjekur në një dërrasë druri: “Ky është tomahawk-u juaj, 1,3 kg. Do ta pjekim në Josper, me qymyr druri, mbi 300 gradë. Medium-rare?” Mysafiri bën një foto. Pas darkës, e poston me shkrimin: “Mishi më i mirë që kam ngrënë, dhe shërbimi më i mirë.” Kjo është pikërisht ajo që kërkon standardi.`],
["Përmbledhje",`Në 2019, Forbes zëvendësoi tri standardet “diçka veçanërisht mbresëlënëse” me një të vetëm: “A u dallua përvoja e ushqimit dhe pijeve në ndonjë mënyrë?” Ai vlerëson shërbimin e jashtëzakonshëm, ambientet mbresëlënëse dhe detajet e veçanta, edhe në vende që nuk testohen veçmas. Flower dhe Garden duhet të kenë qëllimisht tre deri në pesë nënshkrime: Old Father, bakllavaja e Genti Malavecit, Josper-i, menutë e degustimit. Dhe dallimi ndërtohet në tri nivele: produkti, shërbimi dhe tregimi.`]
];
LEC.H1=[
["Hyrje: siguria ushqimore nuk është vetëm për kuzhinën",`Kur mendojmë për sigurinë ushqimore, mendojmë për kuzhinën: temperaturat e frigoriferëve, dërrasat e prerjes, larjen e perimeve. Por ushqimi nuk mbaron në kuzhinë. Ai kalon nëpër duart e kamarierit, qëndron në bufe, udhëton me ashensor në room service, dhe akulli në bar është gjithashtu ushqim.

Çdo person që prek ushqimin ose enët ku hahet ushqimi është pjesë e zinxhirit të sigurisë. Një gabim në sallë, një gotë e kapur nga buza, një pjatë e lënë në bufe për tri orë, akulli i marrë me gotë, mund ta bëjë mysafirin të sëmurë, pavarësisht nga sa mirë ka punuar kuzhina. Ky leksion shpjegon parimet bazë të sigurisë ushqimore për stafin e sallës, të barit dhe të room service-it.`],
["Çfarë është HACCP",`HACCP do të thotë “Hazard Analysis and Critical Control Points”, në shqip: Analiza e Rreziqeve dhe Pikat Kritike të Kontrollit. Është sistemi ndërkombëtar që identifikon rreziqet në ushqim dhe pikat ku ato mund të kontrollohen.

Historia e tij është interesante: u zhvillua në vitet 1960 nga kompania Pillsbury në bashkëpunim me NASA-n, për të siguruar që ushqimi i astronautëve të ishte plotësisht i sigurt. Sot është standardi ndërkombëtar, i kërkuar nga legjislacioni i Bashkimit Europian dhe i përafruar në legjislacionin shqiptar.

Parimi është i thjeshtë: në vend që të kontrollojmë ushqimin në fund, kur ndoshta është tepër vonë, identifikojmë çdo pikë ku mund të ndodhë një problem dhe e kontrollojmë atje. Salla, bari dhe room service janë pika kontrolli, njësoj si kuzhina.`],
["Zona e rrezikut",`Bakteret që shkaktojnë helmime ushqimore shumohen shpejt në temperatura midis 5 dhe 63 gradë. Kjo quhet “zona e rrezikut”.

Në kushte ideale, disa baktere mund ta dyfishojnë numrin e tyre çdo 20 minuta. Kjo do të thotë që pas disa orësh, një numër i vogël bakteresh mund të bëhet miliona.

Rregullat:
• Ushqimi i ftohtë mbahet nën 5 gradë.
• Ushqimi i nxehtë mbahet mbi 63 gradë.
• Ushqimi që ka qëndruar në zonën e rrezikut mbi 2 orë hidhet.

Kjo ka pasoja direkte për sallën:
• Pjata që pret në pass për shumë minuta para se të shërbehet ftohet dhe hyn në zonën e rrezikut.
• Bufeja e mëngjesit kontrollohet me termometër çdo orë, siç shpjegohet në leksionin B2.
• Room service duhet ta dorëzojë ushqimin të nxehtë, me kapakë dhe karroca me ngrohës.
• Salcat dhe kremrat e lëna në tavolinë për gjithë mbrëmjen nuk ripërdoren.`],
["Llojet e kontaminimit",`Kontaminimi ka katër kategori, dhe secila ka rregullat e veta:

Biologjik: bakteret, viruset, parazitët. Këta janë shkaku më i shpeshtë i helmimeve ushqimore. Mbrojtja: temperaturat, larja e duarve, pastrimi.

Kimik: detergjentet, produktet e pastrimit, pesticidet. Mbrojtja: produktet e pastrimit ruhen larg ushqimit, enët shpëlahen mirë, asnjë spërkatje pastrimi pranë tavolinave ku po hahet.

Fizik: xhami, flokët, plastika, metali, copat e lëvozhgës. Mbrojtja: flokët e lidhur, asnjë xham pranë akullit, kontrolli i pjatave para shërbimit.

Alergjenët: siç shpjegohet në Modulin 8, alergjenët janë rrezik i veçantë sepse edhe një sasi e vogël mund të shkaktojë një reaksion të rëndë. Mbrojtja: informacioni i saktë, ndarja e enëve, komunikimi me kuzhinën.`],
["Larja e duarve",`Larja e duarve është mbrojtja më e thjeshtë dhe më efektive kundër kontaminimit biologjik. Dhe është ajo që harrohet më shpesh.

Si: me ujë të ngrohtë dhe sapun, të paktën 20 sekonda, duke fërkuar pëllëmbët, pjesën e pasme të duarve, midis gishtave dhe nën thonj. 20 sekonda janë sa të këndosh “Gëzuar ditëlindjen” dy herë.

Kur:
• Para fillimit të turnit.
• Pas tualetit.
• Pas pastrimit.
• Pas prekjes së parave ose të telefonit.
• Pas heqjes së pjatave të përdorura, para se të prekësh pjatat e pastra ose ushqimin.
• Pas prekjes së fytyrës, flokëve ose hundës.
• Pas ngrënies, pirjes ose duhanit.

Telefoni është një nga objektet më të ndotura që mbajmë. Stafi që përdor telefonin gjatë turnit dhe pastaj prek pjatat transmeton gjithçka që ka telefoni.`],
["Kapja e saktë dhe akulli",`Mënyra si prekim gotat, takëmet dhe pjatat ka rëndësi:
• Gotat kapen nga këmba ose nga baza, kurrë nga buza.
• Takëmet kapen nga doreza, kurrë nga pjesa ku vë gojën mysafiri.
• Pjatat kapen nga buza e jashtme, me gishtin e madh jashtë pjesës ku është ushqimi.
• Filxhanët kapen nga doreza ose nga pjata poshtë.

Rregulli i përgjithshëm: asnjë kontakt me pjesët ku vë gojën mysafiri.

Akulli është ushqim, dhe trajtohet si i tillë:
• Merret me lugë metalike ose plastike, kurrë me gotë dhe kurrë me dorë.
• Kova e akullit mbahet e pastër dhe e mbuluar kur nuk përdoret.
• Asnjë gotë ose shishe nuk vendoset brenda kovës së akullit për ta ftohur.
• Kur thyhet xham pranë akullit, i gjithë akulli hidhet, siç shpjegohet në leksionin R1.`],
["Sëmundja dhe regjistri",`Stafi që ka të vjella, diarre ose ethe nuk punon me ushqim dhe njofton supervizorin. Kjo nuk është zgjedhje; është rregull. Disa viruse, si norovirusi, transmetohen shumë lehtë, dhe një person i sëmurë mund të infektojë dhjetëra mysafirë dhe kolegë.

Shumë punonjës kanë frikë të mos humbasin pagën ose të mos duken si të paangazhuar. Por një kamarier i sëmurë që vjen në punë është rrezik për të gjithë. Supervizori duhet ta inkurajojë stafin ta njoftojë, pa ndëshkim.

Plagët në duar mbulohen me fashë të dukshme, zakonisht blu, dhe me dorezë.

Regjistri i temperaturave: bufeja, frigoriferët e barit dhe frigoriferët e sallës kontrollohen dhe shënohen çdo orë gjatë shërbimit. Regjistri tregon që kontrolli është bërë, dhe zbulon problemet para se të bëhen të rrezikshme.

» Skenë nga Flower: Gjatë mëngjesit, stafi i bufesë kontrollon temperaturën e jogurteve dhe sheh 9 gradë. Frigoriferi i bufesë nuk po ftoh mirë. Ai heq menjëherë jogurtet, i zëvendëson me të freskëta nga kuzhina, i vendos mbi akull dhe njofton supervizorin dhe mirëmbajtjen. Shënon gjithçka në regjistër. Asnjë mysafir nuk e vë re, dhe asnjë mysafir nuk sëmuret.`],
["Përmbledhje",`HACCP identifikon rreziqet dhe i kontrollon në çdo pikë, dhe salla, bari dhe room service janë pika kontrolli. Zona e rrezikut është midis 5 dhe 63 gradë: i ftohti nën 5, i nxehti mbi 63, dhe mbi 2 orë në zonën e rrezikut do të thotë hidhet. Katër lloje kontaminimi: biologjik, kimik, fizik dhe alergjenët. Larja e duarve 20 sekonda, në çdo moment kritik. Gotat nga këmba, takëmet nga doreza, pjatat nga buza. Akulli është ushqim. Stafi i sëmurë nuk punon me ushqim. Dhe temperaturat regjistrohen çdo orë.`]
];
LEC.H2=[
["Hyrje: trajnimi në momentin e krizës",`Në një emergjencë, njerëzit nuk “ngrihen” në nivelin e situatës. Bien në nivelin e trajnimit të tyre. Ky është një parim i njohur në fushat ku emergjencat janë të zakonshme: aviacion, mjekësi, zjarrfikës. Kur ndodh diçka e papritur, truri nuk ka kohë të mendojë; vepron sipas asaj që ka praktikuar.

Në restorant dhe në bar, emergjencat janë të rralla, por ndodhin: një mysafir që mbytet, një reaksion alergjik, një djegie, një zjarr në kuzhinë, një rrëshqitje. Ekipi që i ka praktikuar reagon brenda sekondave. Ekipi që nuk i ka praktikuar ngrin, dhe sekondat kanë rëndësi. Ky leksion shpjegon emergjencat më të zakonshme dhe si veprojmë.

Ky leksion nuk zëvendëson trajnimin e ndihmës së parë me një instruktor të certifikuar. Është përmbledhje e asaj që çdo anëtar i stafit duhet ta dijë.`],
["Mbytja",`Mbytja ndodh kur ushqimi bllokon rrugët e frymëmarrjes. Në restorant, ndodh më shpesh me mish, peshk me kocka ose ushqime që hahen shpejt duke folur ose duke qeshur.

Shenjat:
• Mysafiri kap fytin me duar, një shenjë universale.
• Nuk mund të flasë, të kollitet ose të marrë frymë.
• Fytyra skuqet, pastaj bëhet blu.

Nëse mysafiri mund të kollitet fort, inkurajoje të vazhdojë të kollitet. Kolla është mënyra më efektive e trupit për ta nxjerrë.

Nëse nuk mund të kollitet, të flasë ose të marrë frymë:
• Thirr ndihmë menjëherë: supervizorin dhe ambulancën, 127.
• Qëndro pas tij, anoje pak përpara dhe jep deri në 5 goditje të forta midis shpatullave me pjesën e poshtme të pëllëmbës.
• Nëse nuk funksionon, jep deri në 5 shtytje abdominale, manovra Heimlich: qëndro pas tij, vendos grushtin mbi kërthizë, mbaje me dorën tjetër dhe tërhiqe fort brenda dhe lart.
• Vazhdo të alternosh 5 goditje dhe 5 shtytje derisa të dalë ushqimi ose të vijë ndihma.
• Nëse mysafiri humbet ndjenjat, fillo ringjalljen kardiopulmonare nëse je i trajnuar, dhe prit ambulancën.

Të paktën dy persona në çdo turn duhet të kenë trajnim të ndihmës së parë.`],
["Reaksioni alergjik",`Siç shpjegohet në leksionin A3, reaksioni alergjik i rëndë është emergjencë mjekësore:
• Thirr supervizorin dhe ambulancën, 127, menjëherë.
• Mos e lëviz mysafirin pa nevojë; lëre në pozicionin që i jep më shumë rehati.
• Pyet nëse ka autoinjektor adrenaline, EpiPen. Mysafiri ose shoqëruesi e përdor në kofshë.
• Qëndro me mysafirin derisa të vijë ndihma.
• Ruaj pjatën dhe porosinë.

Shenjat që kërkojnë veprim të menjëhershëm: ënjtje e fytyrës, buzëve ose gjuhës, vështirësi në frymëmarrje, marramendje ose humbje ndjenjash.`],
["Djegiet",`Djegiet janë rrezik i përditshëm për stafin e sallës dhe të barit: pjata të nxehta, kafe dhe çaj, makina e espresos, avulli, qirinjtë, flambimet.

Ndihma e parë për djegie të lehta:
• Ftohe zonën me ujë të ftohtë që rrjedh, jo me akull, për 10 deri në 20 minuta. Akulli mund ta dëmtojë më shumë lëkurën.
• Hiq unazat, orët ose rrobat pranë zonës, nëse nuk janë ngjitur me lëkurën.
• Mbuloje me mbulesë të pastër, që nuk ngjitet, si film ushqimor ose garzë.
• Mos vendos kremra, gjalpë, vaj ose pastë dhëmbësh. Këto e mbajnë nxehtësinë dhe rrisin rrezikun e infeksionit.
• Mos i shpo flluskat.

Për djegie të rënda, të mëdha, në fytyrë, në duar ose në zonat gjenitale, ose kur lëkura duket e bardhë ose e zezë: ambulanca, 127.

Parandalimi: pjatat e nxehta paralajmërohen, “Kujdes, pjata është shumë e nxehtë”, dhe mbahen me pecetë. Kafeja dhe çaji derdhen larg mysafirit. Fëmijët mbahen larg pjatave të nxehta dhe qirinjve.`],
["Zjarri",`Zjarri në restorant mund të fillojë në kuzhinë, nga qirinjtë në sallë, ose nga problemet elektrike.

Rregullat:
• Njih vendndodhjen e fikësve të zjarrit më të afërt dhe të kuvertave të zjarrit.
• Për zjarrin në tigan me vaj, përdor kuvertën e zjarrit ose kapakun, për ta mbytur. Kurrë ujë mbi vaj që digjet: uji avullohet menjëherë dhe e hedh vajin e djegur në ajër, duke krijuar një shpërthim zjarri.
• Për zjarrin e vogël, fikësi i duhur, i drejtuar në bazë të flakëve.
• Për zjarrin që nuk kontrollohet: alarmi, evakuimi, zjarrfikësit, 128.

Evakuimi:
• Njih daljet e emergjencës dhe pikën e grumbullimit.
• Drejto mysafirët me qetësi, por me vendosmëri: “Ju lutem, ndiqni mua nga kjo dalje.”
• Mos përdor ashensorin.
• Ndihmo mysafirët me vështirësi lëvizjeje, fëmijët dhe të moshuarit.
• Numëro stafin në pikën e grumbullimit.

Qirinjtë në sallë: kurrë pranë perdeve, menuve ose dekorimeve që digjen. Fiken në fund të shërbimit.`],
["Rrëshqitjet dhe numrat",`Rrëshqitjet janë aksidentet më të shpeshta në restorante, për stafin dhe për mysafirët.

Parandalimi:
• Lëngu në dysheme pastrohet menjëherë dhe shënohet me tabelë paralajmëruese deri sa të thahet.
• Këpucë jo-rrëshqitëse për të gjithë stafin.
• Korridoret dhe daljet e lira nga pengesat.
• Kujdes i veçantë pranë pishinës, siç shpjegohet në leksionin N2, dhe në hyrje kur bie shi.

Nëse një mysafir rrëzohet:
• Mos e ngri menjëherë. Pyet si ndihet dhe nëse ka dhimbje.
• Nëse ka dhimbje të forta, sidomos në kokë, qafë ose shpinë, mos e lëviz dhe thirr ambulancën.
• Njofto supervizorin dhe regjistro incidentin.

Numrat e emergjencës në Shqipëri:
• Ndihma e shpejtë: 127.
• Zjarrfikësit: 128.
• Policia: 129.

Këta numra duhet të jenë të shkruar te çdo stacion, bashkë me numrin e brendshëm të sigurisë dhe të menaxherit të turnit.

» Skenë nga Garden: Një mysafir kap fytin me duar dhe nuk mund të flasë. Kamarieri më i afërt e sheh, thërret “Supervizor! 127!” dhe vepron menjëherë: pesë goditje midis shpatullave, pastaj pesë shtytje abdominale. Në shtytjen e tretë, copa e mishit del. Mysafiri merr frymë. Supervizori i ul mysafirët e tavolinës përreth, ambulanca e kontrollon mysafirin, dhe hoteli e ndjek gjendjen e tij të nesërmen. Kamarieri kishte bërë trajnimin e ndihmës së parë dy muaj më parë.`],
["Përmbledhje",`Në emergjencë, njerëzit bien në nivelin e trajnimit. Mbytja: nëse kollitet, inkurajoje; nëse jo, 5 goditje midis shpatullave dhe 5 shtytje abdominale, me 127. Reaksioni alergjik: 127, mos e lëviz, EpiPen. Djegiet: ujë i ftohtë 10 deri në 20 minuta, pa akull dhe pa krem. Zjarri: kurrë ujë mbi vaj, njih fikësit, daljet dhe pikën e grumbullimit. Rrëshqitjet: pastro dhe shëno menjëherë. Numrat: 127, 128, 129, te çdo stacion. Dhe të paktën dy persona për turn me trajnim të ndihmës së parë.`]
];
LEC.Q1=[
["Hyrje: dhjetë minuta që ndryshojnë turnin",`Line-up-i, ose briefing-u para turnit, është takimi i shkurtër i ekipit para se të hapen dyert. Në shumë restorante, është një formalitet: supervizori lexon rezervimet, thotë specialitetet dhe ekipi shpërndahet. Në restorantet më të mira në botë, është mjeti më i fuqishëm i kulturës dhe i trajnimit.

Ky leksion është për supervizorët dhe për ata që do të bëhen supervizorë. Shpjegon pse line-up-i ka kaq rëndësi, strukturën dhjetëminutëshe, si përgatitet dhe si drejtohet që të informojë, të stërvitë dhe të motivojë njëkohësisht.`],
["Pse line-up-i",`Ritz-Carlton e ka bërë line-up-in e përditshëm një nga mjetet kryesore të kulturës së tij. Çdo turn, në çdo departament, në çdo hotel të markës në botë, fillon me një takim të shkurtër. Dhe shpesh, të gjithë hotelet e markës diskutojnë të njëjtën temë të ditës, nga një shtyllë e vlerave të tyre.

Pse funksionon? Për disa arsye:
• Përsëritja: dhjetë minuta në ditë, çdo ditë të vitit, janë rreth 60 orë trajnim për çdo person, pa e nxjerrë nga puna asnjë ditë.
• Koha: trajnimi bëhet pikërisht para se të zbatohet. Ajo që mësohet në line-up përdoret pas dhjetë minutash.
• Informacioni: çdo anëtar i ekipit e di të njëjtën gjë: kush vjen, çfarë mungon, çfarë është e veçantë sot.
• Kultura: line-up-i tregon çdo ditë çfarë ka rëndësi. Nëse çdo ditë flitet për mysafirët dhe për standardet, ekipi e kupton që këto janë prioritetet.
• Ekipi: është momenti i vetëm kur të gjithë janë bashkë, para presionit të shërbimit.`],
["Struktura dhjetëminutëshe",`Line-up-i i mirë është i shkurtër dhe i strukturuar. Dhjetë minuta, me katër pjesë:

2 minuta: kontrolli i paraqitjes. Uniforma, flokët, thonjtë, emblema, këpucët, siç shpjegohet në leksionin L9 të Modulit 2. Shpejt dhe pa turpërim. Supervizori e bën me sy, dhe korrigjimet bëhen privatisht.

2 minuta: informacioni i ditës. Rezervimet, mysafirët VIP dhe ata që kthehen me preferencat e tyre, alergjitë e njohura, specialitetet me çmimet, produktet që mungojnë dhe alternativat.

4 minuta: ushtrimi i ditës. Një ushtrim praktik nga platforma: një skenë LEARN, një provë e verërave me gotë, një pyetje për alergjenët, një frazë për sugjerimin e ëmbëlsirës.

2 minuta: një histori suksesi dhe qëllimi i turnit. Një moment i mirë nga dje, me emrin e personit. Dhe një qëllim i matshëm për sot.

Line-up-i fillon në kohë dhe mbaron në kohë. Një line-up që zgjat 25 minuta humbet vëmendjen e ekipit pas minutës së dhjetë.`],
["Përgatitja",`Line-up-i i mirë nuk improvizohet. Supervizori e përgatit një ditë përpara, ose të paktën para turnit:
• Lista e rezervimeve me shënime: VIP, mysafirë që kthehen, raste të veçanta, alergji, kërkesa.
• Informacioni nga kuzhina: specialitetet, çmimet, produktet që mungojnë, alternativat.
• Ushtrimi i ditës, nga plani javor i trajnimit në platformë, në seksionin e praktikës.
• Një sukses për t'u përmendur: nga auditet, nga komentet e mysafirëve, nga vëzhgimi i vet.
• Qëllimi i turnit.

Supervizori që vjen në line-up pa e ditur kush vjen sot humbet autoritetin para ekipit.`],
["Informacioni që duhet ndarë",`Pjesa e informacionit duhet të jetë e saktë dhe e përqendruar:
• Mysafirët VIP dhe ata që kthehen: emri, tavolina, preferencat. “Tavolina 5, zoti dhe zonja Rossi, herën e tretë. Ajo ka alergji ndaj arrave. Festojnë përvjetorin.”
• Alergjitë e njohura në rezervime.
• Specialitetet me çmimet: “Sonte kemi tomahawk prej 1,4 kg; me 12.000 lekë për kilogram, del rreth 16.800 lekë.”
• Produktet që mungojnë dhe alternativat: “Shojza ka mbaruar. Sugjeroni levrekun me kore barishtesh.”
• Ngjarjet në hotel: një dasmë, një konferencë, një grup i madh.
• Çdo ndryshim në procedura.

Rregull: vetëm informacioni që ekipi ka nevojë për këtë turn. Detajet administrative, si oraret e javës tjetër, mund të ndahen me shkrim.`],
["Ushtrimi: praktikë, jo leksion",`Pjesa e ushtrimit është më e rëndësishmja, dhe ajo që harrohet më shpesh. Ushtrimi duhet të jetë praktik, jo leksion. Ekipi nuk mëson duke dëgjuar supervizorin të flasë për katër minuta; mëson duke bërë.

Shembuj ushtrimesh katërminutëshe:
• Skena LEARN: supervizori luan mysafirin e pakënaqur, një kamarier zbaton pesë hapat.
• Gjuha shqisore: çdo kamarier përshkruan një pjatë në 15 sekonda.
• Alergjenët: supervizori përmend një pjatë, ekipi thotë alergjenët.
• Çiftimi: supervizori përmend një pjatë, një kamarier sugjeron verën me gotë dhe një me shishe.
• Termat në anglisht: përshkrimi i një kokteili në anglisht.
• Pyetje nga platforma: pesë pyetje të shpejta nga provimet.

Siç shpjegohet në leksionin Q3, ushtrimet zgjidhen nga dy dobësitë kryesore që tregon paneli i auditeve të javës.`],
["Mbyllja: sukses dhe qëllim",`Line-up-i mbyllet me dy gjëra:

Një histori suksesi nga dje. Me emrin e personit, me detajet: “Dje Ana trajtoi ankesën e zotit Müller për bifstekun me LEARN të përsosur. Zoti Müller na shkroi sot në mëngjes që ishte mbrëmja më e mirë e udhëtimit të tij.” Kjo bën dy gjëra: lavdëron Anën publikisht, dhe i tregon të gjithë ekipit si duket sjellja e duhur.

Një qëllim i matshëm për turnin: “Sot asnjë gotë uji bosh mbi 60 sekonda.” “Sot, çdo tavolinë dëgjon sugjerimin e ëmbëlsirës.” “Sot, çdo kamarier përdor emrin e mysafirit të paktën dy herë.” Qëllimi duhet të jetë një, i qartë dhe i matshëm. Në fund të turnit, supervizori kontrollon nëse u arrit.

» Skenë nga Flower: Ora 18:20. Supervizori mbledh ekipin. Dy minuta për paraqitjen: një kravatë e shtrembër, e rregulluar me një shikim. Dy minuta informacion: “Dy VIP sonte, një alergji ndaj gluteni në tavolinën 9, shojza ka mbaruar.” Katër minuta ushtrim: çdo kamarier sugjeron verën me gotë për gocat dhe për oktapodin. Dy minuta mbyllje: “Dje Arbeni e bëri një çift të qajë nga gëzimi me qirinë e përvjetorit. Qëllimi i sotëm: çdo tavolinë dëgjon për Old Father pas darkës.” Ora 18:30, dyert hapen.`],
["Përmbledhje",`Line-up-i është mjeti më i fuqishëm i kulturës dhe i trajnimit: rreth 60 orë në vit pa e nxjerrë stafin nga puna. Dhjetë minuta: 2 për paraqitjen, 2 për informacionin, 4 për ushtrimin, 2 për suksesin dhe qëllimin. Përgatitet një ditë përpara. Informacioni është i saktë dhe vetëm për këtë turn. Ushtrimi është praktikë, jo leksion, dhe zgjidhet nga dobësitë e auditeve. Dhe mbyllet me një histori suksesi me emër dhe me një qëllim të matshëm.`]
];
LEC.Q2=[
["Hyrje: feedback që ndryshon sjelljen",`Supervizori sheh çdo ditë gjëra që duhen përmirësuar: një gotë uji bosh, një pjatë e shërbyer nga ana e gabuar, një mysafir i papërshëndetur, një sugjerim i harruar. Dhe sheh gjëra që janë bërë shkëlqyeshëm. Pyetja është çfarë bën me to.

Shumë supervizorë ose nuk thonë asgjë, për të shmangur konfliktin, ose thonë gjithçka me nervozizëm në mes të shërbimit. Asnjëra nuk ndryshon sjelljen. Ky leksion shpjegon si jepet feedback që ndryshon vërtet sjelljen: me fakte, me respekt, në kohën e duhur dhe me ndjekje.`],
["Modeli SBI",`Center for Creative Leadership, një institut ndërkombëtar për zhvillimin e drejtuesve, ka zhvilluar një model të thjeshtë për feedback-un, që quhet SBI: Situation, Behavior, Impact. Në shqip: Situata, Sjellja, Ndikimi.

Situata: kur dhe ku. Specifike, jo e përgjithshme. “Mbrëmë, në tavolinën 7, gjatë pjatave kryesore.”

Sjellja: çfarë bëri personi, saktësisht, si fakt i vëzhguar. Jo gjykim, jo interpretim. “Gota e ujit mbeti bosh për rreth 4 minuta.”

Ndikimi: çfarë pasoje pati. “Mysafiri thirri me dorë, dhe ne humbëm standardin HD22, rimbushja brenda 1 minute.”

Pastaj, pyet: “Çfarë ndodhi? Si mund ta parandalojmë?”

Krahaso me feedback-un e zakonshëm: “Duhet të jesh më i vëmendshëm.” Kjo nuk i tregon personit çfarë të ndryshojë, dhe tingëllon si sulm personal. SBI i tregon saktësisht çfarë ndodhi, pa e sulmuar si person.`],
["Pse pyetja ka rëndësi",`Pas SBI-së, pyetja “Çfarë ndodhi?” është po aq e rëndësishme sa vetë feedback-u.

Arsyet:
• Ndoshta kishte një arsye që supervizori nuk e dinte. Kamarieri ishte duke ndihmuar një kolege me një mysafir të vështirë. Stacioni i ujit ishte bosh. Kuzhina e kishte thirrur.
• Pyetja e bën personin të mendojë vetë për zgjidhjen. Zgjidhja që gjen vetë personi zbatohet më shpesh se ajo që i imponohet.
• Pyetja tregon respekt. Feedback-u bëhet bisedë, jo akuzë.

Pas pyetjes, bini dakord për një veprim konkret: “Nga sot, kur kalon pranë tavolinave, kontrollo gotat e ujit edhe nëse po shkon diku tjetër.” Një veprim, i qartë, i matshëm.`],
["Lavdërimi",`Lavdërimi është po aq i rëndësishëm sa korrigjimi, dhe shpesh më i fuqishëm. Sjellja që lavdërohet përsëritet.

Rregulli i artë: lavdëro publikisht, korrigjo privatisht.

Lavdërimi specifik ka shumë më shumë fuqi se lavdërimi i përgjithshëm:
• I përgjithshëm: “Bravo, punë e mirë sonte.”
• Specifik: “Mënyra si e trajtove ankesën e zotit Smith ishte LEARN e përsosur. E dëgjove deri në fund, i ofrove dy zgjidhje dhe u ktheve pas tri minutash. Ai u largua i lumtur.”

Lavdërimi specifik bën tri gjëra: i tregon personit saktësisht çfarë bëri mirë, që ta përsërisë; tregon që supervizori e vëzhgoi vërtet; dhe i tregon pjesës tjetër të ekipit, kur bëhet publikisht, si duket sjellja e duhur.

Shumë supervizorë korrigjojnë shumë më shpesh se lavdërojnë. Një ekip që dëgjon vetëm korrigjime ndihet i pavlerësuar dhe humbet motivimin. Kërko qëllimisht sjelljet e mira për t'i lavdëruar.`],
["Koha: brenda 24 orësh",`Feedback-u pas një jave është histori. Personi nuk e mban mend mirë situatën, detajet janë harruar, dhe ndjesia është “pse po ma thua tani?”. Feedback-u brenda 24 orësh është mësim: situata është e freskët, dhe personi mund ta lidhë menjëherë me sjelljen.

Por “menjëherë” nuk do të thotë “në mes të shërbimit”. Korrigjimi në mes të shërbimit, para mysafirëve ose para kolegëve, e turpëron personin dhe e shpërqendron. Përjashtimi i vetëm: kur një gabim po ndodh dhe duhet ndalur për të mbrojtur mysafirin, si një alergji ose një rrezik sigurie. Atëherë ndërhyhet menjëherë, me qetësi, dhe feedback-u i plotë jepet më vonë.

Momentet më të mira për feedback-un korrigjues:
• Pas turnit, kur shërbimi ka mbaruar.
• Para turnit tjetër, para line-up-it.
• Gjithmonë privatisht, në një vend ku nuk dëgjojnë të tjerët.`],
["Procesi në katër hapa",`Feedback-u efektiv ndjek një proces:

Vëzhgo me auditin. Përdor auditin e platformës si bazë faktesh. Audit-i i jep supervizorit një listë objektive pikash për të vëzhguar dhe shmang feedback-un e bazuar në përshtypje.

Bisedë pesëminutëshe. Privatisht, pas turnit ose para tjetrit. SBI, pastaj pyetje, pastaj një veprim konkret. Pesë minuta mjaftojnë; feedback-u nuk është mbledhje.

Ndiq. Në turnin tjetër, vëzhgo të njëjtën pikë. Nëse personi është përmirësuar, lavdëroje: “Sot i vura re gotat e ujit gjatë gjithë mbrëmjes. Shkëlqyeshëm.” Kjo e mbyll ciklin.

Regjistro. Shënimi i supervizorit në audit e sheh stafi në profilin e tij në platformë. Kjo i lejon personit të shohë progresin e vet, dhe supervizorit të shohë nëse një problem përsëritet.

» Skenë nga Flower: Pas turnit, supervizori i thotë Elirës: “Ke pesë minuta? Mbrëmë në tavolinën 4, kur mysafirja pyeti për alergjenët e oktapodit, i the që nuk ka asnjë, dhe pastaj shkove të kontrolloje. Oktapodi ka soje dhe gluten. Nëse nuk do të kishe kontrolluar, mund të kishte qenë rrezik. Çfarë ndodhi?” Elira: “Isha e sigurt, por gabova.” “Si mund ta parandalojmë?” “Do ta kontrolloj gjithmonë në fishë para se t'i përgjigjem.” Në turnin tjetër, supervizori e sheh Elirën duke kontrolluar fishën dhe i thotë: “E pashë. Shumë mirë.”`],
["Përmbledhje",`Modeli SBI: Situata specifike, Sjellja si fakt i vëzhguar, Ndikimi. Pastaj pyet “Çfarë ndodhi? Si mund ta parandalojmë?” dhe bini dakord për një veprim konkret. Lavdëro publikisht dhe specifikisht, korrigjo privatisht. Brenda 24 orësh, por jo në mes të shërbimit, përveç kur duhet mbrojtur mysafiri. Procesi: vëzhgo me auditin, bisedë pesëminutëshe, ndiq në turnin tjetër, regjistro. Dhe kërko qëllimisht sjelljet e mira për t'i lavdëruar.`]
];
LEC.Q3=[
["Hyrje: ajo që matet përmirësohet",`Pa matje, ekipi beson se po plotëson standardin. Supervizori mendon se gotat e ujit rimbushen në kohë, se çdo tavolinë dëgjon sugjerimin e ëmbëlsirës, se emri i mysafirit përdoret. Por pa matje, këto janë përshtypje, jo fakte.

Inspektori i Forbes do të masë gjithsesi. Më mirë ta masim ne çdo javë, se ai një herë në vit. Ky leksion shpjegon si bëhet auditi i brendshëm, si lexohet paneli i platformës, si planifikohet trajnimi nga rezultatet dhe si krahasohen auditet e brendshme me një vizitë të jashtme.`],
["Ritmi i auditeve",`Çdo anëtar i stafit auditohet të paktën dy herë në muaj, në turne dhe në zona të ndryshme:
• Në mëngjes dhe në darkë.
• Në Flower dhe në Garden.
• Në mbrëmjet e qeta dhe në ato të ngarkuara.
• Në sallë, në bar, në room service, sipas rolit.

Pse në kushte të ndryshme? Sepse një kamarier mund të jetë i shkëlqyer në një mbrëmje të qetë dhe të humbasë standardet në një mbrëmje të ngarkuar. Inspektori nuk zgjedh mbrëmjen më të lehtë.

Auditet shpërndahen midis supervizorëve, që asnjë person të mos auditohet gjithmonë nga i njëjti supervizor. Kjo e bën vlerësimin më objektiv.`],
["Si auditohet",`Auditi bëhet si inspektori:
• Nga një pozicion që nuk bie në sy. Supervizori nuk qëndron pas kamarierit me listë në dorë; vëzhgon nga stacioni, nga bari ose nga një tavolinë.
• Pa ndërhyrë. Nëse sheh një gabim, nuk e korrigjon gjatë auditit, përveç kur ka rrezik për mysafirin. Feedback-u jepet më vonë, siç shpjegohet në leksionin Q2.
• Shëno vetëm atë që pe. Jo atë që supozon, jo atë që të tregoi dikush tjetër.
• N/A për momentet që nuk ndodhën. Nëse tavolina nuk porositi verë, standardet e verës shënohen N/A, jo “po” dhe jo “jo”.

Auditi është i ndershëm. Supervizori që shënon “po” për gjithçka, për të shmangur konfliktin, nuk ndihmon askënd. Ekipi nuk përmirësohet, dhe kur vjen inspektori, rezultati është befasi.`],
["Leximi i panelit",`Platforma ka një panel që përmbledh rezultatet e auditeve dhe të provimeve. Supervizori e lexon çdo javë, duke u fokusuar te dy seksione:
• Standardet më të dobëta: cilat standarde dështojnë më shpesh në auditet e ekipit. Për shembull, HD22, rimbushja e pijeve, ose HD12, përdorimi i emrit.
• Gabimet në provime: cilat pyetje gabohen më shpesh nga stafi. Për shembull, alergjenët e një pjate të caktuar, ose temperatura e një vere.

Dy dobësitë kryesore të javës bëhen ushtrimet e line-up-it për javën tjetër, siç shpjegohet në leksionin Q1. Kështu, trajnimi nuk është i rastësishëm: fokusohet saktësisht atje ku ekipi ka më shumë nevojë.

Paneli tregon edhe progresin individual. Supervizori mund të shohë cili anëtar i stafit ka nevojë për më shumë mbështetje, dhe cili është gati për më shumë përgjegjësi.`],
["Synimet",`Synimet e matshme i japin drejtim punës:
• Mesatarja e auditeve të ekipit 85 për qind ose më shumë, brenda 3 muajve.
• 100 për qind e stafit me Modulin 2 të certifikuar brenda 6 muajve.

Pse 85 për qind? Sepse Forbes kërkon rezultate të larta për yjet më të lartë, dhe 85 për qind në auditet e brendshme, që zakonisht janë më të buta se inspektimi i jashtëm, është një pikë fillimi e arsyeshme. Me kohën, synimi rritet.

Synimet ndahen me ekipin. Ekipi duhet ta dijë ku është dhe ku duhet të arrijë. Progresi festohet: kur mesatarja kalon 85 për qind, ekipi duhet ta dijë dhe ta festojë.`],
["Mystery guest",`Auditet e brendshme kanë një kufizim: stafi i njeh supervizorët, dhe sjellja ndryshon kur e di që vëzhgohet. Prandaj, një herë në tremujor, bëhet një vizitë e jashtme anonime, “mystery guest”, sipas standardeve të Forbes.

Mystery guest-i është një person i jashtëm, zakonisht nga një kompani e specializuar, që vjen si mysafir i zakonshëm, darkon, pi në bar, porosit room service, dhe vlerëson çdo standard. Stafi nuk e di kur vjen dhe kush është.

Rezultatet e mystery guest-it krahasohen me auditet e brendshme:
• Nëse janë të ngjashme, auditet e brendshme janë të ndershme dhe të sakta.
• Nëse mystery guest-i jep rezultate shumë më të ulëta, auditet e brendshme janë shumë të buta, ose stafi sillet ndryshe kur e di që vëzhgohet.

Mystery guest-i është gjithashtu provë për inspektimin e vërtetë të Forbes: tregon si do të dukemi kur të vijë inspektori.`],
["Cikli i përmirësimit të vazhdueshëm",`Auditi, paneli, line-up-i dhe feedback-u formojnë një cikël:
• Mat: auditet dhe provimet tregojnë ku jemi.
• Analizo: paneli tregon dobësitë kryesore.
• Trajno: line-up-i dhe feedback-u fokusohen te dobësitë.
• Mat përsëri: auditet e javës tjetër tregojnë nëse u përmirësuam.

Ky cikël nuk mbaron kurrë. Sapo një dobësi përmirësohet, tjetra del në pah. Kjo nuk është shenjë dështimi; është shenjë që ekipi po rritet.

» Skenë nga Garden: Paneli i javës tregon që standardi më i dobët është HD12, përdorimi i emrit të mysafirit, me 58 për qind. Supervizorja e bën temën e line-up-it të javës: çdo ditë, një ushtrim katërminutësh për mënyrën si merret dhe përdoret emri. Qëllimi i turnit: “Çdo tavolinë dëgjon emrin e saj të paktën dy herë.” Pas dy javësh, HD12 është 87 për qind. Supervizorja e lavdëron ekipin në line-up dhe zgjedh dobësinë tjetër.`],
["Përmbledhje",`Ajo që matet përmirësohet. Çdo anëtar i stafit auditohet dy herë në muaj, në turne dhe zona të ndryshme. Auditi bëhet si inspektori: pa rënë në sy, pa ndërhyrë, vetëm atë që pe, N/A për atë që nuk ndodhi. Paneli lexohet çdo javë, dhe dy dobësitë kryesore bëhen ushtrimet e line-up-it. Synimet: 85 për qind mesatare brenda 3 muajve, 100 për qind me Modulin 2 brenda 6 muajve. Mystery guest një herë në tremujor. Dhe cikli: mat, analizo, trajno, mat përsëri.`]
];

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PASS_LESSON=3, EXAM_MAX=20, EXAM_PASS=85, AUDIT_PASS=85;
const ROLES=["Kamarier/e","Banakier/e","Host/Hostess","Runner","Supervizor/e","Sommelier","Praktikant/e"];
LESSONS.forEach(l=>{if(WHY[l.id])l.why=WHY[l.id]});
const SRC={M0,M1,LESSONS,M3,M4,M5,M6,M7,M8,M9,M10,M11,M12,M13,M14,M15,MS,MM};
const MODS=CATALOG.map(m=>({...m,lessons:m.lessons?SRC[m.lessons]:null}));
const BUILT=MODS.filter(m=>m.lessons);
const SERVICE=MODS.find(m=>m.cert);
MODS.forEach(m=>{if(m.lessons)m.lessons.forEach(l=>{l.mod=m;if(FG[l.id])l.figs=FG[l.id];if(LEC[l.id])l.lec=LEC[l.id]})});
const ALL_LESSONS=BUILT.flatMap(m=>m.lessons);
const POOL={};BUILT.forEach(m=>POOL[m.id]=m.lessons.flatMap(l=>l.quiz.map((q,i)=>({...q,id:l.id+"-"+i,lid:l.id}))));
const AUDIT_ITEMS=AUDIT.flatMap(g=>g.items.map(([id,t,s])=>({id,t,s,g:g.g})));
const examN=m=>Math.min(EXAM_MAX,POOL[m.id].length);

const S={mode:"loading",isMgr:false,uid:null,db:null,meExists:false,
  me:{name:"",role:"",lessons:{},quizzes:{},exams:{},lastAudit:null},
  staff:[],audits:[],staffLoaded:false};
let lessonQuiz={}, exam=null, auditDraft=null, timer={sel:0,start:0,run:false,log:[]}, tick=null;

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function lsGet(){try{return JSON.parse(localStorage.getItem("flower-academy-me")||"null")}catch(e){return null}}
function lsSet(v){try{localStorage.setItem("flower-academy-me",JSON.stringify(v))}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return"—";const x=new Date(d);return isNaN(x)?d:x.toLocaleDateString("sq-AL",{day:"2-digit",month:"short"})}
function pctChip(p,th){if(p==null)return'<span class="chip">—</span>';const c=p>=th?"ok":p>=th-15?"warn":"bad";return`<span class="chip ${c} mono">${p}%</span>`}
function doneIn(me,m){return m.lessons.filter(l=>me.lessons&&me.lessons[l.id]).length}
function examOf(me,m){const e=me.exams&&me.exams[m.id];if(e)return e;if(m.cert&&me.exam)return me.exam;return null}
function totalDone(me){return ALL_LESSONS.filter(l=>me.lessons&&me.lessons[l.id]).length}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const lessonHref=l=>"#mesimi-"+l.id.toLowerCase();
const modHref=m=>"#modul-"+m.n.toLowerCase();

async function saveMe(patch){
  Object.assign(S.me,patch,{updatedAt:new Date().toISOString()});
  if(S.mode==="cloud"&&S.db&&S.uid){
    const ref=S.db.doc("staff/"+S.uid);
    try{ if(S.meExists) await ref.update({...patch,updatedAt:S.me.updatedAt}); else {await ref.set({...S.me}); S.meExists=true;} }
    catch(e){ toast("Nuk u ruajt në server. Provo përsëri."); console.warn(e); }
  } else lsSet(S.me);
}

/* ---------- routing ---------- */
function routes(){
  const r=[["home","Kryefaqja"],["akademia","Modulet"],["praktika","Praktika"],["menuja","Menuja"],["verat","Manuali i verës"],["bari","Manuali i barit"],["kohet","Karta e kohëve"],["planimetria","Planimetria"]];
  if(S.isMgr){r.push(["auditi","Auditi në sallë"],["paneli","Paneli i shefit"])}
  return r;
}
function current(){return (location.hash||"#home").slice(1)||"home"}
function renderTabs(){
  const cur=current(), base=/^(mesimi-|modul-|provimi-)/.test(cur)?"akademia":cur;
  $("#tabs").innerHTML=routes().map(([h,t])=>`<a href="#${h}" ${h===base?'aria-current="page"':""}>${t}</a>`).join("");
}
function renderWho(){
  let h="";
  if(S.mode==="loading")h='<span class="chip">Duke u lidhur…</span>';
  else{
    if(S.me.name)h+=`<span>${esc(S.me.name)}</span>`;
    if(S.isMgr)h+='<span class="chip acc">Shef</span>';
    if(S.mode==="local")h+='<span class="chip warn" title="Progresi ruhet vetëm në këtë pajisje">Lokal</span>';
  }
  $("#who").innerHTML=h;
}
function render(){
  renderTabs();renderWho();
  const cur=current(); const v=$("#view");
  if(S.mode!=="loading"&&(S.mode==="local"||S.loaded)&&!S.me.name&&cur!=="kohet"&&cur!=="menuja"&&cur!=="verat"&&cur!=="bari"&&cur!=="planimetria"){v.innerHTML=viewJoin();bindJoin();return}
  let m;
  if(cur.startsWith("mesimi-")){const l=ALL_LESSONS.find(x=>"mesimi-"+x.id.toLowerCase()===cur);if(l){v.innerHTML=viewLesson(l);bindLesson(l)}else v.innerHTML=viewHome()}
  else if(cur.startsWith("modul-")&&(m=MODS.find(x=>"modul-"+x.n.toLowerCase()===cur))){v.innerHTML=viewModule(m)}
  else if(cur.startsWith("provimi-")&&(m=BUILT.find(x=>"provimi-"+x.n.toLowerCase()===cur))){v.innerHTML=viewExam(m);bindExam(m)}
  else if(cur==="mesimet"||cur==="provimi"){location.replace(cur==="mesimet"?modHref(SERVICE):"#provimi-"+SERVICE.n);return}
  else if(cur==="akademia"){v.innerHTML=viewCatalog()}
  else if(cur==="praktika"){v.innerHTML=viewPractice();bindPractice()}
  else if(cur==="kohet"){v.innerHTML=viewTimes()}
  else if(cur==="menuja"){v.innerHTML=viewMenu();bindMenu()}
  else if(cur==="verat"){v.innerHTML=viewManual();bindManual()}
  else if(cur==="bari"){v.innerHTML=viewBar();bindBar()}
  else if(cur==="planimetria"){v.innerHTML=viewFloor();bindFloor()}
  else if(cur==="auditi"&&S.isMgr){v.innerHTML=viewAudit();bindAudit()}
  else if(cur==="paneli"&&S.isMgr){v.innerHTML=viewPanel()}
  else {v.innerHTML=viewHome()}
}
let lastRoute=null;
window.addEventListener("hashchange",()=>{if(current()!==lastRoute){lastRoute=current();window.scrollTo(0,0)}render()});

  <form id="joinf" class="card stack">

function bindJoin(){

function modStatus(me,m){
  if(!m.lessons)return'<span class="chip">Në ndërtim</span>';
  const d=doneIn(me,m),ex=examOf(me,m);
  if(ex&&ex.best>=EXAM_PASS)return'<span class="chip ok">Kaluar '+ex.best+'%</span>';
  if(d===m.lessons.length)return'<span class="chip acc">Gati për provim</span>';
  if(d)return`<span class="chip warn">${d}/${m.lessons.length} mësime</span>`;
  return'<span class="chip">Fillo</span>';
}
function catalogList(){
  const groups=[...new Set(MODS.map(m=>m.g))];
  return groups.map(g=>`<div class="stack"><p class="eyebrow">${g}</p><div class="grid2">${MODS.filter(m=>m.g===g).map(m=>{const on=!!m.lessons;const inner=`<span class="n">${m.n}</span><div><h3>${esc(m.t)}</h3><p class="muted" style="font-size:14px">${esc(m.s)}</p><div class="row" style="margin-top:6px;gap:8px">${on?`<span class="muted" style="font-size:13px">${m.lessons.length} mësime · ${m.lessons.reduce((a,l)=>a+l.min,0)} min</span>`:""}${modStatus(S.me,m)}</div></div>`;return on?`<a class="mod card" href="${modHref(m)}" style="text-decoration:none;color:inherit">${inner}</a>`:`<div class="mod off card" style="background:transparent">${inner}</div>`}).join("")}</div></div>`).join("");
}
function nextLesson(){for(const m of BUILT){const l=m.lessons.find(x=>!S.me.lessons[x.id]);if(l)return l}return null}

function viewHome(){
  const tot=ALL_LESSONS.length,d=totalDone(S.me),pct=Math.round(d/tot*100), ex=examOf(S.me,SERVICE), la=S.me.lastAudit;
  const next=nextLesson();
  return `<section class="hero">
    <div>
      <p class="eyebrow">Flower Hotel · Akademia e F&amp;B</p>
      <h1 style="margin-top:10px">Çdo sekondë e mysafirit ka rëndësi${S.me.name?`, ${esc(S.me.name.split(" ")[0])}`:""}.</h1>
      <p class="lead">Inspektori Forbes vjen anonim dhe vlerëson çdo standard me po ose jo. Akademia ka ${MODS.length} module dhe ${tot} mësime: teoria e mikpritjes, shërbimi, produkti, menutë tona, mysafiri dhe udhëheqja. Çdo mësim ka një leksion të plotë dhe të jep arsyen, hapat, frazat dhe kohët që praktikohen çdo ditë.</p>
      <div class="row" style="margin-top:20px">
        <a class="btn primary" href="${next?lessonHref(next):"#akademia"}">${next?(d?"Vazhdo: ":"Fillo: ")+esc(next.t):"Shiko modulet"}</a>
        <a class="btn" href="#kohet">Karta e kohëve</a>
      </div>
    </div>
    <div class="clock" aria-label="Kohët kryesore">
      <div><b>60 s</b><span>përshëndetja në hyrje dhe në tavolinë</span></div>
      <div><b>4 min</b><span>pija e parë në tavolinë</span></div>
      <div><b>3 min</b><span>pija e parë në banak</span></div>
      <div><b>60 s</b><span>rimbushja pas gotës bosh</span></div>
    </div>
  </section>
  <section class="grid3">
    <div class="card stack"><p class="eyebrow">Mësimet e përfunduara</p><p class="mono" style="font-size:28px;font-weight:700">${d}<span class="muted" style="font-size:18px">/${tot}</span></p><div class="progress"><i style="width:${pct}%"></i></div><p class="muted" style="font-size:13px">${BUILT.length} module aktive nga ${MODS.length}</p></div>
    <div class="card stack"><p class="eyebrow">Provimi i shërbimit</p><div class="row">${ex?pctChip(ex.best,EXAM_PASS):'<span class="chip">I pabërë</span>'}<span class="muted" style="font-size:13px">kalimi ${EXAM_PASS}%</span></div><p class="muted" style="font-size:13px">${ex?`${ex.attempts} tentativa · e fundit ${fmtDate(ex.lastAt)}`:"Moduli 2 · pas 9 mësimeve"}</p></div>
    <div class="card stack"><p class="eyebrow">Auditi në sallë</p><div class="row">${la?pctChip(la.score,AUDIT_PASS):'<span class="chip">Pa audit ende</span>'}</div><p class="muted" style="font-size:13px">${la?`${fmtDate(la.date)} · ${la.missed&&la.missed.length?la.missed.length+" pika për t’u përmirësuar":"të gjitha pikat e plotësuara"}`:"Shefi të vëzhgon gjatë turnit"}</p></div>
  </section>

function lecHTML(l){
  const words=l.lec.map(x=>x[0]+" "+x[1]).join(" ").split(/\s+/).length, rmin=Math.max(1,Math.round(words/190));
  const body=l.lec.map(([h,t],i)=>{
    const blocks=t.split(/\n\s*\n/).map(b=>{
      const lines=b.split("\n").map(x=>x.trim()).filter(Boolean);
      if(lines.every(x=>x.startsWith("• ")))return `<ul>${lines.map(x=>`<li>${esc(x.slice(2))}</li>`).join("")}</ul>`;
      if(lines[0].startsWith("» ")){const t0=lines.join(" ").slice(2);const m=t0.match(/^([^:]{3,40}):\s*(.*)$/);return `<div class="lec-scene">${m?`<b>${esc(m[1])}</b>${esc(m[2])}`:esc(t0)}</div>`}
      const li=lines.findIndex(x=>x.startsWith("• "));
      if(li>0)return `<p>${esc(lines.slice(0,li).join(" "))}</p><ul>${lines.slice(li).map(x=>`<li>${esc(x.replace(/^• /,""))}</li>`).join("")}</ul>`;
      return `<p>${esc(lines.join(" "))}</p>`}).join("");
    return `<section id="lec-${i}"><h3>${esc(h)}</h3>${blocks}</section>`}).join("");
  return `<section class="stack" id="lecture"><div class="row" style="justify-content:space-between;align-items:baseline"><h2>Leksioni</h2><div class="lec-meta"><span>${l.lec.length} pjesë</span><span>${String(words).replace(/\B(?=(\d{3})+$)/g,".")} fjalë</span><span>rreth ${rmin} min lexim</span></div></div>
    <div class="lec"><nav class="lec-toc" aria-label="Përmbajtja e leksionit">${l.lec.map(([h],i)=>`<button type="button" data-lec="${i}">${esc(h.replace(/:.*$/,""))}</button>`).join("")}</nav><div class="lec-body">${body}</div></div></section>`;
}

    <div class="row" style="margin-top:14px">${st.checked?quizResult(l,st):`<button class="btn primary" id="qcheck" ${Object.keys(st.ans).length<l.quiz.length?"disabled":""}>Kontrollo përgjigjet</button>`}</div>

function quizResult(l,st){
  const sc=l.quiz.reduce((a,q,i)=>a+(st.ans[i]===q.a?1:0),0), ok=sc>=PASS_LESSON;

}
function bindLesson(l){

  const r=$("#qretry");if(r)r.addEventListener("click",()=>{lessonQuiz[l.id]={ans:{},checked:false};render();$("#lq").scrollIntoView({behavior:"smooth"})});
}

/* exam (per module) */
function viewExam(m){
  const d=doneIn(S.me,m), ex=examOf(S.me,m), N=examN(m);
  const head=`<a href="${modHref(m)}" class="muted" style="font-size:14px;text-decoration:none">← Moduli ${m.n}: ${esc(m.t)}</a>`;
  if(!exam||exam.mid!==m.id){
    return `<section class="stack" style="max-width:720px">${head}<p class="eyebrow">Moduli ${m.n} · Provimi</p><h1>Provimi: ${esc(m.t)}</h1>
      <p class="muted" style="font-size:17px">${N} pyetje me skenarë nga të ${m.lessons.length} mësimet, në rend të rastësishëm. Përgjigjet shihen në fund. Kalimi është ${EXAM_PASS}%, pra të paktën ${Math.ceil(N*EXAM_PASS/100)} përgjigje të sakta.</p>
      ${d<m.lessons.length?`<p class="notice"><span><b>Rekomandim:</b> ke përfunduar ${d}/${m.lessons.length} mësime. Mund ta bësh provimin, por shanset rriten shumë pasi t’i mbarosh të gjitha.</span></p>`:""}
      ${ex?`<div class="card row"><span>Rezultati yt më i mirë</span>${pctChip(ex.best,EXAM_PASS)}<span class="muted" style="font-size:13px">${ex.attempts} tentativa · i fundit ${ex.last}%</span></div>`:""}
      <div class="row"><button class="btn primary" id="exstart">${ex?"Bëje përsëri":"Fillo provimin"}</button></div></section>`;
  }
  if(exam.done){
    const sc=exam.qs.reduce((a,q,i)=>a+(exam.ans[i]===q.a?1:0),0), p=Math.round(sc/exam.qs.length*100), ok=p>=EXAM_PASS;
    const wrongL={};exam.qs.forEach((q,i)=>{if(exam.ans[i]!==q.a)wrongL[q.lid]=(wrongL[q.lid]||0)+1});
    return `<section class="card stack"><p class="eyebrow">Rezultati · Moduli ${m.n}</p><div class="row"><span class="score" style="color:var(${ok?"--ok":"--bad"})">${p}%</span><div><h2>${ok?"Kalove provimin":"Jo ende"}</h2><p class="muted">${sc} nga ${exam.qs.length} të sakta · kalimi ${EXAM_PASS}%</p></div></div>
      ${Object.keys(wrongL).length?`<div class="stack"><p class="eyebrow">Rishiko këto mësime</p><div class="row">${Object.entries(wrongL).map(([lid,n])=>{const l=ALL_LESSONS.find(x=>x.id===lid);return `<a class="chip bad" href="${lessonHref(l)}">${esc(l.t)} · ${n} gabime</a>`}).join("")}</div></div>`:""}
      <div class="row"><button class="btn primary" id="exagain">Bëje përsëri</button><a class="btn" href="#akademia">Te modulet</a></div></section>
      <section class="card"><h2>Përgjigjet</h2>${exam.qs.map((q,i)=>{const a=exam.ans[i];return `<div class="q"><p class="qt">${i+1}. ${esc(q.q)}</p><div class="opts">${q.o.map((o,oi)=>`<div class="opt ${oi===q.a?"right":a===oi?"wrong":""}"><span class="dot"></span><span>${esc(o)}</span></div>`).join("")}</div><p class="expl">${esc(q.e)}</p></div>`}).join("")}</section>`;
  }
  const i=exam.i,q=exam.qs[i],a=exam.ans[i];
  return `<section class="stack" style="max-width:760px"><div class="row" style="justify-content:space-between"><p class="eyebrow">Moduli ${m.n} · Pyetja ${i+1} nga ${exam.qs.length}</p><span class="mono muted" style="font-size:13px">${Object.keys(exam.ans).length} përgjigje</span></div>
    <div class="progress"><i style="width:${(i+1)/exam.qs.length*100}%"></i></div>
    <div class="card stack" id="exq"><h2 style="font-size:21px">${esc(q.q)}</h2><div class="opts">${q.o.map((o,oi)=>`<button type="button" class="opt ${a===oi?"sel":""}" data-o="${oi}"><span class="dot"></span><span>${esc(o)}</span></button>`).join("")}</div></div>
    <div class="row" style="justify-content:space-between"><button class="btn" id="exprev" ${i===0?"disabled":""}>← Mbrapa</button>${i<exam.qs.length-1?`<button class="btn primary" id="exnext" ${a==null?"disabled":""}>Tjetra →</button>`:`<button class="btn primary" id="exfinish" ${Object.keys(exam.ans).length<exam.qs.length?"disabled":""}>Dorëzo provimin</button>`}</div></section>`;
}
function startExam(m){exam={mid:m.id,qs:shuffle(POOL[m.id]).slice(0,examN(m)).map(q=>{const idx=shuffle(q.o.map((_,k)=>k));return {...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)}}),ans:{},i:0,done:false};render();window.scrollTo(0,0)}
function bindExam(m){
  const on=(id,f)=>{const e=$(id);if(e)e.addEventListener("click",f)};
  on("#exstart",()=>startExam(m));on("#exagain",()=>startExam(m));
  document.querySelectorAll("#exq .opt").forEach(b=>b.addEventListener("click",()=>{exam.ans[exam.i]=+b.dataset.o;render()}));
  on("#exprev",()=>{exam.i--;render()});on("#exnext",()=>{exam.i++;render()});
  on("#exfinish",async()=>{exam.done=true;
    const sc=exam.qs.reduce((a,q,i)=>a+(exam.ans[i]===q.a?1:0),0), p=Math.round(sc/exam.qs.length*100);
    const prev=examOf(S.me,m)||{best:0,attempts:0};
    const wrong=exam.qs.filter((q,i)=>exam.ans[i]!==q.a).map(q=>q.id);
    const e2={best:Math.max(prev.best||0,p),last:p,attempts:(prev.attempts||0)+1,lastAt:new Date().toISOString(),wrong};
    if(prev.passedAt)e2.passedAt=prev.passedAt; else if(p>=EXAM_PASS)e2.passedAt=e2.lastAt;
    render();window.scrollTo(0,0);await saveMe({exams:{...(S.me.exams||{}),[m.id]:e2}});render();});
}

    try{
      await S.db.collection("audits").add(rec);
      if(st){await S.db.doc("staff/"+st.id).update({lastAudit:{score:sc.p,date:d.date,missed,notes:rec.notes}})}
      auditDraft=newDraft();toast("Auditi u ruajt: "+rec.staffName+" "+sc.p+"%");location.hash="#paneli";
    }catch(e){console.warn(e);btn.disabled=false;toast("Auditi nuk u ruajt. Provo përsëri.")}
  });
}

/* manager panel */
function viewPanel(){return (window.academyAdmin?window.academyAdmin.html():"")+_viewPanel()}
function _viewPanel(){
  const st=S.staff, au=S.audits;
  const sx=s=>examOf(s,SERVICE);
  const exams=st.map(sx).filter(Boolean).map(e=>e.best);
  const since=Date.now()-30*864e5, recent=au.filter(a=>new Date(a.date).getTime()>=since&&a.score!=null);
  const isCert=s=>doneIn(s,SERVICE)===SERVICE.lessons.length&&sx(s)&&sx(s).best>=EXAM_PASS&&s.lastAudit&&s.lastAudit.score>=AUDIT_PASS;
  const cert=st.filter(isCert);
  const miss={};recent.forEach(a=>(a.missed||[]).forEach(id=>miss[id]=(miss[id]||0)+1));
  const seen={};recent.forEach(a=>Object.entries(a.items||{}).forEach(([k,v])=>{if(v==="y"||v==="n")seen[k]=(seen[k]||0)+1}));
  const weak=Object.entries(miss).map(([id,n])=>({it:AUDIT_ITEMS.find(x=>x.id===id),n,rate:Math.round(n/(seen[id]||n)*100)})).filter(x=>x.it).sort((a,b)=>b.rate-a.rate||b.n-a.n).slice(0,8);
  const wq={};st.forEach(s=>BUILT.forEach(m=>{const e=examOf(s,m);(e&&e.wrong||[]).forEach(id=>{const l=id.split("-")[0];wq[l]=(wq[l]||0)+1})}));
  const status=s=>{if(isCert(s))return'<span class="chip ok">Certifikuar</span>';if(sx(s)&&sx(s).best>=EXAM_PASS)return'<span class="chip gold">Pret auditin</span>';if(doneIn(s,SERVICE)===SERVICE.lessons.length)return'<span class="chip acc">Gati për provim</span>';return'<span class="chip">Në trajnim</span>'};
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const modCell=(s,m)=>{const e=examOf(s,m);return `<span class="mono">${doneIn(s,m)}/${m.lessons.length}</span> ${e?pctChip(e.best,EXAM_PASS):""}`};
  return `<section class="row" style="justify-content:space-between;align-items:flex-end"><div class="stack"><p class="eyebrow">Vetëm për shefin</p><h1>Paneli i ekipit</h1></div><a class="btn primary" href="#auditi">+ Audit i ri</a></section>
  ${S.mode!=="cloud"?'<p class="notice"><span><b>Mënyra lokale.</b> Paneli mbushet kur platforma lidhet me serverin.</span></p>':""}
  <section class="tiles">
    <div class="tile"><b>${st.length}</b><span>staf i regjistruar</span></div>
    <div class="tile"><b>${cert.length}<span class="muted" style="font-size:18px">/${st.length}</span></b><span>të certifikuar në shërbim</span></div>
    <div class="tile"><b>${avg(exams)??"—"}${exams.length?"%":""}</b><span>mesatarja e provimit të shërbimit</span></div>
    <div class="tile"><b>${avg(recent.map(a=>a.score))??"—"}${recent.length?"%":""}</b><span>mesatarja e auditeve · 30 ditë (${recent.length})</span></div>
  </section>
  <section class="stack"><h2>Stafi</h2>
  ${st.length?`<div class="tablewrap"><table><thead><tr><th>Emri</th><th>Pozicioni</th><th>Mësime</th><th>Module të kaluara</th><th>Provimi i shërbimit</th><th>Auditi i fundit</th><th>Statusi</th></tr></thead><tbody>${st.slice().sort((a,b)=>totalDone(b)-totalDone(a)).map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.role||"")}</td><td class="num">${totalDone(s)}/${ALL_LESSONS.length}</td><td class="num">${BUILT.filter(m=>{const e=examOf(s,m);return e&&e.best>=EXAM_PASS}).length}/${BUILT.length}</td><td>${sx(s)?pctChip(sx(s).best,EXAM_PASS):'<span class="muted">—</span>'}</td><td>${s.lastAudit?pctChip(s.lastAudit.score,AUDIT_PASS)+` <span class="muted" style="font-size:12px">${fmtDate(s.lastAudit.date)}</span>`:'<span class="muted">—</span>'}</td><td>${status(s)}</td></tr>`).join("")}</tbody></table></div><p class="muted" style="font-size:12.5px">“Module të kaluara” = provime me ≥ ${EXAM_PASS}%. Certifikimi në shërbim kërkon Modulin 2 të plotë, provimin ≥ ${EXAM_PASS}% dhe auditin e fundit ≥ ${AUDIT_PASS}%.</p>`:`<div class="panel stack"><h3>Ende askush nuk është regjistruar</h3><p class="muted">Ndani linkun e platformës me stafin. Secili hyn me llogarinë e vet, shkruan emrin dhe shfaqet këtu automatikisht me progresin.</p></div>`}
  </section>
  <section class="grid2">
    <div class="card stack"><p class="eyebrow">Standardet më të dobëta · auditet 30 ditë</p>${weak.length?`<div class="bars">${weak.map(w=>`<div class="barrow"><span>${esc(w.it.t)} <span class="ref">${w.it.s}</span></span><span class="track"><i style="width:${w.rate}%"></i></span><span class="mono">${w.rate}%</span></div>`).join("")}</div><p class="muted" style="font-size:12.5px">Përqindja e vëzhgimeve ku standardi nuk u plotësua. Zgjidh ushtrimin përkatës për line-up.</p>`:'<p class="muted">Shfaqet pas auditeve të para.</p>'}</div>
    <div class="card stack"><p class="eyebrow">Gabimet në provime sipas mësimit</p>${Object.keys(wq).length?`<div class="bars">${Object.entries(wq).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([lid,n])=>{const l=ALL_LESSONS.find(x=>x.id===lid);const mx=Math.max(...Object.values(wq));return `<div class="barrow"><span>${esc(l?l.t:lid)}</span><span class="track"><i style="width:${n/mx*100}%;background:var(--warn)"></i></span><span class="mono">${n}</span></div>`}).join("")}</div>`:'<p class="muted">Shfaqet pas provimeve të para.</p>'}</div>
  </section>
  <section class="stack"><h2>Auditet e fundit</h2>${au.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Stafi</th><th>Turni</th><th>Zona</th><th>Rezultati</th><th>Pikat e humbura</th></tr></thead><tbody>${au.slice(0,25).map(a=>`<tr><td class="num">${fmtDate(a.date)}</td><td>${esc(a.staffName)}</td><td>${esc(a.shift)}</td><td>${esc(a.area)}</td><td>${pctChip(a.score,AUDIT_PASS)}</td><td style="font-size:13px">${(a.missed||[]).map(id=>{const it=AUDIT_ITEMS.find(x=>x.id===id);return it?esc(it.s):""}).join(", ")||"—"}</td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">Ende pa audite. Bëj të parin gjatë turnit të sotëm.</p>'}</section>`;
}


/* ---------- boot ---------- */
render();
(async function boot(){
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude?window.claude.use("db"):null,window.claude?window.claude.use("user"):null])}catch(e){}
  let uid=null;try{uid=user?await user.id():null}catch(e){}
  if(!db||!uid){
    S.mode="local";const m=lsGet();if(m)S.me=Object.assign(S.me,m);render();return;
  }
  S.db=db;S.uid=uid;S.mode="cloud";
  try{S.isMgr=await user.canEdit()}catch(e){S.isMgr=false}
  const to=setTimeout(()=>{if(!S.loaded){S.loaded=true;render()}},10000);
  db.doc("staff/"+uid).onSnapshot(snap=>{
    clearTimeout(to);S.loaded=true;S.meExists=snap.exists;
    if(snap.exists){const d=snap.data()||{};S.me=Object.assign({name:"",role:"",lessons:{},quizzes:{},exams:{},lastAudit:null},d)}
    else{const m=lsGet();if(m&&m.name){S.me=Object.assign(S.me,m)}}
    render();
  },err=>{console.warn(err);S.mode="local";render()});
  if(S.isMgr){
    db.collection("staff").onSnapshot(s=>{S.staff=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.name);S.staffLoaded=true;if(current()==="paneli"||current()==="auditi")render()},e=>console.warn(e));
    db.collection("audits").orderBy("createdAt","desc").limit(300).onSnapshot(s=>{S.audits=s.docs.map(d=>({id:d.id,...d.data()}));if(current()==="paneli")render()},e=>console.warn(e));
  }
  render();
})();
})();
</script>
