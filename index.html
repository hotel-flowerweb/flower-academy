["Temperaturat e shërbimit",`Temperatura është faktori që ndikon më shumë në shijen e verës pas vetë verës. Shumë restorante e shërbejnë të bardhën shumë të ftohtë dhe të kuqen shumë të ngrohtë. Rregulli bazë:

• Shampanja dhe verërat me flluska: 6 deri në 8 gradë.
• Të bardhat dhe rozetë: 8 deri në 10 gradë. Të bardhat më të plota, si një Chardonnay i kaluar në fuçi, mund të shërbehen pak më ngrohtë, rreth 10 deri në 12 gradë.
• Të kuqet e lehta, si Pinot Noir: 14 deri në 16 gradë.
• Të kuqet e plota, si Primitivo, Cabernet ose verërat e mëdha shqiptare: 16 deri në 18 gradë.
• Birra: 4 deri në 6 gradë.

Temperatura e dhomës në një restorant në verë mund të jetë 24 ose 26 gradë, që është shumë për çdo verë të kuqe. Prandaj të kuqet ruhen në frigorifer vere ose në një vend të freskët, jo në raftin pas barit pranë dritave. Një e kuqe që duket pak e ngrohtë mund të ftohet për disa minuta në kovë me ujë dhe akull. Një e bardhë shumë e ftohtë ngrohet duke e mbajtur gotën në dorë, por më mirë të mos ndodhë fare.`],
["Gotat dhe akulli",`Gota e duhur e bën pijen të shprehë aromën dhe tregon profesionalizëm. Rregullat bazë:

• Gota Bordeaux, e lartë dhe e gjerë, për të kuqet e plota. Gota Burgundy, me tas më të gjerë, për Pinot Noir dhe të kuqet aromatike.
• Gota e bardhë, më e vogël, për të bardhat dhe rozetë, që të ruajë temperaturën.
• Flute ose tulipan për shampanjën dhe prosecco-n. Tulipani lejon aromën të shprehet më shumë.
• Rocks ose old fashioned për uiski dhe kokteile të shkurtra me akull.
• Highball për gin tonic dhe pije të gjata.
• Coupe për martini, daiquiri dhe kokteile të shërbyera pa akull.

Gota kapet gjithmonë nga këmba ose nga pjesa e poshtme, kurrë nga buza. Para shërbimit kontrollohet kundër dritës: pa njolla, pa gjurmë gishtash, pa çarje. Një gotë me çarje hiqet nga qarkullimi menjëherë, edhe nëse është e vetmja e atij lloji.

Akulli është përbërës, jo detaj. Për uiski “on the rocks” përdoret kub i madh ose sferë, që shkrin ngadalë. Për highball, kube standarde deri në majë. Për mojito dhe julep, akull i thyer. “Neat” do të thotë pa akull, në temperaturë dhome. Akulli duhet të jetë i kristaltë dhe pa erë frigoriferi, dhe merret gjithmonë me lugë ose darë, kurrë me gotë, sepse gota mund të çahet dhe copat e xhamit nuk shihen në akull.`],
["Kokteilet: saktësia mbi gjithçka",`Mysafiri që porosit të njëjtin kokteil dy herë pret të njëjtin kokteil dy herë. Kjo arrihet vetëm me saktësi. Rregullat e barit të Flower:

• Gjithmonë me jigger, kurrë me sy. Edhe barmenët me përvojë, sepse sasia e syrit ndryshon me lodhjen dhe me nxitimin.
• Receta e shtëpisë për çdo kokteil, e shkruar dhe e njëjtë për çdo barmen. Recetat e kokteileve tona janë në Manualin e barit.
• Garnitura e freskët, e prerë në çast. Lëkura e portokallit për Old Father ose për një Negroni shtrydhet mbi gotë për të çliruar vajrat aromatikë.
• Saktësisht si e kërkon mysafiri. Nëse kërkon martini “dirty”, “me Hendrick's” ose “pa sheqer”, ashtu bëhet. Nëse nuk e kupton kërkesën, pyet: “E preferoni Martinin të tundur apo të përzier, me ullinj apo me lëkurë limoni?”

Kokteili signature, Old Father, është krenaria e barit dhe duhet ta njohë çdokush: përbërësit, historinë dhe mënyrën si e prezantojmë. Kur një mysafir pyet “çfarë më rekomandoni?”, është sugjerimi i parë. Për mysafirët që nuk pinë alkool, ofrohen mocktail-et e shtëpisë me të njëjtin kujdes dhe me të njëjtën gotë elegante, jo si alternativë e dorës së dytë.`],
["Detajet e luksit në bar",`Ajo që e dallon barin e një hoteli luksoz nga një bar i zakonshëm janë detajet që mysafiri i vë re edhe pa e kuptuar.

• Çdo pije vendoset mbi coaster liri ose lëkure, kurrë drejt e mbi tavolinë ose banak.
• Me pijen e parë vijnë snacks të freskëta: ullinj, bajame, chips të shtëpisë, me pecetë liri.
• Menuja e pijeve jepet pa u kërkuar, e pastër dhe e paprekur, jo me qoshe të thyera ose njolla.
• Ofrohet kokteili signature dhe mocktail-et, në mënyrë që mysafiri ta dijë që ekzistojnë.
• Banaku mbahet i pastër gjatë gjithë kohës: pa gota të përdorura, pa lecka, pa shishe të hapura pa tapë.
• Kur mysafiri ngrihet për pak, peceta e tij paloset dhe vendoset pranë gotës.

Për verërat me flluska, një fjali e mirë mund ta kthejë një moment të zakonshëm në festë: “Për diçka me flluska kemi Prosecco Col Mesian ose, për një festë, Moët Impérial.”`],
["Përmbledhje",`Vera me gotë shërbehet me prezantim, provë 2 cl, derdhje 150 ml dhe ruajtje korrekte. Temperaturat janë nga 6 gradë për shampanjën deri në 18 për të kuqet e plota. Gota është e duhur për çdo pije dhe kontrollohet kundër dritës. Akulli është përbërës dhe trajtohet me kujdes. Kokteilet bëhen me jigger dhe me recetën e shtëpisë, saktësisht si i kërkon mysafiri. Dhe detajet e luksit, nga coaster-i te snacks-at, janë të pranishme çdo herë.

Për të mësuar produktet konkrete, kalo nga Manuali i verës dhe Manuali i barit në platformë.`]
];
LEC.L8=[
["Hyrje: skena që mysafiri nuk duhet ta shohë",`Një tavolinë e shtruar në mënyrë perfekte i thotë mysafirit që ky restorant kujdeset për çdo detaj. Një gotë me njollë, një pirun i papolishuar ose një tavolinë që lëkundet i thotë të kundërtën, dhe e bën të dyshojë edhe për kuzhinën që nuk e sheh.

Standardet HD49 deri në HD52, HD55 deri në HD58 dhe BL39 deri në BL45 mbulojnë tri faza: përgatitjen e tavolinës para shërbimit, mirëmbajtjen gjatë vaktit dhe mbylljen me faturën dhe pagesën. Ky leksion i ndjek në këtë rend.`],
["Inspektimi para shërbimit",`Çdo turn fillon me inspektimin. Para se të hapen dyert, çdo kamarier kontrollon zonën e vet dhe supervizori kontrollon të gjithë sallën.

• Gotat: çdo gotë kontrollohet kundër dritës. Pa njolla, pa gjurmë gishtash, pa çarje në buzë.
• Takëmet: të polishuara, pa njolla uji, të vendosura në distancë të njëjtë nga buza e tavolinës.
• Pecetat: liri e hekurosur, e palosur njësoj në çdo tavolinë.
• Tavolina: pa lëkundje. Nëse lëkundet, rregullohet me mekanizmin e këmbës ose me një mbështetëse të padukshme, kurrë me pecetë të palosur nën këmbë.
• Menutë: pa njolla, pa qoshe të thyera, me faqet në rend.
• Kripa, piperi dhe vaji: të mbushura dhe të pastra.
• Karriget: në distancë të njëjtë nga tavolina, të pastra, pa thërrime.

Çdo gjë me çarje ose njollë që nuk pastrohet hiqet nga qarkullimi. Kjo vlen edhe kur stoku është i ulët. Një gotë më pak në raft është më mirë se një gotë e çarë në tavolinë.`],
["Heqja e pjatave",`Pjatat hiqen kur të gjithë mysafirët e tavolinës kanë mbaruar, jo kur mbaron i pari. Heqja e pjatës së një mysafiri ndërsa të tjerët ende hanë i bën ata të ndihen të nxituar. Përjashtim bën rasti kur mysafiri vetë e kërkon ose e shtyn pjatën anash.

Sinjali që mysafiri ka mbaruar janë takëmet paralel në pjatë, rreth orës katër. Kur nuk je i sigurt, pyet: “A mund ta marr?” Mos pyet “Mbaruat?” sepse tingëllon si nxitim.

Pjatat hiqen nga e djathta, pa zhurmë dhe pa i grumbulluar para mysafirit. Teknika profesionale është të mbash pjatat në dorën e majtë, me takëmet të mbledhura në pjatën e sipërme, dhe të mos kruash mbetjet e ushqimit para tavolinës. Këto bëhen në stacion, larg pamjes.

Në bar, gotat bosh dhe pecetat e përdorura hiqen menjëherë, pa pritur që mysafiri të largohet.`],
["Para ëmbëlsirës: tavolina e re",`Para ëmbëlsirës, tavolina përgatitet si për një vakt të ri. Kjo është një nga momentet ku shërbimi luksoz shihet më qartë.

• Hiqen të gjitha pjatat, takëmet dhe gotat që nuk duhen më, përfshirë gotat e ujit nëse mysafiri ka kaluar në verë dhe nuk po pi më ujë.
• Hiqen kripa, piperi dhe vaji.
• Thërrimet pastrohen me crumber, nga e majta e mysafirit, duke i mbledhur në një pjatë të vogël, jo duke i hedhur në dysheme.
• Vendosen takëmet e ëmbëlsirës, nëse nuk ishin vendosur që në fillim. Nëse ishin vendosur sipër pjatës, ulen në vend: luga në të djathtë, piruni në të majtë.
• Jepen menutë e ëmbëlsirave dhe të pijeve digjestive, me një sugjerim konkret.

Kjo është edhe koha për të ofruar kafe, çaj ose një digjestiv. Shumë mysafirë nuk e porositin vetëm sepse askush nuk ua ofroi.`],
["Salla gjatë shërbimit",`Gjatë shërbimit, salla duhet të mbetet e rregullt si në fillim. Tavolinat e lira mbeten të shtruara njësoj si të tjerat, me gotat në vijë dhe karriget në distancë të njëjtë. Kur një tavolinë lirohet, ajo ri-shtrohet brenda pesë minutash. Një tavolinë e pistë në mes të sallës është gjëja e parë që sheh mysafiri i ri kur hyn.

Stacionet e kamarierëve dhe banaku i pasmë i barit janë pjesë e sallës dhe shihen nga mysafirët. Prandaj:
• Pa shishe të hapura pa tapë.
• Pa lecka të përdorura në pamje.
• Pa gota të përdorura dhe pjata me mbetje.
• Pa telefona, çanta ose sende personale.
• Pa letra, fatura dhe dokumente të shpërndara.

Një stacion i rregullt është edhe një stacion më efikas, sepse çdo gjë gjendet menjëherë.`],
["Fatura: dy minuta dhe zero gabime",`Fatura është momenti i fundit i shërbimit dhe shpesh ai ku mysafiri ka më pak durim. Pas një darke të shkëlqyer, pritja dhjetë minuta për faturën lë shije të keqe. Standardi është që fatura të arrijë brenda dy minutave nga kërkesa.

Për ta arritur këtë, fatura përgatitet paraprakisht. Kur mysafiri ka mbaruar kafenë ose ëmbëlsirën, kamarieri e kontrollon faturën në POS, në mënyrë që të jetë gati kur kërkohet. Por nuk e sjell pa u kërkuar. Sjellja e faturës pa kërkesë i thotë mysafirit që duhet të largohet.

Para se ta sjellësh, kontrolloje:
• Të gjithë artikujt janë të saktë dhe nuk ka artikuj të tepërt ose që mungojnë.
• Çmimet e mishrave me kilogram përputhen me peshën reale.
• Nëse është mysafir hoteli, numri i dhomës është i saktë.
• Nëse ka zbritje ose kompensim të vendosur nga supervizori, është aplikuar.

Fatura sillet në mbajtëse fature, jo në dorë ose në pjatë. Vendoset para organizatorit, ose në mes të tavolinës kur nuk dihet kush paguan. Shuma nuk lexohet me zë. “Ja fatura juaj, zoti Smith. Mos u nxitoni.” Pastaj tërhiqu dhe lëre mysafirin ta shohë në qetësi.`],
["Pagesa",`Pagesa me kartë bëhet me POS të lëvizshëm në tavolinë. Karta nuk largohet kurrë nga sytë e mysafirit. Kjo është një çështje sigurie dhe besimi, dhe Forbes e kontrollon.

Për mysafirët e hotelit që ngarkojnë në dhomë, konfirmo emrin dhe numrin e dhomës me zë të ulët, në mënyrë që mysafirët e tjerë të mos e dëgjojnë. Kërko nënshkrimin dhe kontrollo që emri përputhet me sistemin.

Pas pagesës, fatura përfundimtare dhe kopja e kartës vendosen në mbajtëse dhe i jepen mysafirit me falënderim. Nëse mysafiri lë bakshish, falënderohet me mirësjellje, pa e numëruar para tij.

Pastaj vjen lamtumira, e cila u trajtua në leksionin për gjuhën: falënderim, emri, ftesë për t'u kthyer. Nëse është e mundur, kamarieri ose hosti e shoqëron mysafirin deri te dera ose të paktën e përshëndet kur kalon pranë podiumit.

» Skenë nga Flower: Një çift ka mbaruar kafenë. Kamarieri e ka kontrolluar faturën në POS. Zotëria bën shenjën e faturës. Brenda një minute, fatura arrin në mbajtëse, e vendosur në mes. “Ja fatura juaj. Mos u nxitoni.” Zotëria thotë që e ngarkon në dhomë. Kamarieri ulet pak dhe pyet me zë të ulët: “Dhoma 412, zoti Hoxha?” Pas nënshkrimit: “Ju faleminderit shumë. Shpresojmë t'ju shohim nesër në mëngjes.” Hosti i përshëndet te dera me emër.`],
["Përmbledhje",`Tavolina fillon me inspektimin: gota kundër dritës, takëme të polishuara, tavolinë pa lëkundje. Gjatë vaktit, pjatat hiqen kur kanë mbaruar të gjithë, nga e djathta dhe pa zhurmë, dhe para ëmbëlsirës tavolina pastrohet si për një vakt të ri. Tavolina e liruar ri-shtrohet brenda pesë minutash. Fatura arrin brenda dy minutave, e kontrolluar, në mbajtëse, pa lexuar shumën. Karta nuk largohet nga sytë e mysafirit.

Zero gabime në faturë është një objektiv i arritshëm vetëm nëse çdo kamarier e kontrollon para se ta sjellë. Kjo kërkon tridhjetë sekonda dhe shpëton një mbrëmje.`]
];
LEC.L9=[
["Hyrje: uniforma si premtim",`Mysafiri e sheh kamarierin para se ta dëgjojë. Paraqitja jonë është premtimi i parë për cilësinë e shërbimit. Një uniformë e hekurosur, flokë të rregulluara dhe duar të pastra i thonë mysafirit që ky restorant kujdeset për detajet. Një këmishë e rrudhur ose një njollë në përparëse i thotë të kundërtën, dhe mysafiri pyet veten si duket kuzhina që nuk e sheh.

Standardet HD14 deri në HD16 dhe BL12 deri në BL14 kërkojnë që stafi të jetë i paraqitur në mënyrë profesionale, me uniformë të pastër dhe në gjendje të mirë, dhe që të ketë qëndrim profesional gjatë gjithë kohës. Ky leksion përcakton standardin e Flower.`],
["Uniforma",`Uniforma vishet e plotë, e pastër dhe e hekurosur në çdo turn. Nuk ka përjashtime për turnin e mëngjesit ose për ditët e qeta.

• Këmisha ose bluza: e hekurosur, pa njolla, pa kopsa që mungojnë, e futur brenda.
• Përparësja: e pastër në fillim të turnit. Mbaj një rezervë në stacion për rastin kur njollohet gjatë shërbimit.
• Pantallonat ose funi: të hekurosura, në gjatësinë e duhur.
• Këpucët: të zeza, të mbyllura, të pastruara, me taban që nuk rrëshqet. Pa atlete, përveç kur janë pjesë e uniformës.
• Etiketa me emër: gjithmonë e vendosur, në anën e djathtë të gjoksit, e lexueshme.
• Çorapet: të errëta dhe në përputhje me uniformën.

Kamarieri mban me vete gjithmonë: një stilolaps që punon, një hapëse shishesh, një çakmak ose shkrepëse nëse ka qirinj në tavolina, dhe një pecetë shërbimi. Këto mbahen në xhepin e përparëses, jo në duar.`],
["Higjiena personale",`Kamarieri prek gotat, pjatat dhe takëmet që mysafiri do t'i vendosë në gojë. Higjiena personale nuk është çështje estetike, është çështje sigurie ushqimore.

• Duart: të pastra, me thonj të shkurtër dhe të pastër. Lahen sa herë kthehesh nga tualeti, pasi ke prekur para, telefon ose mbeturina, dhe rregullisht gjatë turnit.
• Thonjtë: pa llak të ndritshëm ose të dëmtuar. Nëse përdoret llak, të jetë i thjeshtë dhe në gjendje perfekte.
• Flokët: të pastër dhe të rregulluar. Flokët e gjatë të lidhur, në mënyrë që të mos bien mbi fytyrë ose mbi tavolinë.
• Mjekra: e rruar ose e rregulluar mirë.
• Parfumi: i lehtë ose aspak. Parfumi i fortë ndërhyn me aromën e verës dhe të ushqimit, dhe mund t'i shqetësojë mysafirët.
• Fryma: e freskët. Pa ushqime me erë të fortë para turnit.

Bizhuteritë mbahen në minimum: një orë e thjeshtë, një unazë martese, vathë të vegjël. Byzylykët dhe unazat e mëdha mund të prekin pjatat dhe të bien në ushqim.`],
["Qëndrimi në sallë",`Qëndrimi profesional nuk mbaron me uniformën. Ai përfshin mënyrën si lëviz, si qëndron dhe si sillesh kur mendon se askush nuk të sheh. Në sallë, gjithmonë dikush të sheh.

• Pa telefona në sallë. Telefoni personal mbahet në dollap ose në zonën e stafit. Nëse duhet ta përdorësh për punë, përdore larg pamjes së mysafirëve.
• Pa ngrënë, pa pirë dhe pa përtypur çamçakëz në sallë. Uji pihet në zonën e stafit.
• Pa u mbështetur te muri, te banaku ose te karriget.
• Pa biseda personale me kolegët në sallë, as me zë të ulët. Mysafiri që sheh dy kamarierë duke qeshur në qoshe mendon se po qeshin me të.
• Pa duar në xhepa dhe pa krahë të kryqëzuar.
• Pa vrapuar. Edhe në momentet më të ngarkuara, ecja është e shpejtë por e qetë.

Kur ke një moment pa punë, nuk zhdukesh. Zër një pozicion me pamje nga zona jote, me qëndrim të drejtë dhe të hapur, dhe skano tavolinat.`],
["Qëndrimi ndaj mysafirit dhe ndaj ekipit",`Profesionalizmi është edhe çështje qëndrimi mendor. Ka disa parime që e përcaktojnë.

• Mysafiri nuk e sheh kurrë stresin tonë. Nëse kuzhina është e vonuar, nëse kemi një problem me një koleg, nëse ka ndodhur një gabim, mysafiri sheh vetëm qetësi.
• Ankesat për punën, për turnin ose për kolegët nuk bëhen kurrë para mysafirëve. Diskutohen me supervizorin, larg sallës.
• Diskrecioni është absolut. Ajo që dëgjojmë në tavolina mbetet në tavolina. Nuk komentojmë mysafirët, as me kolegët, as jashtë punës, as në rrjetet sociale.
• Mysafirët e njohur, të famshëm ose me pozita trajtohen me të njëjtin profesionalizëm si gjithë të tjerët. Nuk kërkojmë foto, nuk tregojmë që janë këtu.
• Puna në ekip është e dukshme. Kur një koleg ka nevojë, ndihmojmë pa u kërkuar. Për mysafirin, të gjithë jemi një.`],
["Kontrolli në line-up",`Çdo turn fillon me line-up-in, takimin e shkurtër të ekipit para shërbimit. Pjesë e line-up-it është kontrolli i paraqitjes, që zgjat rreth dy minuta. Supervizori kontrollon çdo anëtar të ekipit: uniformën, etiketën me emër, flokët, duart, këpucët dhe mjetet e punës.

Ky kontroll nuk është për të turpëruar askënd. Është mënyra që ekipi të sigurojë që të gjithë janë në nivelin e njëjtë para se të shohë mysafirin e parë. Nëse dikush ka një problem, si një njollë ose një kopsë që mungon, rregullohet para se të hapen dyert.

Line-up-i përfshin edhe informacionin e turnit: rezervimet e veçanta, mysafirët VIP, pjatat që kanë mbaruar, specialitetet e ditës dhe një pikë fokusi nga trajnimi. Mund të përdorësh ushtrimet e çdo mësimi në platformë si temë për line-up-in.`],
["Përmbledhje",`Paraqitja profesionale ka tre shtresa: uniforma e plotë dhe e pastër, higjiena personale si çështje sigurie ushqimore, dhe qëndrimi në sallë dhe ndaj mysafirit. Asnjë telefon në sallë, asnjë mbështetje te muri, asnjë bisedë personale, asnjë stres i dukshëm.

Kontrolli dyminutësh në line-up siguron që çdo turn fillon në nivelin e duhur. Dhe mbaj mend: mysafiri gjykon restorantin nga ajo që sheh. Ne jemi pjesa e parë që sheh.`]
];
LEC.T1=[
["Hyrje: pse na intereson një vlerësim nga jashtë",`Çdo restorant mendon se jep shërbim të mirë. Problemi është se “i mirë” do të thotë gjëra të ndryshme për njerëz të ndryshëm. Për një kamarier, shërbim i mirë mund të jetë të jesh i sjellshëm. Për një menaxher, mund të jetë të mos ketë ankesa. Për një mysafir që ka darkuar në hotelet më të mira të Evropës, shërbim i mirë është diçka shumë më e saktë dhe më e kërkuar.

Forbes Travel Guide e zgjidh këtë problem duke e kthyer shërbimin e mirë në një listë standardesh të matshme. Kjo listë na jep një gjuhë të përbashkët. Kur themi “përshëndetja brenda 60 sekondave”, të gjithë e dimë saktësisht çfarë do të thotë dhe të gjithë mund ta kontrollojmë. Ky leksion shpjegon si funksionon sistemi dhe pse e kemi zgjedhur si bazë për trajnimin e Flower.`],
["Kush është Forbes Travel Guide",`Forbes Travel Guide është sistemi më i vjetër i pavarur i vlerësimit me yje për hotelet, restorantet dhe spa-të. Filloi në vitin 1958 si Mobil Travel Guide, kur kompania e naftës Mobil botonte udhëzues për udhëtarët me makinë në Amerikë, dhe mori emrin Forbes në vitin 2009. Sot vlerëson qindra hotele në të gjithë botën.

Vlerësimet kanë tri nivele: Five-Star, Four-Star dhe Recommended. Ato nuk jepen nga hoteli vetë dhe nuk blihen. Jepen pas inspektimeve të pavarura.

Dallimi më i rëndësishëm nga yjet shtetërore është ky: yjet shtetërore matin kryesisht ndërtesën, madhësinë e dhomave, pajisjet dhe shërbimet që ofrohen. Forbes mat kryesisht si sillet stafi. Një hotel me ndërtesë të re dhe mermer kudo mund të marrë vlerësim të ulët nga Forbes nëse stafi nuk përshëndet, nuk parashikon dhe nuk di produktin. Dhe një hotel më i vogël me staf të shkëlqyer mund të arrijë nivel të lartë.`],
["Inspektori anonim",`Inspektori i Forbes nuk njoftohet. Ai rezervon si çdo mysafir tjetër, me emrin e vet ose me një emër tjetër, dhe paguan si çdo mysafir. Zakonisht qëndron dy netë. Gjatë kësaj kohe ha në restorant, pi në bar, porosit room service, teston spa-n, përdor pishinën, bën kërkesa te recepsioni dhe ndonjëherë krijon situata të vështira me qëllim: kërkon diçka që nuk është në menu, ankohet për një pjatë, kërkon ndryshim tavoline, pyet për një verë që nuk e njeh.

Gjatë gjithë kohës mban shënime të detajuara, shpesh me kohë të matura me sekonda. Sa kohë kaloi nga ulja te përshëndetja. Sa kohë deri te pija e parë. A u përdor emri i tij. A e dinte kamarieri origjinën e peshkut. A ishte gota pa njolla.

Vetëm në fund, ndonjëherë, prezantohet te drejtori i hotelit për një bisedë. Por shpesh largohet pa u identifikuar fare.

Kjo ka një pasojë të thjeshtë dhe të fuqishme për ne: çdo mysafir mund të jetë inspektori. Nuk ka mënyrë për ta njohur. Prandaj e vetmja strategji që funksionon është t'i shërbejmë çdo mysafiri, çdo ditë, sikur të ishte inspektori. Dhe kur e bëjmë këtë, kemi arritur qëllimin e vërtetë, që nuk është vlerësimi, por mysafiri i kënaqur.`],
["Standardet janë binare",`Çdo standard Forbes vlerësohet me “po” ose “jo”. Nuk ka “pothuajse”, nuk ka “mjaftueshëm”, nuk ka pikë të pjesshme. Tavolina u përshëndet brenda 60 sekondave ose jo. Pija e parë erdhi brenda katër minutave ose jo. Kamarieri e përdori emrin ose jo.

Kjo mënyrë vlerësimi ka një logjikë të fortë. Shërbimi i “mjaftueshëm” nuk mbahet mend. Mysafiri nuk thotë “më përshëndetën pas 90 sekondash, pothuajse në kohë”. Ai thjesht ndjen që ka pritur. Standardi binar e bën të qartë ku është kufiri.

Prandaj trajnimi ynë punon me numra të saktë dhe sjellje të sakta. Nuk themi “mundohu të jesh i shpejtë”. Themi “60 sekonda”. Nuk themi “trego kujdes me gotat”. Themi “çdo gotë kundër dritës para shërbimit”. Në fund të çdo mësimi në këtë platformë ka një listë me numra kyç, sepse ata janë kufiri midis “po” dhe “jo”.

Por kujdes: standardi binar nuk do të thotë shërbim mekanik. Forbes penalizon edhe shërbimin që duket i mësuar përmendësh, pa ngrohtësi. Qëllimi është të arrish standardin në mënyrë natyrale.`],
["Shërbimi peshon më shumë se ndërtesa",`Standardet Forbes ndahen në dy grupe të mëdha. Standardet e shërbimit matin si sillet stafi: përshëndetja, kohët, njohuria, parashikimi. Standardet e ambientit matin gjendjen e ambientit dhe pajisjeve: pastërtia, ndriçimi, mobiljet, gotat.

Forbes deklaron se rreth 75 për qind e vlerësimit lidhet me shërbimin. Në manualin e vitit 2019, restoranti i hotelit (Hotel Dining) ka 62 standarde dhe bari (Bar/Lounge) ka 45, dhe shumica e tyre janë të shërbimit.

Ky është lajm i mirë për ne. Do të thotë që rezultati varet kryesisht nga ne, nga stafi, dhe jo nga muret. Nuk mund ta ndryshojmë ndërtesën nesër, por mund ta ndryshojmë mënyrën si e përshëndesim mysafirin sonte.

Në këtë platformë, çdo mësim tregon në krye cilat standarde Forbes mbulon, me kodin e tyre. HD do të thotë Hotel Dining, pra restoranti, dhe BL do të thotë Bar/Lounge. Kështu mund të shohësh drejtpërdrejt si lidhet ajo që mëson me atë që mat inspektori.`],
["Lidhja emocionale",`Përveç standardeve objektive, Forbes mat edhe diçka më të vështirë për t'u matur: si u ndje inspektori. Në çdo moment të rëndësishëm të qëndrimit, inspektori shënon emocionin e vet në një shkallë nga “i zemëruar” te “i mahnitur”. Midis tyre ka nivele si i frustruar, i pakënaqur, i zhgënjyer, indiferent, i kënaqur, i lumtur dhe shumë i impresionuar.

Kjo pjesë e vlerësimit tregon që Forbes e di që standardet nuk mjaftojnë. Mund t'i kryesh të gjitha standardet dhe mysafiri të largohet “indiferent”. Mund të bësh një gabim të vogël dhe mysafiri të largohet “i mahnitur” sepse e rregullove me ngrohtësi dhe me një gjest të papritur.

Moduli 15 për lidhjen emocionale e shtjellon këtë më thellë. Për tani mbaj mend një gjë: qëllimi nuk është mysafiri që nuk ankohet. Qëllimi është mysafiri që tregon për ne.`],
["Çfarë do të thotë kjo për punën tënde çdo ditë",`Ky sistem mund të duket i largët, diçka që i intereson drejtorit dhe jo kamarierit. Në fakt është e kundërta. Çdo standard Forbes është një përshkrim i saktë i një sjelljeje që ti e bën ose nuk e bën çdo turn.

• Kur përshëndet një tavolinë brenda 60 sekondave, ke fituar një standard.
• Kur shpjegon levrekun me përbërësit dhe origjinën, ke fituar një tjetër.
• Kur kontrollon gotën kundër dritës, një tjetër.
• Kur përdor emrin e mysafirit, një tjetër.

Dhe çdo herë që nuk e bën, ai standard humbet, jo vetëm për inspektorin, por për mysafirin që ishte aty.

» Skenë nga Flower: Një mysafir vjen vetëm në Flower një të martë në mbrëmje, porosit menunë degustuese, pyet për origjinën e oktapodit, kërkon të ndryshojë një pjatë për shkak të një preference, pyet për një verë të veçantë dhe në fund kërkon një taksi. Mund të jetë një mysafir i zakonshëm. Mund të jetë inspektori. Nëse ekipi i shërben njësoj në të dyja rastet, nuk ka rëndësi.`],
["Përmbledhje",`Forbes Travel Guide është sistemi më i vjetër i pavarur i vlerësimit, që nga viti 1958. Inspektori është anonim, qëndron zakonisht dy netë dhe teston çdo pjesë të hotelit. Standardet janë binare, po ose jo. Rreth 75 për qind e vlerësimit lidhet me shërbimin, pra me stafin. Dhe përveç standardeve, matet edhe emocioni i mysafirit.

Mësimi kryesor: çdo mysafir mund të jetë inspektori, prandaj i shërbejmë çdo mysafiri sikur të ishte.`]
];
LEC.T2=[
["Hyrje: pse kategoritë",`Manuali i Forbes ka qindra standarde. Askush nuk i mban mend të gjitha përmendsh, as nuk ka nevojë. Ajo që ka rëndësi është të kuptosh logjikën pas tyre. Çdo standard i përket një nga nëntë kategorive, dhe çdo kategori mat një aspekt të ndryshëm të përvojës së mysafirit.

Kur e kupton kategorinë, kupton qëllimin e standardit. Dhe kur kupton qëllimin, mund të reagosh drejt edhe në situata që manuali nuk i përmend fare. Ky leksion i kalon të nëntat një nga një, me shembuj nga puna jonë në Flower dhe Garden.`],
["1. Mirësjellja (Courtesy & Manners)",`Kjo është kategoria më bazike: edukata dhe aftësitë sociale. Përfshin përshëndetjen, tonin e zërit, buzëqeshjen, kontaktin me sy, mënyrën si i drejtohesh mysafirit dhe mbylljen e çdo bisede.

Standardet e kësaj kategorie duken të thjeshta, por janë ato që humbasin më shpesh, sepse varen nga gjendja shpirtërore e stafit. Kamarieri i lodhur në orën 22:30 harron të buzëqeshë. Kamarieri i stresuar flet shpejt dhe me ton të thatë.

Shembull: standardi HD5 kërkon që toni të jetë i ngrohtë gjatë gjithë bisedës, jo vetëm në fillim. Leksioni për gjuhën dhe tonin në Modulin 2 e shtjellon këtë kategori.`],
["2. Efikasiteti (Efficiency)",`Kjo kategori mat kohën. Sa shpejt u përshëndet mysafiri, sa shpejt erdhi pija, sa shpejt erdhi fatura. Këtu janë të gjithë numrat që i shohim në platformë: 60 sekonda, 4 minuta, 3 minuta, 7 dhe 10 minuta për mëngjesin.

Efikasiteti nuk do të thotë nxitim. Do të thotë që mysafiri nuk pret më shumë se sa duhet. Një shërbim mund të jetë i ngadaltë dhe i qetë në ritëm, siç është menuja degustuese, dhe njëkohësisht efikas, sepse çdo pjatë vjen kur mysafiri është gati.

Shembull: BL17 kërkon që pija e parë të arrijë brenda katër minutave në tavolinë dhe tre minutave në banak. Karta e kohëve në platformë i mbledh të gjitha kohët në një faqe.`],
["3. Rehatia (Guest Comfort & Convenience)",`Kjo kategori mat nëse mysafiri u vu në siklet ose iu desh të përpiqej për diçka. Mysafiri nuk duhet të kërkojë kamarierin me sy, nuk duhet të ngrihet për të marrë diçka, nuk duhet të presë në këmbë në hyrje pa vend për t'u ulur, nuk duhet të ndiejë ftohtë në terrasë pa batanije.

Shembull: HD3 kërkon një zonë të rehatshme pritjeje. HD9 kërkon që mysafiri të mos ketë nevojë të kërkojë diçka që stafi mund ta kishte parashikuar.`],
["4. Kujdesi personal (Graciousness, Thoughtfulness & Personalized Service)",`Kjo është kategoria e parashikimit dhe e personalizimit. Mat nëse stafi e trajtoi mysafirin si individ: e përdori emrin, kujtoi preferencat, parashikoi nevojat, ofroi alternativa në vend të një “jo”.

Kjo kategori është ajo që e dallon më qartë një hotel të mirë nga një hotel i shkëlqyer. Shumë hotele i arrijnë standardet e mirësjelljes dhe të efikasitetit. Më pak arrijnë t'i bëjnë mysafirët të ndihen të njohur.

Shembull: HD12 kërkon përdorimin e emrit të mysafirit. HD18 kërkon që asnjë “jo” të mos jepet pa alternativë.`],
["5. Aftësia teknike (Technical Execution, Skill & Knowledge)",`Kjo kategori mat saktësinë profesionale dhe njohuritë. A e di kamarieri përbërësit e pjatës? A e hap shishen e verës në mënyrën e duhur? A i shërben pjatat pa pyetur “kush e kishte”? A e di temperaturën e duhur të shampanjës?

Kjo është kategoria ku trajnimi ka ndikimin më të drejtpërdrejtë. Njohuritë mësohen, teknikat stërviten. Modulet e produktit në platformë, për ushqimin, verën, alkoolet dhe kafenë, si dhe menutë tona të Flower dhe Garden, janë të gjitha në shërbim të kësaj kategorie.

Shembull: HD24 kërkon që stafi të dijë detajet e menusë. BL19 kërkon servirjen pa pyetur kush porositi.`],
["6. Elementet e luksit (Elements of Luxury)",`Kjo kategori mat detajet që e dallojnë një hotel me pesë yje nga një me katër. Nuk janë gjëra që mysafiri i kërkon. Janë gjëra që i vë re dhe që krijojnë ndjenjën e luksit.

• Coaster liri ose lëkure nën çdo pije.
• Snacks të freskëta me pijen e parë.
• Kafe e shërbyer me filxhan, pjatë, lugë paralel dhe ujë me espresson.
• Një zgjedhje e mirë verërash me gotë: të paktën tri të kuqe, tri të bardha dhe një me flluska.
• Pecetat liri, jo letre.
• Bukë e ngrohtë dhe gjalpë në temperaturën e duhur.

Këto elemente kushtojnë pak, por mungesa e tyre vihet re menjëherë nga një mysafir që njeh hotelet e luksit.`],
["7. Cilësia e ushqimit dhe pijeve (Food & Beverage Quality)",`Kjo kategori mat produktin vetë: freskinë, shijen, temperaturën, prezantimin dhe sasinë. Është kryesisht përgjegjësi e kuzhinës dhe e barit, por salla ka një rol të rëndësishëm: kontrolli në pass, shërbimi i shpejtë që ushqimi të mos ftohet, temperatura e verës, gota e duhur.

Një pjatë perfekte që pret dy minuta në pass dhe arrin e vakët humbet këtë standard, edhe pse kuzhina bëri punën e vet.`],
["8. Paraqitja e stafit (Staff Appearance)",`Kjo kategori mat uniformën, kujdesin personal dhe qëndrimin. Uniforma e pastër dhe e hekurosur, etiketa me emër, flokët e rregulluar, duart e pastra, qëndrimi i drejtë. Leksioni për paraqitjen në Modulin 2 e përcakton standardin e Flower.`],
["9. Pastërtia dhe gjendja (Cleanliness & Condition)",`Kategoria e fundit mat higjienën dhe mirëmbajtjen: menutë pa njolla, gotat pa gjurmë, tavolinat pa thërrime, banaku i pastër, tualetet, dyshemeja. Edhe gjendja: karrige pa gërvishtje, tavolina pa lëkundje, porcelan pa çarje.

Kjo kategori është e lidhur ngushtë me inspektimin para shërbimit që bëjmë çdo turn.`],
["Si i përdorim kategoritë në praktikë",`Kategoritë na ndihmojnë të mendojmë kur nuk ka rregull të shkruar. Kur ndodh diçka e papritur, pyet veten: cilën kategori po prek kjo situatë?

» Skenë nga Flower: Një mysafir në Garden kërkon të ndryshojë tavolinë sepse dielli i bie në sy. Nuk ka standard specifik për diellin. Por kjo prek Rehatinë (mysafiri është në siklet) dhe Kujdesin personal (a e trajtojmë si individ apo si “kërkesë”). Reagimi i duhur del vetvetiu: e ndryshojmë tavolinën menjëherë, ose ulim tendën, dhe e bëjmë me buzëqeshje, pa e bërë mysafirin të ndihet si bezdi.

Kur supervizori bën auditin në sallë, gjetjet grupohen sipas kategorive. Kështu shohim ku jemi të fortë dhe ku duhet stërvitje.`],
["Përmbledhje",`Nëntë kategoritë janë: Mirësjellja, Efikasiteti, Rehatia, Kujdesi personal, Aftësia teknike, Elementet e luksit, Cilësia e ushqimit dhe pijeve, Paraqitja e stafit, Pastërtia dhe gjendja. Çdo standard i përket njërës prej tyre. Kur kupton kategorinë, kupton qëllimin, dhe kur kupton qëllimin, di si të veprosh edhe kur manuali hesht.`]
];
LEC.T3=[
["Hyrje: çfarë kujton mysafiri",`Pyet dikë për darkën më të mirë që ka bërë ndonjëherë. Rrallë do të fillojë me pjatën. Zakonisht fillon me një ndjenjë: “Na trajtuan si familje”, “Kamarieri e dinte që ishte ditëlindja ime”, “Ishte një mbrëmje magjike”. Ushqimi ka rëndësi, por kujtimi ndërtohet nga emocionet.

Ky leksion shpjegon pse mysafirët ndihen ashtu siç ndihen. Do të shohim disa ide nga psikologjia dhe nga studiuesit e mikpritjes që na ndihmojnë të kuptojmë sjelljen e mysafirit dhe të krijojmë kujtime, jo vetëm të kryejmë detyra.`],
["Shërbimi dhe mikpritja nuk janë e njëjta gjë",`Danny Meyer, një nga restoratorët më të njohur të Nju Jorkut, e bën këtë dallim shumë qartë. Shërbimi është dorëzimi teknik i produktit: pjata vjen në kohë, në temperaturë, nga ana e duhur. Mikpritja është si ndihet mysafiri ndërsa i dorëzohet. Shërbimi është monolog, thotë ai: ne vendosim si bëhet. Mikpritja është dialog: dëgjojmë dhe përshtatemi.

Mund të shërbesh në mënyrë perfekte dhe mysafiri të ndihet i ftohtë. Mund të bësh një gabim të vogël teknik dhe mysafiri të ndihet i dashur. Forbes mat të dyja, standardet teknike dhe ndjenjën, dhe ne duhet të jemi të fortë në të dyja.

Në praktikë, mikpritja shfaqet në gjëra të vogla: buzëqeshja që nuk duket e detyruar, interesi i vërtetë kur mysafiri tregon pse ka ardhur, gatishmëria për të bërë diçka jashtë rutinës kur mysafiri ka nevojë.`],
["Momentet e së vërtetës",`Jan Carlzon, drejtuesi i linjës ajrore skandinave SAS në vitet tetëdhjetë, e quajti “moment të së vërtetës” çdo kontakt ku klienti formon një mendim për kompaninë. Ai llogariti që çdo pasagjer kishte rreth pesë kontakte me stafin gjatë një udhëtimi, dhe që secili nga këto kontakte, i shkurtër sa pesëmbëdhjetë sekonda, vendoste nëse klienti do të kthehej.

Një darkë në Flower ka shumë më tepër momente të tilla, rreth 15 deri në 25: hyrja, përshëndetja, shoqërimi, uji, oferta e pijeve, porosia, çdo pjatë, kontrolli pas pjatës, ëmbëlsira, kafeja, fatura, lamtumira. Secili moment është i vogël. Por kujtimi i mbrëmjes ndërtohet nga të gjithë bashkë.

Kjo ka një pasojë të rëndësishme: nuk ka momente të parëndësishme. Kamarieri që sjell ujin është po aq përfaqësues i hotelit sa drejtori. Runner-i që vendos pjatën është po aq i rëndësishëm sa shefi i kuzhinës.`],
["Rregulli pik-fund",`Daniel Kahneman, psikolog dhe fitues i çmimit Nobel në ekonomi, zbuloi diçka të habitshme për mënyrën si kujtojmë përvojat. Njerëzit nuk e kujtojnë një përvojë si mesatare të të gjitha momenteve. E kujtojnë kryesisht nga dy momente: momenti më intensiv, pozitiv ose negativ, që quhet pika, dhe momenti i fundit.

Ky zbulim quhet rregulli pik-fund dhe ka dy pasoja të drejtpërdrejta për ne.

• Krijo të paktën një moment të fortë pozitiv në çdo vizitë. Mund të jetë një rekomandim i shkëlqyer, një detaj i papritur për një ditëlindje, një shpjegim pasionant i një vere, një gjest i vogël si batanija që vjen para se ta kërkosh.
• Mos e lër kurrë fundin të jetë i dobët. Fatura që vonohet, lamtumira që mungon, palltoja që nuk gjendet, të gjitha këto e ngjyrosin gjithë mbrëmjen. Një darkë e shkëlqyer që mbaron me 15 minuta pritje për faturën kujtohet si darkë e mesme.

» Skenë nga Flower: Një çift në përvjetor ha menunë degustuese në Flower. Gjithçka shkon mirë, por pa ndonjë moment të veçantë. Në fund, me kafenë, kamarieri sjell një pjatë të vogël me dy ëmbëlsira të vogla dhe një kartë të shkruar me dorë nga ekipi: “Gëzuar përvjetorin.” Kur largohen, hosti i përshëndet me emër dhe i uron. Ky është momenti që do ta tregojnë.`],
["Psikologjia e pritjes",`David Maister, studiues i shërbimeve në Harvard, shkroi një nga tekstet më të njohura për pritjen. Ai tregoi që mysafiri nuk mat minutat, mat ndjenjën e pritjes, dhe kjo ndjenjë ndikohet nga disa faktorë.

• Koha e pazënë duket më e gjatë se koha e zënë. Mysafiri që pret me një pije në dorë dhe menunë për ta lexuar ndjen më pak pritje se ai që pret duke parë murin.
• Pritja e pasigurt duket më e gjatë se pritja e njohur. “Rreth dhjetë minuta” është më e lehtë se “pak”.
• Pritja e pashpjeguar duket më e gjatë se ajo e shpjeguar. “Rizotoja kërkon 20 minuta sepse gatuhet në çast” e bën pritjen të kuptueshme.
• Pritja e padrejtë duket më e gjatë. Kur mysafiri sheh që një tavolinë që erdhi pas tij merr pjatat më parë, pritja bëhet e padurueshme.
• Pritja në ankth duket më e gjatë. Mysafiri që ka një tren për të kapur ose një takim pas darkës ndjen çdo minutë dyfish.
• Pritja vetëm duket më e gjatë se pritja në grup.

Këto parime shpjegojnë pse rregullat tona për kohën e pritjes janë ashtu siç janë: jep kohë konkrete, ofro një pije, shpjego arsyen, njofto para se të pyesin.`],
["Nevoja për kontroll",`Mysafiri që udhëton ka humbur pak nga kontrolli i zakonshëm i jetës së vet. Është në një qytet që nuk e njeh, ndoshta në një vend ku nuk flet gjuhën, në një restorant ku nuk i di rregullat. Kjo krijon një pasiguri të vogël, edhe tek mysafirët më të sigurt.

Kur i ofrojmë zgjedhje, informacion dhe parashikim, ia kthejmë atë kontroll. “Preferoni dritaren apo më në qetësi?” i jep zgjedhje. “Tomahawk-u peshon rreth 1,2 kilogramë” i jep informacion. “Dëshironi pjatat njëra pas tjetrës?” i jep kontroll mbi ritmin.

Kjo është arsyeja pse një “jo” e thatë dhe pritja pa informacion janë kaq të dëmshme. Ato ia heqin mysafirit kontrollin plotësisht. Dhe kjo është arsyeja pse formula E-P-A-V, me dy alternativa, funksionon: edhe kur nuk mund t'i japim atë që kërkon, i japim një zgjedhje.`],
["Pritshmëritë dhe krahasimi",`Kënaqësia e mysafirit nuk varet vetëm nga ajo që merr, por nga diferenca midis asaj që merr dhe asaj që priste. Një mysafir që vjen në një hotel me pesë yje pret shumë. Ajo që në një lokal të zakonshëm do të ishte “shumë mirë”, këtu është thjesht “normale”.

Pritshmëritë formohen nga shumë gjëra: çmimi, faqja e internetit, komentet online, rekomandimet e miqve, përvojat e mëparshme në hotele të tjera. Mysafiri që ka darkuar në hotele luksoze në Milano ose Vjenë na krahason me ato, jo me restorantet e tjera të qytetit.

Kjo nuk duhet të na frikësojë, por duhet të na kujtojë që standardi ynë nuk është “më mirë se lagjja”. Standardi ynë është niveli ndërkombëtar i luksit.`],
["Përmbledhje",`Shërbimi është teknik, mikpritja është emocionale, dhe na duhen të dyja. Çdo darkë ka 15 deri në 25 momente të së vërtetës. Mysafiri kujton kryesisht momentin më intensiv dhe fundin, prandaj krijojmë një moment të fortë dhe mbrojmë fundin. Pritja ndjehet sipas mënyrës si menaxhohet, jo sipas minutave. Mysafiri ka nevojë për kontroll, dhe ne ia japim me zgjedhje dhe informacion. Dhe kënaqësia varet nga pritshmëritë, që në një hotel luksoz janë të larta.`]
];
LEC.T4=[
["Hyrje: nga i kënaqur te i habitur",`Mysafiri i kënaqur nuk ankohet. Por mysafiri i kënaqur shpesh nuk kthehet dhe nuk tregon për ne. Ai thjesht mori atë që priste. Mysafiri i habitur, ai që mori më shumë se sa priste, është ai që kthehet, që na rekomandon dhe që shkruan për ne.

Ky leksion shpjegon dy modele që na ndihmojnë të kuptojmë këtë dallim, modelin e Albrecht-it dhe modelin Kano, dhe si i kthejmë në praktikë çdo ditë me vëzhgim dhe kujtesë.`],
["Modeli Albrecht: katër nivelet e shërbimit",`Karl Albrecht, një nga studiuesit e parë të menaxhimit të shërbimeve, e ndau shërbimin në katër nivele. Çdo nivel ndërtohet mbi të mëparshmin.

• Niveli bazik. Pa këtë nuk ka shërbim fare. Ushqimi i sigurt, tavolina e pastër, stafi që flet me mirësjellje. Mysafiri nuk e vë re kur ekziston, por largohet kur mungon.
• Niveli i pritshëm. Ajo që mysafiri e merr si të mirëqenë në një restorant të këtij niveli. Përshëndetja në hyrje, menuja, uji, fatura e saktë, pjatat në kohë. Kur është aty, mysafiri është neutral. Kur mungon, zhgënjehet.
• Niveli i dëshiruar. Ajo që mysafiri do ta donte, por nuk e kërkon dhe nuk e pret domosdoshmërisht. Emri i tij i përdorur, një rekomandim i mirë i personalizuar, vera e servirur në temperaturën perfekte.
• Niveli i papritur. Ajo që mysafiri nuk e imagjinonte fare. Kamarieri kujton verën që piu vitin e kaluar. Kuzhina përgatit një version pa gluten të ëmbëlsirës pa u kërkuar sepse e mori vesh nga rezervimi. Ekipi i uron ditëlindjen e djalit me emër.

Hotelet me pesë yje e kryejnë nivelin bazik dhe të pritshëm pa asnjë gabim, rregullisht arrijnë nivelin e dëshiruar dhe krijojnë momente të nivelit të papritur për shumë mysafirë.`],
["Modeli Kano: pse e papritura bëhet e pritshme",`Noriaki Kano, një profesor japonez i cilësisë, vuri re që jo të gjitha elementet e një shërbimi ndikojnë njësoj në kënaqësi.

• Disa elemente janë kushte bazë. Mungesa e tyre zemëron, por prania nuk impresionon. Askush nuk thotë “ishte e mrekullueshme, pjata ishte e pastër”. Por të gjithë ankohen për një pjatë të pistë.
• Disa elemente janë proporcionale. Sa më shumë, aq më mirë. Sa më e shpejtë pija, sa më i ngrohtë toni, aq më i kënaqur mysafiri.
• Disa elemente janë kënaqësi të papritura. Mysafiri nuk i pret, prandaj mungesa e tyre nuk e zhgënjen, por prania e tyre krijon kënaqësi të madhe.

Zbulimi më i rëndësishëm i Kanos është që, me kalimin e kohës, elementet lëvizin. Ajo që dje ishte kënaqësi e papritur, nesër bëhet e pritshme. WiFi në hotel dikur ishte surprizë, sot është kusht bazë. Ujë falas në tavolinë, menu në anglisht, pagesa me kartë, e njëjta gjë.

Kjo do të thotë që ekipi nuk mund të pushojë. Momentet “wow” që funksionojnë sot do të bëhen standard nesër, dhe duhet të gjejmë të reja. Kjo është pjesë e kulturës së përmirësimit të vazhdueshëm.`],
["Parashikimi: vëzhgim i sistematizuar",`Parashikimi duket si talent i lindur, por në të vërtetë është vëzhgim i sistematizuar. Kamarieri që “e ndjen” çfarë do mysafiri e ka mësuar këtë duke parë mijëra tavolina.

Teknika bazë është skanimi i sallës. Çdo 30 deri në 60 sekonda, sa herë kalon ose qëndron në pozicion, bën një skanim të shpejtë të zonës tënde:
• Gotat: sa kanë mbetur?
• Pjatat: kush ka mbaruar, kush jo?
• Menutë: të mbyllura apo të hapura?
• Fytyrat: kush po kërkon me sy?
• Trupat: të përkulur përpara do të thotë bisedë e thellë, mos ndërprit. Të mbështetur prapa me sy që lëvizin do të thotë që kanë nevojë për diçka.

Me kohë, skanimi bëhet automatik dhe kamarieri fillon të shohë modelet. Tavolina e biznesit dëshiron ritëm të shpejtë. Çifti i ri dëshiron të lihet i qetë. Familja me fëmijë ka nevojë për bukën menjëherë.`],
["Kujtesa e mysafirit: personalizimi si sistem",`Personalizimi i nivelit të lartë kërkon kujtesë, dhe kujtesa kërkon sistem. Askush nuk mund të mbajë mend preferencat e qindra mysafirëve në kokë.

Sistemi bazohet në profilin e mysafirit në sistemin e hotelit dhe në POS-in e restorantit. Aty shënohen:
• Alergjitë dhe kufizimet ushqimore.
• Vera, kokteili ose uji i preferuar.
• Tavolina e preferuar.
• Rastet e veçanta: ditëlindje, përvjetor.
• Çdo gjë tjetër domethënëse: “nuk i pëlqen cilantro”, “dëshiron kafenë me ëmbëlsirën, jo pas”.

Ajo që shkruhet sot është momenti “wow” i vizitës së ardhshme.

» Skenë nga Garden: Zoti Smith qëndron në hotel për herë të dytë, gjashtë muaj pas të parës. Para se të vijë në darkë, hosti kontrollon profilin: herën e fundit mori Old Father në bar dhe Duka Riserva me tomahawk-un, dhe kërkoi tavolinën pranë dritares. Kur hyn, hosti: “Mirëmbrëma, zoti Smith, mirë se u kthyet. Ju kemi rezervuar tavolinën pranë dritares.” Kamarieri, pas përshëndetjes: “Dëshironi të filloni me një Old Father si herën e kaluar?” Zoti Smith buzëqesh. Nuk e priste.`],
["Përmbledhje",`Shërbimi ka katër nivele: bazik, i pritshëm, i dëshiruar dhe i papritur. Hotelet më të mira i kryejnë dy të parët pa gabim dhe krijojnë rregullisht të tretin dhe të katërtin. Me kalimin e kohës, e papritura bëhet e pritshme, prandaj duhet të shpikim vazhdimisht. Parashikimi është vëzhgim i sistematizuar me skanim çdo 30 deri në 60 sekonda. Dhe personalizimi kërkon një sistem kujtese, ku ajo që shënojmë sot krijon habinë e nesërme.`]
];
LEC.T5=[
["Hyrje: komunikimi si mjet pune",`Në hotelerinë e luksit, komunikimi nuk është vetëm mënyra si flasim. Është mjeti kryesor i punës. Çdo standard i shërbimit kalon nëpër komunikim: përshëndetja, rekomandimi, kërkesa për ndjesë, lamtumira. Edhe kur nuk flasim, komunikojmë me qëndrimin, me sytë, me shpejtësinë e ecjes.

Ky leksion vendos bazat e komunikimit që përdorin hotelet me pesë yje në botë dhe si i zbatojmë ne në shqip dhe në anglisht. Leksioni për gjuhën dhe tonin në Modulin 2 i kthen këto në sjellje konkrete në sallë.`],
["Rregulli 10/5",`Shumë zinxhirë hotelesh luksoze përdorin një rregull të thjeshtë që quhet rregulli 10/5. Kur një mysafir është rreth dhjetë hapa larg, rreth tre metra, bën kontakt me sy dhe buzëqesh. Kur është rreth pesë hapa larg, rreth një metër e gjysmë, e përshëndet me zë.

Rregulli vlen kudo në hotel: në korridor, në hyrje të restorantit, pranë pishinës, në ashensor. Asnjë mysafir nuk kalon pranë stafit pa u njohur. Edhe kur je duke çuar një tabaka në kuzhinë, edhe kur je me nxitim, një kontakt me sy dhe një “mirëmbrëma” e shkurtër marrin dy sekonda.

Rregulli 10/5 duket i vogël, por ka efekt të madh. Mysafiri që përshëndetet nga çdo anëtar i stafit që takon ndihet i mirëpritur në të gjithë hotelin, jo vetëm në recepsion.`],
["Regjistri formal",`Regjistri është niveli i formalitetit të gjuhës. Në hotelerinë e luksit përdorim gjithmonë regjistrin formal, edhe me mysafirë të rinj, edhe me mysafirë që na flasin në mënyrë miqësore.

Në shqip kjo do të thotë vetën e dytë shumës: “Ju”, “Dëshironi?”, “Preferoni?”. Në shkrim, “Ju” shkruhet me shkronjë të madhe kur i drejtohemi mysafirit. Nuk kalojmë në “ti” edhe kur mysafiri na thotë “ti” ne. Mund të jemi të ngrohtë dhe miqësorë, por regjistri mbetet formal.

Në anglisht, i drejtohemi mysafirit me “Sir” ose “Madam”, ose me “Mr.” ose “Ms.” dhe mbiemrin. Shmangim “guys”, “mate”, “dear”, “buddy”, “folks”. Përdorim “Certainly”, “Of course”, “My pleasure” në vend të “Sure”, “Yeah”, “No problem”.

Me mysafirë që flasin gjuhë të tjera, italisht, gjermanisht, frëngjisht, një përshëndetje e shkurtër në gjuhën e tyre, nëse e di mirë, është gjest i bukur. Por nëse nuk je i sigurt, më mirë anglisht korrekte se sa një gjuhë tjetër e gabuar.`],
["Gjuha e trupit",`Studimet e komunikimit tregojnë që një pjesë e madhe e asaj që kuptojmë nga një bisedë vjen nga toni dhe gjuha e trupit, jo nga fjalët. Mysafiri lexon trupin tënd para se të dëgjojë fjalët.

Disa rregulla të hoteleve luksoze:
• Qëndro në një kënd të lehtë ndaj tavolinës, jo drejt sipër saj. Qëndrimi drejt sipër duket dominues.
• Në tavolinat e ulëta të lounge-it, përkulu lehtë që sytë të jenë më afër nivelit të mysafirit.
• Duart të dukshme dhe të qeta. Duart në xhepa duken të pavëmendshme, duart pas shpine duken të ftohta, krahët e kryqëzuar duken mbrojtës.
• Kontakti me sy i natyrshëm: e mban kur flet dhe kur dëgjon, por nuk e ngul.
• Buzëqeshja e vërtetë përfshin edhe sytë. Një buzëqeshje vetëm me buzë duket e detyruar.
• Distanca: rreth një hap nga mysafiri. Shumë afër është ndërhyrje, shumë larg është ftohtësi.

Kujdes me dallimet kulturore. Mysafirë nga disa vende preferojnë më shumë distancë, të tjerë më pak. Disa kultura e shohin kontaktin e gjatë me sy si mungesë respekti. Vëzhgo reagimin e mysafirit dhe përshtatu.`],
["Dëgjimi aktiv",`Dëgjimi aktiv është aftësia për të dëgjuar me të vërtetë, jo vetëm për të pritur radhën për të folur. Në restorant ka tri qëllime: të marrësh informacionin e saktë, të tregosh mysafirit që e dëgjon dhe të kapësh atë që nuk thuhet hapur.

Teknikat bazë:
• Dëgjo deri në fund. Mos e ndërprit mysafirin dhe mos parashiko përgjigjen para se të mbarojë.
• Përsërit pikat kritike. “Biftek mesatarisht i gjallë, pa salcë.” Kjo konfirmon që e kuptove dhe i jep mysafirit mundësinë të korrigjojë.
• Bëj pyetje sqaruese kur ka dyshim. “Kur thoni pikant, a e preferoni shumë pikant apo pak?”
• Vëre atë që nuk thuhet. Mysafiri që thotë “s'ka gjë, mirë është” me fytyrë të zhgënjyer nuk është mirë.

Mysafiri që ndihet i dëgjuar fal shumë më lehtë një gabim. Mysafiri që ndihet i padëgjuar zemërohet edhe kur gjithçka shkon mirë.`],
["Fjalët që shmangen dhe zëvendësimet",`Disa fjalë dhe shprehje e dëmtojnë përshtypjen edhe kur thuhen me qëllim të mirë. Hotelet luksoze kanë lista të tyre të fjalëve të ndaluara. Kjo është lista jonë.

• “Problem”, edhe në formën “s'ka problem”. E vendos idenë e problemit në mendjen e mysafirit. Zëvendësimi: “Me kënaqësi.”
• “Nuk e di.” Zëvendësimi: “Më lejoni ta kontrolloj.”
• “Nuk mundem.” Zëvendësimi: “Ajo që mund të bëj është...”
• “Është politikë e hotelit.” Mysafirit nuk i intereson politika. Zëvendësimi: shpjegim i shkurtër dhe alternativë.
• “Nuk është tavolina ime.” Nuk ekziston.
• “Prisni.” Zëvendësimi: “Ju lutem më jepni një moment.”
• “Mbaruat?” Zëvendësimi: “A mund ta marr?”
• “Të gjitha mirë?” e thënë shpejt duke kaluar. Zëvendësimi: kontroll i vërtetë, me ndalesë: “Gjithçka sipas dëshirës suaj?”

» Skenë nga Flower: Mysafiri kërkon një pjatë pa qepë. Kamarieri i papërvojë: “S'ka problem.” Kamarieri me përvojë: “Me kënaqësi, e njoftoj kuzhinën që ta përgatisë pa qepë.” Fjalia e dytë është më e gjatë me pesë fjalë, por i thotë mysafirit saktësisht çfarë do të ndodhë.`],
["Komunikimi me kolegët para mysafirit",`Mysafiri dëgjon edhe si flasim me njëri-tjetrin. Komunikimi midis stafit në sallë duhet të jetë i shkurtër, i qetë dhe i padukshëm.

• Asnjë thirrje me zë nga njëra anë e sallës në tjetrën.
• Asnjë diskutim për problemet e punës para mysafirëve.
• Asnjë gjuhë e huaj ose zhargon midis stafit para mysafirit, sepse mysafiri mund të mendojë që po flasim për të.
• Gjeste të vogla dhe të koordinuara për komunikim të shpejtë: një vështrim, një lëvizje e kokës drejt një tavoline.

Ekipi që komunikon mirë në heshtje duket si koreografi. Ekipi që thërret dhe debaton duket si kaos.`],
["Përmbledhje",`Rregulli 10/5: sy dhe buzëqeshje në dhjetë hapa, përshëndetje në pesë. Regjistri gjithmonë formal, “Ju” në shqip dhe “Sir” ose “Madam” në anglisht. Gjuha e trupit e hapur, në kënd të lehtë, me duar të dukshme. Dëgjimi aktiv: deri në fund, përsërit pikat kritike, pyet kur ka dyshim. Dhe zëvendëso fjalët që dëmtojnë me fjalë që tregojnë veprim.`]
];
LEC.T6=[
["Hyrje: pse po e bëjmë këtë trajnim",`Kjo platformë nuk është një detyrim administrativ. Është mënyra si Flower ndërton një ekip që jep shërbim në nivelin e hoteleve më të mira të Evropës. Ky leksion i fundit i Modulit 0 shpjegon si lidhet puna jote me rezultatin e hotelit, si funksionon cikli ynë i përmirësimit dhe çfarë kulture duam të ndërtojmë së bashku.`],
["Zinxhiri shërbim–fitim",`Në vitet nëntëdhjetë, një grup studiuesish të Harvard Business School, mes tyre James Heskett, publikuan një studim që ndryshoi mënyrën si kompanitë e shërbimeve e shohin stafin. E quajtën “Service-Profit Chain”, zinxhiri shërbim–fitim.

Zinxhiri funksionon kështu:
• Stafi i trajnuar, i mbështetur dhe i motivuar është më i kënaqur me punën.
• Stafi i kënaqur jep shërbim më të mirë dhe qëndron më gjatë në punë.
• Shërbimi më i mirë krijon mysafirë më të kënaqur.
• Mysafirët e kënaqur bëhen besnikë: kthehen, shpenzojnë më shumë dhe na rekomandojnë.
• Besnikëria krijon të ardhura dhe rritje për kompaninë.
• Rritja lejon investime të reja në staf, dhe zinxhiri rifillon.

Mësimi kryesor është që trajnimi nuk është kosto. Është hallka e parë e zinxhirit. Dhe çdo kamarier, çdo barmen, çdo host është pjesë e këtij zinxhiri, jo një spektator.`],
["Cikli ynë: Standard, Trajnim, Matje, Feedback",`Në Flower punojmë me një cikël të thjeshtë përmirësimi, i bazuar në metodën Plan-Do-Check-Act që përdoret në shumë industri për cilësinë.

• Standardi. Është i shkruar në këtë platformë: çfarë bëjmë, si e bëjmë dhe brenda sa kohe. Standardi i bazuar te Forbes, me shembuj nga Flower dhe Garden.
• Trajnimi. Bëhet me mësimet dhe leksionet në platformë, me ushtrimet e line-up-it para çdo turni dhe me praktikën në sallë nën vëzhgimin e supervizorit.
• Matja. Bëhet me testet e mësimeve, me provimet e moduleve dhe me auditin në sallë, ku supervizori vëzhgon shërbimin real dhe shënon “po” ose “jo” për çdo standard.
• Feedback-u. Jepet nga supervizori brenda 24 orësh pas auditit: çfarë u bë mirë dhe një gjë konkrete për të përmirësuar.

Pastaj cikli rifillon. Standardi mund të përmirësohet nëse shohim që nuk funksionon. Trajnimi fokusohet te pikat ku auditi tregoi dobësi. Me çdo cikël, niveli rritet.`],
["Përgjegjësia e përbashkët",`Forbes nuk e vlerëson “kamarierin e tavolinës 7”. Vlerëson restorantin. Mysafiri nuk e di cili kamarier është përgjegjës për cilën zonë. Për të, ne jemi një ekip.

Kjo krijon një kulturë të përgjegjësisë së përbashkët:
• Nëse tavolina e kolegut pret pa përshëndetje, është tavolina jonë. E përshëndesim dhe e njoftojmë kolegun.
• Nëse kolegu harron ujin, e mbushim ne.
• Nëse në pass ka një pjatë që pret dhe runner-i nuk është aty, e çojmë ne.
• Nëse shohim një gotë me njollë në tavolinën e dikujt tjetër, e ndërrojmë.

Ekipi fiton ose humbet bashkë. Kur Flower merr një koment të shkëlqyer, është i të gjithëve. Kur merr një ankesë, është gjithashtu e të gjithëve.

» Skenë nga Flower: E shtunë, ora 21:00, Garden plot. Kamarieri i zonës A është në kuzhinë për një problem me një porosi. Kamarierja e zonës B sheh që një tavolinë e re në zonën A është ulur prej 40 sekondash. Shkon, i përshëndet, ofron ujin dhe i jep menutë: “Kolegu im Ardit do jetë me ju për një moment.” Kur Arditi kthehet, i thotë me një fjali: “Tavolina 14, ujë me gaz, menutë i kanë.” Mysafirët nuk e vunë re asgjë.`],
["Gabimi është informacion",`Në shumë vende pune, gabimi fshihet sepse ka frikë nga ndëshkimi. Në ekipet më të mira të botës, gabimi trajtohet si informacion: na tregon ku duhet stërvitje, ku standardi nuk është i qartë ose ku sistemi nuk funksionon.

Kur auditi tregon një “jo”, nuk është gjykim për ty si person. Është informacion për ekipin. Supervizori nuk pyet “kush e bëri”, por “pse ndodhi dhe si e parandalojmë”.

Kjo kulturë kërkon dy gjëra nga secili prej nesh:
• Ndershmëri për t'i pranuar gabimet shpejt, pa justifikime. Gabimi që raportohet menjëherë mund të rregullohet para se mysafiri të largohet. Gabimi që fshihet bëhet ankesë.
• Hapje për feedback. Kur supervizori ose një koleg të tregon diçka për të përmirësuar, është dhuratë, jo sulm.

Kultura e ekipeve me pesë yje është kultura e korrigjimit të shpejtë dhe pa turp.`],
["Si ta përdorësh këtë platformë",`Platforma është ndërtuar që ta përdorësh rregullisht, jo një herë.

• Lexo leksionin e plotë të çdo mësimi, pastaj kalo hapat, frazat dhe gabimet që duhen shmangur.
• Bëj testin e mësimit. Kalimi kërkon shumicën e përgjigjeve të sakta. Nëse nuk kalon, rilexo dhe provo përsëri.
• Bëj provimin e modulit kur i ke mbaruar mësimet.
• Përdor faqet Menutë tona, Manuali i verës, Manuali i barit dhe Karta e kohëve si referencë gjatë punës.
• Kthehu te mësimet kur supervizori të jep feedback për një temë.

Supervizorët e shohin progresin e çdokujt në panel dhe e përdorin për të planifikuar trajnimin në line-up.`],
["Përmbledhje",`Zinxhiri shërbim–fitim fillon me stafin e trajnuar. Cikli ynë është Standard, Trajnim, Matje, Feedback, dhe rifillon gjithmonë. Përgjegjësia është e përbashkët: çdo tavolinë është tavolina jonë. Gabimi është informacion, jo turp. Dhe kjo platformë është mjeti i përditshëm për të gjitha këto.

Me këtë mbyllet Moduli 0. Tani e di si mendon Forbes, si ndjen mysafiri dhe si punon ekipi. Modulet e ardhshme i kthejnë këto në teknika konkrete.`]
];
LEC.S1=[
["Hyrje: një restorant, shumë stile",`Një restorant hoteli me pesë yje nuk përdor një stil të vetëm shërbimi. Gjatë një dite të vetme, i njëjti ekip mund të kalojë nëpër katër stile të ndryshme. Mëngjesi është bufe me stacion vezësh të përgatitura në çast. Dreka është shërbim i pjatës së gatshme. Darka ka momente ku pjata përfundohet para mysafirit. Një event në fundjavë ka shërbim banketi për njëqind persona.

Stafi që i njeh të gjitha stilet përshtatet pa stres, kupton pse rregullat ndryshojnë nga një situatë në tjetrën dhe mund të ndihmojë kudo ku ka nevojë. Ky leksion i kalon gjashtë stilet klasike, historinë e tyre, kur përdoret secili dhe si i kombinojmë në Flower dhe Garden.`],
["1. Shërbimi amerikan (plated)",`Në shërbimin amerikan, i quajtur edhe “plated”, pjata përgatitet dhe dekorohet plotësisht në kuzhinë dhe sillet gati te mysafiri. Kamarieri nuk prek ushqimin, vetëm e transporton dhe e vendos.

Ky stil u përhap në restorantet amerikane në shekullin e njëzetë sepse ishte i shpejtë dhe kërkonte më pak staf të specializuar. Sot është stili kryesor i kuzhinës moderne në të gjithë botën, përfshirë restorantet me yje Michelin, sepse i jep shefit kontroll të plotë mbi prezantimin. Çdo pjatë del njësoj si e ka menduar shefi.

Avantazhet: konsistencë, shpejtësi, kontroll i porcionit dhe i prezantimit. Disavantazhi: më pak teatër dhe më pak ndërveprim me mysafirin.

Në Flower dhe Garden, shumica e pjatave à la carte dhe të gjitha pjatat e menusë degustuese shërbehen në këtë stil. Kjo është arsyeja pse rregullat e servirjes, si pjata nga e djathta dhe proteina në orën gjashtë, janë kaq të rëndësishme: puna e shefit duhet të arrijë te mysafiri ashtu siç doli nga pass-i.`],
["2. Shërbimi francez (guéridon)",`Shërbimi francez, ose shërbimi guéridon, është stili ku ushqimi përfundohet para mysafirit mbi një karrocë të vogël që quhet guéridon. Kamarieri fileton peshkun, pret mishin, përgatit sallatën ose bën flambé para syve të mysafirit.

Ky stil lindi në restorantet e mëdha franceze të shekullit të nëntëmbëdhjetë, kur kamarierët ishin artizanë të vërtetë. Shembujt klasikë janë filetimi i një levreku ose shojze të plotë, prerja e një chateaubriand ose e një tomahawk-u, sallata Caesar e përgatitur në tavolinë, tartare e përzier para mysafirit, crêpes Suzette dhe banane flambé.

Avantazhi kryesor është teatri. Mysafiri nuk ha vetëm pjatën, por përjeton përgatitjen e saj. Sipas rregullit pik-fund që pamë në Modulin 0, një moment i tillë shpesh bëhet ajo që mysafiri kujton dhe tregon. Disavantazhet: kërkon kamarierë me aftësi të lartë teknike, kërkon më shumë kohë dhe hapësirë, dhe një gabim bëhet para syve të të gjithëve.

Në Flower, guéridon-i përdoret për momente të veçanta, sidomos për mishrat premium të Garden dhe për peshqit e plotë. Leksioni S4 i shpjegon teknikat.`],
["3. Shërbimi rus (silver service)",`Në shërbimin rus, ushqimi vjen nga kuzhina në pjata të mëdha, tradicionalisht argjendi, dhe kamarieri e kalon në pjatën e mysafirit me një lugë dhe një pirun të mbajtur në një dorë. Shërbimi bëhet nga e majta e mysafirit.

Emri vjen nga oborri rus i shekullit të nëntëmbëdhjetë, nga ku u përhap në Evropë. Para kësaj, në darkat aristokratike franceze, të gjitha pjatat vendoseshin njëherësh në tavolinë. Shërbimi rus solli idenë revolucionare të pjatave që vijnë njëra pas tjetrës, të nxehta, në rend. Kjo është në fakt origjina e menusë me pjata që njohim sot.

Sot silver service përdoret kryesisht në banketet formale, darkat shtetërore dhe disa restorante shumë klasike. Kërkon stërvitje, sidomos teknika e lugës dhe pirunit në një dorë, por kur bëhet mirë është shumë elegant.`],
["4. Shërbimi anglez",`Në shërbimin anglez, pjata e madhe me mishin ose me peshkun e plotë vendoset para organizatorit të tavolinës, i cili e pret dhe e ndan vetë, ose me ndihmën e kamarierit, dhe kamarieri ua shpërndan pjatat të tjerëve.

Ky stil vjen nga tradita e darkës familjare angleze, ku i zoti i shtëpisë priste mishin e pjekur të së dielës. Sot përdoret rrallë, kryesisht në darka private, në raste festive ose kur një grup porosit një copë të madhe për ta ndarë.

Në Garden, kur një grup porosit një tomahawk ose një copë tjetër premium për dy ose më shumë persona, mund të përdorim një version modern të këtij stili: copa prezantohet e plotë para tavolinës, pastaj pritet në guéridon ose në kuzhinë dhe shërbehet.`],
["5. Family style",`Në family style, pjatat vendosen në mes të tavolinës dhe mysafirët shërbejnë vetë dhe ndajnë. Është stili i tryezës familjare dhe i kuzhinave mesdhetare, ku mezet ndahen.

Ky stil është bërë shumë popullor në restorantet moderne sepse krijon atmosferë të ngrohtë dhe sociale. Por kërkon kujdes teknik: lugë shërbimi për çdo pjatë, pjata të vogla shtesë për çdo mysafir, hapësirë në tavolinë dhe kujdes të veçantë me alergjitë, sepse mysafiri me alergji mund të marrë pa e ditur nga një pjatë e përbashkët.

Për grupet në Flower ose Garden që porositin disa antipasta për t'i ndarë, kjo është mënyra e natyrshme. Kamarieri i vendos pjatat në mes, sjell lugët e shërbimit dhe pjatat e vogla, dhe i shpjegon pjatat një nga një.`],
["6. Bufeja",`Në bufe, mysafiri shërben vetë nga stacionet. Kjo duket sikur ul rolin e stafit, por në fakt e ndryshon. Në bufenë e një hoteli me pesë yje, stafi ka shumë punë:

• Mbushja e vazhdueshme. Asnjë enë nuk duhet të mbetet më shumë se një e katërta bosh. Bufeja gjysmë bosh duket si fund i shërbimit.
• Etiketat. Çdo pjatë me emër, në shqip dhe anglisht, me alergjenët.
• Higjiena. Lugë të veçanta për çdo pjatë, mbulesa kundër teshtitjes, temperaturat e duhura për ushqimin e nxehtë dhe të ftohtë.
• Stacionet à la minute. Vezët, petullat ose pjata të tjera të përgatitura në çast sipas kërkesës.
• Shërbimi i pijeve në tavolinë. Kafeja, çaji dhe lëngjet ofrohen dhe shërbehen nga stafi, jo vetëm nga mysafiri.
• Pastrimi i tavolinave dhe heqja e pjatave të përdorura.

Moduli 5 për mëngjesin dhe bufenë e shtjellon këtë stil me standardet e veta Forbes.`],
["Si i kombinojmë në Flower",`Në praktikë, Flower dhe Garden përdorin një kombinim:

• Mëngjesi: bufe me stacion à la minute dhe shërbim pijesh në tavolinë.
• À la carte në drekë dhe darkë: plated, me momente guéridon për peshqit e plotë dhe për mishrat premium.
• Menuja degustuese: plated, me ritëm të kontrolluar dhe prezantim të çdo pjate.
• Grupet me antipasta për t'i ndarë: family style.
• Eventet dhe banketet: plated ose silver service sipas nivelit të eventit.

» Skenë nga Garden: Një tavolinë prej katër vetash porosit tre antipasta për t'i ndarë, një tomahawk për dy dhe dy pjata individuale. Kamarieri i shërben antipastat në family style, me lugë shërbimi dhe pjata të vogla. Tomahawk-un e prezanton të plotë në dërrasë para tavolinës, pastaj e pret në guéridon dhe e shërben në dy pjata të ngrohta. Dy pjatat e tjera dalin plated nga kuzhina në të njëjtin moment. Tre stile në një tavolinë, pa asnjë konfuzion.`],
["Përmbledhje",`Gjashtë stilet janë: amerikan ose plated, francez ose guéridon, rus ose silver service, anglez, family style dhe bufe. Secili ka historinë, avantazhet dhe rregullat e veta. Flower i kombinon sipas momentit: plated si bazë, guéridon për teatrin, family style për ndarjen, bufe për mëngjesin dhe silver service për eventet formale. Kamarieri që i njeh të gjitha kalon nga njëri te tjetri pa stres.`]
];
LEC.S2=[
["Hyrje: pse një sekuencë e fiksuar",`Imagjino një orkestër ku çdo muzikant luan pjesën e vet kur i duket. Edhe nëse secili është virtuoz, rezultati është zhurmë. Shërbimi në restorant është njësoj. Edhe kamarierët më të mirë, nëse çdokush ndjek rendin e vet, krijojnë një përvojë të çrregullt për mysafirin.

Cikli i shërbimit është partitura jonë. Njëzet hapa, në të njëjtin rend, çdo herë, nga çdo kamarier. Kur hapat janë të njëjtë për të gjithë, mysafiri merr të njëjtin shërbim pavarësisht kush i shërben, dhe kolegët mund të ndihmojnë njëri-tjetrin pa pyetur “ku jemi me këtë tavolinë?”.

Ka edhe një përfitim tjetër, më pak të dukshëm. Kur sekuenca bëhet automatike, mendja e kamarierit lirohet nga pyetja “çfarë vjen tani?” dhe i mbetet vend për mysafirin: për ta dëgjuar, për ta vëzhguar, për të parashikuar.`],
["Lidhja me Forbes",`Nëse i krahason njëzet hapat me 62 standardet Forbes për restorantin, do të shohësh që shumica e standardeve janë thjesht hapa të kësaj sekuence, të matura me kohë dhe sjellje. Përshëndetja brenda 60 sekondave është hapi 5. Pija e parë brenda katër minutave është hapi 6. Heqja e thërrimeve para ëmbëlsirës është hapi 15. Fatura brenda dy minutave është hapi 19.

Kjo do të thotë që, nëse sekuenca zbatohet plotësisht dhe në kohë, shumica e standardeve plotësohen vetvetiu. Nuk ka nevojë t'i mbash mend standardet një nga një. Mjafton të mbash mend sekuencën.`],
["Faza e parë: mbërritja (hapat 1 deri në 7)",`Faza e parë fillon në hyrje dhe mbaron kur mysafiri ka pijen e parë dhe bukën përpara.

• Hapat 1 deri në 3, hyrja. Njohja brenda 10 sekondave, përshëndetja brenda 60 sekondave, shoqërimi te tavolina, ndihma me karrigen dhe dorëzimi i informacionit te kamarieri. Leksioni L1 i shtjellon në detaje.
• Hapi 4, peceta dhe menutë. Kamarieri ofron pecetën, e hap ose ia vendos mysafirit në prehër kur ai e pranon, gjithmonë nga e djathta dhe pa e prekur mysafirin. Menutë jepen të hapura, zonjave të parave.
• Hapi 5, përshëndetja e tavolinës. Brenda 60 sekondave nga ulja: prezantimi me emër, uji me emrin e markës, sugjerimi konkret i aperitivit.
• Hapi 6, aperitivi. Shërbehet brenda katër minutave, me snacks ose amuse-bouche nëse kuzhina e ofron.
• Hapi 7, buka. Shërbehet me vaj ulliri ose gjalpë dhe kamarieri e shpjegon: çfarë buke është, a është bërë në shtëpi. Rimbushja ofrohet gjatë vaktit.`],
["Faza e dytë: porosia (hapat 8 deri në 10)",`Faza e dytë është momenti kur mysafiri vendos çfarë do të hajë dhe të pijë, dhe kur kamarieri ka ndikimin më të madh si këshilltar.

• Hapi 8, porosia e ushqimit. Prezanto specialitetet e ditës dhe pjatat që kanë mbaruar, para se mysafiri të zgjedhë. Rekomando me metodën P-A-S. Merr porosinë me numrat e pozicioneve dhe konfirmo pikat kritike: pjekjen e mishit, alergjitë, ndryshimet.
• Hapi 9, porosia e verës. Sugjero një çiftim me pjatat e zgjedhura, ose thirr sommelier-in. Për verën me shishe: prezantimi i etiketës, hapja, prova dhe derdhja, siç shpjegohet në Modulin 9.
• Hapi 10, mise en place. Para pjatës së parë, rregullo takëmet sipas porosisë: shto thikën e peshkut, lugën e supës, thikën e biftekut, hiq ato që nuk duhen.

Gabimi më i shpeshtë në këtë fazë është vonesa e porosisë në sistem. Porosia që mbetet në bllok për pesë minuta sepse kamarieri po merr dy tavolina të tjera i vonon të gjitha kohët që vijnë pas.`],
["Faza e tretë: vakti (hapat 11 deri në 15)",`Faza e tretë është zemra e mbrëmjes: pjatat, ritmi dhe kujdesi i vazhdueshëm.

• Hapi 11, pjata e parë. Shërbimi i njëkohshëm i të gjithë tavolinës, emërtimi i çdo pjate, kontrolli dy minuta pas.
• Hapi 12, heqja. Kur të gjithë kanë mbaruar, nga e djathta, pa zhurmë.
• Hapi 13, pjata kryesore. Takëmet para pjatës, shërbimi i njëkohshëm, kontrolli dy minuta pas, rimbushja e verës dhe e ujit.
• Hapi 14, heqja e plotë. Hiqen pjatat, kripa, piperi, buka, pjatat anësore dhe gotat që nuk duhen më.
• Hapi 15, thërrimet. Me crumber, para ëmbëlsirës.

Gjatë gjithë kësaj faze vazhdon skanimi i tavolinës: gota bosh, mysafiri që kërkon me sy, ritmi midis pjatave rreth 8 deri në 12 minuta. Në menunë degustuese, hapat 11 dhe 12 përsëriten për çdo pjatë, me ritëm më të shpejtë sepse porcionet janë më të vogla.`],
["Faza e katërt: fundi (hapat 16 deri në 20)",`Faza e katërt është ajo që e përcakton kujtimin, sipas rregullit pik-fund. Shumë restorante e humbasin mbrëmjen këtu, sepse ekipi “e ka mbaruar” punën me pjatën kryesore.

• Hapi 16, menuja e ëmbëlsirave. Ofroje gjithmonë, edhe kur mysafiri duket i ngopur, me një sugjerim konkret: “Tiramisu-ja jonë Brutal është shumë e lehtë, mund ta ndani.” Vendos takëmet e ëmbëlsirës.
• Hapi 17, kafeja, çaji dhe digjestivi. Ofro me sugjerim konkret: një grappa, një raki e vjetër, një amaro, një verë ëmbëlsire.
• Hapi 18, petit fours ose mignardises. Nëse kuzhina i ofron, vijnë me kafenë.
• Hapi 19, fatura. Kur kërkohet, brenda dy minutave, e kontrolluar, në mbajtëse, pa lexuar shumën.
• Hapi 20, largimi. Ndihmë me karrigen dhe me pallton, falënderim me emër, ftesë për t'u kthyer. Pastaj, informacioni i ri për mysafirin futet në profilin e tij: çfarë piu, çfarë i pëlqeu, çfarë rasti festoi.

Hapi 20 është ai që lidh këtë vizitë me tjetrën. Pa të, personalizimi i herës së ardhshme nuk ekziston.`],
["Kur sekuenca duhet të përshtatet",`Sekuenca është e fiksuar, por mysafiri nuk është. Ka raste kur rendi përshtatet:

• Mysafiri me nxitim kërkon porosinë dhe faturën menjëherë. Bashkon hapat, por nuk i kapërcen: uji, porosia, pjata, fatura gati.
• Mysafiri vjen vetëm për pije dhe ëmbëlsirë. Fillon nga hapi 5 dhe kalon te 16.
• Grupi i madh porosit menu të paracaktuar. Hapat 8 dhe 9 janë bërë më parë, por konfirmohen alergjitë.
• Mysafiri dëshiron të porosisë gjithçka bashkë që në fillim. E respekton dhe kontrollon ritmin me kuzhinën.

Rregulli është: hapat mund të bashkohen ose të shtyhen sipas mysafirit, por asnjë hap nuk harrohet.

» Skenë nga Flower: Një çift biznesmenësh në drekë thotë: “Kemi takim pas 50 minutash.” Kamarieri: “Do ta organizoj që të keni kohë. Ju sugjeroj pjatat që dalin më shpejt.” Porosia merret me ujin, pjatat dalin së bashku, kafeja ofrohet me pjatën kryesore, fatura përgatitet paraprakisht dhe sillet me kafenë. Ata largohen pas 42 minutash, pa asnjë hap të harruar.`],
["Përmbledhje",`Njëzet hapat ndahen në katër faza: mbërritja (1 deri në 7), porosia (8 deri në 10), vakti (11 deri në 15) dhe fundi (16 deri në 20). Shumica e standardeve Forbes janë hapa të kësaj sekuence. Hapat mund të përshtaten sipas mysafirit, por asnjëri nuk harrohet. Dhe hapi i fundit, profili i mysafirit, është fillimi i vizitës së ardhshme.

Mësoje sekuencën përmendsh. Ushtrimi i këtij mësimi në line-up të ndihmon ta bësh automatike.`]
];
LEC.S3=[
["Hyrje: pse rregulla kaq të sakta",`Për dikë që nuk ka punuar në restorant, rregullat e servirjes mund të duken si formalitete: pse ka rëndësi nëse pjata vjen nga e djathta apo nga e majta? Në fakt, çdo rregull ka një arsye praktike. Rregullat ekzistojnë që kamarieri të mos e pengojë mysafirin, të mos kalojë krahun para fytyrës së tij, të mos e prekë dhe të mos e ndërpresë bisedën. Kur rregullat zbatohen, shërbimi bëhet i padukshëm. Kur nuk zbatohen, mysafiri e ndjen edhe pa ditur pse.

Ky leksion shpjegon rregullat teknike të Flower: anët e shërbimit, rendin, lëvizjen në sallë, mbajtjen e pjatave dhe të gotave, dhe heqjen. Skema e anëve të shërbimit në këtë mësim i tregon vizualisht.`],
["Anët e shërbimit",`Ka disa tradita të ndryshme në botë për anët e shërbimit. Në Flower ndjekim praktikën moderne evropiane, që është edhe ajo që pret Forbes.

• Pjatat e servirura nga kuzhina shërbehen nga e djathta e mysafirit, me dorën e djathtë.
• Pjatat hiqen nga e djathta.
• Pijet, uji dhe vera shërbehen nga e djathta, sepse gotat ndodhen në të djathtë të pjatës.
• Silver service, ku kamarieri e kalon ushqimin nga pjata e madhe, bëhet nga e majta, sepse kamarieri mban pjatën e madhe me dorën e majtë dhe shërben me të djathtën.
• Buka në pjatën anësore shërbehet nga e majta, sepse pjata e bukës ndodhet në të majtë.

Arsyeja e këtyre rregullave është e thjeshtë. Shumica e njerëzve janë të djathtë dhe e mbajnë thikën dhe gotën me dorën e djathtë. Kur kamarieri vjen nga e djathta me dorën e djathtë, krahu i tij lëviz në drejtim të jashtëm, larg mysafirit, dhe nuk kalon para fytyrës. Nëse do vinte nga e djathta me dorën e majtë, krahu do kalonte para gjoksit të mysafirit.

Kur nuk mund ta arrish mysafirin nga ana e duhur, për shembull sepse karrigia është pranë murit, shërbe nga ana tjetër me një fjali të shkurtër: “Më falni, nga kjo anë.” Rregulli i rehatisë së mysafirit është më i rëndësishëm se rregulli i anës.`],
["Rendi i shërbimit",`Rendi klasik i shërbimit në një tavolinë është:
• Të ftuarit e nderit, nëse ka.
• Zonjat, duke filluar nga më e moshuara.
• Zotërinjtë, duke filluar nga më i moshuari.
• Organizatori ose personi që paguan, i fundit.

Në praktikë moderne, ky rend përdoret kryesisht për porosinë dhe për verën, ndërsa për pjatat përdoret shërbimi i njëkohshëm. Kur tavolina ka katër ose më shumë persona, dy ose më shumë kamarierë dhe runner-ë shërbejnë njëkohësisht që askush të mos presë me pjatën para vetes ndërsa të tjerët ende nuk e kanë.

Për fëmijët ka një rregull praktik: pjata e fëmijës shpesh shërbehet e para, sepse fëmijët kanë më pak durim dhe prindërit hanë më të qetë kur fëmija është i zënë.

Për mysafirët me alergji, pjata e tyre shërbehet e veçantë ose e para dhe emërtohet qartë, që të mos ngatërrohet.`],
["Lëvizja në sallë dhe rreth tavolinës",`Mënyra si lëviz kamarieri në sallë ndikon në atmosferën. Disa rregulla bazë:

• Rreth tavolinës, lëviz në drejtim të akrepave të orës. Kështu, kur shërben nga e djathta, kalon natyrshëm nga një mysafir te tjetri.
• Mos kalo kurrë mes dy mysafirëve që flasin. Gjej një rrugë tjetër, edhe nëse është më e gjatë.
• Mos u kthe me shpinë nga mysafiri kur je pranë tavolinës. Kur largohesh, bëj një hap prapa dhe pastaj kthehu.
• Në korridoret midis tavolinave, mbaj të djathtën, si në rrugë, që kolegët që vijnë nga ana tjetër të kalojnë pa u përplasur.
• Kur mban një tabaka me pije ose pjata, ke përparësi. Kolegët pa ngarkesë të lënë vend.
• Kurrë mos vrapo. Ecja e shpejtë dhe e qetë është gjithmonë e mjaftueshme.`],
["Mbajtja e pjatave",`Mbajtja e pjatave është aftësi teknike që kërkon praktikë. Standardi i Flower është:

• Dy pjata në dorën e majtë. Pjata e parë mbahet me gishtin e madh sipër buzës dhe gishtat poshtë. Pjata e dytë vendoset nën të parën, e mbështetur te gishtat e mesëm dhe te kyçi i dorës.
• Një pjatë në dorën e djathtë, që është ajo që vendos e para.
• Kurrë mos e prek sipërfaqen e ngrënies, as buzën e brendshme të pjatës. Gishti i madh qëndron në buzën e jashtme.
• Kur nuk je i sigurt për teknikën e tri pjatave, mbaj vetëm dy. Një pjatë e rënë në sallë është shumë më keq se një rrugë më shumë.

Orientimi i pjatës kur e vendos:
• Logoja e pjatës, nëse ka, në orën dymbëdhjetë, larg mysafirit.
• Proteina kryesore, mishi ose peshku, në orën gjashtë, drejt mysafirit.
• Pjata vendoset rreth dy gishta nga buza e tavolinës, e qendërzuar midis takëmeve.

Shefi e ka menduar pjatën nga një kënd i caktuar. Kur e kthen gabim, mysafiri sheh pjatën nga ana e pasme.`],
["Mbajtja e gotave dhe tabakaja",`Gotat kapen gjithmonë nga këmba ose, kur nuk kanë këmbë, nga pjesa e poshtme. Kurrë nga buza, sepse aty mysafiri vendos buzët. Gotat e pastra transportohen me tabaka ose, kur janë gota me këmbë, të varura mes gishtave të dorës së majtë, me tasin poshtë.

Tabakaja mbahet me dorën e majtë, me pëllëmbën e hapur poshtë qendrës. Gotat e rënda dhe të larta vendosen në qendër, gotat e lehta anash. Kur heq gota nga tabakaja, merr ato në anët në mënyrë të alternuar, që tabakaja të mbetet e balancuar. Shishet e hapura nuk transportohen në tabaka me gota.

Për shërbimin e pijeve në tavolinë, tabakaja nuk vendoset kurrë mbi tavolinën e mysafirit. Kamarieri e mban në dorë dhe vendos gotat një nga një nga e djathta.`],
["Heqja",`Heqja e pjatave ka po aq rregulla sa servirja:

• Heqja bëhet kur të gjithë kanë mbaruar, përveç kur mysafiri e kërkon ose e shtyn pjatën anash.
• Nga e djathta, me dorën e djathtë, pastaj pjata kalon në dorën e majtë.
• Takëmet mblidhen në pjatën e parë dhe mbahen nën gishtin e madh, që të mos rrëshqasin dhe të mos bien.
• Pjatat e tjera vendosen poshtë, në dorën e majtë.
• Mbetjet e ushqimit nuk pastrohen para mysafirit. Bëhet në stacion ose në kuzhinë.
• Pa zhurmë porcelani. Pjata mbi pjatë pa u përplasur.
• Asnjë grumbullim i pjatave mbi tavolinën e mysafirit. Bëj disa rrugë nëse duhet, ose kërko ndihmë nga një koleg.

» Skenë nga Flower: Tavolina 8, gjashtë persona, ka mbaruar pjatën kryesore. Kamarieri dhe runner-i afrohen bashkë. Kamarieri fillon nga pozicioni 1, runner-i nga pozicioni 4. Secili merr dy pjata, me takëmet nën gishtin e madh, dhe largohet. Kthehen për dy të fundit. Në më pak se një minutë tavolina është e lirë, pa asnjë zhurmë dhe pa asnjë pjatë të grumbulluar para mysafirëve.`],
["Përmbledhje",`Pjatat dhe pijet nga e djathta, silver service dhe buka nga e majta. Rendi: të ftuarit e nderit, zonjat, zotërinjtë, organizatori, por pjatat njëkohësisht. Lëvizja në drejtim të akrepave, kurrë mes dy mysafirëve që flasin. Dy pjata në të majtë, një në të djathtë, gishti i madh kurrë mbi sipërfaqen e ngrënies, proteina në orën gjashtë. Gotat nga këmba. Heqja kur kanë mbaruar të gjithë, pa zhurmë, pa pastruar mbetjet para mysafirit.`]
];
LEC.S4=[
["Hyrje: teatri i shërbimit",`Ka momente kur një pjatë nuk vjen vetëm nga kuzhina. Vjen me një karrocë, me një kamarier që e përfundon para syve të mysafirit, me aromën që përhapet në tavolinë, me një flakë që ngrihet dhe shuhet. Këto janë momentet e shërbimit guéridon dhe të silver service, dhe janë nga më të fuqishmet që ka një restorant.

Sipas rregullit pik-fund, një flambé ose një fileto e bërë bukur shpesh bëhet ajo që mysafiri tregon të nesërmen. Por kjo vlen edhe në të kundërt. Një guéridon i bërë keq, me peshkun që shpërbëhet ose me flakën që del jashtë kontrollit, është po aq i dukshëm. Prandaj në Flower vetëm stafi i certifikuar nga shefi e bën këtë shërbim.

Ky leksion shpjegon përgatitjen e karrocës, teknikën e lugës dhe pirunit në një dorë, filetimin e peshkut, prerjen e mishit, flambé-në dhe rregullat e sigurisë.`],
["Mise en place e karrocës",`Shërbimi guéridon fillon shumë para se karroca të afrohet te tavolina. Gjithçka duhet të jetë gati, sepse para mysafirit nuk ka vend për të kërkuar një pirun që mungon.

Përgatitja e karrocës:
• Mbulesë e pastër dhe e hekurosur.
• Pjatat e mysafirëve të ngrohura, ose të ftohura për pjatat e ftohta.
• Takëmet e shërbimit: lugë dhe pirunë të mëdhenj, thikë filetimi, thikë prerjeje, spatulë peshku.
• Dërrasë prerjeje e pastër, kur nevojitet.
• Pjatë për mbetjet, kockat dhe lëkurën.
• Peceta shërbimi dhe një pecetë rezervë.
• Salcat dhe garniturat në enë të vogla, gati për t'u shtuar.
• Për flambé: tigani, burimi i zjarrit, alkooli i matur në gotë të vogël, fikësi i zjarrit afër.

Karroca afrohet te tavolina dhe vendoset në mënyrë që mysafiri ta shohë punën, por pa e penguar. Kamarieri punon me fytyrë nga mysafiri, jo me shpinë.`],
["Luga dhe piruni në një dorë",`Teknika bazë e silver service dhe e shumë veprimeve në guéridon është mbajtja e lugës dhe pirunit në një dorë, që në anglisht quhet “spoon and fork”. Duket e vështirë në fillim, por me praktikë bëhet natyrale.

Si mbahen:
• Në dorën e djathtë. Luga poshtë, me pjesën konkave lart, e mbështetur te gishti i vogël dhe i unazës.
• Piruni sipër lugës, me majat poshtë, i mbajtur midis gishtit tregues dhe gishtit të madh.
• Gishti i mesëm ndan dy takëmet dhe kontrollon hapjen.
• Luga mbart ushqimin, piruni e mban në vend.

Për ushqime të rrumbullakëta ose të vogla, si perimet, piruni mund të kthehet me majat lart dhe të përdoret si një lugë e dytë.

Kjo teknikë praktikohet larg mysafirëve, me bukë, me fasule ose me patate të ziera, derisa të mund ta bësh pa e menduar. Vetëm atëherë kalon në shërbim real. Mysafiri nuk duhet të shohë kurrë ushqimin që bie nga luga.`],
["Filetimi i peshkut të plotë",`Filetimi i një peshku të plotë para mysafirit është një nga teknikat më elegante dhe më të kërkuara të guéridon-it. Në Flower përdoret për peshqit e plotë si levreku ose koca, kur kuzhina i ofron.

Hapat bazë:
• Prezanto peshkun e plotë te mysafiri para se të fillosh. “Levreku juaj i plotë, i pjekur me barishte. Do ta filetoj për ju.”
• Vendose peshkun në dërrasë ose në pjatën e shërbimit, me kokën në të majtën tënde dhe barkun nga ti.
• Hiq lëkurën e sipërme butësisht me lugën dhe pirunin, duke e mbledhur drejt bishtit, dhe hiq pendët anësore dhe të shpinës.
• Me buzën e lugës, ndaj filetin e sipërm përgjatë vijës qendrore, nga koka drejt bishtit. Pastaj ndaji dy gjysmat e filetit të sipërm, njërën drejt teje dhe tjetrën larg.
• Ngrije shtyllën kurrizore nga bishti drejt kokës, me kujdes, në një lëvizje. Shtylla del bashkë me kokën. Vendose në pjatën e mbetjeve.
• Kontrollo filetin e poshtëm për kocka të vogla dhe hiqi.
• Prezanto filetat në pjatat e ngrohta, me lëkurën poshtë ose të hequr, me salcën dhe garniturat.

Gjithë procesi duhet të zgjasë rreth tre deri në pesë minuta. Më gjatë dhe peshku ftohet.`],
["Prerja e mishit",`Për copat e mëdha të mishit premium, si tomahawk-u i Garden, prerja para mysafirit e shton vlerën e përvojës. Rregullat bazë:

• Prezanto copën e plotë te tavolina para prerjes. Kjo është momenti i teatrit: mysafiri sheh madhësinë dhe cilësinë.
• Mishi duhet të ketë pushuar disa minuta pas pjekjes, që lëngjet të shpërndahen. Kjo bëhet në kuzhinë.
• Ndaj mishin nga kocka me thikë të mprehtë, duke ndjekur kockën.
• Prije gjithmonë kundër fijeve të mishit, në feta të barabarta, rreth një deri në një centimetër e gjysmë.
• Rendit fetat në pjatat e ngrohta, me anën e prerë lart që të duket pjekja.
• Kocka mund t'i ofrohet mysafirit veçmas ose të vendoset në pjatë si dekor, sipas dëshirës.

Thika e prerjes duhet të jetë e mprehtë. Një thikë e topitur e shqyen mishin dhe e humbet lëngun.`],
["Flambé dhe siguria",`Flambé është teknika ku alkooli ndizet në tigan për të djegur alkoolin dhe për të krijuar aromë dhe teatër. Është spektakolare, por përdor zjarr dhe alkool afër mysafirëve, prandaj ka rregulla sigurie që nuk negociohen.

Rregullat e sigurisë:
